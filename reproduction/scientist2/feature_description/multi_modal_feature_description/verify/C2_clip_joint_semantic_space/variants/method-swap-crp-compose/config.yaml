# Variant: method-swap-crp-compose
# Claim: C2 — v_c places c in the joint image-text semantic space

# --- Inherited from main experiment (MUST match exactly) ---
refsets: runs/M2_reference_sets/refsets.h5
text_embeddings: runs/M5_text_embeddings/text_embeddings.h5
clip_arch: ViT-B-32
clip_pretrained: openai
clip_ckpt_cache: /data/zhenqian/models/clip-vit-b32
inspected_model: resnet50
model_ckpt: /data/zhenqian/models/resnet50-imagenet.pth
data_dir: /data/zhenqian/data/imagenet-val
k: 16
pool: mean            # mean-pool of cropped CLIP embeddings (same as main experiment)
n_permute: 1000
seed: 42
layers: [layer3, layer4, avgpool, fc]

# --- Method-swap delta (CRP-compose) ---
method: clip_dissect_crp_compose   # vs. main experiment: clip_dissect_plain
lrp_rule: lrp_epsilon              # LRP-ε rule: ε=1e-6
lrp_epsilon: 1.0e-6
relevance_crop_percentile: 90      # top-90% of positive relevance mass defines the bbox
min_crop_size_px: 32               # minimum bbox side before CLIP resize (prevents degenerate crops)
component_scope: fc_only           # only fc components for P2a (1000 components); reduces cost vs. all 2000

# --- GPU pin ---
cuda_visible_devices: "1,2,3,5,6"  # subset of allowlist

# --- Output ---
out_v_c: verify/C2_clip_joint_semantic_space/variants/method-swap-crp-compose/v_c_crp.h5
out_p2a: verify/C2_clip_joint_semantic_space/variants/method-swap-crp-compose/result_p2a.json
out_p2b: verify/C2_clip_joint_semantic_space/variants/method-swap-crp-compose/result_p2b.json
out_result: verify/C2_clip_joint_semantic_space/variants/method-swap-crp-compose/result.json
