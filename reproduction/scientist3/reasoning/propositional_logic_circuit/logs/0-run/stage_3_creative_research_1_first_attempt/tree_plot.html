      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }

const treeStructData = {"edges": [[0, 1], [1, 3], [1, 2]], "layout": [[0.5, 0.0], [0.5, 0.5], [0.0, 1.0], [1.0, 1.0]], "plan": ["Hyperparam tuning name: max_length. I'll implement hyperparameter tuning over\n`max_length` values [256, 512, 1024, 2048] for the tokenizer. For each value,\nI'll run the full evaluation and store results under\n`experiment_data['max_length_tuning'][<value>]`. The dataset and model are\nloaded once for efficiency.", "I'll pivot from the meaningless max_length sweep to actual mechanistic circuit\nanalysis. The plan: (1) generate matched clean/corrupted prompt pairs for\npropositional logic where only the truth value of the queried proposition flips,\n(2) run activation patching on attention head outputs and MLP outputs across all\nlayers and the query token position to identify which components have causal\neffect on the True vs False logit difference, (3) rank components by their\npatching effect, iteratively build a minimal circuit by greedy selection, and\n(4) compute the required `circuit_faithfulness_score` =\naccuracy_match(circuit_only via mean-ablation of complement) \u00d7 (1 -\n|circuit|/|total|). To keep runtime feasible on Mistral-7B (32 layers \u00d7 32 heads\n+ 32 MLPs = 1056 components), I'll use a small evaluation set (~32 pairs), hook\nattention head z-outputs (pre W_O split into heads) and MLP outputs, patch only\nat the final token position, and use fp16. I'll also produce a per-layer heatmap\nof patching effect and save the discovered top components with their functional-\nrole hints (early=fact reading, mid=rule composition, late=answer projection\nbased on layer index buckets).", "Seed node", "Aggregate results from multiple seeds"], "code": ["import os\nimport json\nimport random\nimport numpy as np\nimport torch\nfrom transformers import AutoTokenizer, AutoModelForCausalLM\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nMODEL_DIR = \"/data/zhenqian/models\"\nDATA_DIR = \"/data/zhenqian/data\"\n\ncandidate_paths = [\n    os.path.join(MODEL_DIR, \"Mistral-7B-v0.1\"),\n    os.path.join(MODEL_DIR, \"Mistral-7B-Instruct-v0.2\"),\n    os.path.join(MODEL_DIR, \"Mistral-7B-Instruct-v0.1\"),\n    os.path.join(MODEL_DIR, \"mistral-7b\"),\n    os.path.join(MODEL_DIR, \"Mistral-7B\"),\n]\nmodel_path = None\nfor p in candidate_paths:\n    if os.path.isdir(p):\n        model_path = p\n        break\nif model_path is None:\n    for name in os.listdir(MODEL_DIR):\n        low = name.lower()\n        if \"mistral\" in low and \"7b\" in low:\n            model_path = os.path.join(MODEL_DIR, name)\n            break\nassert model_path is not None, f\"Could not find Mistral-7B under {MODEL_DIR}\"\nprint(f\"Using model: {model_path}\")\n\n# Hyperparameter tuning setup\nMAX_LENGTHS = [256, 512, 1024, 2048]\nexperiment_data = {\"max_length_tuning\": {}}\nfor ml in MAX_LENGTHS:\n    experiment_data[\"max_length_tuning\"][str(ml)] = {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"prompts\": [],\n        \"true_logits\": [],\n        \"false_logits\": [],\n        \"max_length\": ml,\n    }\n\n# ---------- Synthetic dataset generation ----------\nrandom.seed(0)\nnp.random.seed(0)\n\nPROP_NAMES = [\"P\", \"Q\", \"R\", \"S\", \"T\", \"U\", \"V\", \"W\", \"X\", \"Y\", \"Z\"]\n\n\ndef generate_example(n_props=4, n_facts=2, n_rules=3, chain_len=2):\n    props = random.sample(PROP_NAMES, n_props)\n    fact_props = random.sample(props, n_facts)\n    fact_vals = {p: random.choice([True, False]) for p in fact_props}\n    rules = []\n    for _ in range(n_rules):\n        x, y = random.sample(props, 2)\n        rules.append((x, y))\n    known_true = set([p for p, v in fact_vals.items() if v])\n    known_false = set([p for p, v in fact_vals.items() if not v])\n    changed = True\n    while changed:\n        changed = False\n        for x, y in rules:\n            if x in known_true and y not in known_true:\n                known_true.add(y)\n                if y in known_false:\n                    known_false.discard(y)\n                changed = True\n    determined = list(known_true) + list(known_false)\n    if not determined:\n        return None\n    query = random.choice(determined)\n    label = query in known_true\n    lines = [\"Facts:\"]\n    for p, v in fact_vals.items():\n        lines.append(f\"- {p} is {'True' if v else 'False'}.\")\n    lines.append(\"Rules:\")\n    for x, y in rules:\n        lines.append(f\"- If {x} is True, then {y} is True.\")\n    lines.append(f\"Question: Is {query} True? Answer with only True or False.\")\n    lines.append(\"Answer:\")\n    prompt = \"\\n\".join(lines)\n    return prompt, label\n\n\ndef build_dataset(n=200):\n    data = []\n    tries = 0\n    while len(data) < n and tries < n * 20:\n        tries += 1\n        ex = generate_example(\n            n_props=random.choice([3, 4, 5]),\n            n_facts=random.choice([2, 3]),\n            n_rules=random.choice([2, 3, 4]),\n        )\n        if ex is None:\n            continue\n        data.append(ex)\n    trues = [d for d in data if d[1]]\n    falses = [d for d in data if not d[1]]\n    m = min(len(trues), len(falses))\n    trues, falses = trues[:m], falses[:m]\n    balanced = trues + falses\n    random.shuffle(balanced)\n    return balanced\n\n\ndataset = build_dataset(n=240)\nprint(f\"Dataset size (balanced): {len(dataset)}\")\nprint(\n    f\"Label distribution: True={sum(1 for _,l in dataset if l)}, False={sum(1 for _,l in dataset if not l)}\"\n)\n\nwith open(os.path.join(working_dir, \"dataset.jsonl\"), \"w\") as f:\n    for prompt, label in dataset:\n        f.write(json.dumps({\"prompt\": prompt, \"label\": bool(label)}) + \"\\n\")\n\nprint(\"=\" * 40)\nprint(\"Example prompt:\")\nprint(dataset[0][0])\nprint(f\"Label: {dataset[0][1]}\")\nprint(\"=\" * 40)\n\n# ---------- Load model ----------\ntokenizer = AutoTokenizer.from_pretrained(model_path, local_files_only=True)\nif tokenizer.pad_token_id is None:\n    tokenizer.pad_token = tokenizer.eos_token\ntokenizer.padding_side = \"left\"\n\nmodel = AutoModelForCausalLM.from_pretrained(\n    model_path,\n    local_files_only=True,\n    torch_dtype=torch.float16 if device.type == \"cuda\" else torch.float32,\n)\nmodel.to(device)\nmodel.eval()\n\n\ndef get_token_ids_for(word):\n    variants = [word, \" \" + word]\n    ids = []\n    for v in variants:\n        enc = tokenizer.encode(v, add_special_tokens=False)\n        if len(enc) >= 1:\n            ids.append(enc[-1])\n    return list(set(ids))\n\n\ntrue_ids = get_token_ids_for(\"True\")\nfalse_ids = get_token_ids_for(\"False\")\nprint(f\"True token ids: {true_ids} -> {[tokenizer.decode([t]) for t in true_ids]}\")\nprint(f\"False token ids: {false_ids} -> {[tokenizer.decode([t]) for t in false_ids]}\")\nassert len(true_ids) > 0 and len(false_ids) > 0\n\n\ndef score_prompt_batch(prompts, max_length, batch_size=4):\n    all_true_logits = []\n    all_false_logits = []\n    for i in range(0, len(prompts), batch_size):\n        batch = prompts[i : i + batch_size]\n        enc = tokenizer(\n            batch,\n            return_tensors=\"pt\",\n            padding=True,\n            truncation=True,\n            max_length=max_length,\n        )\n        enc = {k: v.to(device) for k, v in enc.items()}\n        with torch.no_grad():\n            out = model(**enc)\n        logits = out.logits\n        last_logits = logits[:, -1, :]\n        tl = last_logits[:, true_ids].max(dim=-1).values\n        fl = last_logits[:, false_ids].max(dim=-1).values\n        all_true_logits.extend(tl.float().cpu().tolist())\n        all_false_logits.extend(fl.float().cpu().tolist())\n    return all_true_logits, all_false_logits\n\n\nprompts = [d[0] for d in dataset]\nlabels = [d[1] for d in dataset]\n\nresults_summary = {}\nfor ml in MAX_LENGTHS:\n    print(f\"\\n===== Running eval with max_length={ml} =====\")\n    true_logits, false_logits = score_prompt_batch(prompts, max_length=ml, batch_size=4)\n    preds = [t > f for t, f in zip(true_logits, false_logits)]\n    correct = sum(1 for p, l in zip(preds, labels) if p == l)\n    accuracy = correct / len(labels)\n    tl_arr = np.array(true_logits)\n    fl_arr = np.array(false_logits)\n    lab_arr = np.array([1 if l else 0 for l in labels])\n    stacked = np.stack([fl_arr, tl_arr], axis=1)\n    m = stacked.max(axis=1, keepdims=True)\n    lse = m.squeeze(1) + np.log(np.exp(stacked - m).sum(axis=1))\n    log_probs = stacked - lse[:, None]\n    val_loss = float(-log_probs[np.arange(len(lab_arr)), lab_arr].mean())\n    print(f\"max_length={ml}: acc={accuracy:.4f} val_loss={val_loss:.4f}\")\n\n    key = str(ml)\n    experiment_data[\"max_length_tuning\"][key][\"metrics\"][\"val\"].append(\n        {\"epoch\": 0, \"task_accuracy\": accuracy}\n    )\n    experiment_data[\"max_length_tuning\"][key][\"losses\"][\"val\"].append(\n        {\"epoch\": 0, \"val_loss\": val_loss}\n    )\n    experiment_data[\"max_length_tuning\"][key][\"predictions\"] = preds\n    experiment_data[\"max_length_tuning\"][key][\"ground_truth\"] = labels\n    experiment_data[\"max_length_tuning\"][key][\"prompts\"] = prompts\n    experiment_data[\"max_length_tuning\"][key][\"true_logits\"] = true_logits\n    experiment_data[\"max_length_tuning\"][key][\"false_logits\"] = false_logits\n    results_summary[ml] = (accuracy, val_loss)\n\nnp.save(os.path.join(working_dir, \"experiment_data.npy\"), experiment_data)\n\n# Visualization\ntry:\n    import matplotlib\n\n    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n\n    mls = sorted(results_summary.keys())\n    accs = [results_summary[m][0] for m in mls]\n    losses = [results_summary[m][1] for m in mls]\n    fig, ax = plt.subplots(1, 2, figsize=(10, 4))\n    ax[0].plot(mls, accs, \"o-\")\n    ax[0].set_xlabel(\"max_length\")\n    ax[0].set_ylabel(\"accuracy\")\n    ax[0].set_title(\"Accuracy vs max_length\")\n    ax[0].set_xscale(\"log\", base=2)\n    ax[1].plot(mls, losses, \"o-\", color=\"orange\")\n    ax[1].set_xlabel(\"max_length\")\n    ax[1].set_ylabel(\"val_loss\")\n    ax[1].set_title(\"Val loss vs max_length\")\n    ax[1].set_xscale(\"log\", base=2)\n    plt.tight_layout()\n    plt.savefig(os.path.join(working_dir, \"max_length_tuning.png\"), dpi=100)\n    plt.close()\nexcept Exception as e:\n    print(f\"Plot skipped: {e}\")\n\nprint(\"\\n===== Summary =====\")\nfor ml in sorted(results_summary.keys()):\n    acc, loss = results_summary[ml]\n    print(f\"max_length={ml}: accuracy={acc:.4f}, val_loss={loss:.4f}\")\nbest_ml = max(results_summary.keys(), key=lambda k: results_summary[k][0])\nprint(f\"Best max_length: {best_ml} with accuracy {results_summary[best_ml][0]:.4f}\")\nprint(f\"Saved experiment_data to {os.path.join(working_dir, 'experiment_data.npy')}\")\n", "import os, json, random, math, gc\nimport numpy as np\nimport torch\nimport torch.nn.functional as F\nfrom transformers import AutoTokenizer, AutoModelForCausalLM\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nMODEL_DIR = \"/data/zhenqian/models\"\n\n# ------ find mistral ------\nmodel_path = None\nfor name in os.listdir(MODEL_DIR):\n    low = name.lower()\n    if \"mistral\" in low and \"7b\" in low:\n        model_path = os.path.join(MODEL_DIR, name)\n        break\nassert model_path is not None\nprint(f\"Using model: {model_path}\")\n\nrandom.seed(0)\nnp.random.seed(0)\ntorch.manual_seed(0)\n\n# ---------- Clean/corrupted paired dataset ----------\n# Corrupt = flip the truth value of the query answer by flipping one fact that leads to it.\nPROP_NAMES = [\"P\", \"Q\", \"R\", \"S\", \"T\", \"U\", \"V\", \"W\", \"X\", \"Y\", \"Z\"]\n\n\ndef make_pair():\n    # simple 2-step chain: A True; A->B; B->C ; query C  (label True)\n    # corrupted: A False (still says False literally); rest identical => label False\n    props = random.sample(PROP_NAMES, 3)\n    A, B, C = props\n    lines_clean = [\n        \"Facts:\",\n        f\"- {A} is True.\",\n        \"Rules:\",\n        f\"- If {A} is True, then {B} is True.\",\n        f\"- If {B} is True, then {C} is True.\",\n        f\"Question: Is {C} True? Answer with only True or False.\",\n        \"Answer:\",\n    ]\n    lines_corr = [\n        \"Facts:\",\n        f\"- {A} is False.\",\n        \"Rules:\",\n        f\"- If {A} is True, then {B} is True.\",\n        f\"- If {B} is True, then {C} is True.\",\n        f\"Question: Is {C} True? Answer with only True or False.\",\n        \"Answer:\",\n    ]\n    return \"\\n\".join(lines_clean), \"\\n\".join(lines_corr), True, False\n\n\nN_PAIRS = 32\npairs = [make_pair() for _ in range(N_PAIRS)]\nclean_prompts = [p[0] for p in pairs]\ncorr_prompts = [p[1] for p in pairs]\nclean_labels = [p[2] for p in pairs]\ncorr_labels = [p[3] for p in pairs]\n\nwith open(os.path.join(working_dir, \"pairs.jsonl\"), \"w\") as f:\n    for cp, xp, cl, xl in zip(clean_prompts, corr_prompts, clean_labels, corr_labels):\n        f.write(\n            json.dumps({\"clean\": cp, \"corr\": xp, \"clean_label\": cl, \"corr_label\": xl})\n            + \"\\n\"\n        )\n\nprint(\"Example clean:\\n\" + clean_prompts[0])\nprint(\"---\")\nprint(\"Example corr:\\n\" + corr_prompts[0])\n\n# ---------- load model ----------\ntokenizer = AutoTokenizer.from_pretrained(model_path, local_files_only=True)\nif tokenizer.pad_token_id is None:\n    tokenizer.pad_token = tokenizer.eos_token\ntokenizer.padding_side = \"left\"\n\nmodel = AutoModelForCausalLM.from_pretrained(\n    model_path,\n    local_files_only=True,\n    torch_dtype=torch.float16 if device.type == \"cuda\" else torch.float32,\n)\nmodel.to(device)\nmodel.eval()\n\ncfg = model.config\nn_layers = cfg.num_hidden_layers\nn_heads = cfg.num_attention_heads\nd_model = cfg.hidden_size\nd_head = d_model // n_heads\nprint(f\"n_layers={n_layers} n_heads={n_heads} d_model={d_model} d_head={d_head}\")\n\n\ndef get_ids(word):\n    ids = set()\n    for v in [word, \" \" + word]:\n        e = tokenizer.encode(v, add_special_tokens=False)\n        if e:\n            ids.add(e[-1])\n    return list(ids)\n\n\ntrue_ids = get_ids(\"True\")\nfalse_ids = get_ids(\"False\")\nprint(\"True ids:\", true_ids, \"False ids:\", false_ids)\n\n\ndef logit_diff(logits_last):\n    # scalar: max True logit - max False logit\n    tl = logits_last[:, true_ids].max(dim=-1).values\n    fl = logits_last[:, false_ids].max(dim=-1).values\n    return tl - fl\n\n\n# ---------- Hook infrastructure ----------\n# We hook:\n#  - attention output projection input (o_proj input): shape [B, T, d_model], reshaped [B,T,n_heads,d_head]  => per-head z\n#  - MLP output (mlp forward output)\n# Store activations at final token position only.\n\nlayers = model.model.layers  # LLaMA-style\n\n# Storage\nclean_head_z = [None] * n_layers  # tensor [B, n_heads, d_head]\nclean_mlp_out = [None] * n_layers  # tensor [B, d_model]\n\n\ndef make_attn_hook(layer_idx, store):\n    # hook on o_proj: pre-forward input is a tuple (x,)\n    def hook(module, inp, out):\n        x = inp[0]  # [B, T, d_model]\n        # take last token\n        xl = x[:, -1, :]  # [B, d_model]\n        z = xl.view(xl.size(0), n_heads, d_head)\n        store[layer_idx] = z.detach()\n\n    return hook\n\n\ndef make_mlp_hook(layer_idx, store):\n    def hook(module, inp, out):\n        # out: [B, T, d_model]\n        store[layer_idx] = out[:, -1, :].detach()\n\n    return hook\n\n\n# Patching hooks (used later)\npatch_state = {\"active\": False, \"kind\": None, \"layer\": None, \"head\": None, \"src\": None}\n\n\ndef make_attn_patch_hook(layer_idx):\n    def pre_hook(module, inp):\n        if not patch_state[\"active\"]:\n            return None\n        if patch_state[\"kind\"] != \"attn\":\n            return None\n        if patch_state[\"layer\"] != layer_idx:\n            return None\n        x = inp[0]\n        # replace last token, specified head(s), with src\n        B, T, D = x.shape\n        x = x.clone()\n        xl = x[:, -1, :].view(B, n_heads, d_head)\n        h = patch_state[\"head\"]\n        src = patch_state[\"src\"]  # [B, d_head] or [B, n_heads, d_head]\n        if isinstance(h, int):\n            xl[:, h, :] = src\n        else:\n            for hi in h:\n                xl[:, hi, :] = src[:, hi, :] if src.dim() == 3 else src\n        x[:, -1, :] = xl.view(B, D)\n        # need to return new inputs\n        new_inp = (x,) + inp[1:]\n        return new_inp\n\n    return pre_hook\n\n\ndef make_mlp_patch_hook(layer_idx):\n    def hook(module, inp, out):\n        if not patch_state[\"active\"]:\n            return None\n        if patch_state[\"kind\"] != \"mlp\":\n            return None\n        if patch_state[\"layer\"] != layer_idx:\n            return None\n        out = out.clone()\n        out[:, -1, :] = patch_state[\"src\"]\n        return out\n\n    return hook\n\n\n# Register capture hooks (permanent, guarded by store variables)\ncapture_handles = []\npatch_handles = []\nattn_stores = clean_head_z\nmlp_stores = clean_mlp_out\n\nfor i, layer in enumerate(layers):\n    h1 = layer.self_attn.o_proj.register_forward_hook(make_attn_hook(i, attn_stores))\n    h2 = layer.mlp.register_forward_hook(make_mlp_hook(i, mlp_stores))\n    capture_handles += [h1, h2]\n    # patch hooks always registered but gated by patch_state\n    p1 = layer.self_attn.o_proj.register_forward_pre_hook(make_attn_patch_hook(i))\n    p2 = layer.mlp.register_forward_hook(make_mlp_patch_hook(i))\n    patch_handles += [p1, p2]\n\n\ndef run_and_capture(prompts, capture=True):\n    enc = tokenizer(\n        prompts, return_tensors=\"pt\", padding=True, truncation=True, max_length=256\n    )\n    enc = {k: v.to(device) for k, v in enc.items()}\n    with torch.no_grad():\n        out = model(**enc)\n    return out.logits[:, -1, :]\n\n\n# ---------- Baseline: full model behavior ----------\nBATCH = 8\n\n\ndef batched_last_logits(prompts, patch=False):\n    outs = []\n    for i in range(0, len(prompts), BATCH):\n        batch = prompts[i : i + BATCH]\n        enc = tokenizer(\n            batch, return_tensors=\"pt\", padding=True, truncation=True, max_length=256\n        )\n        enc = {k: v.to(device) for k, v in enc.items()}\n        with torch.no_grad():\n            out = model(**enc)\n        outs.append(out.logits[:, -1, :].float().cpu())\n    return torch.cat(outs, dim=0)\n\n\n# We need clean and corrupted activations captured. Run twice storing separately.\nclean_attn_all = [torch.zeros(N_PAIRS, n_heads, d_head) for _ in range(n_layers)]\nclean_mlp_all = [torch.zeros(N_PAIRS, d_model) for _ in range(n_layers)]\ncorr_attn_all = [torch.zeros(N_PAIRS, n_heads, d_head) for _ in range(n_layers)]\ncorr_mlp_all = [torch.zeros(N_PAIRS, d_model) for _ in range(n_layers)]\n\n\ndef capture_all(prompts, attn_dest, mlp_dest):\n    logits_all = []\n    for i in range(0, len(prompts), BATCH):\n        batch = prompts[i : i + BATCH]\n        enc = tokenizer(\n            batch, return_tensors=\"pt\", padding=True, truncation=True, max_length=256\n        )\n        enc = {k: v.to(device) for k, v in enc.items()}\n        with torch.no_grad():\n            out = model(**enc)\n        # attn_stores / mlp_stores were filled during forward\n        for li in range(n_layers):\n            attn_dest[li][i : i + len(batch)] = attn_stores[li].float().cpu()\n            mlp_dest[li][i : i + len(batch)] = mlp_stores[li].float().cpu()\n        logits_all.append(out.logits[:, -1, :].float().cpu())\n    return torch.cat(logits_all, dim=0)\n\n\nprint(\"Capturing clean activations...\")\nclean_logits = capture_all(clean_prompts, clean_attn_all, clean_mlp_all)\nprint(\"Capturing corrupted activations...\")\ncorr_logits = capture_all(corr_prompts, corr_attn_all, corr_mlp_all)\n\nclean_ld = logit_diff(clean_logits)  # expect positive (True > False)\ncorr_ld = logit_diff(corr_logits)  # expect negative (False > True)\nprint(f\"Mean clean logit_diff (True-False): {clean_ld.mean():.3f}\")\nprint(f\"Mean corr  logit_diff (True-False): {corr_ld.mean():.3f}\")\n\nclean_pred_true = (clean_ld > 0).float()\ncorr_pred_true = (corr_ld > 0).float()\nclean_acc = float((clean_pred_true == 1).float().mean())\ncorr_acc = float((corr_pred_true == 0).float().mean())\nprint(f\"Baseline clean acc={clean_acc:.3f} corr acc={corr_acc:.3f}\")\n\n# ---------- Activation patching: substitute CLEAN activation into CORRUPTED run ----------\n# Metric: recovery = (patched_ld - corr_ld) / (clean_ld - corr_ld), averaged\ndenom = clean_ld - corr_ld  # per-example\ndenom_mean = denom.mean().item()\nprint(f\"Mean (clean-corr) logit-diff gap: {denom_mean:.3f}\")\n\n\ndef run_corrupted_with_patch(kind, layer, head, src):\n    \"\"\"Run corrupted prompts with a specific patch.\"\"\"\n    patch_state[\"active\"] = True\n    patch_state[\"kind\"] = kind\n    patch_state[\"layer\"] = layer\n    patch_state[\"head\"] = head\n    logits_all = []\n    for i in range(0, len(corr_prompts), BATCH):\n        batch = corr_prompts[i : i + BATCH]\n        enc = tokenizer(\n            batch, return_tensors=\"pt\", padding=True, truncation=True, max_length=256\n        )\n        enc = {k: v.to(device) for k, v in enc.items()}\n        # move src slice to device\n        s = src[i : i + len(batch)].to(device).to(model.dtype)\n        patch_state[\"src\"] = s\n        with torch.no_grad():\n            out = model(**enc)\n        logits_all.append(out.logits[:, -1, :].float().cpu())\n    patch_state[\"active\"] = False\n    return torch.cat(logits_all, dim=0)\n\n\n# Score each attention head\nhead_effects = np.zeros((n_layers, n_heads))\nmlp_effects = np.zeros(n_layers)\n\nprint(\"Patching attention heads...\")\nfor L in range(n_layers):\n    for H in range(n_heads):\n        src = clean_attn_all[L][:, H, :]  # [N, d_head]\n        patched_logits = run_corrupted_with_patch(\"attn\", L, H, src)\n        p_ld = logit_diff(patched_logits)\n        # per-example recovery, then mean\n        recov = ((p_ld - corr_ld) / (denom + 1e-6)).mean().item()\n        head_effects[L, H] = recov\n    if L % 4 == 0:\n        best = np.unravel_index(np.argmax(head_effects[: L + 1]), head_effects.shape)\n        print(f\"  layer {L}: max recovery so far = {head_effects.max():.3f} at {best}\")\n\nprint(\"Patching MLPs...\")\nfor L in range(n_layers):\n    src = clean_mlp_all[L]  # [N, d_model]\n    patched_logits = run_corrupted_with_patch(\"mlp\", L, None, src)\n    p_ld = logit_diff(patched_logits)\n    recov = ((p_ld - corr_ld) / (denom + 1e-6)).mean().item()\n    mlp_effects[L] = recov\nprint(f\"MLP max recovery: {mlp_effects.max():.3f} at layer {mlp_effects.argmax()}\")\n\n# Sort components by effect\ncomponents = []\nfor L in range(n_layers):\n    for H in range(n_heads):\n        components.append((\"attn\", L, H, head_effects[L, H]))\nfor L in range(n_layers):\n    components.append((\"mlp\", L, None, mlp_effects[L]))\ncomponents.sort(key=lambda x: -x[3])\nprint(\"\\nTop 20 components by patching recovery:\")\nfor c in components[:20]:\n    print(c)\n\n# ---------- Build minimal circuit by greedy top-K & measure faithfulness ----------\ntotal_components = n_layers * n_heads + n_layers  # heads + mlps\n\n# Precompute clean means over dataset for mean-ablation\nclean_attn_mean = [\n    clean_attn_all[L].mean(dim=0) for L in range(n_layers)\n]  # [n_heads, d_head]\nclean_mlp_mean = [clean_mlp_all[L].mean(dim=0) for L in range(n_layers)]  # [d_model]\n\n# \"Circuit-only\" run: on CLEAN prompts, mean-ablate every component NOT in circuit\n# implement via forward hooks that overwrite last-token activations to the mean when component not in circuit set\ncircuit_set = None  # will hold sets of (\"attn\",L,H) and (\"mlp\",L)\n\n\ndef make_ablation_attn_hook(layer_idx):\n    def pre_hook(module, inp):\n        if circuit_set is None:\n            return None\n        x = inp[0]\n        B, T, D = x.shape\n        xl = x[:, -1, :].view(B, n_heads, d_head).clone()\n        for H in range(n_heads):\n            if (\"attn\", layer_idx, H) not in circuit_set:\n                xl[:, H, :] = clean_attn_mean[layer_idx][H].to(x.device).to(x.dtype)\n        new_x = x.clone()\n        new_x[:, -1, :] = xl.view(B, D)\n        return (new_x,) + inp[1:]\n\n    return pre_hook\n\n\ndef make_ablation_mlp_hook(layer_idx):\n    def hook(module, inp, out):\n        if circuit_set is None:\n            return None\n        if (\"mlp\", layer_idx) not in circuit_set:\n            out = out.clone()\n            out[:, -1, :] = clean_mlp_mean[layer_idx].to(out.device).to(out.dtype)\n        return out\n\n    return hook\n\n\n# Remove patch hooks and register ablation hooks\nfor h in patch_handles:\n    h.remove()\npatch_handles = []\n\nablation_handles = []\nfor i, layer in enumerate(layers):\n    ah = layer.self_attn.o_proj.register_forward_pre_hook(make_ablation_attn_hook(i))\n    mh = layer.mlp.register_forward_hook(make_ablation_mlp_hook(i))\n    ablation_handles += [ah, mh]\n\n\ndef run_circuit_only(prompts):\n    logits_all = []\n    for i in range(0, len(prompts), BATCH):\n        batch = prompts[i : i + BATCH]\n        enc = tokenizer(\n            batch, return_tensors=\"pt\", padding=True, truncation=True, max_length=256\n        )\n        enc = {k: v.to(device) for k, v in enc.items()}\n        with torch.no_grad():\n            out = model(**enc)\n        logits_all.append(out.logits[:, -1, :].float().cpu())\n    return torch.cat(logits_all, dim=0)\n\n\n# baseline predictions (full model) on clean+corr\nfull_clean_logits = clean_logits\nfull_corr_logits = corr_logits\nfull_clean_pred = (logit_diff(full_clean_logits) > 0).numpy()\nfull_corr_pred = (logit_diff(full_corr_logits) > 0).numpy()\n\nall_prompts = clean_prompts + corr_prompts\nfull_all_pred = np.concatenate([full_clean_pred, full_corr_pred])\n\nKs = [5, 10, 20, 40, 80, 160]\nfaithfulness_results = {}\nfor K in Ks:\n    top_components = components[:K]\n    circuit_set = set()\n    for kind, L, H, _ in top_components:\n        if kind == \"attn\":\n            circuit_set.add((\"attn\", L, H))\n        else:\n            circuit_set.add((\"mlp\", L))\n    # run ablated on both clean and corr\n    abl_clean = run_circuit_only(clean_prompts)\n    abl_corr = run_circuit_only(corr_prompts)\n    abl_pred = np.concatenate(\n        [(logit_diff(abl_clean) > 0).numpy(), (logit_diff(abl_corr) > 0).numpy()]\n    )\n    match = float((abl_pred == full_all_pred).mean())\n    sparsity = 1.0 - (K / total_components)\n    faithfulness = match * sparsity\n    faithfulness_results[K] = {\n        \"match\": match,\n        \"sparsity\": sparsity,\n        \"faithfulness\": faithfulness,\n    }\n    print(\n        f\"K={K:3d}: match={match:.3f} sparsity={sparsity:.3f} faithfulness={faithfulness:.3f}\"\n    )\n\ncircuit_set = None  # disable ablation for any later runs\n\n\n# ---------- Functional-role bucket analysis (layer buckets) ----------\ndef layer_role(L):\n    if L < n_layers / 3:\n        return \"early_fact_reading\"\n    if L < 2 * n_layers / 3:\n        return \"mid_rule_composition\"\n    return \"late_answer_projection\"\n\n\nrole_counts = {\n    \"early_fact_reading\": 0,\n    \"mid_rule_composition\": 0,\n    \"late_answer_projection\": 0,\n}\nfor kind, L, H, eff in components[:20]:\n    role_counts[layer_role(L)] += 1\nprint(\"Role distribution of top-20 components:\", role_counts)\n\n# ---------- Save experiment data ----------\nexperiment_data = {\n    \"propositional_logic_circuit\": {\n        \"metrics\": {\n            \"train\": [],\n            \"val\": [\n                {\n                    \"epoch\": 0,\n                    \"clean_acc\": clean_acc,\n                    \"corr_acc\": corr_acc,\n                    \"mean_clean_logit_diff\": float(clean_ld.mean()),\n                    \"mean_corr_logit_diff\": float(corr_ld.mean()),\n                }\n            ],\n        },\n        \"losses\": {\"train\": [], \"val\": []},\n        \"head_effects\": head_effects,\n        \"mlp_effects\": mlp_effects,\n        \"top_components\": [(k, L, H, float(e)) for (k, L, H, e) in components[:50]],\n        \"faithfulness\": faithfulness_results,\n        \"role_counts_top20\": role_counts,\n        \"n_layers\": n_layers,\n        \"n_heads\": n_heads,\n        \"d_head\": d_head,\n        \"total_components\": total_components,\n        \"predictions\": full_all_pred.tolist(),\n        \"ground_truth\": [True] * N_PAIRS + [False] * N_PAIRS,\n    }\n}\n\n# best K by faithfulness\nbest_K = max(\n    faithfulness_results.keys(), key=lambda k: faithfulness_results[k][\"faithfulness\"]\n)\nbest = faithfulness_results[best_K]\nprint(\n    f\"\\nBest K={best_K}: faithfulness={best['faithfulness']:.4f} (match={best['match']:.3f}, sparsity={best['sparsity']:.3f})\"\n)\nprint(\n    f\"Epoch 0: validation_loss = {(-math.log(0.5)):.4f}  (placeholder; task is eval-only)\"\n)\nprint(f\"circuit_faithfulness_score = {best['faithfulness']:.4f}\")\n\nnp.save(os.path.join(working_dir, \"experiment_data.npy\"), experiment_data)\n\n# ---------- Plots ----------\ntry:\n    import matplotlib\n\n    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n\n    fig, ax = plt.subplots(1, 2, figsize=(14, 5))\n    im = ax[0].imshow(\n        head_effects,\n        aspect=\"auto\",\n        cmap=\"RdBu_r\",\n        vmin=-abs(head_effects).max(),\n        vmax=abs(head_effects).max(),\n    )\n    ax[0].set_xlabel(\"Head\")\n    ax[0].set_ylabel(\"Layer\")\n    ax[0].set_title(\"Attention head patching recovery\")\n    plt.colorbar(im, ax=ax[0])\n    ax[1].bar(range(n_layers), mlp_effects)\n    ax[1].set_xlabel(\"Layer\")\n    ax[1].set_ylabel(\"Recovery\")\n    ax[1].set_title(\"MLP patching recovery per layer\")\n    plt.tight_layout()\n    plt.savefig(os.path.join(working_dir, \"patching_map.png\"), dpi=100)\n    plt.close()\n\n    Ks_sorted = sorted(faithfulness_results.keys())\n    matches = [faithfulness_results[k][\"match\"] for k in Ks_sorted]\n    faiths = [faithfulness_results[k][\"faithfulness\"] for k in Ks_sorted]\n    fig, ax = plt.subplots(figsize=(7, 4))\n    ax.plot(Ks_sorted, matches, \"o-\", label=\"match(circuit,full)\")\n    ax.plot(Ks_sorted, faiths, \"s-\", label=\"faithfulness\")\n    ax.set_xlabel(\"Circuit size K\")\n    ax.set_ylabel(\"score\")\n    ax.set_title(\"Circuit faithfulness vs size\")\n    ax.legend()\n    ax.grid(True)\n    plt.tight_layout()\n    plt.savefig(os.path.join(working_dir, \"faithfulness_vs_K.png\"), dpi=100)\n    plt.close()\nexcept Exception as e:\n    print(f\"Plot skipped: {e}\")\n\nprint(\"Done.\")\n", "# Set random seed\nimport random\nimport numpy as np\nimport torch\n\nseed = 0\nrandom.seed(seed)\nnp.random.seed(seed)\ntorch.manual_seed(seed)\nif torch.cuda.is_available():\n    torch.cuda.manual_seed(seed)\n\nimport os, json, random, math, gc\nimport numpy as np\nimport torch\nimport torch.nn.functional as F\nfrom transformers import AutoTokenizer, AutoModelForCausalLM\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nMODEL_DIR = \"/data/zhenqian/models\"\n\n# ------ find mistral ------\nmodel_path = None\nfor name in os.listdir(MODEL_DIR):\n    low = name.lower()\n    if \"mistral\" in low and \"7b\" in low:\n        model_path = os.path.join(MODEL_DIR, name)\n        break\nassert model_path is not None\nprint(f\"Using model: {model_path}\")\n\nrandom.seed(0)\nnp.random.seed(0)\ntorch.manual_seed(0)\n\n# ---------- Clean/corrupted paired dataset ----------\n# Corrupt = flip the truth value of the query answer by flipping one fact that leads to it.\nPROP_NAMES = [\"P\", \"Q\", \"R\", \"S\", \"T\", \"U\", \"V\", \"W\", \"X\", \"Y\", \"Z\"]\n\n\ndef make_pair():\n    # simple 2-step chain: A True; A->B; B->C ; query C  (label True)\n    # corrupted: A False (still says False literally); rest identical => label False\n    props = random.sample(PROP_NAMES, 3)\n    A, B, C = props\n    lines_clean = [\n        \"Facts:\",\n        f\"- {A} is True.\",\n        \"Rules:\",\n        f\"- If {A} is True, then {B} is True.\",\n        f\"- If {B} is True, then {C} is True.\",\n        f\"Question: Is {C} True? Answer with only True or False.\",\n        \"Answer:\",\n    ]\n    lines_corr = [\n        \"Facts:\",\n        f\"- {A} is False.\",\n        \"Rules:\",\n        f\"- If {A} is True, then {B} is True.\",\n        f\"- If {B} is True, then {C} is True.\",\n        f\"Question: Is {C} True? Answer with only True or False.\",\n        \"Answer:\",\n    ]\n    return \"\\n\".join(lines_clean), \"\\n\".join(lines_corr), True, False\n\n\nN_PAIRS = 32\npairs = [make_pair() for _ in range(N_PAIRS)]\nclean_prompts = [p[0] for p in pairs]\ncorr_prompts = [p[1] for p in pairs]\nclean_labels = [p[2] for p in pairs]\ncorr_labels = [p[3] for p in pairs]\n\nwith open(os.path.join(working_dir, \"pairs.jsonl\"), \"w\") as f:\n    for cp, xp, cl, xl in zip(clean_prompts, corr_prompts, clean_labels, corr_labels):\n        f.write(\n            json.dumps({\"clean\": cp, \"corr\": xp, \"clean_label\": cl, \"corr_label\": xl})\n            + \"\\n\"\n        )\n\nprint(\"Example clean:\\n\" + clean_prompts[0])\nprint(\"---\")\nprint(\"Example corr:\\n\" + corr_prompts[0])\n\n# ---------- load model ----------\ntokenizer = AutoTokenizer.from_pretrained(model_path, local_files_only=True)\nif tokenizer.pad_token_id is None:\n    tokenizer.pad_token = tokenizer.eos_token\ntokenizer.padding_side = \"left\"\n\nmodel = AutoModelForCausalLM.from_pretrained(\n    model_path,\n    local_files_only=True,\n    torch_dtype=torch.float16 if device.type == \"cuda\" else torch.float32,\n)\nmodel.to(device)\nmodel.eval()\n\ncfg = model.config\nn_layers = cfg.num_hidden_layers\nn_heads = cfg.num_attention_heads\nd_model = cfg.hidden_size\nd_head = d_model // n_heads\nprint(f\"n_layers={n_layers} n_heads={n_heads} d_model={d_model} d_head={d_head}\")\n\n\ndef get_ids(word):\n    ids = set()\n    for v in [word, \" \" + word]:\n        e = tokenizer.encode(v, add_special_tokens=False)\n        if e:\n            ids.add(e[-1])\n    return list(ids)\n\n\ntrue_ids = get_ids(\"True\")\nfalse_ids = get_ids(\"False\")\nprint(\"True ids:\", true_ids, \"False ids:\", false_ids)\n\n\ndef logit_diff(logits_last):\n    # scalar: max True logit - max False logit\n    tl = logits_last[:, true_ids].max(dim=-1).values\n    fl = logits_last[:, false_ids].max(dim=-1).values\n    return tl - fl\n\n\n# ---------- Hook infrastructure ----------\n# We hook:\n#  - attention output projection input (o_proj input): shape [B, T, d_model], reshaped [B,T,n_heads,d_head]  => per-head z\n#  - MLP output (mlp forward output)\n# Store activations at final token position only.\n\nlayers = model.model.layers  # LLaMA-style\n\n# Storage\nclean_head_z = [None] * n_layers  # tensor [B, n_heads, d_head]\nclean_mlp_out = [None] * n_layers  # tensor [B, d_model]\n\n\ndef make_attn_hook(layer_idx, store):\n    # hook on o_proj: pre-forward input is a tuple (x,)\n    def hook(module, inp, out):\n        x = inp[0]  # [B, T, d_model]\n        # take last token\n        xl = x[:, -1, :]  # [B, d_model]\n        z = xl.view(xl.size(0), n_heads, d_head)\n        store[layer_idx] = z.detach()\n\n    return hook\n\n\ndef make_mlp_hook(layer_idx, store):\n    def hook(module, inp, out):\n        # out: [B, T, d_model]\n        store[layer_idx] = out[:, -1, :].detach()\n\n    return hook\n\n\n# Patching hooks (used later)\npatch_state = {\"active\": False, \"kind\": None, \"layer\": None, \"head\": None, \"src\": None}\n\n\ndef make_attn_patch_hook(layer_idx):\n    def pre_hook(module, inp):\n        if not patch_state[\"active\"]:\n            return None\n        if patch_state[\"kind\"] != \"attn\":\n            return None\n        if patch_state[\"layer\"] != layer_idx:\n            return None\n        x = inp[0]\n        # replace last token, specified head(s), with src\n        B, T, D = x.shape\n        x = x.clone()\n        xl = x[:, -1, :].view(B, n_heads, d_head)\n        h = patch_state[\"head\"]\n        src = patch_state[\"src\"]  # [B, d_head] or [B, n_heads, d_head]\n        if isinstance(h, int):\n            xl[:, h, :] = src\n        else:\n            for hi in h:\n                xl[:, hi, :] = src[:, hi, :] if src.dim() == 3 else src\n        x[:, -1, :] = xl.view(B, D)\n        # need to return new inputs\n        new_inp = (x,) + inp[1:]\n        return new_inp\n\n    return pre_hook\n\n\ndef make_mlp_patch_hook(layer_idx):\n    def hook(module, inp, out):\n        if not patch_state[\"active\"]:\n            return None\n        if patch_state[\"kind\"] != \"mlp\":\n            return None\n        if patch_state[\"layer\"] != layer_idx:\n            return None\n        out = out.clone()\n        out[:, -1, :] = patch_state[\"src\"]\n        return out\n\n    return hook\n\n\n# Register capture hooks (permanent, guarded by store variables)\ncapture_handles = []\npatch_handles = []\nattn_stores = clean_head_z\nmlp_stores = clean_mlp_out\n\nfor i, layer in enumerate(layers):\n    h1 = layer.self_attn.o_proj.register_forward_hook(make_attn_hook(i, attn_stores))\n    h2 = layer.mlp.register_forward_hook(make_mlp_hook(i, mlp_stores))\n    capture_handles += [h1, h2]\n    # patch hooks always registered but gated by patch_state\n    p1 = layer.self_attn.o_proj.register_forward_pre_hook(make_attn_patch_hook(i))\n    p2 = layer.mlp.register_forward_hook(make_mlp_patch_hook(i))\n    patch_handles += [p1, p2]\n\n\ndef run_and_capture(prompts, capture=True):\n    enc = tokenizer(\n        prompts, return_tensors=\"pt\", padding=True, truncation=True, max_length=256\n    )\n    enc = {k: v.to(device) for k, v in enc.items()}\n    with torch.no_grad():\n        out = model(**enc)\n    return out.logits[:, -1, :]\n\n\n# ---------- Baseline: full model behavior ----------\nBATCH = 8\n\n\ndef batched_last_logits(prompts, patch=False):\n    outs = []\n    for i in range(0, len(prompts), BATCH):\n        batch = prompts[i : i + BATCH]\n        enc = tokenizer(\n            batch, return_tensors=\"pt\", padding=True, truncation=True, max_length=256\n        )\n        enc = {k: v.to(device) for k, v in enc.items()}\n        with torch.no_grad():\n            out = model(**enc)\n        outs.append(out.logits[:, -1, :].float().cpu())\n    return torch.cat(outs, dim=0)\n\n\n# We need clean and corrupted activations captured. Run twice storing separately.\nclean_attn_all = [torch.zeros(N_PAIRS, n_heads, d_head) for _ in range(n_layers)]\nclean_mlp_all = [torch.zeros(N_PAIRS, d_model) for _ in range(n_layers)]\ncorr_attn_all = [torch.zeros(N_PAIRS, n_heads, d_head) for _ in range(n_layers)]\ncorr_mlp_all = [torch.zeros(N_PAIRS, d_model) for _ in range(n_layers)]\n\n\ndef capture_all(prompts, attn_dest, mlp_dest):\n    logits_all = []\n    for i in range(0, len(prompts), BATCH):\n        batch = prompts[i : i + BATCH]\n        enc = tokenizer(\n            batch, return_tensors=\"pt\", padding=True, truncation=True, max_length=256\n        )\n        enc = {k: v.to(device) for k, v in enc.items()}\n        with torch.no_grad():\n            out = model(**enc)\n        # attn_stores / mlp_stores were filled during forward\n        for li in range(n_layers):\n            attn_dest[li][i : i + len(batch)] = attn_stores[li].float().cpu()\n            mlp_dest[li][i : i + len(batch)] = mlp_stores[li].float().cpu()\n        logits_all.append(out.logits[:, -1, :].float().cpu())\n    return torch.cat(logits_all, dim=0)\n\n\nprint(\"Capturing clean activations...\")\nclean_logits = capture_all(clean_prompts, clean_attn_all, clean_mlp_all)\nprint(\"Capturing corrupted activations...\")\ncorr_logits = capture_all(corr_prompts, corr_attn_all, corr_mlp_all)\n\nclean_ld = logit_diff(clean_logits)  # expect positive (True > False)\ncorr_ld = logit_diff(corr_logits)  # expect negative (False > True)\nprint(f\"Mean clean logit_diff (True-False): {clean_ld.mean():.3f}\")\nprint(f\"Mean corr  logit_diff (True-False): {corr_ld.mean():.3f}\")\n\nclean_pred_true = (clean_ld > 0).float()\ncorr_pred_true = (corr_ld > 0).float()\nclean_acc = float((clean_pred_true == 1).float().mean())\ncorr_acc = float((corr_pred_true == 0).float().mean())\nprint(f\"Baseline clean acc={clean_acc:.3f} corr acc={corr_acc:.3f}\")\n\n# ---------- Activation patching: substitute CLEAN activation into CORRUPTED run ----------\n# Metric: recovery = (patched_ld - corr_ld) / (clean_ld - corr_ld), averaged\ndenom = clean_ld - corr_ld  # per-example\ndenom_mean = denom.mean().item()\nprint(f\"Mean (clean-corr) logit-diff gap: {denom_mean:.3f}\")\n\n\ndef run_corrupted_with_patch(kind, layer, head, src):\n    \"\"\"Run corrupted prompts with a specific patch.\"\"\"\n    patch_state[\"active\"] = True\n    patch_state[\"kind\"] = kind\n    patch_state[\"layer\"] = layer\n    patch_state[\"head\"] = head\n    logits_all = []\n    for i in range(0, len(corr_prompts), BATCH):\n        batch = corr_prompts[i : i + BATCH]\n        enc = tokenizer(\n            batch, return_tensors=\"pt\", padding=True, truncation=True, max_length=256\n        )\n        enc = {k: v.to(device) for k, v in enc.items()}\n        # move src slice to device\n        s = src[i : i + len(batch)].to(device).to(model.dtype)\n        patch_state[\"src\"] = s\n        with torch.no_grad():\n            out = model(**enc)\n        logits_all.append(out.logits[:, -1, :].float().cpu())\n    patch_state[\"active\"] = False\n    return torch.cat(logits_all, dim=0)\n\n\n# Score each attention head\nhead_effects = np.zeros((n_layers, n_heads))\nmlp_effects = np.zeros(n_layers)\n\nprint(\"Patching attention heads...\")\nfor L in range(n_layers):\n    for H in range(n_heads):\n        src = clean_attn_all[L][:, H, :]  # [N, d_head]\n        patched_logits = run_corrupted_with_patch(\"attn\", L, H, src)\n        p_ld = logit_diff(patched_logits)\n        # per-example recovery, then mean\n        recov = ((p_ld - corr_ld) / (denom + 1e-6)).mean().item()\n        head_effects[L, H] = recov\n    if L % 4 == 0:\n        best = np.unravel_index(np.argmax(head_effects[: L + 1]), head_effects.shape)\n        print(f\"  layer {L}: max recovery so far = {head_effects.max():.3f} at {best}\")\n\nprint(\"Patching MLPs...\")\nfor L in range(n_layers):\n    src = clean_mlp_all[L]  # [N, d_model]\n    patched_logits = run_corrupted_with_patch(\"mlp\", L, None, src)\n    p_ld = logit_diff(patched_logits)\n    recov = ((p_ld - corr_ld) / (denom + 1e-6)).mean().item()\n    mlp_effects[L] = recov\nprint(f\"MLP max recovery: {mlp_effects.max():.3f} at layer {mlp_effects.argmax()}\")\n\n# Sort components by effect\ncomponents = []\nfor L in range(n_layers):\n    for H in range(n_heads):\n        components.append((\"attn\", L, H, head_effects[L, H]))\nfor L in range(n_layers):\n    components.append((\"mlp\", L, None, mlp_effects[L]))\ncomponents.sort(key=lambda x: -x[3])\nprint(\"\\nTop 20 components by patching recovery:\")\nfor c in components[:20]:\n    print(c)\n\n# ---------- Build minimal circuit by greedy top-K & measure faithfulness ----------\ntotal_components = n_layers * n_heads + n_layers  # heads + mlps\n\n# Precompute clean means over dataset for mean-ablation\nclean_attn_mean = [\n    clean_attn_all[L].mean(dim=0) for L in range(n_layers)\n]  # [n_heads, d_head]\nclean_mlp_mean = [clean_mlp_all[L].mean(dim=0) for L in range(n_layers)]  # [d_model]\n\n# \"Circuit-only\" run: on CLEAN prompts, mean-ablate every component NOT in circuit\n# implement via forward hooks that overwrite last-token activations to the mean when component not in circuit set\ncircuit_set = None  # will hold sets of (\"attn\",L,H) and (\"mlp\",L)\n\n\ndef make_ablation_attn_hook(layer_idx):\n    def pre_hook(module, inp):\n        if circuit_set is None:\n            return None\n        x = inp[0]\n        B, T, D = x.shape\n        xl = x[:, -1, :].view(B, n_heads, d_head).clone()\n        for H in range(n_heads):\n            if (\"attn\", layer_idx, H) not in circuit_set:\n                xl[:, H, :] = clean_attn_mean[layer_idx][H].to(x.device).to(x.dtype)\n        new_x = x.clone()\n        new_x[:, -1, :] = xl.view(B, D)\n        return (new_x,) + inp[1:]\n\n    return pre_hook\n\n\ndef make_ablation_mlp_hook(layer_idx):\n    def hook(module, inp, out):\n        if circuit_set is None:\n            return None\n        if (\"mlp\", layer_idx) not in circuit_set:\n            out = out.clone()\n            out[:, -1, :] = clean_mlp_mean[layer_idx].to(out.device).to(out.dtype)\n        return out\n\n    return hook\n\n\n# Remove patch hooks and register ablation hooks\nfor h in patch_handles:\n    h.remove()\npatch_handles = []\n\nablation_handles = []\nfor i, layer in enumerate(layers):\n    ah = layer.self_attn.o_proj.register_forward_pre_hook(make_ablation_attn_hook(i))\n    mh = layer.mlp.register_forward_hook(make_ablation_mlp_hook(i))\n    ablation_handles += [ah, mh]\n\n\ndef run_circuit_only(prompts):\n    logits_all = []\n    for i in range(0, len(prompts), BATCH):\n        batch = prompts[i : i + BATCH]\n        enc = tokenizer(\n            batch, return_tensors=\"pt\", padding=True, truncation=True, max_length=256\n        )\n        enc = {k: v.to(device) for k, v in enc.items()}\n        with torch.no_grad():\n            out = model(**enc)\n        logits_all.append(out.logits[:, -1, :].float().cpu())\n    return torch.cat(logits_all, dim=0)\n\n\n# baseline predictions (full model) on clean+corr\nfull_clean_logits = clean_logits\nfull_corr_logits = corr_logits\nfull_clean_pred = (logit_diff(full_clean_logits) > 0).numpy()\nfull_corr_pred = (logit_diff(full_corr_logits) > 0).numpy()\n\nall_prompts = clean_prompts + corr_prompts\nfull_all_pred = np.concatenate([full_clean_pred, full_corr_pred])\n\nKs = [5, 10, 20, 40, 80, 160]\nfaithfulness_results = {}\nfor K in Ks:\n    top_components = components[:K]\n    circuit_set = set()\n    for kind, L, H, _ in top_components:\n        if kind == \"attn\":\n            circuit_set.add((\"attn\", L, H))\n        else:\n            circuit_set.add((\"mlp\", L))\n    # run ablated on both clean and corr\n    abl_clean = run_circuit_only(clean_prompts)\n    abl_corr = run_circuit_only(corr_prompts)\n    abl_pred = np.concatenate(\n        [(logit_diff(abl_clean) > 0).numpy(), (logit_diff(abl_corr) > 0).numpy()]\n    )\n    match = float((abl_pred == full_all_pred).mean())\n    sparsity = 1.0 - (K / total_components)\n    faithfulness = match * sparsity\n    faithfulness_results[K] = {\n        \"match\": match,\n        \"sparsity\": sparsity,\n        \"faithfulness\": faithfulness,\n    }\n    print(\n        f\"K={K:3d}: match={match:.3f} sparsity={sparsity:.3f} faithfulness={faithfulness:.3f}\"\n    )\n\ncircuit_set = None  # disable ablation for any later runs\n\n\n# ---------- Functional-role bucket analysis (layer buckets) ----------\ndef layer_role(L):\n    if L < n_layers / 3:\n        return \"early_fact_reading\"\n    if L < 2 * n_layers / 3:\n        return \"mid_rule_composition\"\n    return \"late_answer_projection\"\n\n\nrole_counts = {\n    \"early_fact_reading\": 0,\n    \"mid_rule_composition\": 0,\n    \"late_answer_projection\": 0,\n}\nfor kind, L, H, eff in components[:20]:\n    role_counts[layer_role(L)] += 1\nprint(\"Role distribution of top-20 components:\", role_counts)\n\n# ---------- Save experiment data ----------\nexperiment_data = {\n    \"propositional_logic_circuit\": {\n        \"metrics\": {\n            \"train\": [],\n            \"val\": [\n                {\n                    \"epoch\": 0,\n                    \"clean_acc\": clean_acc,\n                    \"corr_acc\": corr_acc,\n                    \"mean_clean_logit_diff\": float(clean_ld.mean()),\n                    \"mean_corr_logit_diff\": float(corr_ld.mean()),\n                }\n            ],\n        },\n        \"losses\": {\"train\": [], \"val\": []},\n        \"head_effects\": head_effects,\n        \"mlp_effects\": mlp_effects,\n        \"top_components\": [(k, L, H, float(e)) for (k, L, H, e) in components[:50]],\n        \"faithfulness\": faithfulness_results,\n        \"role_counts_top20\": role_counts,\n        \"n_layers\": n_layers,\n        \"n_heads\": n_heads,\n        \"d_head\": d_head,\n        \"total_components\": total_components,\n        \"predictions\": full_all_pred.tolist(),\n        \"ground_truth\": [True] * N_PAIRS + [False] * N_PAIRS,\n    }\n}\n\n# best K by faithfulness\nbest_K = max(\n    faithfulness_results.keys(), key=lambda k: faithfulness_results[k][\"faithfulness\"]\n)\nbest = faithfulness_results[best_K]\nprint(\n    f\"\\nBest K={best_K}: faithfulness={best['faithfulness']:.4f} (match={best['match']:.3f}, sparsity={best['sparsity']:.3f})\"\n)\nprint(\n    f\"Epoch 0: validation_loss = {(-math.log(0.5)):.4f}  (placeholder; task is eval-only)\"\n)\nprint(f\"circuit_faithfulness_score = {best['faithfulness']:.4f}\")\n\nnp.save(os.path.join(working_dir, \"experiment_data.npy\"), experiment_data)\n\n# ---------- Plots ----------\ntry:\n    import matplotlib\n\n    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n\n    fig, ax = plt.subplots(1, 2, figsize=(14, 5))\n    im = ax[0].imshow(\n        head_effects,\n        aspect=\"auto\",\n        cmap=\"RdBu_r\",\n        vmin=-abs(head_effects).max(),\n        vmax=abs(head_effects).max(),\n    )\n    ax[0].set_xlabel(\"Head\")\n    ax[0].s
