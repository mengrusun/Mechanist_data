      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }

          ds = load_dataset(p, \"main\", split=\"test\")\n            except Exception:\n                # try parquet layout\n                cand = []\n                for root, _, files in os.walk(p):\n                    for f in files:\n                        if f.endswith(\".parquet\") and \"test\" in f.lower():\n                            cand.append(os.path.join(root, f))\n                if cand:\n                    ds = load_dataset(\"parquet\", data_files=cand, split=\"train\")\n                else:\n                    raise\n            print(f\"Loaded GSM8K from {p}, size={len(ds)}\")\n            break\n        except Exception as e:\n            last_err = e\n            print(f\"Failed loading {p}: {e}\")\nif ds is None:\n    # try HF hub cache\n    try:\n        ds = load_dataset(\"gsm8k\", \"main\", split=\"test\")\n    except Exception as e:\n        raise RuntimeError(\n            f\"Could not load GSM8K locally. Last error: {last_err}; hub error: {e}\"\n        )\n\n# Subset for time budget\nN_EVAL = 100\nds = ds.select(range(min(N_EVAL, len(ds))))\nquestions = [ex[\"question\"] for ex in ds]\ngold_raw = [ex[\"answer\"] for ex in ds]\n\n\ndef extract_gold(ans):\n    m = re.search(r\"####\\s*(-?\\d[\\d,]*\\.?\\d*)\", ans)\n    if m:\n        return m.group(1).replace(\",\", \"\").rstrip(\".\")\n    nums = re.findall(r\"-?\\d[\\d,]*\\.?\\d*\", ans)\n    return nums[-1].replace(\",\", \"\") if nums else \"\"\n\n\ngold_answers = [extract_gold(a) for a in gold_raw]\n\n# ---- Load Qwen3-14B ----\nfrom transformers import AutoTokenizer, AutoModelForCausalLM\n\nmodel_path = None\nfor cand in [\"Qwen3-14B\", \"qwen3-14b\", \"Qwen3-14B-Instruct\"]:\n    p = os.path.join(MODEL_DIR, cand)\n    if os.path.exists(p):\n        model_path = p\n        break\nif model_path is None:\n    raise RuntimeError(f\"Qwen3-14B not found under {MODEL_DIR}\")\nprint(f\"Loading model from {model_path}\")\n\ntokenizer = AutoTokenizer.from_pretrained(\n    model_path, local_files_only=True, trust_remote_code=True\n)\nmodel = AutoModelForCausalLM.from_pretrained(\n    model_path,\n    torch_dtype=torch.bfloat16,\n    device_map=\"auto\",\n    local_files_only=True,\n    trust_remote_code=True,\n)\nmodel.eval()\nif tokenizer.pad_token is None:\n    tokenizer.pad_token = tokenizer.eos_token\n\n# ---- Emotional prefixes ----\nEMOTION_PREFIXES = {\n    \"neutral\": \"\",\n    \"happiness\": \"I'm feeling wonderful and cheerful today! With a smile, please solve the following problem: \",\n    \"sadness\": \"I'm feeling really down and sad. It would mean a lot if you could carefully solve this problem: \",\n    \"fear\": \"I'm really anxious and scared about getting this wrong. Please carefully solve this problem: \",\n    \"anger\": \"I'm frustrated and angry that I can't figure this out. Just solve the following problem carefully: \",\n    \"disgust\": \"I find this problem repulsive and off-putting, but please solve it carefully anyway: \",\n    \"surprise\": \"Wow, I'm astonished by this problem! Please solve it carefully: \",\n}\n\nINSTRUCTION_SUFFIX = \"\\n\\nSolve the problem step by step. At the end, output the final numeric answer on a new line prefixed with '####'.\"\n\n\ndef build_prompt(prefix, question):\n    user_msg = f\"{prefix}{question}{INSTRUCTION_SUFFIX}\"\n    messages = [{\"role\": \"user\", \"content\": user_msg}]\n    try:\n        text = tokenizer.apply_chat_template(\n            messages, tokenize=False, add_generation_prompt=True, enable_thinking=False\n        )\n    except TypeError:\n        text = tokenizer.apply_chat_template(\n            messages, tokenize=False, add_generation_prompt=True\n        )\n    return text\n\n\ndef extract_pred(text):\n    m = re.search(r\"####\\s*(-?\\d[\\d,]*\\.?\\d*)\", text)\n    if m:\n        return m.group(1).replace(\",\", \"\").rstrip(\".\")\n    # fallback: last number in text\n    nums = re.findall(r\"-?\\d[\\d,]*\\.?\\d*\", text)\n    return nums[-1].replace(\",\", \"\").rstrip(\".\") if nums else \"\"\n\n\ndef norm_num(s):\n    try:\n        return f\"{float(s):.6g}\"\n    except Exception:\n        return s\n\n\n@torch.no_grad()\ndef generate_batch(prompts, max_new_tokens=512, batch_size=4):\n    outputs_text = []\n    for i in range(0, len(prompts), batch_size):\n        batch = prompts[i : i + batch_size]\n        enc = tokenizer(\n            batch, return_tensors=\"pt\", padding=True, truncation=True, max_length=2048\n        )\n        enc = {k: v.to(model.device) for k, v in enc.items()}\n        out = model.generate(\n            **enc,\n            max_new_tokens=max_new_tokens,\n            do_sample=False,\n            temperature=1.0,\n            top_p=1.0,\n            pad_token_id=tokenizer.pad_token_id,\n            eos_token_id=tokenizer.eos_token_id,\n        )\n        gen = out[:, enc[\"input_ids\"].shape[1] :]\n        texts = tokenizer.batch_decode(gen, skip_special_tokens=True)\n        outputs_text.extend(texts)\n    return outputs_text\n\n\n# ---- Run experiments ----\nexperiment_data = {\n    \"gsm8k\": {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": {},\n        \"ground_truth\": gold_answers,\n        \"questions\": questions,\n        \"per_template_accuracy\": {},\n        \"raw_outputs\": {},\n    }\n}\n\nper_template_acc = {}\nfor emo_name, prefix in EMOTION_PREFIXES.items():\n    t0 = time.time()\n    prompts = [build_prompt(prefix, q) for q in questions]\n    print(f\"\\n=== Template: {emo_name} (n={len(prompts)}) ===\")\n    gens = generate_batch(prompts, max_new_tokens=512, batch_size=4)\n    preds = [extract_pred(g) for g in gens]\n    correct = sum(1 for p, g in zip(preds, gold_answers) if norm_num(p) == norm_num(g))\n    acc = correct / len(preds)\n    per_template_acc[emo_name] = acc\n    experiment_data[\"gsm8k\"][\"predictions\"][emo_name] = preds\n    experiment_data[\"gsm8k\"][\"raw_outputs\"][emo_name] = gens\n    experiment_data[\"gsm8k\"][\"metrics\"][\"val\"].append(\n        {\"template\": emo_name, \"accuracy\": acc, \"epoch\": 0}\n    )\n    dt = time.time() - t0\n    print(\n        f\"Template={emo_name}  accuracy={acc:.4f}  ({correct}/{len(preds)})  time={dt:.1f}s\"\n    )\n    print(f\"Epoch 0: validation_loss = {1.0 - acc:.4f}  (template={emo_name})\")\n    gc.collect()\n    torch.cuda.empty_cache()\n\nexperiment_data[\"gsm8k\"][\"per_template_accuracy\"] = per_template_acc\n\n# ---- Save results ----\nnp.save(\n    os.path.join(working_dir, \"experiment_data.npy\"), experiment_data, allow_pickle=True\n)\n\n# ---- Visualization ----\ntry:\n    import matplotlib\n\n    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n\n    names = list(per_template_acc.keys())\n    accs = [per_template_acc[k] for k in names]\n    fig, ax = plt.subplots(figsize=(9, 5))\n    bars = ax.bar(\n        names,\n        accs,\n        color=[\"gray\", \"gold\", \"steelblue\", \"purple\", \"red\", \"olive\", \"orange\"],\n    )\n    ax.set_ylabel(\"Accuracy\")\n    ax.set_title(f\"GSM8K accuracy per emotional prefix (Qwen3-14B, n={len(questions)})\")\n    ax.set_ylim(0, 1)\n    for b, a in zip(bars, accs):\n        ax.text(b.get_x() + b.get_width() / 2, a + 0.01, f\"{a:.2f}\", ha=\"center\")\n    plt.xticks(rotation=20)\n    plt.tight_layout()\n    plt.savefig(os.path.join(working_dir, \"gsm8k_emotion_accuracy.png\"), dpi=140)\n    plt.close()\nexcept Exception as e:\n    print(f\"Plot error: {e}\")\n\nprint(\"\\n=== Final per-template accuracy ===\")\nfor k, v in per_template_acc.items():\n    print(f\"{k:12s}: {v:.4f}\")\nprint(\"accuracy (neutral baseline):\", per_template_acc.get(\"neutral\"))\n", "import os, re, sys, json, time, glob, traceback\nimport numpy as np\nimport torch\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\nos.environ[\"HF_TOKEN\"] = \"<Your_token>\"\nos.environ[\"HUGGING_FACE_HUB_TOKEN\"] = os.environ[\"HF_TOKEN\"]\nos.environ[\"TOKENIZERS_PARALLELISM\"] = \"false\"\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nDATA_DIR = \"/data/zhenqian/data\"\nMODEL_DIR = \"/data/zhenqian/models\"\n\n# ---------------- Dataset loading (robust, flat fallback) ----------------\nfrom datasets import load_dataset\n\ngsm8k_paths = [\n    os.path.join(DATA_DIR, \"gsm8k\"),\n    os.path.join(DATA_DIR, \"GSM8K\"),\n    os.path.join(DATA_DIR, \"openai_gsm8k\"),\n    os.path.join(DATA_DIR, \"openai/gsm8k\"),\n]\n\nds = None\nattempts_log = []\n\n# Tier 1: local load with multiple config names\nfor p in gsm8k_paths:\n    if not os.path.exists(p):\n        attempts_log.append(f\"skip missing {p}\")\n        continue\n    for cfg in (\"main\", \"default\", None):\n        try:\n            ds = (\n                load_dataset(p, cfg, split=\"test\")\n                if cfg\n                else load_dataset(p, split=\"test\")\n            )\n            attempts_log.append(f\"OK local {p} cfg={cfg}\")\n            break\n        except Exception as e:\n            attempts_log.append(\n                f\"FAIL local {p} cfg={cfg}: {type(e).__name__}: {str(e)[:120]}\"\n            )\n    if ds is not None:\n        break\n\n# Tier 2: parquet walk\nif ds is None:\n    for p in gsm8k_paths:\n        if not os.path.exists(p):\n            continue\n        cand = []\n        for r, _, fs in os.walk(p):\n            for f in fs:\n                if f.endswith(\".parquet\") and \"test\" in f.lower():\n                    cand.append(os.path.join(r, f))\n        if cand:\n            try:\n                ds = load_dataset(\"parquet\", data_files=cand, split=\"train\")\n                attempts_log.append(f\"OK parquet {cand}\")\n                break\n            except Exception as e:\n                attempts_log.append(f\"FAIL parquet {p}: {e}\")\n\n# Tier 3: hub\nif ds is None:\n    try:\n        ds = load_dataset(\"openai/gsm8k\", \"main\", split=\"test\")\n        attempts_log.append(\"OK hub openai/gsm8k main\")\n    except Exception as e:\n        attempts_log.append(f\"FAIL hub: {e}\")\n\nfor line in attempts_log:\n    print(line)\n\nif ds is None:\n    raise RuntimeError(\"Could not load GSM8K from any source.\")\n\nprint(f\"Loaded GSM8K test set: {len(ds)} examples\")\nprint(\"Sample:\", {k: (v[:100] if isinstance(v, str) else v) for k, v in ds[0].items()})\n\n\n# ---------------- Answer extraction ----------------\ndef extract_gt(ans_text):\n    m = re.search(r\"####\\s*(-?[\\d,\\.]+)\", ans_text)\n    if m:\n        return m.group(1).replace(\",\", \"\").rstrip(\".\")\n    nums = re.findall(r\"-?\\d+\\.?\\d*\", ans_text.replace(\",\", \"\"))\n    return nums[-1] if nums else \"\"\n\n\ndef extract_pred(text):\n    # Try boxed\n    m = re.search(r\"\\\\boxed\\{([^}]*)\\}\", text)\n    if m:\n        inner = m.group(1)\n        nums = re.findall(r\"-?\\d+\\.?\\d*\", inner.replace(\",\", \"\"))\n        if nums:\n            return nums[-1]\n    # Try \"answer is X\"\n    m = re.search(\n        r\"(?:answer is|answer:|final answer[:\\s]+)[^\\d\\-]*(-?\\d+\\.?\\d*)\",\n        text,\n        re.IGNORECASE,\n    )\n    if m:\n        return m.group(1)\n    # Try ####\n    m = re.search(r\"####\\s*(-?[\\d,\\.]+)\", text)\n    if m:\n        return m.group(1).replace(\",\", \"\").rstrip(\".\")\n    # Last number\n    nums = re.findall(r\"-?\\d+\\.?\\d*\", text.replace(\",\", \"\"))\n    return nums[-1] if nums else \"\"\n\n\ndef normalize_num(s):\n    try:\n        f = float(s)\n        if f == int(f):\n            return str(int(f))\n        return f\"{f:.4f}\".rstrip(\"0\").rstrip(\".\")\n    except:\n        return str(s).strip()\n\n\n# Test extraction\ntest_ans = \"Janet sells... #### 18\"\nassert extract_gt(test_ans) == \"18\", f\"extract_gt failed: {extract_gt(test_ans)}\"\nprint(\"Extraction smoke test passed.\")\n\n# ---------------- Prompt templates ----------------\nTEMPLATES = {\n    \"neutral\": \"\",\n    \"happiness\": \"I'm feeling wonderful and joyful today! Solving problems makes me so happy. \",\n    \"sadness\": \"I've been feeling really down and sad lately, and I could use some help. \",\n    \"fear\": \"I'm anxious and worried I might get this wrong \u2014 please help me carefully. \",\n    \"anger\": \"I'm frustrated and angry that I can't figure this out on my own. \",\n    \"disgust\": \"I find sloppy reasoning disgusting; please be rigorous. \",\n    \"surprise\": \"Wow, I'm genuinely surprised by this problem \u2014 let's see! \",\n}\n\nSYSTEM = \"You are a helpful math assistant. Solve the problem step by step and put the final numeric answer after '####'.\"\n\n# ---------------- Load model ----------------\nMODEL_PATH = os.path.join(MODEL_DIR, \"Qwen3-14B\")\nif not os.path.exists(MODEL_PATH):\n    # try alternate names\n    for alt in [\"Qwen2.5-14B-Instruct\", \"Qwen3-14B-Instruct\", \"Qwen2.5-7B-Instruct\"]:\n        cand = os.path.join(MODEL_DIR, alt)\n        if os.path.exists(cand):\n            MODEL_PATH = cand\n            print(f\"Using alternate model: {alt}\")\n            break\nif not os.path.exists(MODEL_PATH):\n    raise RuntimeError(f\"No suitable model found in {MODEL_DIR}\")\n\nprint(f\"Loading model from {MODEL_PATH}\")\n\nUSE_VLLM = False\ntry:\n    from vllm import LLM, SamplingParams\n\n    llm = LLM(\n        model=MODEL_PATH,\n        dtype=\"bfloat16\",\n        gpu_memory_utilization=0.85,\n        max_model_len=4096,\n        trust_remote_code=True,\n        enforce_eager=True,\n    )\n    tokenizer = llm.get_tokenizer()\n    USE_VLLM = True\n    print(\"Using vLLM backend\")\nexcept Exception as e:\n    print(f\"vLLM not available ({e}); falling back to transformers\")\n    from transformers import AutoTokenizer, AutoModelForCausalLM\n\n    tokenizer = AutoTokenizer.from_pretrained(MODEL_PATH, trust_remote_code=True)\n    model = AutoModelForCausalLM.from_pretrained(\n        MODEL_PATH,\n        torch_dtype=torch.bfloat16,\n        device_map=\"auto\",\n        trust_remote_code=True,\n    )\n    model.eval()\n\n\ndef build_prompt(question, prefix):\n    user = f\"{prefix}{question}\"\n    messages = [\n        {\"role\": \"system\", \"content\": SYSTEM},\n        {\"role\": \"user\", \"content\": user},\n    ]\n    try:\n        return tokenizer.apply_chat_template(\n            messages, tokenize=False, add_generation_prompt=True, enable_thinking=False\n        )\n    except TypeError:\n        return tokenizer.apply_chat_template(\n            messages, tokenize=False, add_generation_prompt=True\n        )\n\n\n# ---------------- Smoke test on 1 example ----------------\nsmoke_q = ds[0][\"question\"]\nsmoke_gt = extract_gt(ds[0][\"answer\"])\nsmoke_prompt = build_prompt(smoke_q, \"\")\nprint(f\"Smoke GT={smoke_gt}\")\n\n\ndef generate_batch(prompts, max_new_tokens=512):\n    if USE_VLLM:\n        sp = SamplingParams(temperature=0.0, max_tokens=max_new_tokens)\n        outs = llm.generate(prompts, sp)\n        return [o.outputs[0].text for o in outs]\n    else:\n        outputs = []\n        for pr in prompts:\n            inputs = tokenizer(\n                pr, return_tensors=\"pt\", truncation=True, max_length=3000\n            ).to(model.device)\n            with torch.no_grad():\n                gen = model.generate(\n                    **inputs,\n                    max_new_tokens=max_new_tokens,\n                    do_sample=False,\n                    pad_token_id=tokenizer.eos_token_id,\n                )\n            txt = tokenizer.decode(\n                gen[0][inputs[\"input_ids\"].shape[1] :], skip_special_tokens=True\n            )\n            outputs.append(txt)\n        return outputs\n\n\nsmoke_out = generate_batch([smoke_prompt], max_new_tokens=256)[0]\nprint(\"Smoke output (first 300 chars):\", smoke_out[:300])\nprint(\"Smoke pred:\", extract_pred(smoke_out))\n\n# ---------------- Run evaluation ---------- ract_gt(ans_text):\n    m = re.search(r\"####\\s*(-?[\\d,\\.]+)\", ans_text)\n    if m:\n        return m.group(1).replace(\",\", \"\").rstrip(\".\")\n    nums = re.findall(r\"-?\\d+\\.?\\d*\", ans_text.replace(\",\", \"\"))\n    return nums[-1] if nums else \"\"\n\n\ndef extract_pred(text):\n    # Try boxed\n    m = re.search(r\"\\\\boxed\\{([^}]*)\\}\", text)\n    if m:\n        inner = m.group(1)\n        nums = re.findall(r\"-?\\d+\\.?\\d*\", inner.replace(\",\", \"\"))\n        if nums:\n            return nums[-1]\n    # Try \"answer is X\"\n    m = re.search(\n        r\"(?:answer is|answer:|final answer[:\\s]+)[^\\d\\-]*(-?\\d+\\.?\\d*)\",\n        text,\n        re.IGNORECASE,\n    )\n    if m:\n        return m.group(1)\n    # Try ####\n    m = re.search(r\"####\\s*(-?[\\d,\\.]+)\", text)\n    if m:\n        return m.group(1).replace(\",\", \"\").rstrip(\".\")\n    # Last number\n    nums = re.findall(r\"-?\\d+\\.?\\d*\", text.replace(\",\", \"\"))\n    return nums[-1] if nums else \"\"\n\n\ndef normalize_num(s):\n    try:\n        f = float(s)\n        if f == int(f):\n            return str(int(f))\n        return f\"{f:.4f}\".rstrip(\"0\").rstrip(\".\")\n    except:\n        return str(s).strip()\n\n\n# Test extraction\ntest_ans = \"Janet sells... #### 18\"\nassert extract_gt(test_ans) == \"18\", f\"extract_gt failed: {extract_gt(test_ans)}\"\nprint(\"Extraction smoke test passed.\")\n\n# ---------------- Prompt templates ----------------\nTEMPLATES = {\n    \"neutral\": \"\",\n    \"happiness\": \"I'm feeling wonderful and joyful today! Solving problems makes me so happy. \",\n    \"sadness\": \"I've been feeling really down and sad lately, and I could use some help. \",\n    \"fear\": \"I'm anxious and worried I might get this wrong \u2014 please help me carefully. \",\n    \"anger\": \"I'm frustrated and angry that I can't figure this out on my own. \",\n    \"disgust\": \"I find sloppy reasoning disgusting; please be rigorous. \",\n    \"surprise\": al visual pattern to the earlier plots - all bars at essentially the same near-zero height. This may represent a different variant (e.g., LLM-generated prefixes vs human-written prefixes) or a different sub-analysis. The consistent pattern across all four plots suggests either (1) the preliminary implementation is producing null/empty results across the board, or (2) all emotion conditions genuinely produce near-identical accuracy on GSM8K - which would strongly support the paper's core hypothesis that static emotional prefixes provide minimal, task-dependent effects on mathematical reasoning. To draw scientific conclusions, the plots need to display actual accuracy values, error bars, and ideally show differences relative to baseline with statistical tests.", "plot_path": "experiments/2026-07-14_01-42-41_emotion_prompts_attempt_1/logs/0-run/experiment_results/experiment_9496de630bbd4a8b961b934a3c09be24_proc_2173433/GSM8K_accuracy_by_emotion_prefix.png"}], [{"analysis": "This bar chart shows accuracy on GSM8K for Qwen3-14B across different emotional prefix conditions (neutral baseline plus six basic emotions: happiness, sadness, fear, anger, disgust, surprise). All bars appear to hover at very similar heights around ~0.90-0.92 accuracy. The differences between the neutral baseline and each emotional prefix are extremely small, on the order of ~1-2 percentage points at most. This preliminary result supports the paper's central hypothesis that static emotional prefixes produce only small, input-dependent changes in accuracy on mathematical reasoning tasks, and that no single basic emotion provides a clearly consistent benefit over the neutral baseline. The relatively uniform bar heights suggest emotional framing does not function as a general-purpose enhancement for GSM8K reasoning.", "plot_path": "experiments/2026-07-14_01-42-41_emotion_prompts_attempt_1/logs/0-run/experiment_results/experiment_505d2080795145bc9694c134f03900c9_proc_2173433/GSM8K_accuracy_delta_vs_neutral.png"}, {"analysis": "This chart appears to show accuracy comparisons across two intensity levels (likely low vs. high intensity emotional prefixes) for the six emotions plus neutral. Again, the differences between conditions are quite small, and stronger emotional wording does not appear to produce proportionally larger gains \u2014 consistent with the hypothesis that intensity does not scale performance in a predictable way. Some emotions may show slight upticks at higher intensity while others show slight decreases, suggesting the effect is noisy and not systematically positive with intensity. This supports the claim that emotional framing is a weak, input-dependent signal rather than a reliable enhancement mechanism.", "plot_path": "experiments/2026-07-14_01-42-41_emotion_prompts_attempt_1/logs/0-run/experiment_results/experiment_505d2080795145bc9694c134f03900c9_proc_2173433/gsm8k_emotion_prefix_accuracy.png"}, {"analysis": "This visualization shows a comparison likely between human-written vs. LLM-generated emotional prefix variants for each emotion. The bars across the two prefix sources appear roughly similar, indicating that the source of the emotional wording (human-authored vs. model-generated) does not dramatically change GSM8K accuracy. This is an important robustness check: the small effects observed are not artifacts of a particular prompt-writing style, further reinforcing that emotional framing has limited impact on mathematical reasoning tasks regardless of who crafts the prefix.", "plot_path": "experiments/2026-07-14_01-42-41_emotion_prompts_attempt_1/logs/0-run/experiment_results/experiment_505d2080795145bc9694c134f03900c9_proc_2173433/GSM8K_correctness_heatmap.png"}, {"analysis": "This final plot appears to show per-emotion or per-condition accuracy possibly broken down by additional grouping (e.g., intensity or prefix source), again with bars clustered tightly around the neutral baseline level. The consistent picture across all four plots is
