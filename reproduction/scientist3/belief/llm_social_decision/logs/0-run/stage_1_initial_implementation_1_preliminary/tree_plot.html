      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }

const treeStructData = {"edges": [], "layout": [[0.0, 0.0], [1.0, 0.0]], "plan": ["I'll implement a baseline for extracting steerable social-variable directions\nfrom Llama-3.1-8B-Instruct's residual stream in a dictator-game setting. The\nplan: (1) generate 1000 dictator-game prompts with randomized\ngender/age/instruction/meeting variables, (2) for each variable, create paired\nprompts differing only in that variable and extract mean difference vectors from\na mid-layer residual stream, (3) compute \"pure\" directions by orthogonalizing\neach variable's direction against the others, (4) run baseline generation to get\ntransfer amounts, (5) run interventions by adding +\u03b1\u00b7d and -\u03b1\u00b7d to the residual\nstream at the extraction layer via forward hooks, and (6) compute Cohen's d\nbetween positive and negative injection transfer amounts per variable. To keep\nruntime manageable within 10 hours, I'll use a subset of trials (100) for the\nintervention sweep but extract directions from all 1000 paired prompts, and\nparse the numeric transfer from short greedy generations.", "I'll implement a baseline for extracting and injecting social-variable\ndirections in Llama-3.1-8B-Instruct's residual stream on a dictator game. The\nplan: (1) build 1000 dictator-game prompts with randomized\ngender/age/instruction/meeting variables; (2) for each variable, build paired\nprompts differing only in that variable and compute the mean difference of\nresidual-stream activations at a middle layer to get a \"raw\" direction; (3)\northogonalize each direction against the others (Gram-Schmidt) to get \"pure\"\ndirections; (4) causally intervene by adding \u00b1\u03b1\u00b7direction as a forward hook on\nthat layer during generation on a subset of trials; (5) parse the transfer\namount from the generated text and compute Cohen's d between positive vs\nnegative injection as the effect size per variable. I'll use greedy decoding\nwith a small max_new_tokens, extract activations at the last prompt token, and\nuse a subset (e.g., 60 prompts per variable) for intervention to keep runtime\nbounded. Results (per-variable Cohen's d, transfers) are saved to\nexperiment_data.npy and a bar chart is plotted."], "code": ["import os, re, json, random, gc\nimport numpy as np\nimport torch\nimport torch.nn.functional as F\nfrom transformers import AutoTokenizer, AutoModelForCausalLM\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nMODEL_DIR = \"/data/zhenqian/models\"\nMODEL_PATH = os.path.join(MODEL_DIR, \"Llama-3.1-8B-Instruct\")\nif not os.path.isdir(MODEL_PATH):\n    # try alternate naming\n    for cand in [\n        \"Meta-Llama-3.1-8B-Instruct\",\n        \"llama-3.1-8b-instruct\",\n        \"Llama-3.1-8B-Instruct\",\n    ]:\n        p = os.path.join(MODEL_DIR, cand)\n        if os.path.isdir(p):\n            MODEL_PATH = p\n            break\nprint(f\"Loading model from {MODEL_PATH}\")\n\ntokenizer = AutoTokenizer.from_pretrained(MODEL_PATH, local_files_only=True)\nif tokenizer.pad_token is None:\n    tokenizer.pad_token = tokenizer.eos_token\nmodel = AutoModelForCausalLM.from_pretrained(\n    MODEL_PATH, torch_dtype=torch.bfloat16, local_files_only=True, device_map=None\n).to(device)\nmodel.eval()\n\nn_layers = model.config.num_hidden_layers\nhidden_size = model.config.hidden_size\nEXTRACT_LAYER = n_layers // 2  # mid-layer\nprint(f\"n_layers={n_layers}, hidden_size={hidden_size}, extract_layer={EXTRACT_LAYER}\")\n\n# ---------- 1. Build dictator-game trials ----------\nGENDERS = [\"male\", \"female\"]\nAGES = [\"young (age 22)\", \"old (age 68)\"]\nINSTRUCTIONS = [\n    \"You are participating in an economics experiment. You have been given $20 and must decide how much to transfer to an anonymous recipient. The recipient will receive whatever you transfer; you keep the rest.\",\n    \"Imagine you found $20 and can share any portion with a stranger who has nothing. Whatever you give to them, they keep; whatever you keep, is yours.\",\n]\nMEETINGS = [\n    \"You will meet the recipient face-to-face after the decision.\",\n    \"You will never meet the recipient; the transaction is fully anonymous.\",\n]\n\nVAR_OPTIONS = {\n    \"gender\": GENDERS,\n    \"age\": AGES,\n    \"instruction\": INSTRUCTIONS,\n    \"meeting\": MEETINGS,\n}\n\n\ndef build_prompt(gender, age, instruction, meeting):\n    system = \"You are a participant in an economics decision-making study. Respond with only a single integer amount in dollars.\"\n    user = (\n        f\"You are a {gender}, {age}.\\n\\n\"\n        f\"{instruction}\\n\\n\"\n        f\"{meeting}\\n\\n\"\n        f\"You have $20. How many dollars (an integer from 0 to 20) will you transfer to the recipient? \"\n        f\"Answer with only a single integer.\"\n    )\n    messages = [\n        {\"role\": \"system\", \"content\": system},\n        {\"role\": \"user\", \"content\": user},\n    ]\n    return tokenizer.apply_chat_template(\n        messages, tokenize=False, add_generation_prompt=True\n    )\n\n\nrandom.seed(0)\nnp.random.seed(0)\ntorch.manual_seed(0)\n\nN_TRIALS = 1000\ntrials = []\nfor i in range(N_TRIALS):\n    g = random.choice(GENDERS)\n    a = random.choice(AGES)\n    ins = random.choice(INSTRUCTIONS)\n    m = random.choice(MEETINGS)\n    trials.append({\"gender\": g, \"age\": a, \"instruction\": ins, \"meeting\": m})\n\n# ---------- 2. Hook to capture / modify residual stream ----------\n_captured = {}\n_injection = {\"vec\": None, \"alpha\": 0.0}\n\n\ndef make_hook(layer_idx):\n    def hook(module, inputs, outputs):\n        # outputs is tuple; first element is hidden states [B, T, H]\n        if isinstance(outputs, tuple):\n            h = outputs[0]\n        else:\n            h = outputs\n        if _captured.get(\"capture\", False):\n            # store last token hidden state of each batch elem\n            _captured[\"h\"] = h[:, -1, :].detach().float().cpu()\n        if _injection[\"vec\"] is not None:\n            v = _injection[\"vec\"].to(h.device).to(h.dtype)\n            h = h + _injection[\"alpha\"] * v.view(1, 1, -1)\n            if isinstance(outputs, tuple):\n                return (h,) + outputs[1:]\n            return h\n        return outputs\n\n    return hook\n\n\ntarget_layer = model.model.layers[EXTRACT_LAYER]\nhook_handle = target_layer.register_forward_hook(make_hook(EXTRACT_LAYER))\n\n\n# ---------- 3. Extract residual activations for paired prompts ----------\n@torch.no_grad()\ndef get_last_token_hidden(prompts, batch_size=4):\n    all_h = []\n    _captured[\"capture\"] = True\n    _injection[\"vec\"] = None\n    for i in range(0, len(prompts), batch_size):\n        batch = prompts[i : i + batch_size]\n        enc = tokenizer(\n            batch, return_tensors=\"pt\", padding=True, truncation=True, max_length=512\n        ).to(device)\n        # need last non-pad token per example. We'll run one-by-one to simplify.\n        for j, p in enumerate(batch):\n            enc1 = tokenizer(\n                p, return_tensors=\"pt\", truncation=True, max_length=512\n            ).to(device)\n            _ = model(**enc1)\n            all_h.append(_captured[\"h\"][0].clone())\n    _captured[\"capture\"] = False\n    return torch.stack(all_h, dim=0)  # [N, H]\n\n\n# For direction extraction we need paired prompts differing in one variable.\n# We'll use a subset of trials to build pairs (300 pairs per variable).\nN_PAIR = 200\npair_indices = random.sample(range(N_TRIALS), N_PAIR)\n\ndirections = {}\nfor var, opts in VAR_OPTIONS.items():\n    print(f\"Extracting direction for {var}...\")\n    prompts_pos, prompts_neg = [], []\n    for idx in pair_indices:\n        t = dict(trials[idx])\n        t[var] = opts[0]\n        prompts_pos.append(build_prompt(**t))\n        t2 = dict(trials[idx])\n        t2[var] = opts[1]\n        prompts_neg.append(build_prompt(**t2))\n    h_pos = get_last_token_hidden(prompts_pos)\n    h_neg = get_last_token_hidden(prompts_neg)\n    diff = (h_pos - h_neg).mean(dim=0)  # [H]\n    directions[var] = diff\n    print(f\"  ||diff||={diff.norm().item():.3f}\")\n\n\n# ---------- 4. Compute \"pure\" directions by orthogonalizing ----------\ndef orthogonalize(target, others):\n    v = target.clone()\n    for o in others:\n        o_unit = o / (o.norm() + 1e-8)\n        v = v - (v @ o_unit) * o_unit\n    return v\n\n\npure_directions = {}\nvar_list = list(directions.keys())\nfor var in var_list:\n    others = [directions[v] for v in var_list if v != var]\n    pure_directions[var] = orthogonalize(directions[var], others)\n    print(f\"Pure {var}: ||d||={pure_directions[var].norm().item():.3f}\")\n\n# ---------- 5. Baseline + intervention generation ----------\nINT_TRIALS = 80  # trials used to evaluate intervention effect per variable\nint_indices = random.sample(range(N_TRIALS), INT_TRIALS)\n\n\ndef parse_transfer(text):\n    # find first integer 0..20\n    for m in re.finditer(r\"-?\\d+\", text):\n        try:\n            n = int(m.group())\n            if 0 <= n <= 20:\n                return n\n        except:\n            pass\n    return None\n\n\n@torch.no_grad()\ndef generate_transfer(prompt, max_new_tokens=8):\n    enc = tokenizer(prompt, return_tensors=\"pt\", truncation=True, max_length=512).to(\n        device\n    )\n    out = model.generate(\n        **enc,\n        max_new_tokens=max_new_tokens,\n        do_sample=False,\n        temperature=1.0,\n        pad_token_id=tokenizer.eos_token_id,\n    )\n    gen = tokenizer.decode(\n        out[0, enc[\"input_ids\"].shape[1] :], skip_special_tokens=True\n    )\n    return parse_transfer(gen), gen\n\n\n# Determine alpha scale using norm of typical hidden state\n_captured[\"capture\"] = True\n_injection[\"vec\"] = None\nsample_prompt = build_prompt(**trials[0])\nenc = tokenizer(sample_prompt, return_tensors=\"pt\").to(device)\nwith torch.no_grad():\n    _ = model(**enc)\nhidden_norm = _captured[\"h\"][0].norm().item()\n_captured[\"capture\"] = False\nprint(f\"Typical hidden state norm at layer {EXTRACT_LAYER}: {hidden_norm:.2f}\")\n\nexperiment_data = {\n    \"dictator_game\": {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"effect_sizes\": {},\n        \"per_variable_results\": {},\n        \"directions_norms\": {\n            v: float(pure_directions[v].norm().item()) for v in var_list\n        },\n        \"extract_layer\": EXTRACT_LAYER,\n    }\n}\n\n\ndef cohens_d(a, b):\n    a = np.array(a, dtype=float)\n    b = np.array(b, dtype=float)\n    if len(a) < 2 or len(b) < 2:\n        return 0.0\n    va, vb = a.var(ddof=1), b.var(ddof=1)\n    pooled = np.sqrt(\n        ((len(a) - 1) * va + (len(b) - 1) * vb) / (len(a) + len(b) - 2) + 1e-8\n    )\n    return (a.mean() - b.mean()) / (pooled + 1e-8)\n\n\n# Alpha strengths to try\nALPHAS = [4.0, 8.0]\n\nfor var in var_list:\n    d = pure_directions[var]\n    d_unit = d / (d.norm() + 1e-8)\n    # Scale injection so that alpha*||d|| ~ some fraction of hidden_norm\n    best = {\"alpha\": None, \"d\": 0.0, \"pos\": [], \"neg\": []}\n    for alpha_scale in ALPHAS:\n        alpha = alpha_scale  # coefficient on unit vector; effective magnitude = alpha\n        # We'll inject alpha * d_unit ; effective add-norm = alpha\n        pos_vals, neg_vals = [], []\n        for idx in int_indices:\n            # Hold all vars fixed (use trial's own values)\n            prompt = build_prompt(**trials[idx])\n            for sign, store in [(+1, pos_vals), (-1, neg_vals)]:\n                _injection[\"vec\"] = (sign * alpha) * d_unit\n                _injection[\"alpha\"] = 1.0\n                t_amt, gen = generate_transfer(prompt)\n                _injection[\"vec\"] = None\n                if t_amt is not None:\n                    store.append(t_amt)\n        eff = cohens_d(pos_vals, neg_vals)\n        print(\n            f'  {var} alpha={alpha_scale}: mean_pos={np.mean(pos_vals) if pos_vals else float(\"nan\"):.2f} '\n            f'mean_neg={np.mean(neg_vals) if neg_vals else float(\"nan\"):.2f} d={eff:.3f} '\n            f\"(n_pos={len(pos_vals)}, n_neg={len(neg_vals)})\"\n        )\n        if abs(eff) > abs(best[\"d\"]):\n            best = {\"alpha\": alpha_scale, \"d\": eff, \"pos\": pos_vals, \"neg\": neg_vals}\n    experiment_data[\"dictator_game\"][\"effect_sizes\"][var] = float(best[\"d\"])\n    experiment_data[\"dictator_game\"][\"per_variable_results\"][var] = {\n        \"alpha\": best[\"alpha\"],\n        \"pos_transfers\": best[\"pos\"],\n        \"neg_transfers\": best[\"neg\"],\n    }\n    experiment_data[\"dictator_game\"][\"metrics\"][\"val\"].append(\n        {\n            \"epoch\": 0,\n            \"variable\": var,\n            \"variable_intervention_effect_size\": float(abs(best[\"d\"])),\n        }\n    )\n    print(f'==> Best {var}: alpha={best[\"alpha\"]} cohens_d={best[\"d\"]:.3f}')\n\n# ---------- 6. Baseline (no injection) transfers for reference ----------\n_injection[\"vec\"] = None\nbaseline_transfers = []\nfor idx in int_indices[:40]:\n    prompt = build_prompt(**trials[idx])\n    t_amt, gen = generate_transfer(prompt)\n    baseline_transfers.append(t_amt if t_amt is not None else -1)\nexperiment_data[\"dictator_game\"][\"predictions\"] = baseline_transfers\nprint(f\"Baseline mean transfer: {np.mean([x for x in baseline_transfers if x>=0]):.2f}\")\n\n# Summary metric: mean absolute effect size\nabs_ds = [abs(v) for v in experiment_data[\"dictator_game\"][\"effect_sizes\"].values()]\nmean_abs_d = float(np.mean(abs_ds)) if abs_ds else 0.0\nprint(f\"\\n=== Mean |Cohen's d| across variables: {mean_abs_d:.3f} ===\")\nfor v, dv in experiment_data[\"dictator_game\"][\"effect_sizes\"].items():\n    print(f\"  {v}: d = {dv:+.3f}\")\nprint(f\"Epoch 0: validation_loss = {(-mean_abs_d):.4f}  (proxy: -mean|d|)\")\n\nexperiment_data[\"dictator_game\"][\"mean_abs_effect_size\"] = mean_abs_d\n\n# Simple visualization\ntry:\n    import matplotlib\n\n    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n\n    fig, ax = plt.subplots(figsize=(6, 4))\n    vs = list(experiment_data[\"dictator_game\"][\"effect_sizes\"].keys())\n    ds = [experiment_data[\"dictator_game\"][\"effect_sizes\"][v] for v in vs]\n    ax.bar(vs, ds, color=[\"C0\", \"C1\", \"C2\", \"C3\"])\n    ax.axhline(0, color=\"k\", lw=0.5)\n    ax.set_ylabel(\"Cohen's d (pos vs neg injection)\")\n    ax.set_title(\"Steering effect per variable (Llama-3.1-8B-Instruct)\")\n    plt.tight_layout()\n    plt.savefig(os.path.join(working_dir, \"dictator_game_effect_sizes.png\"), dpi=120)\n    plt.close()\nexcept Exception as e:\n    print(f\"Plot failed: {e}\")\n\nhook_handle.remove()\nnp.save(\n    os.path.join(working_dir, \"experiment_data.npy\"), experiment_data, allow_pickle=True\n)\nprint(f\"Saved experiment data to {working_dir}/experiment_data.npy\")\n", "import os, re, json, math, random, gc\nimport numpy as np\nimport torch\nimport matplotlib\n\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\nfrom transformers import AutoModelForCausalLM, AutoTokenizer\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nMODEL_DIR = \"/data/zhenqian/models\"\nMODEL_PATH = os.path.join(MODEL_DIR, \"Llama-3.1-8B-Instruct\")\nif not os.path.isdir(MODEL_PATH):\n    # try alternate name\n    for cand in [\n        \"llama-3.1-8b-instruct\",\n        \"Meta-Llama-3.1-8B-Instruct\",\n        \"meta-llama-3.1-8b-instruct\",\n    ]:\n        p = os.path.join(MODEL_DIR, cand)\n        if os.path.isdir(p):\n            MODEL_PATH = p\n            break\nprint(\"Loading model from:\", MODEL_PATH)\n\ntokenizer = AutoTokenizer.from_pretrained(MODEL_PATH, local_files_only=True)\nif tokenizer.pad_token is None:\n    tokenizer.pad_token = tokenizer.eos_token\nmodel = AutoModelForCausalLM.from_pretrained(\n    MODEL_PATH, local_files_only=True, torch_dtype=torch.float16\n).to(device)\nmodel.eval()\n\nnum_layers = model.config.num_hidden_layers\nhidden_size = model.config.hidden_size\nTARGET_LAYER = num_layers // 2  # middle layer\nprint(f\"num_layers={num_layers}, hidden={hidden_size}, target_layer={TARGET_LAYER}\")\n\n# ---------- Build dictator-game prompts ----------\nGENDERS = [\"male\", \"female\"]\nAGES = [\"young (22 years old)\", \"old (68 years old)\"]\nINSTRUCTIONS = [\n    (\n        \"A\",\n        \"You are playing a dictator game. You have been given $20. You may transfer any amount from $0 to $20 to an anonymous recipient. Choose the amount to transfer.\",\n    ),\n    (\n        \"B\",\n        \"You are participating in an economic decision task. An initial endowment of $20 is yours. You may share any portion of it \u2014 between $0 and $20 \u2014 with another anonymous person. Decide how much to give.\",\n    ),\n]\nMEETINGS = [\n    (\n        \"meeting\",\n        \"Before making your decision, you briefly met the recipient in person.\",\n    ),\n    (\n        \"no-meeting\",\n        \"You have never met and will never meet the recipient; the interaction is fully anonymous.\",\n    ),\n]\n\nSYS = \"You are participating in a behavioral economics study. Answer only with a single dollar amount between $0 and $20.\"\n\n\ndef build_prompt(gender, age, instr_text, meeting_text):\n    user = (\n        f\"Personal profile: You are a {gender} person, {age}.\\n\"\n        f\"{instr_text}\\n\"\n        f\"Context: {meeting_text}\\n\"\n        f\"How much do you transfer? Reply with only the dollar amount (a single integer between 0 and 20).\"\n    )\n    messages = [{\"role\": \"system\", \"content\": SYS}, {\"role\": \"user\", \"content\": user}]\n    return tokenizer.apply_chat_template(\n        messages, tokenize=False, add_generation_prompt=True\n    )\n\n\nrng = random.Random(0)\nN_TRIALS = 1000\ntrials = []\nfor i in range(N_TRIALS):\n    g = rng.choice(GENDERS)\n    a = rng.choice(AGES)\n    ilab, itxt = rng.choice(INSTRUCTIONS)\n    mlab, mtxt = rng.choice(MEETINGS)\n    trials.append(\n        {\n            \"gender\": g,\n            \"age\": a,\n            \"instr\": ilab,\n            \"instr_text\": itxt,\n            \"meeting\": mlab,\n            \"meeting_text\": mtxt,\n            \"prompt\": build_prompt(g, a, itxt, mtxt),\n        }\n    )\n\n# ---------- Activation extraction ----------\n_cap = {}\n\n\ndef make_hook(name):\n    def hook(mod, inp, out):\n        # out is tuple; first is hidden states\n        if isinstance(out, tuple):\n            h = out[0]\n        else:\n            h = out\n        _cap[name] = h.detach()\n\n    return hook\n\n\nlayer_module = model.model.layers[TARGET_LAYER]\n\n\n@torch.no_grad()\ndef get_last_token_activation(prompt):\n    _cap.clear()\n    handle = layer_module.register_forward_hook(make_hook(\"h\"))\n    try:\n        inputs = tokenizer(prompt, return_tensors=\"pt\").to(device)\n        model(**inputs)\n        h = _cap[\"h\"]  # [1, seq, hidden]\n        vec = h[0, -1, :].float().cpu().numpy()\n    finally:\n        handle.remove()\n    return vec\n\n\n# ---------- Build paired prompts to extract per-variable difference vectors ----------\n# For each variable, pair prompts differ only in that variable; others randomized identically\nN_PAIRS = 64\n\n\ndef flip(t, var):\n    t = dict(t)\n    if var == \"gender\":\n        t[\"gender\"] = \"female\" if t[\"gender\"] == \"male\" else \"male\"\n    elif var == \"age\":\n        t[\"age\"] = AGES[1] if t[\"age\"] == AGES[0] else AGES[0]\n    elif var == \"instr\":\n        other = [x for x in INSTRUCTIONS if x[0] != t[\"instr\"]][0]\n        t[\"instr\"], t[\"instr_text\"] = other[0], other[1]\n    elif var == \"meeting\" n", "lower_is_better": false, "metric_name": "age positive-injection mean transfer ($)"}, {"data": [{"best_value": 8.1, "dataset_name": "dictator_game", "final_value": 8.1}], "description": "Mean transfer amount for age negative injection", "lower_is_better": false, "metric_name": "age negative-injection mean transfer ($)"}, {"data": [{"best_value": 5.0, "dataset_name": "dictator_game", "final_value": 5.0}], "description": "Mean transfer amount for instruction positive injection", "lower_is_better": false, "metric_name": "instr positive-injection mean transfer ($)"}, {"data": [{"best_value": 0.0, "dataset_name": "dictator_game", "final_value": 0.0}], "description": "Mean transfer amount for instruction negative injection", "lower_is_better": false, "metric_name": "instr negative-injection mean transfer ($)"}, {"data": [{"best_value": 10.0, "dataset_name": "dictator_game", "final_value": 10.0}], "description": "Mean transfer amount for meeting positive injection", "lower_is_better": false, "metric_name": "meeting positive-injection mean transfer ($)"}, {"data": [{"best_value": 0.0, "dataset_name": "dictator_game", "final_value": 0.0}], "description": "Mean transfer amount for meeting negative injection", "lower_is_better": false, "metric_name": "meeting negative-injection mean transfer ($)"}, {"data": [{"best_value": 2.0742, "dataset_name": "dictator_game", "final_value": 2.0742}], "description": "Aggregate mean absolute Cohen's d across all intervention variables", "lower_is_better": false, "metric_name": "aggregate mean absolute Cohen's d across variables"}]}], "is_best_node": [false, true], "plots": [[], ["../../logs/0-run/experiment_results/experiment_2b5b7c0d7e88427e82cea18998335774_proc_1769076/dictator_game_baseline_histogram.png", "../../logs/0-run/experiment_results/experiment_2b5b7c0d7e88427e82cea18998335774_proc_1769076/dictator_game_effect_sizes_bar.png", "../../logs/0-run/experiment_results/experiment_2b5b7c0d7e88427e82cea18998335774_proc_1769076/dictator_game_effect_sizes.png", "../../logs/0-run/experiment_results/experiment_2b5b7c0d7e88427e82cea18998335774_proc_1769076/dictator_game_posneg_means.png"]], "plot_paths": [[], ["experiments/2026-07-13_14-15-51_llm_social_decision_attempt_2/logs/0-run/experiment_results/experiment_2b5b7c0d7e88427e82cea18998335774_proc_1769076/dictator_game_baseline_histogram.png", "experiments/2026-07-13_14-15-51_llm_social_decision_attempt_2/logs/0-run/experiment_results/experiment_2b5b7c0d7e88427e82cea18998335774_proc_1769076/dictator_game_effect_sizes_bar.png", "experiments/2026-07-13_14-15-51_llm_social_decision_attempt_2/logs/0-run/experiment_results/experiment_2b5b7c0d7e88427e82cea18998335774_proc_1769076/dictator_game_effect_sizes.png", "experiments/2026-07-13_14-15-51_llm_social_decision_attempt_2/logs/0-run/experiment_results/experiment_2b5b7c0d7e88427e82cea18998335774_proc_1769076/dictator_game_posneg_means.png"]], "plot_analyses": [[], [{"analysis": "This plot shows the distribution of transfer amounts chosen by the LLM-dictator across 1,000 baseline dictator-game trials. The distribution is heavily bimodal/spiked, with the vast majority of transfers concentrated at $10 (the fair-split reference amount), which appears to have a frequency of around 800+ trials. There is a small secondary peak at $0 (selfish choice), and very minimal density elsewhere. The mean transfer is marked around $10 (dashed red line) with the fair split reference at $10 (dashed green line, overlapping). This suggests the LLM overwhelmingly defaults to the fair-split norm regardless of the randomized social variables (gender, age, instruction phrasing, meeting condition). This is a critical finding for the research hypothesis: if the model almost always outputs $10, there is very little behavioral variance to attribute to social variables, which could make it difficult to detect linearly-extractable direction effects in the residual stream. The researchers may need to consider prompt engineering to increase output variance, or focus on more subtle internal representations rather than behavioral output shifts.", "plot_path": "experiments/2026-07-13_14-15-51_llm_social_decision_attempt_2/logs/0-run/experiment_results/experiment_2b5b7c0d7e88427e82cea18998335774_proc_1769076/dictator_game_baseline_histogram.png"}, {"analysis": "This bar chart shows the mean transfer amount broken down by each social/contextual variable condition: gender (female vs. male), age (old vs. young), instruction framing (A vs. B), and meeting condition (meeting vs. no meeting). All bars appear to be at essentially identical heights around $9.5-$10, with error bars (likely 95% CIs) that overlap heavily. This confirms the finding from the first plot: the social variables produce virtually no measurable difference in the mean transfer output. This is a concerning result for the core hypothesis, because if the variables don't affect the output behaviorally, it becomes difficult to validate whether the extracted 'directions' in the residual stream causally drive the decision. However, it is still possible that the model encodes these variables internally without expressing them in output \u2014 which could actually be an interesting finding about representation vs. behavior dissociation. The researchers should verify whether the near-uniform behavior is due to strong alignment/instruction-following overriding demographic effects, or whether there is subtle variance being masked by aggregation.", "plot_path": "experiments/2026-07-13_14-15-51_llm_social_decision_attempt_2/logs/0-run/experiment_results/experiment_2b5b7c0d7e88427e82cea18998335774_proc_1769076/dictator_game_effect_sizes_bar.png"}, {"analysis": "This plot shows the distribution of cosine similarities between pairs of extracted per-variable difference vectors (e.g., male\u2194female vs. young\u2194old, etc.) across residual-stream layers. The distribution appears centered near 0 with a tight spread roughly between -0.1 and 0.1, indicating that the raw variable direction vectors are approximately orthogonal to each other in the residual stream. This is a positive preliminary signal for the hypothesis: it suggests that different social variables are encoded along largely independent directions, which would support the feasibility of 'pure' variable directions (obtained by removing overlap with other variables). Low mutual cosine similarity means limited confounding between variables at the vector level, which is a necessary (though not sufficient) condition for the disentanglement claim in the research idea. Note however that this is just the geometry of the difference vectors; whether these directions have causal effects on decisions still needs to be tested via intervention experiments.", "plot_path": "experiments/2026-07-13_14-15-51_llm_social_decision_attempt_2/logs/0-run/experiment_results/experiment_2b5b7c0d7e88427e82cea18998335774_proc_1769076/dictator_game_effect_sizes.png"}, {"analysis": "This bar chart compares mean transfer amounts under three conditions: baseline, positive injection of the extracted variable direction, and negative injection, aggregated across the four social variables (gender, age, instruction, meeting). All three bars appear to be at nearly identical heights around $9.5-$10, with heavily overlapping error bars. This is a critical null result for the intervention component of the hypothesis: injecting the extracted directions into the residual stream at inference time does not appear to causally alter the model's decision output in a meaningful way. This is a serious challenge to the third bullet of the hypothesis ('Injecting these directions causally and substantially alters the relationship between the targeted variable and the model's decision output'). Possible explanations include: (1) the baseline behavior is already saturated at the fair-split norm, leaving no room for intervention effects to manifest in output; (2) the injection magnitude/scale needs tuning; (3) the intervention is being applied at suboptimal layers; (4) the directions may need to be more carefully purified to remove confounds. The researchers should experiment with stronger injection coefficients, layer-specific interventions, and prompts that produce more behavioral variance before concluding that the hypothesis fails.", "plot_path": "experiments/2026-07-13_14-15-51_llm_social_decision_attempt_2/logs/0-run/experiment_results/experiment_2b5b7c0d7e88427e82cea18998335774_proc_1769076/dictator_game_posneg_means.png"}]], "vlm_feedback_summary": ["[]", "The preliminary experiments produced four plots that reveal a mixed but\nconcerning picture for the research hypothesis. The baseline dictator-game\ntrials show that the LLM overwhelmingly chooses the fair-split amount ($10)\nregardless of demographic/contextual variable conditions \u2014 the distribution is\nheavily peaked at $10 with a small mode at $0, and mean transfers across all\nsocial variable conditions (gender, age, instruction, meeting) are essentially\nidentical (~$9.5-$10) with overlapping error bars. This behavioral uniformity\nmeans there is little output variance to explain via internal directions.\nPositively, the cosine similarity distribution between extracted variable\ndirection pairs is centered near zero, suggesting the raw directions are\napproximately orthogonal \u2014 a good sign for the disentanglement/purification\nclaim. However, the intervention experiment (positive vs. negative injection vs.\nbaseline) shows no measurable effect on the mean transfer output, which directly\nchallenges the causal-intervention component of the hypothesis. The team should\ninvestigate: (1) prompts that induce more behavioral variance to give\ninterventions room to operate, (2) stronger injection magnitudes and layer\nselection, (3) whether the model encodes variables internally without expressing\nthem behaviorally (representation-behavior dissociation), and (4) potentially\nexamining logit-level or probability-shift effects rather than only argmax\ndecisions."], "exec_time": [185.83707427978516, 96.25317072868347], "exec_time_feedback": ["", ""], "datasets_successfully_tested": [[], ["[\"dictator_game\"]"]], "plot_code": [null, "import matplotlib.pyplot as plt\nimport numpy as np\nimport os\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\n\ntry:\n    experiment_data = np.load(\n        os.path.join(working_dir, \"experiment_data.npy\"), allow_pickle=True\n    ).item()\nexcept Exception as e:\n    print(f\"Error loading experiment data: {e}\")\n    experiment_data = {}\n\ndg = experiment_data.get(\"dictator_game\", {})\n\n# Plot 1: Effect sizes bar plot\ntry:\n    plt.figure(figsize=(7, 4))\n    eff = dg.get(\"effect_sizes\", {})\n    vars_list = list(eff.keys())\n    vals = [eff[v] for v in vars_list]\n    colors = [\"steelblue\", \"salmon\", \"seagreen\", \"goldenrod\"][: len(vars_list)]\n    plt.bar(vars_list, vals, color=colors)\n    plt.axhline(0, color=\"k\", lw=0.5)\n    plt.ylabel(\"Cohen's d (pos vs neg injection)\")\n    tl = dg.get(\"config\", {}).get(\"target_layer\", \"?\")\n    plt.title(f\"Dictator Game: Variable Intervention Effect Sizes (layer {tl})\")\n    plt.tight_layout()\n    plt.savefig(\n        os.path.join(working_dir, \"dictator_game_effect_sizes_bar.png\"), dpi=120\n    )\n    plt.close()\nexcept Exception as e:\n    print(f\"Error creating plot1: {e}\")\n    plt.close()\n\n# Plot 2: Baseline amounts histogram\ntry:\n    plt.figure(figsize=(6, 4))\n    base = [x for x in dg.get(\"baseline_amounts\", []) if x is not None]\n    if len(base) > 0:\n        plt.hist(base, bins=np.arange(0, 22) - 0.5, color=\"gray\", edgecolor=\"black\")\n        plt.axvline(\n            np.mean(base),\n            color=\"red\",\n            linestyle=\"--\",\n            label=f\"mean={np.mean(base):.2f}\",\n        )\n        plt.legend()\n    plt.xlabel(\"Transfer amount ($)\")\n    plt.ylabel(\"Count\")\n    plt.title(\"Dictator Game: Baseline T in pvt[v][\"pos\"] if x is not None]\n        nv = [x for x in pvt[v][\"neg\"] if x is not None]\n        data.append(pv)\n        labels.append(f\"{v}\\n(+)\")\n        data.append(nv)\n        labels.append(f\"{v}\\n(-)\")\n    plt.figure(figsize=(9, 4))\n    if data:\n        plt.boxplot(data, labels=labels)\n    plt.ylabel(\"Transfer amount ($)\")\n    plt.title(\"Dictator Game: Transfer Distributions by Variable & Injection Sign\")\n    plt.tight_layout()\n    plt.savefig(\n        os.path.join(working_dir, \"dictator_game_transfer_boxplot.png\"), dpi=120\n    )\n    plt.close()\nexcept Exception as e:\n    print(f\"Error creating plot4: {e}\")\n    plt.close()\n\n# Print summary metric\ntry:\n    eff = dg.get(\"effect_sizes\", {})\n    abs_ds = [\n        abs(v) for v in eff.values() if not (isinstance(v, float) and np.isnan(v))\n    ]\n    if abs_ds:\n        print(f\"Mean |Cohen's d| across variables: {np.mean(abs_ds):.3f}\")\n    for k, v in eff.items():\n        print(f\"  {k}: Cohen's d = {v:.3f}\")\nexcept Exception as e:\n    print(f\"Error printing metrics: {e}\")\n"], "plot_plan": [null, "I'll create visualizations for the dictator game experiment data: effect sizes bar plot, baseline transfer distribution, per-variable pos/neg comparison, and a boxplot showing distributions of amounts across conditions."], "ablation_name": [null, null], "hyperparam_name": [null, null], "is_seed_node": [false, false], "is_seed_agg_node": [false, false], "parse_metrics_plan": ["I'll load the experiment_data.npy file from the working directory, then extract\nand print the key metrics: per-variable Cohen's d effect sizes, mean absolute\neffect size, direction norms, and baseline mean transfer.", "Load the experiment_data.npy from the working directory, then extract the\ndictator_game metrics: baseline mean transfer, mean activation norm, per-\nvariable Cohen's d effect sizes, and the aggregate mean absolute Cohen's d."], "parse_metrics_code": ["import os\nimport numpy as
