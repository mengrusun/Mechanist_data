    input_ids=conf_ids,\n            max_new_tokens=4,\n            do_sample=False,\n            pad_token_id=tokenizer.eos_token_id,\n        )\n        conf_text = tokenizer.decode(\n            cont[0, conf_ids.shape[1] :], skip_special_tokens=True\n        ).strip()\n        num = \"\"\n        for ch in conf_text:\n            if ch.isdigit():\n                num += ch\n            elif num:\n                break\n        try:\n            parsed = int(num) if num else -1\n        except:\n            parsed = -1\n\n        conf_score = first_digit_ev * 10.0\n\n        confidences.append(conf_score)\n        answers_text.append(ans_text)\n        questions_text.append(q)\n\n        if (i + 1) % 10 == 0:\n            print(\n                f'[{i+1}/{NUM_EXAMPLES}] Q=\"{q[:50]}...\" A=\"{ans_text[:30]}\" conf_parsed={parsed} conf_score={conf_score:.2f}'\n            )\n\nconfidences = np.array(confidences)\nprint(\n    f\"\\nConfidence stats: mean={confidences.mean():.2f}, std={confidences.std():.2f}, unique={len(np.unique(np.round(confidences,1)))}\"\n)\n\nexperiment_data[\"triviaqa\"][\"confidence_scores\"] = confidences.tolist()\nexperiment_data[\"triviaqa\"][\"answers\"] = answers_text\nexperiment_data[\"triviaqa\"][\"questions\"] = questions_text\n\nn_bins = 3\ntry:\n    bin_edges = np.quantile(confidences, np.linspace(0, 1, n_bins + 1))\n    bin_edges = np.unique(bin_edges)\n    if len(bin_edges) < 3:\n        bin_edges = np.array(\n            [confidences.min() - 1e-6, np.median(confidences), confidences.max() + 1e-6]\n        )\n    labels = np.digitize(confidences, bin_edges[1:-1])\nexcept Exception as e:\n    print(f\"binning error: {e}\")\n    labels = (confidences > np.median(confidences)).astype(int)\n\nunique, counts = np.unique(labels, return_counts=True)\nprint(f\"Label distribution: {dict(zip(unique.tolist(), counts.tolist()))}\")\nmajority_baseline = counts.max() / counts.sum()\nprint(f\"Majority baseline: {majority_baseline:.4f}\")\n\n\ndef train_probe(X, y):\n    if len(np.unique(y)) < 2:\n        return 0.0, 0.0\n    X_tr, X_te, y_tr, y_te = train_test_split(\n        X, y, test_size=0.3, random_state=42, stratify=y\n    )\n    clf = LogisticRegression(max_iter=1000, C=1.0)\n    clf.fit(X_tr, y_tr)\n    return clf.score(X_te, y_te), clf.score(X_tr, y_tr)\n\n\npost_acc = []\npre_acc = []\npost_train = []\npre_train = []\n\nfor L in range(n_layers):\n    X_post = np.stack(post_hidden_by_layer[L])\n    X_pre = np.stack(pre_hidden_by_layer[L])\n    try:\n        acc_post, tr_post = train_probe(X_post, labels)\n    except Exception as e:\n        acc_post, tr_post = 0.0, 0.0\n    try:\n        acc_pre, tr_pre = train_probe(X_pre, labels)\n    except Exception as e:\n        acc_pre, tr_pre = 0.0, 0.0\n    post_acc.append(acc_post)\n    pre_acc.append(acc_pre)\n    post_train.append(tr_post)\n    pre_train.append(tr_pre)\n    print(\n        f\"Layer {L:2d}: post_probe_acc={acc_post:.4f} (train={tr_post:.4f}) | pre_probe_acc={acc_pre:.4f} (train={tr_pre:.4f})\"\n    )\n\npost_acc = np.array(post_acc)\npre_acc = np.array(pre_acc)\n\nbest_layer = int(np.argmax(post_acc))\nbest_post = float(post_acc[best_layer])\nbest_pre = float(pre_acc[best_layer])\n\nprint(\"\\n===== SUMMARY =====\")\nprint(f\"Model: {model_name}\")\nprint(f\"Examples: {NUM_EXAMPLES}\")\nprint(\n    f\"Confidence std: {confidences.std():.3f}, unique values: {len(np.unique(np.round(confidences,1)))}\"\n)\nprint(f\"Majority baseline: {majority_baseline:.4f}\")\nprint(f\"Best layer (post): {best_layer}\")\nprint(f\"cache_probe_accuracy = {best_post:.4f}\")\nprint(f\"Control (pre-answer, same layer): {best_pre:.4f}\")\nprint(f\"Delta (post - pre) at best layer: {best_post - best_pre:.4f}\")\nprint(f\"Mean post_acc across layers: {post_acc.mean():.4f}\")\nprint(f\"Mean pre_acc across layers: {pre_acc.mean():.4f}\")\n\nfor L in range(n_layers):\n    experiment_data[\"triviaqa\"][\"metrics\"][\"train\"].append(\n        {\"layer\": L, \"post_train\": post_train[L], \"pre_train\": pre_train[L]}\n    )\n    experiment_data[\"triviaqa\"][\"metrics\"][\"val\"].append(\n        {\"layer\": L, \"post_val\": float(post_acc[L]), \"pre_val\": float(pre_acc[L])}\n    )\n    print(\n        f\"Epoch {L}: validation_loss = {1.0 - post_acc[L]:.4f}  (post_probe_acc={post_acc[L]:.4f})\"\n    )\n\nexperiment_data[\"triviaqa\"][\"layer_probe_acc_post\"] = post_acc.tolist()\nexperiment_data[\"triviaqa\"][\"layer_probe_acc_pre\"] = pre_acc.tolist()\nexperiment_data[\"triviaqa\"][\"predictions\"] = labels.tolist()\nexperiment_data[\"triviaqa\"][\"ground_truth\"] = confidences.tolist()\nexperiment_data[\"triviaqa\"][\"majority_baseline\"] = float(majority_baseline)\nexperiment_data[\"triviaqa\"][\"best_layer\"] = best_layer\nexperiment_data[\"triviaqa\"][\"cache_probe_accuracy\"] = best_post\n\nplt.figure(figsize=(9, 5))\nplt.plot(range(n_layers), post_acc, label=\"post-answer (target)\", marker=\"o\")\nplt.plot(range(n_layers), pre_acc, label=\"pre-answer (control)\", marker=\"s\")\nplt.axhline(\n    majority_baseline,\n    color=\"red\",\n    linestyle=\"--\",\n    label=f\"majority baseline={majority_baseline:.3f}\",\n)\nplt.xlabel(\"Layer\")\nplt.ylabel(\"Probe accuracy\")\nplt.title(f\"Cache probe accuracy by layer ({model_name}, TriviaQA)\")\nplt.legend()\nplt.grid(True, alpha=0.3)\nplt.tight_layout()\nplt.savefig(os.path.join(working_dir, \"triviaqa_layerwise_probe_accuracy.png\"), dpi=120)\nplt.close()\n\nplt.figure(figsize=(7, 4))\nplt.hist(confidences, bins=20, edgecolor=\"black\")\nplt.xlabel(\"Verbal confidence (digit-EV based)\")\nplt.ylabel(\"Count\")\nplt.title(f\"Confidence distribution ({model_name})\")\nplt.tight_layout()\nplt.savefig(os.path.join(working_dir, \"triviaqa_confidence_distribution.png\"), dpi=120)\nplt.close()\n\nnp.save(os.path.join(working_dir, \"experiment_data.npy\"), experiment_data)\nprint(f\"\\nSaved experiment_data.npy and plots to {working_dir}\")\nprint(f\"\\nFINAL cache_probe_accuracy = {best_post:.4f}\")\n", "import os, glob, json, re, sys, math, time, traceback\nimport numpy as np\nimport torch\nimport torch.nn.functional as F\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.model_selection import train_test_split\nimport matplotlib\n\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nDATA_DIR = \"/data/zhenqian/data\"\nMODEL_DIR = \"/data/zhenqian/models\"\n\nexperiment_data = {\n    \"triviaqa_gemma3\": {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"layer_accuracy_post\": [],\n        \"layer_accuracy_pre\": [],\n        \"majority_baseline\": None,\n        \"best_cache_probe_accuracy\": None,\n        \"confidence_hist\": None,\n        \"notes\": [],\n    }\n}\n\n\n# ---------- Load TriviaQA ----------\ndef load_triviaqa():\n    from datasets import load_from_disk, load_dataset\n\n    entries = os.listdir(DATA_DIR)\n    print(\"DATA_DIR contents:\", entries)\n    cand = [e for e in entries if \"trivia\" in e.lower()]\n    print(\"TriviaQA candidates:\", cand)\n    for c in cand:\n        p = os.path.join(DATA_DIR, c)\n        try:\n            if os.path.isdir(p) and (\n                os.path.exists(os.path.join(p, \"dataset_info.json\"))\n                or os.path.exists(os.path.join(p, \"state.json\"))\n            ):\n                ds = load_from_disk(p)\n                print(f\"Loaded from_disk: {p}\")\n                return ds\n        except Exception as e:\n            print(f\"load_from_disk failed on {p}: {e}\")\n        # try parquet\n        pqs = glob.glob(os.path.join(p, \"**\", \"*.parquet\"), recursive=True)\n        if pqs:\n            try:\n                ds = load_dataset(\"parquet\", data_files=pqs, split=\"train\")\n                print(f\"Loaded parquet from: {p}\")\n                return ds\n            except Exception as e:\n                print(f\"parquet load failed: {e}\")\n    raise RuntimeError(\"Could not load TriviaQA from DATA_DIR\")\n\n\nds = load_triviaqa()\n# normalize to list of (question, answer_aliases)\nif hasattr(ds, \"keys\") and not hasattr(ds, \"column_names\"):\n    # DatasetDict\n    split = \"validation\" if \"validation\" in ds else list(ds.keys())[0]\n    ds = ds[split]\nprint(\"Dataset columns:\", ds.column_names, \"size:\", len(ds))\n\n\ndef get_qa(ex):\n    q = ex.get(\"question\", \"\")\n    a = ex.get(\"answer\", {})\n    aliases = []\n    if isinstance(a, dict):\n        aliases = a.get(\"aliases\", []) or a.get(\"normalized_aliases\", []) or []\n        if \"value\" in a and a[\"value\"]:\n            aliases = [a[\"value\"]] + list(aliases)\n    elif isinstance(a, str):\n        aliases = [a]\n    return q, aliases\n\n\nN = 200\nexamples = []\nfor i in range(min(N * 3, len(ds))):\n    q, al = get_qa(ds[i])\n    if q and al:\n        examples.append((q, al))\n    if len(examples) >= N:\n        break\nprint(f\"Prepared {len(examples)} examples\")\n\n# ---------- Load model ----------\nfrom transformers import AutoTokenizer, AutoModelForCausalLM\n\n\ndef find_model():\n    entries = os.listdir(MODEL_DIR)\n    print(\"MODEL_DIR contents:\", entries)\n    # prefer instruction-tuned Gemma-3\n    priorities = [\n        lambda e: \"gemma-3\" in e.lower()\n        and (\"it\" in e.lower() or \"instruct\" in e.lower()),\n        lambda e: \"gemma\" in e.lower()\n        and (\"it\" in e.lower() or \"instruct\" in e.lower()),\n        lambda e: \"qwen\" in e.lower()\n        and (\"instruct\" in e.lower() or \"it\" in e.lower() or \"7b\" in e.lower()),\n        lambda e: \"gemma-3\" in e.lower(),\n        lambda e: \"gemma\" in e.lower(),\n        lambda e: \"qwen\" in e.lower(),\n    ]\n    for pred in priorities:\n        for e in entries:\n            p = os.path.join(MODEL_DIR, e)\n            if os.path.isdir(p) and pred(e):\n                # Check has config\n                if os.path.exists(os.path.join(p, \"config.json\")):\n                    return p\n    raise RuntimeError(\"No suitable model found in MODEL_DIR\")\n\n\nmodel_path = find_model()\nprint(f\"Loading model: {model_path}\")\ntokenizer = AutoTokenizer.from_pretrained(\n    model_path, local_files_only=True, trust_remote_code=True\n)\nif tokenizer.pad_token is None:\n    tokenizer.pad_token = tokenizer.eos_token\n\ndtype = torch.bfloat16 if torch.cuda.is_available() else torch.float32\ntry:\n    model = AutoModelForCausalLM.from_pretrained(\n        model_path,\n        local_files_only=True,\n        torch_dtype=dtype,\n        device_map=\"auto\",\n        trust_remote_code=True,\n        output_hidden_states=True,\n    )\nexcept Exception as e:\n    print(f\"device_map=auto failed: {e}; retrying without\")\n    model = AutoModelForCausalLM.from_pretrained(\n        model_path,\n        local_files_only=True,\n        torch_dtype=dtype,\n        trust_remote_code=True,\n        output_hidden_states=True,\n    ).to(device)\nmodel.eval()\nnum_layers = model.config.num_hidden_layers\nhidden_size = model.config.hidden_size\nprint(f\"Model num_layers={num_layers}, hidden_size={hidden_size}\")\n\n# ---------- Prompt design ----------\nFEWSHOT = \"\"\"You will answer trivia questions concisely and then rate your confidence 0-100.\n\nQuestion: What is the capital of France?\nAnswer: Paris\nConfidence: 98\n\nQuestion: In what year was the Eiffel Tower completed?\nAnswer: 1889\nConfidence: 85\n\nQuestion: Who wrote the novel 'The Master and Margarita'?\nAnswer: Mikhail Bulgakov\nConfidence: 72\n\nQuestion: What is the atomic number of xenon?\nAnswer: 54\nConfidence: 60\n\n\"\"\"\n\n\ndef build_answer_prompt(q):\n    return FEWSHOT + f\"Question: {q}\\nAnswer:\"\n\n\ndef build_confidence_prompt(q, answer):\n    return FEWSHOT + f\"Question: {q}\\nAnswer: {answer}\\nConfidence:\"\n\n\n# ---------- Answer generation and hidden state extraction ----------\ndef normalize(s):\n    s = s.lower().strip()\n    s = re.sub(r\"[^a-z0-9 ]\", \"\", s)\n    s = re.sub(r\"\\s+\", \" \", s)\n    return s\n\n\ndef is_correct(pred, aliases):\n    p = normalize(pred)\n    for a in aliases:\n        if normalize(a) in p or p in normalize(a):\n            return 1\n    return 0\n\n\n# Digit token ids for confidence estimation\ndigit_token_ids = {}\nfor d in range(10):\n    ids = tokenizer.encode(str(d), add_special_tokens=False)\n    if len(ids) == 1:\n        digit_token_ids[d] = ids[0]\n    else:\n        # try with space prefix\n        ids2 = tokenizer.encode(\" \" + str(d), add_special_tokens=False)\n        if len(ids2) == 1:\n            digit_token_ids[d] = ids2[0]\n        else:\n            digit_token_ids[d] = ids[-1]\nprint(\"Digit token ids:\", digit_token_ids)\n\n\n@torch.no_grad()\ndef generate_answer_and_extract(q, max_new=25):\n    prompt = build_answer_prompt(q)\n    enc = tokenizer(prompt, return_tensors=\"pt\").to(device)\n    prompt_len = enc.input_ids.shape[1]\n    # Also compute pre-answer hidden state (control) at last prompt token\n    out_pre = model(**enc, output_hidden_states=True, use_cache=False)\n    pre_hidden = [\n        h[0, -1, :].float().cpu().numpy() for h in out_pre.hidden_states\n    ]  # list of (hidden,)\n    del out_pre\n    # Generate answer\n    gen = model.generate(\n        **enc,\n        max_new_tokens=max_new,\n        do_sample=False,\n        pad_token_id=tokenizer.pad_token_id,\n        eos_token_id=(\n            tokenizer.encode(\"\\n\", add_special_tokens=False)[-1]\n            if tokenizer.encode(\"\\n\", add_special_tokens=False)\n            else tokenizer.eos_token_id\n        ),\n        return_dict_in_generate=True,\n    )\n    seq = gen.sequences[0]\n    ans_ids = seq[prompt_len:].tolist()\n    ans_text = tokenizer.decode(ans_ids, skip_special_tokens=True)\n    # Trim at newline\n    if \"\\n\" in ans_text:\n        ans_text = ans_text.split(\"\\n\")[0]\n    ans_text = ans_text.strip()\n    # Now compute hidden state at position right after answer (before \"Confidence:\")\n    post_prompt = prompt + \" \" + ans_text + \"\\nConfidence:\"\n    enc2 = tokenizer(post_prompt, return_tensors=\"pt\").to(device)\n    out_post = model(**enc2, output_hidden_states=True, use_cache=False)\n    # Take hidden state at last token (just before generating confidence number)\n    post_hidden = [h[0, -1, :].float().cpu().numpy() for h in out_post.hidden_states]\n    logits = out_post.logits[0, -1, :].float().cpu()\n    del out_post\n    # Compute digit-based expected confidence: for the first digit position\n    # Softmax over digit tokens\n    digit_ids_list = [digit_token_ids[d] for d in range(10)]\n    digit_logits = logits[digit_ids_list]\n    digit_probs = torch.softmax(digit_logits, dim=-1).numpy()\n    exp_first_digit = float(np.sum(digit_probs * np.arange(10)))\n    # Now greedy-generate a few tokens for the actual verbalized confidence\n    gen2 = model.generate(\n        **enc2,\n        max_new_tokens=5,\n        do_sample=False,\n        pad_token_id=tokenizer.pad_token_id,\n        return_dict_in_generate=True,\n    )\n    conf_ids = gen2.sequences[0][enc2.input_ids.shape[1] :].tolist()\n    conf_text = tokenizer.decode(conf_ids, skip_special_tokens=True)\n    m = re.search(r\"(\\d{1,3})\", conf_text)\n    verbal_conf = int(m.group(1)) if m else None\n    if verbal_conf is not None:\n        verbal_conf = max(0, min(100, verbal_conf))\n    return ans_text, pre_hidden, post_hidden, verbal_conf, exp_first_digit\n\n\n# ---------- Run over examples ----------\npre_hiddens_all = []  # list per example: list over layers\npost_hiddens_all = []\nverbal_confs = []\nexp_confs = []\ncorrectness = []\nanswers = []\nquestions = []\n\nt0 = time.time()\nfor i, (q, aliases) in enumerate(examples):\n    try:\n        ans, pre_h, post_h, vc, ec = generate_answer_and_extract(q)\n    except Exception as e:\n        print(f\"[{i}] gen error: {e}\")\n        traceback.print_exc()\n        continue\n    if vc is None:\n        continue\n    questions.append(q)\n    answers.append(ans)\n    pre_hiddens_all.append(pre_h)\n    post_hiddens_all.append(post_h)\n    verbal_confs.append(vc)\n    exp_confs.append(ec)\n    correctness.append(is_correct(ans, aliases))\n    if (i + 1) % 20 == 0:\n        print(\n            f\"[{i+1}/{len(examples)}] elapsed={time.time()-t0:.1f}s ans='{ans[:40]}' vc={vc} ec={ec:.2f}\"\n        )\n\nprint(f\"Collected {len(verbal_confs)} valid examples\")\nverbal_confs = np.array(verbal_confs)\nexp_confs = np.array(exp_confs)\ncorrectness = np.array(correctness)\n\n# Confidence distribution\nhist, edges = np.histogram(verbal_confs, bins=[0, 20, 40, 60, 80, 101])\nprint(\"Verbal conf histogram:\", hist, \"edges:\", edges)\nexperiment_data[\"triviaqa_gemma3\"][\"confidence_hist\"] = {\n    \"hist\": hist.tolist(),\n    \"edges\": edges.tolist(),\n    \"raw\": verbal_confs.tolist(),\n}\n\n\n# ---------- Choose bin target ----------\n# Try verbal confidence bins; if degenerate, fall back to expected-value bins; if still degenerate, use correctness\ndef bin_signal(vals, n_bins=3):\n    # quantile bins\n    qs = np.quantile(vals, np.linspace(0, 1, n_bins + 1))\n    qs = np.unique(qs)\n    if len(qs) < 3:\n        return None, None\n    bins = np.digitize(vals, qs[1:-1])\n    return bins, qs\n\n\ny = None\ntarget_name = None\nbins, qs = bin_signal(verbal_confs, 3)\nif (\n    bins is not None\n    and len(np.unique(bins)) >= 2\n    and (np.max(np.bincount(bins)) / len(bins)) < 0.85\n):\n    y = bins\n    target_name = \"verbal_confidence_bins\"\nelse:\n    print(\"Verbal confidence degenerate; falling back to expected-digit-value bins\")\n    bins, qs = bin_signal(exp_confs, 3)\n    if bins is not None and len(np.unique(bins)) >= 2:\n        y = bins\n        target_name = \"expected_confidence_bins\"\n    else:\n        print(\"Expected confidence degenerate; falling back to correctness\")\n        y = correctness.astype(int)\n        target_name = \"correctness\"\n\nexperiment_data[\"triviaqa_gemma3\"][\"notes\"].append(f\"target={target_name}\")\nprint(f\"Using target: {target_name}, class dist: {np.bincount(y)}\")\n\nmajority = float(np.max(np.bincount(y)) / len(y))\nexperiment_data[\"triviaqa_gemma3\"][\"majority_baseline\"] = majority\nprint(f\"Majority baseline: {majority:.4f}\")\n\n# ---------- Probe training per layer ----------\nn_examples = len(y)\nn_layers_h = len(post_hiddens_all[0])  # num_layers + 1 (embedding)\nprint(f\"Hidden layers available: {n_layers_h}\")\n\n\n# Convert to arrays: (N, hidden) per layer\ndef stack_layer(hiddens_all, layer_idx):\n    return np.stack([h[layer_idx] for h in hiddens_all], axis=0)\n\n\nidx = np.arange(n_examples)\ntrain_idx, val_idx = train_test_split(\n    idx, test_size=0.3, random_state=42, stratify=y if len(np.unique(y)) > 1 else None\n)\n\nlayer_acc_post = []\nlayer_acc_pre = []\nbest_post_acc = 0.0\nbest_layer = -1\n\nfor L in range(n_layers_h):\n    Xp = stack_layer(post_hiddens_all, L)\n    Xc = stack_layer(pre_hiddens_all, L)\n    # normalize\n    Xp_mean = Xp[train_idx].mean(0, keepdims=True)\n    Xp_std = Xp[train_idx].std(0, keepdims=True) + 1e-6\n    Xp_n = (Xp - Xp_mean) / Xp_std\n    Xc_mean = Xc[train_idx].mean(0, keepdims=True)\n    Xc_std = Xc[train_idx].std(0, keepdims=True) + 1e-6\n    Xc_n = (Xc - Xc_mean) / Xc_std\n    try:\n        clf_p = LogisticRegression(max_iter=1000, C=1.0)\n        clf_p.fit(Xp_n[train_idx], y[train_idx])\n        acc_p = clf_p.score(Xp_n[val_idx], y[val_idx])\n    except Exception as e:\n        acc_p = float(\"nan\")\n    try:\n        clf_c = LogisticRegression(max_iter=1000, C=1.0)\n        clf_c.fit(Xc_n[train_idx], y[train_idx])\n        acc_c = clf_c.score(Xc_n[val_idx], y[val_idx])\n    except Exception as e:\n        acc_c = float(\"nan\")\n    layer_acc_post.append(acc_p)\n    layer_acc_pre.append(acc_c)\n    if not math.isnan(acc_p) and acc_p > best_post_acc:\n        best_post_acc = acc_p\n        best_layer = L\n    val_loss = 1.0 - acc_p if not math.isnan(acc_p) else float(\"nan\")\n    print(\n        f\"Layer {L}: post_acc={acc_p:.4f} pre_acc={acc_c:.4f} val_loss={val_loss:.4f}\"\n    )\n    experiment_data[\"triviaqa_gemma3\"][\"metrics\"][\"val\"].append(\n        {\"layer\": L, \"post_acc\": acc_p, \"pre_acc\": acc_c}\n    )\n    experiment_data[\"triviaqa_gemma3\"][\"losses\"][\"val\"].append(\n        {\"layer\": L, \"val_loss\": val_loss}\n    )\n\nexperiment_data[\"triviaqa_gemma3\"][\"layer_accuracy_post\"] = layer_acc_post\nexperiment_data[\"triviaqa_gemma3\"][\"layer_accuracy_pre\"] = layer_acc_pre\nexperiment_data[\"triviaqa_gemma3\"][\"best_cache_probe_accuracy\"] = best_post_acc\nexperiment_data[\"triviaqa_gemma3\"][\"ground_truth\"] = y.tolist()\n\n# ---------- Plots ----------\ntry:\n    fig, ax = plt.subplots(figsize=(10, 4))\n    ax.plot(layer_acc_post, label=\"Post-answer probe (cache)\")\n    ax.plot(layer_acc_pre, label=\"Pre-answer control\")\n    ax.axhline(\n        majority, color=\"k\", linestyle=\"--\", label=f\"Majority baseline={majority:.2f}\"\n    )\n    ax.set_xlabel(\"Layer\")\n    ax.set_ylabel(\"Probe accuracy\")\n    ax.set_title(f\"Cache probe accuracy per layer (target={target_name})\")\n    ax.legend()\n    plt.tight_layout()\n    plt.savefig(\n        os.path.join(working_dir, \"probe_accuracy_by_layer_gemma3_triviaqa.png\")\n    )\n    plt.close()\n\n    fig, ax = plt.subplots()\n    ax.bar(range(len(hist)), hist)\n    ax.set_xticks(range(len(hist)))\n    ax.set_xticklabels([f\"{int(edges[i])}-{int(edges[i+1])}\" for i in range(len(hist))])\n    ax.set_title(\"Verbal confidence distribution\")\n    plt.tight_layout()\n    plt.savefig(os.path.join(working_dir, \"confidence_histogram_gemma3_triviaqa.png\"))      return 0\n    for a in aliases:\n        an = normalize(a)\n        if an and (an == p or an in p or p in an):\n            return 1\n    return 0\n\n\n# Precompute token ids for digits 0-9 (single-token variants)\ndigit_token_ids = {}\nfor d in range(10):\n    # try leading space and no space\n    for cand in [f\" {d}\", f\"{d}\"]:\n        toks = tokenizer.encode(cand, add_special_tokens=False)\n        if len(toks) == 1:\n            digit_token_ids.setdefault(d, []).append(toks[0])\n# flatten\ndigit_ids_flat = {d: list(set(v)) for d, v in digit_token_ids.items()}\nprint(\"digit token ids:\", digit_ids_flat)\n\n\n@torch.no_grad()\ndef generate_answer(prompt, max_new=20):\n    inputs = tokenizer(prompt, return_tensors=\"pt\").to(device)\n    out = model.generate(\n        **inputs,\n        max_new_tokens=max_new,\n        do_sample=False,\n        temperature=1.0,\n        pad_token_id=tokenizer.eos_token_id,\n    )\n    gen = out[0][inputs[\"input_ids\"].shape[1] :]\n    text = tokenizer.decode(gen, skip_special_tokens=True)\n    # take first line\n    ans = text.split(\"\\n\")[0].strip()\n    return ans\n\n\n@torch.no_grad()\ndef get_hidden_states_and_confidence(question, answer):\n    \"\"\"\n    Feed prompt = fewshot + Q + A + newline + \"Confidence:\" placeholder minus digits.\n    Capture hidden states at position of the last token of 'A: <answer>' (post-answer, pre-newline/confidence tokens).\n    Then compute expected confidence value from logits over first digit at the position after \"Confidence:\".\n    \"\"\"\n    # Build two prompts: one ending right after answer (for hidden states), one full for confidence\n    post_answer_prompt = FEWSHOT + f\"Q: {question}\\nA: {answer}\"\n    full_prompt = FEWSHOT + f\"Q: {question}\\nA: {answer}\\nConfidence:\"\n\n    # First, get hidden states at post-answer position\n    inputs_post = tokenizer(post_answer_prompt, return_tensors=\"pt\").to(device)\n    out_post = model(**inputs_post, output_hidden_states=True, use_cache=False)\n    # hidden_states: tuple of (num_layers+1) tensors of shape (1, seq_len, hidden)\n    hs_all = out_post.hidden_states  # includes embedding layer\n    post_pos = inputs_post[\"input_ids\"].shape[1] - 1\n    # Take last-token hidden state per layer\n    layer_vecs = np.stack(\n        [hs[0, post_pos, :].float().cpu().numpy() for hs in hs_all], axis=0\n    )\n    # Also grab a pre-answer control (position of \"A:\" token, i.e., before answer content)\n    # Approximate: find last \"\\nA:\" position. Use encoding of prompt without answer.\n    pre_answer_prompt = FEWSHOT + f\"Q: {question}\\nA:\"\n    pre_len = tokenizer(pre_answer_prompt, return_tensors=\"pt\")[\"input_ids\"].shape[1]\n    pre_pos = min(pre_len - 1, post_pos)\n    layer_vecs_pre = np.stack(\n        [hs[0, pre_pos, :].float().cpu().numpy() for hs in hs_all], axis=0\n    )\n\n    # Now get confidence: forward the full prompt and look at logits at last position\n    inputs_full = tokenizer(full_prompt, return_tensors=\"pt\").to(device)\n    out_full = model(**inputs_full, use_cache=False)\n    logits = out_full.logits[0, -1, :]  # next-token logits\n    probs = torch.softmax(logits.float(), dim=-1).cpu().numpy()\n\n    # Expected first digit\n    digit_probs = np.zeros(10)\n    for d in range(10):\n        for tid in digit_ids_flat.get(d, []):\n            digit_probs[d] += probs[tid]\n    Z = digit_probs.sum()\n    if Z < 1e-8:\n        expected_first = 5.0  # neutral\n    else:\n        digit_probs = digit_probs / Z\n        expected_first = float(np.sum(np.arange(10) * digit_probs))\n\n    # Also greedy sample confidence (up to 3 digits) for reporting\n    greedy_ids = np.argmax(probs)\n    # Simple heuristic: continuous confidence = expected_first * 10 (maps 0-9 -> 0-90 range), plus a fudge\n    # Better: sample greedy tokens\n    with torch.no_grad():\n        gen = model.generate(\n            **inputs_full,\n            max_new_tokens=4,\n            do_sample=False,\n            pad_token_id=tokenizer.eos_token_id,\n        )\n    conf_text = tokenizer.decode(\n        gen[0][inputs_full[\"input_ids\"].shape[1] :], skip_special_tokens=True\n    )\n    m = re.search(r\"(\\d+)\", conf_text)\n    verbal_conf_argmax = int(m.group(1)) if m else -1\n    if verbal_conf_argmax > 100:\n        verbal_conf_argmax = 100\n\n    # Use expected_first * 10 as continuous verbal confidence proxy (0-90 scale)\n    continuous_conf = expected_first * 10.0\n\n    return layer_vecs, layer_vecs_pre, continuous_conf, verbal_conf_argmax\n\n\n# ---------- Main loop ----------\nall_post_hs = []\nall_pre_hs = []\nall_conf_cont = []\nall_conf_argmax = []\nall_correct = []\n\nfrom tqdm import tqdm\n\nprocessed = 0\nfor i, ex in enumerate(tqdm(ds, desc=\"processing\")):\n    try:\n        q = ex[\"question\"]\n        aliases = (\n            ex[\"answer\"].get(\"aliases\", [])\n            + [ex[\"answer\"].get(\"value\", \"\")]\n            + ex[\"answer\"].get(\"normalized_aliases\", [])\n        )\n        aliases = [a for a in aliases if a]\n        ans_prompt = build_answer_prompt(q)\n        pred = generate_answer(ans_prompt, max_new=15)\n        correct = is_correct(pred, aliases)\n        layer_vecs, layer_vecs_pre, cont_conf, argmax_conf = (\n            get_hidden_states_and_confidence(q, pred)\n        )\n        all_post_hs.append(layer_vecs)\n        all_pre_hs.append(layer_vecs_pre)\n        all_conf_cont.append(cont_conf)\n        all_conf_argmax.append(argmax_conf)\n        all_correct.append(correct)\n        processed += 1\n        if i < 5:\n            print(\n                f\"[{i}] Q: {q[:80]} | pred={pred[:40]} | argmax_conf={argmax_conf} | cont_conf={cont_conf:.2f} | correct={correct}\"\n            )\n    except Exception as e:\n        print(f\"Skipping example {i}: {e}\")\n        continue\n\nprint(f\"Processed {processed} examples\")\n\nall_post_hs = np.stack(all_post_hs, axis=0)  # (N, L+1, H)\nall_pre_hs = np.stack(all_pre_hs, axis=0)\nall_conf_cont = np.array(all_conf_cont)\nall_conf_argmax = np.array(all_conf_argmax)\nall_correct = np.array(all_correct)\n\nprint(f\"Hidden states shape: {all_post_hs.shape}\")\nprint(\n    f\"Continuous conf: min={all_conf_cont.min():.2f} max={all_conf_cont.max():.2f} mean={all_conf_cont.mean():.2f} std={all_conf_cont.std():.2f}\"\n)\nprint(f\"Argmax conf unique: {np.unique(all_conf_argmax, return_counts=True)}\")\nprint(f\"Correctness rate: {all_correct.mean():.3f}\")\n\nexperiment_data[\"triviaqa_gemma3_27b_pt\"][\"raw_confidences\"] = all_conf_cont.tolist()\nexperiment_data[\"triviaqa_gemma3_27b_pt\"][\"raw_correctness\"] = all_correct.tolist()\n\n# ---------- Bin confidences ----------\n# Bin continuous confidence into 3 quantile bins\ntry:\n    q1, q2 = np.quantile(all_conf_cont, [1 / 3, 2 / 3])\n    conf_bins = np.digitize(all_conf_cont, [q1, q2])\nexcept Exception:\n    conf_bins = (all_conf_cont > np.median(all_conf_cont)).astype(int)\n\nunique, counts = np.unique(conf_bins, return_counts=True)\nprint(f\"Confidence bin distribution: {dict(zip(unique.tolist(), counts.tolist()))}\")\n\n# Majority baselines\nmaj_conf = counts.max() / counts.sum()\nmaj_corr = max(all_correct.mean(), 1 - all_correct.mean())\nexperiment_data[\"triviaqa_gemma3_27b_pt\"][\"majority_baseline_conf\"] = float(maj_conf)\nexperiment_data[\"triviaqa_gemma3_27b_pt\"][\"majority_baseline_corr\"] = float(maj_corr)\nprint(f\"Majority baseline confidence: {maj_conf:.4f}\")\nprint(f\"Majority baseline correctness: {maj_corr:.4f}\")\n\n# ---------- Per-layer probing ----------\nN, Lp1, H = all_post_hs.shape\n# Subsample layers to speed up: every 4th layer plus endpoints\nlayer_indices = sorted(set([0] + list(range(0, Lp1, 4)) + [Lp1 - 1]))\nprint(f\"Probing layers: {layer_indices}\")\n\n# Split\nidx_train, idx_test = train_test_split(\n    np.arange(N),\n    test_size=0.3,\n    random_state=42,\n    stratify=conf_bins if len(unique) > 1 else None,\n)\n\nper_layer_conf_acc = []\nper_layer_corr_acc = []\nper_layer_control_conf_acc = []\n\nfor L in layer_indices:\n    X_post = all_post_hs[:, L, :]\n    X_pre = all_pre_hs[:, L, :]\n\n    scaler = StandardScaler()\n    X_post_tr = scaler.fit_transform(X_post[idx_train])\n    X_post_te = scaler.transform(X_post[idx_test])\n\n    scaler2 = StandardScaler()\n    X_pre_tr = scaler2.fit_transform(X_pre[idx_train])\n    X_pre_te = scaler2.transform(X_pre[idx_test])\n\n    # confidence probe\n    try:\n        clf = LogisticRegression(max_iter=1000, C=1.0)\n        clf.fit(X_post_tr, conf_bins[idx_train])\n        acc_conf = clf.score(X_post_te, conf_bins[idx_test])\n    except Exception as e:\n        print(f\"conf probe layer {L} fail: {e}\")\n        acc_conf = float(\"nan\")\n\n    # correctness probe\n    try:\n        if len(np.unique(all_correct)) > 1:\n            clf2 = LogisticRegression(max_iter=1000, C=1.0)\n            clf2.fit(X_post_tr, all_correct[idx_train])\n            acc_corr = clf2.score(X_post_te, all_correct[idx_test])\n        else:\n            acc_corr = maj_corr\n    except Exception as e:\n        print(f\"corr probe layer {L} fail: {e}\")\n        acc_corr = float(\"nan\")\n\n    # control: pre-answer -> confidence\n    try:\n        clf3 = LogisticRegression(max_iter=1000, C=1.0)\n        clf3.fit(X_pre_tr, conf_bins[idx_train])\n        acc_ctrl = clf3.score(X_pre_te, conf_bins[idx_test])\n    except Exception as e:\n        acc_ctrl = float(\"nan\")\n\n    per_layer_conf_acc.append(acc_conf)\n    per_layer_corr_acc.append(acc_corr)\n    per_layer_control_conf_acc.append(acc_ctrl)\n    print(\n        f\"Layer {L}: conf_acc={acc_conf:.4f} corr_acc={acc_corr:.4f} control_conf_acc={acc_ctrl:.4f}\"\n    )\n\nper_layer_conf_acc = np.array(per_layer_conf_acc)\nper_layer_corr_acc = np.array(per_layer_corr_acc)\nper_layer_control_conf_acc = np.array(per_layer_control_conf_acc)\n\nbest_conf_idx = int(np.nanargmax(per_layer_conf_acc))\nbest_corr_idx = int(np.nanargmax(per_layer_corr_acc))\nbest_layer_conf = layer_indices[best_conf_idx]\nbest_layer_corr = layer_indices[best_corr_idx]\nbest_conf_acc = float(per_layer_conf_acc[best_conf_idx])\nbest_corr_acc = float(per_layer_corr_acc[best_corr_idx])\n\nprint(\n    f\"\\nBest layer for conf probe: layer {best_layer_conf} acc={best_conf_acc:.4f} (baseline {maj_conf:.4f})\"\n)\nprint(\n    f\"Best layer for corr probe: layer {best_layer_corr} acc={best_corr_acc:.4f} (baseline {maj_corr:.4f})\"\n)\n\nexperiment_data[\"triviaqa_gemma3_27b_pt\"][\n    \"per_layer_confidence_acc\"\n] = per_layer_conf_acc.tolist()\nexperiment_data[\"triviaqa_gemma3_27b_pt\"][\n    \"per_layer_correctness_acc\"\n] = per_layer_corr_acc.tolist()\nexperiment_data[\"triviaqa_gemma3_27b_pt\"][\n    \"per_layer_control_conf_acc\"\n] = per_layer_control_conf_acc.tolist()\nexperiment_data[\"triviaqa_gemma3_27b_pt\"][\"best_layer_conf\"] = best_layer_conf\nexperiment_data[\"triviaqa_gemma3_27b_pt\"][\"best_layer_corr\"] = best_layer_corr\nexperiment_data[\"triviaqa_gemma3_27b_pt\"][\"cache_probe_accuracy\"] = best_conf_acc\nexperiment_data[\"triviaqa_gemma3_27b_pt\"][\"layer_indices\"] = layer_indices\nexperiment_data[\"triviaqa_gemma3_27b_pt\"][\"metrics\"][\"val\"].append(\n    {\n        \"epoch\": 0,\n        \"cache_probe_accuracy\": best_conf_acc,\n        \"corr_probe_accuracy\": best_corr_acc,\n        \"majority_conf\": float(maj_conf),\n        \"majority_corr\": float(maj_corr),\n    }\n)\nexperiment_data[\"triviaqa_gemma3_27b_pt\"][\"losses\"][\"val\"].append(\n    {\"epoch\": 0, \"val_loss\": float(1.0 - best_conf_acc)}\n)\n\nprint(f\"Epoch 0: validation_loss = {1.0 - best_conf_acc:.4f}\")\nprint(f\"CACHE_PROBE_ACCURACY = {best_conf_acc:.4f}\")\n\n# ---------- Visualization ----------\nfig, ax = plt.subplots(1, 1, figsize=(10, 6))\nax.plot(layer_indices, per_layer_conf_acc, \"o-\", label=\"Post-answer -> Confidence\")\nax.plot(\n    layer_indices,\n    per_layer_control_conf_acc,\n    \"s--\",\n    label=\"Pre-answer (co , 36, 40, 44, 48, 52, 56, 60, 62]', '\\n', 'Layer 0:\nconf_acc=0.2833 corr_acc=0.8500 control_conf_acc=0.3333', '\\n', 'Layer 4:\nconf_acc=0.4167 corr_acc=0.8167 control_conf_acc=0.3500', '\\n', 'Layer 8:\nconf_acc=0.4333 corr_acc=0.8167 control_conf_acc=0.3000', '\\n', 'Layer 12:\nconf_acc=0.4000 corr_acc=0.8500 control_conf_acc=0.3500', '\\n', 'Layer 16:\nconf_acc=0.5167 corr_acc=0.8167 control_conf_acc=0.3500', '\\n', 'Layer 20:\nconf_acc=0.5167 corr_acc=0.8500 control_conf_acc=0.4167', '\\n', 'Layer 24:\nconf_acc=0.5667 corr_acc=0.8333 control_conf_acc=0.5167', '\\n', 'Layer 28:\nconf_acc=0.6167 corr_acc=0.8333 control_conf_acc=0.5167', '\\n', 'Layer 32:\nconf_acc=0.5833 corr_acc=0.8500 control_conf_acc=0.4833', '\\n', 'Layer 36:\nconf_acc=0.5333 corr_acc=0.8500 control_conf_acc=0.5167', '\\n', 'Layer 40:\nconf_acc=0.5000 corr_acc=0.8500 control_conf_acc=0.6333', '\\n', 'Layer 44:\nconf_acc=0.5167 corr_acc=0.8500 control_conf_acc=0.5833', '\\n', 'Layer 48:\nconf_acc=0.5833 corr_acc=0.8500 control_conf_acc=0.5333', '\\n', 'Layer 52:\nconf_acc=0.5667 corr_acc=0.8500 control_conf_acc=0.5333', '\\n', 'Layer 56:\nconf_acc=0.5167 corr_acc=0.8500 control_conf_acc=0.5833', '\\n', 'Layer 60:\nconf_acc=0.5167 corr_acc=0.8500 control_conf_acc=0.5833', '\\n', 'Layer 62:\nconf_acc=0.5000 corr_acc=0.8500 control_conf_acc=0.5833', '\\n', '\\nBest layer\nfor conf probe: layer 28 acc=0.6167 (baseline 0.3350)', '\\n', 'Best layer for\ncorr probe: layer 0 acc=0.8500 (baseline 0.8550)', '\\n', 'Epoch 0:\nvalidation_loss = 0.3833', '\\n', 'CACHE_PROBE_ACCURACY = 0.6167', '\\n', 'Saved\nexperiment_data.npy and probe accuracy figure.', '\\n', 'Execution time: 14\nminutes seconds (time limit is 10 hours).']", ""], "analysis": ["The script failed to load the TriviaQA dataset. The local path\n`/data/zhenqian/data/trivia_qa/rc.nocontext` exists but is not a HuggingFace\n`Dataset`/`DatasetDict` directory (likely contains raw parquet files or a\ndifferent structure). The subsequent `load_from_disk` on the subdir fails, and\nthe fallback `load_dataset(\"trivia_qa\", \"rc.nocontext\", ...)` fails with an HF\nURI error (the legacy dataset script name `trivia_qa` is not `namespace/name`).\nModel loading was never reached.  Proposed fixes: 1. Inspect the actual contents\nof `/data/zhenqian/data/trivia_qa` (and subfolders such as `rc.nocontext`) and\nload accordingly. Most likely they are parquet files \u2014 enumerate them and use\n`load_dataset(\"parquet\", data_files={\"validation\": [...]})`. Currently the code\nonly tries parquet loading at the top-level `c` dir, but the parquet files\nprobably live inside `c/rc.nocontext/`. The `os.walk` should already find them,\nbut the loop `break`s out to `load_from_disk` first and hits the exception path\nincorrectly \u2014 restructure so that after `load_from_disk` fails on a subdir,\nparquet discovery still runs on that subdir. 2. Also try `mandarjoshi/trivia_qa`\nas the HF repo id in the final fallback (the new canonical name is\n`mandarjoshi/trivia_qa`), which resolves the `HfUriError` about\n`namespace/name`. 3. Ensure `HF_TOKEN` env var is set from the provided token\nbefore any HF call, to enable download as a last resort. 4. Make the walk-based\nparquet fallback robust: gather parquet files recursively from every candidate\ndirectory (including its `rc.nocontext` subfolder) before raising.", "The script ran to completion without crashing, but the experiment is\nscientifically degenerate due to a collapse in the confidence signal, making the\nprobe results meaningless.  Key issues observed in the output: 1. Verbal\nconfidence collapses to a single value: The model output \"100\" for essentially\nevery one of the 200 examples (mean=99.0, std=9.9, only 2 unique values). The\nquantile-based binning therefore produced highly imbalanced bins: counts=[2, 0,\n198] \u2014 effectively one class with 2 outliers, and only 2 bins used instead of\nthe intended 3. 2. As a result, both the \"post-answer probe\" (acc=1.0000) and\nthe \"pre-answer control\" (acc=0.9833) trivially predict the majority class. The\nreported \"cache_probe_accuracy = 1.0000 vs control 0.9833\" is not evidence of a\ncached confidence \u2014 it just reflects the class imbalance (198/200 \u2248 0.99\nmajority baseline). The best probe layer is layer 0 (embedding), which further\nconfirms it's picking up on trivial features, not a meaningful hidden-state\ncache. 3. The core hypothesis (verbal confidence is cached mid-generation)\ncannot be tested when the verbalized confidence has no variance across examples.\nProposed fixes: - Elicit a more varied confidence distribution. Options:   a)\nChange the prompt to encourage graded self-assessment, e.g., few-shot examples\nshowing varied confidences (60, 75, 85, 95), or ask \"How confident are you\n(0\u2013100)? Please give a realistic estimate, not always 100.\" Include an explicit\ninstruction to avoid always answering 100.   b) Use sampling (do_sample=True,\ntemperature\u22480.7) for the confidence generation step so the model doesn't\ncollapse to a single greedy token; or use token-level probabilities over the\ndigit tokens to derive a continuous confidence score instead of relying on the\ngreedy decode.   c) Consider using an instruction-tuned variant (gemma-3-*-it)\nfor the confidence-verbalization step, since the pretrained \"-pt\" checkpoint is\nnot trained to follow the \"Confidence (0\u2013100):\" instruction meaningfully and may\njust complete with \"100\".   d) Increase max_new_tokens for the answer (currently\n20) so answers aren't truncated, and parse the confidence more robustly (e.g.,\naccept \"9x%\", \"0.xx\", \"high/medium/low\" mapped to numbers). - Make the binning\nrobust to degenerate distributions: if <3 unique values or any bin has <10% of\ndata, either abort with a clear message or fall back to a correct/incorrect\nbinary probe target (predicting `correct` from post-answer hidden state) \u2014 which\nis the more meaningful signal anyway. - Report the majority-class baseline\nalongside probe accuracy, so trivial results (like the current 100% \"probe\" from\nan all-one-class problem) are immediately visible and not mistaken for evidence.\n- Also consider evaluating on a harder subset of TriviaQA (e.g., filter out\ncases where the answer is trivially in the question) to increase incorrect-\nanswer rate and induce genuine variation in verbalized confidence.  Until the\nconfidence distribution has real variance, no conclusion can be drawn from the\ncurrent numbers.", "The script failed at dataset loading. `find_triviaqa()` raised FileNotFoundError\nbecause no parquet files were found under `/data/zhenqian/data/trivia_qa` (and\nthe fallback `/data/zhenqian/data/triviaqa` was also not detected). The function\nonly checks these two hardcoded directory names and only looks for `.parquet`\nfiles, so it misses TriviaQA data that may be stored under a differently named\ndirectory (e.g., `TriviaQA`, `trivia_qa_rc`, `triviaqa_rc`, HuggingFace cache\ndirs like `datasets--trivia_qa`) or in other formats (JSON/JSONL/arrow).\nProposed fix: 1. Broaden the search: list all entries under `DATA_DIR` and match\nany directory whose lowercase name contains `trivia` (e.g., `for name in\nos.listdir(DATA_DIR): if 'trivia' in name.lower(): ...`). 2. Also recursively\nsearch matched dirs for `.parquet`, `.json`, `.jsonl`, and `.arrow` files, and\nadd loaders for each format (e.g., `pd.read_json(..., lines=True)` for jsonl,\n`datasets.load_from_disk` for arrow). 3. If the dataset truly isn't present,\ndownload it from HuggingFace using the provided HF token:\n`datasets.load_dataset('trivia_qa', 'rc.nocontext',\ncache_dir=os.path.join(DATA_DIR, 'trivia_qa'))` and then read from that cache.\n4. Print the directory listing of `DATA_DIR` on failure to aid debugging, and\nfail with a clearer message listing what was searched.  Before rerunning, verify\nby running `ls /data/zhenqian/data` to see the actual folder name/format of the\nTriviaQA data.", "The script failed immediately with `RuntimeError: Cannot load TriviaQA from\nlocal paths.` at `load_triviaqa(n=200)`. The loader tried three candidate\ndirectories (`trivia_qa`, `triviaqa`, `TriviaQA`) under `/data/zhenqian/data`\nusing both `load_from_disk` and parquet-based loading, but none succeeded,\nmeaning either (a) the dataset is not present under any of these expected names,\nor (b) it is present under a different name/format (e.g., JSON, arrow, nested\nsubdirs) that the current probing logic does not detect.  Proposed fix: 1.\nFirst, list the actual contents of `/data/zhenqian/data` (e.g.,\n`os.listdir(DATA_DIR)`) and log matches with \"trivia\" (case-insensitive) so we\ncan see the real directory name. Add this as a diagnostic print before raising.\n2. Expand the candidate list to be dynamic: enumerate `DATA_DIR` and pick any\ndirectory whose lowercase name contains \"trivia\". 3. Broaden the file-format\ndiscovery inside `load_triviaqa` to also try:    - `datasets.load_from_disk` on\nevery nested subdirectory containing a `dataset_info.json` or `state.json`.    -\n`.json` / `.jsonl` files via `load_dataset(\"json\", data_files=...)`.    -\n`.arrow` files. 4. If the dataset genuinely is missing, download it explicitly\n(the idea allows downloads via HF token) using `load_dataset(\"trivia_qa\",\n\"rc.nocontext\", cache_dir=os.path.join(DATA_DIR, \"trivia_qa\"))` with the\nprovided HF token, then save to disk under `$DATA_DIR/trivia_qa` so subsequent\nruns find it via `load_from_disk`. 5. Only after all discovery + optional\ndownload attempts fail should we raise, and the error message should include the\ndirectory listing to aid debugging.  This will let the rest of the pipeline\n(Gemma-3-27B hidden-state extraction and layer-wise linear probing) actually\nrun.", "Bug: The data loader only found `.json` metadata files (`dataset_info.json`,\n`state.json`) in `/data/zhenqian/data/triviaqa_validation/`, but not the actual\ndataset content. This directory appears to be a HuggingFace `datasets` cache\nwith `.arrow` shard files (and possibly one `.json` metadata). The script loaded\n`dataset_info.json` as a DataFrame and got metadata columns (`builder_name`,\n`citation`, ...) rather than the actual TriviaQA questions/answers, then failed\nwith \"No question column\".  Root cause: (1) The file discovery logic includes\n`.json` files that are HuggingFace dataset metadata, not real data. (2) `.arrow`\nfiles were listed among extensions but the extension-preference loop picks\n`.json` before `.arrow`, so metadata JSONs shadowed the real Arrow data. (3)\nEven if `.arrow` were picked, the extension preference `[\".parquet\", \".jsonl\",\n\".json\", \".arrow\"]` puts `.arrow` last.  Proposed fix: 1. Load the TriviaQA data\nusing `datasets.load_from_disk(\"/data/zhenqian/data/triviaqa_validation\")`\ninstead of manually globbing files \u2014 this is a HuggingFace `save_to_disk` dump.\n2. As fallback, explicitly filter out known metadata files (`dataset_info.json`,\n`state.json`) and prefer `.arrow` over `.json` when a `dataset_info.json`\nsibling exists. 3. After loading, still validate that a question column exists\nand fail clearly otherwise.  Example replacement snippet: ```python from\ndatasets import load_from_disk roots = find_triviaqa_root() ds = None for root\nin roots:     try:         ds = load_from_disk(root)         break     except\nException:         pass if ds is None:     raise RuntimeError(\"Could not load\nTriviaQA via load_from_disk\") df = ds.to_pandas() if hasattr(ds, \"to_pandas\")\nelse ds[\"validation\"].to_pandas() ``` This will produce a DataFrame with the\nreal `question`/`answer` columns and let the rest of the pipeline run.", "The script crashed immediately after loading the Gemma-3-27B model with:\nAttributeError: 'Gemma3Config' object has no attribute 'num_hidden_layers'  Root\ncause: Gemma-3 is a multimodal architecture whose top-level `Gemma3Config` nests\nthe language-model config under `config.text_config`. Attributes like\n`num_hidden_layers` and `hidden_size` live in `config.text_config`, not directly\non `config`. Similarly, `AutoModelForCausalLM` for a Gemma-3 checkpoint\ntypically loads `Gemma3ForConditionalGeneration`, whose `.language_model` sub-\nmodule is what actually produces the hidden states we need to probe. Because the\ncrash happens right after loading, no data was collected.  Proposed fix:  1.\nResolve config fields defensively, e.g.:    ```python    text_cfg =\ngetattr(model.config, \"text_config\", model.config)    num_layers   =\ngetattr(text_cfg, \"num_hidden_layers\", None) or getattr(model.config,\n\"num_hidden_layers\", None)    hidden_size  = getattr(text_cfg, \"hidden_size\",\nNone) or getattr(model.config, \"hidden_size\",       None)    ```    and, if\nstill None, fall back to `len(model.get_output_embeddings().weight)`-style\nintrospection or `model.model.config`.  2. Prefer the text-only Gemma-3 causal\nLM. Options:    - Load with `Gemma3ForCausalLM` (text-only) if available in the\ninstalled transformers version, e.g.      `from transformers import\nGemma3ForCausalLM; model = Gemma3ForCausalLM.from_pretrained(...)`, OR    -\nAfter loading with `AutoModelForCausalLM`, grab the language sub-model via\n`model = model.language_model` (or `model.model`) before running forward passes,\nso `output_hidden_states=True` returns the expected list of 63 tensors\n(embedding + 62 layers).  3. Make sure the forward call still receives\n`output_hidden_states=True` on the language-model submodule, and update\n`n_layers_h = len(post_hiddens_all[0])` sanity-check to match `num_layers + 1`.\n4. As a secondary robustness improvement, wrap the initial \"prompt-only\" forward\npass in the same `output_hidden_states=True` path (already done) but guard\nagainst the model being a conditional-generation wrapper by explicitly calling\n`model.language_model(**enc, output_hidden_states=True)` if needed.  After\napplying (1) and (2), the pipeline should proceed past line 158 and be able to\ncollect hidden states from all 62 transformer layers of Gemma-3-27B-pt for the\nprobe experiment. It's also worth double-checking that the *pretrained* (`-pt`)\ncheckpoint is desired here \u2014 the few-shot verbal-confidence prompt was designed\nassuming reasonable instruction-following; if calibration proves degenerate the\nfallback to expected-digit-value or correctness bins will kick in, but this\nshould be noted.", "Two critical bugs:  1) **TriviaQA data loading loaded 0 items.** The candidate\ndir `/data/zhenqian/data/mandarjoshi___trivia_qa` contains HF cache files, but\n`load_from_disk` failed, and the JSON fallback picked up a stray metadata JSON\n(e.g. `dataset_info.json`) and produced a `train` split with 1 example that has\nno `question`/`answer` fields \u2014 so `items` ended up empty. The\n`_cache/closing_gap_belief/*/triviaqa` directories were not properly searched\nfor actual QA content. Additionally, the code never triggers the HF hub fallback\nbecause `ds` is not None (it loaded the bogus 1-example JSON).    - **Fix:**\nAfter loading, validate that the dataset actually contains `question` and\n`answer` fields (and >0 usable items). If not, discard and try the next\ncandidate / HF hub download. Also explicitly skip metadata files like\n`dataset_info.json`, `state.json`, `dataset_infos.json` when building the JSON\n`data_files` list. Prefer `load_from_disk` on the parent\n`mandarjoshi___trivia_qa/rc.nocontext` directory, or directly call\n`load_dataset(\"trivia_qa\", \"rc.nocontext\", cache_dir=...)` first with the\nexisting local cache.  2) **AttributeError on layer count for Gemma-3.**\n`model.model.layers` doesn't exist for `Gemma3Model` \u2014 the attribute path is\ndifferent (e.g. `model.language_model.model.layers` or\n`model.model.language_model.layers` depending on the class). The crash happens\nat:    ```    num_layers = model.config.num_hidden_layers if\nhasattr(model.config, \"num_hidden_la .png", "experiments/2026-07-13_22-41-30_verbal_confidence_attempt_2/logs/0-run/experiment_results/seed_aggregation_48ef0b2f38b6404eba184a8a235331da/triviaqa_gemma3_27b_pt_agg_calibration_curve.png"]], "plot_analyses": [[], [], [], [], [], [], [], [], [], [{"analysis": "This bar chart shows verbalized confidence values by correctness for two conditions: 'Sample QA (Ground Truth)' and 'Preliminary Estimate'. Both categories (Correct and Incorrect) show a confidence value of exactly 0.85, with no visible differentiation between correct and incorrect answers. The n=1 sample size (shown in parentheses) indicates this is an extremely preliminary run with only a single example. The identical confidence values across correct/incorrect categories suggest either (a) the model is producing constant confidence regardless of correctness, or (b) the sample is too small to observe any meaningful calibration pattern. This plot is essentially uninformative for the research hypothesis due to the trivial sample size.", "plot_path": "experiments/2026-07-13_22-41-30_verbal_confidence_attempt_2/logs/0-run/experiment_results/experiment_ad2777dd214144869b53e6a79b6970a2_proc_329916/triviaqa_gemma3_27b_pt_probe_vs_baseline_summary.png"}, {"analysis": "This layer-wise probing accuracy plot shows decoding accuracy (y-axis, 0.0 to 1.0) across all 62 layers of gemma-3-27b-pt for four probe types: high_vs_low_conf (blue circles), correct_vs_incorrect (orange squares), conf_regression_r2 (green triangles), and post_answer_marker (red diamonds). All four probes remain flat at 0.0 across every layer, indicating no signal was decoded at any layer. The horizontal dashed line at 0.5 marks chance level for classification. This is a clear indication that the probing pipeline is not functioning correctly at this preliminary stage \u2014 either the hidden states are not being properly extracted, the probes are not being trained, or the labels/data are missing. The plot fails to provide evidence for or against the caching hypothesis because the probes yield zero accuracy universally, which is implausible even under the null hypothesis (random chance would give ~0.5 for binary classification).", "plot_path": "experiments/2026-07-13_22-41-30_verbal_confidence_attempt_2/logs/0-run/experiment_results/experiment_ad2777dd214144869b53e6a79b6970a2_proc_329916/triviaqa_gemma3_27b_pt_probe_accuracy_vs_layer.png"}, {"analysis": "This calibration reliability diagram plots verbalized confidence (x-axis, 0 to 1) against empirical accuracy (y-axis, 0 to 1), with the diagonal dashed line representing perfect calibration. Only a single data point appears at approximately (0.85, 0.0), meaning the model verbalized 85% confidence but achieved 0% accuracy in that bin. The ECE (Expected Calibration Error) is reported as 0.850 in the legend, indicating severe miscalibration. However, with only one bin populated and n=1 overall, this cannot be interpreted as a meaningful calibration result. The plot merely reflects a single failed prediction with high stated confidence.", "plot_path": "experiments/2026-07-13_22-41-30_verbal_confidence_attempt_2/logs/0-run/experiment_results/experiment_ad2777dd214144869b53e6a79b6970a2_proc_329916/triviaqa_gemma3_27b_pt_confidence_distribution.png"}, {"analysis": "This causal patching effect plot shows patching effect (\u0394 confidence, y-axis ranging roughly -1.0 to 1.0) across layers 0-62 for two conditions: post_answer_to_conf_token (blue circles) and pre_answer_to_conf_token (orange squares). All data points sit exactly at 0.0 across every layer for both conditions, with a horizontal dashed line at 0 marking the no-effect baseline. This means no causal patching effect was measured anywhere in the network. Under the caching hypothesis, one would expect the post_answer_to_conf_token condition to show non-zero effects at intermediate/later layers if confidence is truly written into hidden states after the answer. The uniform zero result suggests the patching intervention was not actually executed (likely a placeholder/stub) rather than reflecting a true negative finding. This plot provides no evidence about the hypothesis at this preliminary stage.", "plot_path": "experiments/2026-07-13_22-41-30_verbal_confidence_attempt_2/logs/0-run/experiment_results/experiment_ad2777dd214144869b53e6a79b6970a2_proc_329916/triviaqa_gemma3_27b_pt_probe_accuracy.png"}, {"analysis": "This second calibration reliability diagram is essentially identical to the earlier one: a single point at approximately (0.85, 0.0) with ECE = 0.850 shown in the legend, and the perfect-calibration diagonal for reference. It confirms that the calibration analysis is being computed from only one QA example, making the output uninformative. The apparently extreme ECE value is an artifact of the tiny sample and not a genuine calibration measurement.", "plot_path": "experiments/2026-07-13_22-41-30_verbal_confidence_attempt_2/logs/0-run/experiment_results/experiment_ad2777dd214144869b53e6a79b6970a2_proc_329916/triviaqa_gemma3_27b_pt_calibration_curve.png"}], []], "vlm_feedback_summary": ["[]", "[]", "[]", "[]", "[]", "[]", "[]", "[]", "[]", "The plots represent an initial preliminary implementation run and, while\nstructurally present, contain essentially no meaningful signal. Key\nobservations: (1) The verbalized-confidence-by-correctness bar chart has n=1 and\nshows identical 0.85 values for both correct and incorrect, making it\nuninformative. (2) The layer-wise probing accuracy plot shows all four probes\n(high_vs_low_conf, correct_vs_incorrect, conf_regression_r2, post_answer_marker)\nat exactly 0.0 across all 62 layers of gemma-3-27b-pt \u2014 this is implausible even\nfor null results and strongly suggests the probing pipeline is not yet\nfunctional (probes not trained, hidden states not extracted, or labels missing).\n(3) Both calibration reliability diagrams show a single point at (0.85, 0.0)\nwith ECE=0.850, again reflecting the n=1 issue. (4) The causal patching plot\nshows exactly zero effect at every layer for both pre- and post-answer patching\nconditions, indicating the intervention is likely a stub rather than a real\nmeasurement. Overall, the pipeline appears to run end-to-end and produce plots\nwith the correct structure/axes for testing the caching hypothesis, but the\nactual experimental content is not yet in place. To move forward, the team needs\nto (a) increase the TriviaQA sample size substantially, (b) verify that hidden\nstates are being extracted at the correct token positions (post-answer vs. pre-\nanswer vs. confidence-token), (c) confirm probes are actually training and\nevaluating with proper labels, and (d) implement the activation patching\nintervention rather than returning zeros. Only after these fixes will the plots\nbecome interpretable with respect to the hypothesis that verbal confidence is\ncached mid-generation.\"}", "[]"], "exec_time": [8.377296686172485, 782.6685643196106, 3.2451231479644775, 3.220128297805786, 3.1642704010009766, 37.36907172203064, 219.12339687347412, 1.3322231769561768, 805.4834790229797, 852.4712455272675, null], "exec_time_feedback": ["", "", "", "", "", "", "", "", "", "", ""], "datasets_successfully_tested": [[], [], [], [], [], [], [], [], [], [""], []], "plot_code": [null, null, null, null, null, null, null, null, "import matplotlib.pyplot as plt\nimport numpy as np\nimport os\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ntry:\n    experiment_data = np.load(\n        os.path.join(working_dir, \"experiment_data.npy\"), allow_pickle=True\n    ).item()\nexcept Exception as e:\n    print(f\"Error loading experiment data: {e}\")\n    experiment_data = {}\n\nkey = \"triviaqa_gemma3_27b_pt\"\ndata = experiment_data.get(key, {})\n\n# Plot 1: Per-layer probe accuracy\ntry:\n    layer_indices = data.get(\"layer_indices\", [])\n    conf_acc = data.get(\"per_layer_confidence_acc\", [])\n    corr_acc = data.get(\"pe
