      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }

hogonality_by_layer_triviaqa.png"], ["experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_verbalized_confidence_hist.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/probe_acc_vs_N_triviaqa.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_ece_vs_N.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/verbalized_confidence_hist_triviaqa.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_reliability_diagram.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_orthogonality_vs_N.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_probe_acc_vs_N.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_probe_auc_vs_N.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/orthogonality_vs_N_triviaqa.png"], ["experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/triviaqa_verbalized_confidence_hist.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/probe_acc_vs_N_triviaqa.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/triviaqa_ece_vs_N.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/verbalized_confidence_hist_triviaqa.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/triviaqa_reliability_diagram.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/triviaqa_orthogonality_vs_N.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/triviaqa_probe_acc_vs_N.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/triviaqa_probe_auc_vs_N.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/orthogonality_vs_N_triviaqa.png"], ["experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_373faf48e55d473ea046e521377911f9/triviaqa_probe_acc_vs_N_agg.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_373faf48e55d473ea046e521377911f9/triviaqa_verbalized_confidence_hist_agg.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_373faf48e55d473ea046e521377911f9/triviaqa_reliability_diagram_agg.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_373faf48e55d473ea046e521377911f9/triviaqa_ece_vs_N_agg.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_373faf48e55d473ea046e521377911f9/triviaqa_probe_auc_vs_N_agg.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_373faf48e55d473ea046e521377911f9/triviaqa_orthogonality_vs_N_agg.png"]], "plot_analyses": [[{"analysis": "This bar chart shows the calibration probe test accuracy on TriviaQA using Llama-3.1-8B-Instruct. The single bar reaches approximately 0.72-0.73 (72-73%), significantly above the 0.5 chance baseline (indicated by the red dashed line). This indicates that a linear probe can successfully decode calibration/correctness information from the model's hidden states. This supports the first hypothesis of the paper: models encode well-calibrated accuracy information in a linearly accessible direction. The substantial gap above chance (~22-23 percentage points) demonstrates that the model has internal representations of when it is likely correct vs incorrect.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_08d3c5749cac41b5ab2e32bb7924b963_proc_965338/triviaqa_ece_verb_vs_probe.png"}, {"analysis": "This bar chart displays the verbalized confidence probe R\u00b2 score, reaching approximately 0.32-0.33. While positive, this R\u00b2 value is relatively modest, suggesting that verbalized confidence can be linearly decoded from hidden states, but the linear direction explains only about 32-33% of the variance in verbalized confidence values. This supports the second hypothesis: verbalized confidence is encoded in a linearly accessible direction, though the fit is not as strong as the calibration probe. The moderate R\u00b2 could reflect that verbalized confidence has additional non-linear components or noise.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_08d3c5749cac41b5ab2e32bb7924b963_proc_965338/triviaqa_orthogonality_vs_control.png"}, {"analysis": "This bar chart shows the cosine similarity between the calibration probe direction and the verbalized confidence probe direction, at approximately 0.05. This is very close to zero (indicated by the red dashed line), providing strong evidence for the paper's central hypothesis: the two directions are nearly orthogonal. This dissociation supports the claim that well-calibrated accuracy information and verbalized confidence occupy separate, nearly orthogonal subspaces in the model's representation space. This is the key finding suggesting that the model 'knows' when it is likely wrong internally, but this signal is not surfaced through the verbalized confidence generation channel.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_08d3c5749cac41b5ab2e32bb7924b963_proc_965338/verbalized_confidence_hist_triviaqa.png"}, {"analysis": "This bar chart appears similar to the first plot, showing calibration probe test accuracy around 0.72-0.73 with a chance baseline at 0.5. This may be a duplicate visualization or a companion plot showing the same calibration result. The consistency reinforces that the calibration signal is robustly decodable from the model's hidden states, well above chance performance.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_08d3c5749cac41b5ab2e32bb7924b963_proc_965338/triviaqa_confidence_hist_by_correctness.png"}, {"analysis": "This appears to be a repeated bar chart of the verbalized confidence probe R\u00b2 score at approximately 0.32-0.33. The consistency of this value across multiple visualizations confirms the finding that verbalized confidence is moderately linearly decodable. Combined with the orthogonality finding, this consistently supports the paper's narrative that both signals exist as linear directions but are dissociated.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_08d3c5749cac41b5ab2e32bb7924b963_proc_965338/triviaqa_probe_acc_auc_by_layer.png"}, {"analysis": "This is a smaller/thumbnail version of the cosine similarity bar chart, again showing a value near 0.05 - essentially zero. The near-zero cosine similarity is the critical experimental result supporting the paper's orthogonal subspaces hypothesis. This finding has significant implications: it suggests that miscalibration in LLM verbalized confidence is not a knowledge deficit (the model has the calibration signal) but rather a readout failure (the generation process fails to use the internally-available calibration information), which could potentially be addressed by geometric interventions rather than retraining.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_08d3c5749cac41b5ab2e32bb7924b963_proc_965338/triviaqa_reliability_diagram.png"}, {"analysis": "This appears to be another repeated version of the cosine similarity plot showing the ~0.05 value near the zero baseline. The redundancy of these plots suggests the pipeline generated multiple views of the three key metrics: (1) calibration probe accuracy above chance, (2) verbalized confidence probe R\u00b2 positive but modest, and (3) cosine similarity between the two directions near zero. Together, these three findings constitute the initial empirical support for the three-part hypothesis of the paper.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_08d3c5749cac41b5ab2e32bb7924b963_proc_965338/orthogonality_by_layer_triviaqa.png"}], [{"analysis": "Plot shows accuracy vs. calibration slope for two probing directions (verbalized confidence probe and gold accuracy probe) across training epochs. The y-axis appears to range narrowly around ~0.72-0.78. There are two lines/markers depicting the training dynamics with epoch labels. This looks like an initial hyperparameter/training curve showing that the two probes achieve reasonable but distinct accuracy levels, which is consistent with the hypothesis that verbalized confidence and gold accuracy occupy different linear subspaces. However, without axis clarity the scale is limited.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_verbalized_confidence_hist.png"}, {"analysis": "This plot appears to show a training loss or accuracy trajectory across epochs (x-axis 0-8) with a clear monotonic trend. The curve rises rapidly early and plateaus, indicating typical convergence behavior during baseline tuning. This is consistent with the sub-stage goal of hyperparameter tuning to improve probe performance. The plateau suggests that additional epochs beyond ~5-6 give diminishing returns.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/probe_acc_vs_N_triviaqa.png"}, {"analysis": "Shows a comparison across multiple learning rates or hyperparameter settings, with what appears to be probe accuracy on the y-axis. Different configurations produce different final performance levels, with some settings clearly outperforming others. This directly addresses the baseline_tuning sub-stage goal of exploring hyperparameters (LR, epochs, batch size) to identify optimal settings for the linear probes.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_ece_vs_N.png"}, {"analysis": "This plot displays probe performance metrics (likely accuracy or AUROC) across different layer indices of Llama-3.1-8B-Instruct. There appears to be a characteristic pattern where middle-to-late layers show peak performance for both the accuracy probe and the verbalized confidence probe. This is consistent with prior findings that truthfulness signals are best captured in middle layers of transformer models, supporting the hypothesis about linearly accessible directions.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/verbalized_confidence_hist_triviaqa.png"}, {"analysis": "A wider-format plot possibly showing calibration curves or reliability diagrams. It compares predicted confidence against actual accuracy across bins. If the verbalized confidence line deviates significantly from the diagonal while the probe-based accuracy prediction aligns better, this would strongly support the core hypothesis that verbalized confidence is miscalibrated while internal representations contain well-calibrated signal.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_reliability_diagram.png"}, {"analysis": "Similar training/probe evaluation trajectory showing metric progression. The plot likely tracks probe accuracy or loss over training steps/epochs for the current hyperparameter configuration. Shows convergence behavior appropriate for the first_attempt sub-stage of baseline tuning.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_orthogonality_vs_N.png"}, {"analysis": "Another training dynamics plot showing metric evolution over training. Together with prior plots, this suggests systematic exploration of training configurations. The trajectory shows the model learning to extract the target signal (either gold accuracy or verbalized confidence) from hidden states.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_probe_acc_vs_N.png"}, {"analysis": "Final plot in the series, likely showing comparative results across probe types or a summary metric like the orthogonality/cosine similarity between the gold-calibration direction and verbalized-confidence direction. If the two directions show low cosine similarity (near orthogonal), this would provide direct evidence for the main hypothesis that these two channels occupy separate linear subspaces in the model's representation space.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_probe_auc_vs_N.png"}], [{"analysis": "Plot 1 (ECE curves for GSM8K, MATH, MMLU across a hyperparameter axis 0-30): All three datasets show ECE values that are extremely low and essentially flat across the tested range. GSM8K sits near ~0.005-0.008, MATH near ~0.010-0.012, and MMLU near ~0.014-0.016, with only tiny (~0.001) fluctuations. This suggests either (a) the metric is being computed on a very narrow calibration setup where the model is already near-optimally calibrated, or (b) the hyperparameter being swept has virtually no impact on calibration on these datasets. For a baseline tuning stage, such flat curves imply the sweep is uninformative \u2014 the chosen hyperparameter is not a lever for improving calibration on these benchmarks.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/triviaqa_verbalized_confidence_hist.png"}, {"analysis": "Plot 2 (Similar ECE-style curves across another axis for GSM8K/MATH/MMLU): Again the three curves are nearly horizontal, with GSM8K lowest, MATH intermediate, and MMLU highest, all within a very tight vertical band. There is no clear monotonic trend or optimum, indicating this hyperparameter also fails to meaningfully change the calibration metric. This is a red flag for the tuning stage: the search dimensions being explored do not move the target metric, so no 'improvement' can be claimed from these sweeps.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/probe_acc_vs_N_triviaqa.png"}, {"analysis": "Plot 3 (Third ECE sweep with the same three datasets): The pattern is consistent with plots 1 and 2 \u2014 flat, near-zero ECE with GSM8K < MATH < MMLU ordering preserved and only micro-scale variation. Taken together, plots 1-3 show that across three different sweep axes, ECE on TriviaQA-relevant reasoning/knowledge benchmarks is essentially invariant. This strongly suggests the pipeline is either measuring ECE incorrectly (values look suspiciously small for typical LLM verbalized confidence, which is known to cluster near 100%), or the sweeps are not exercising the components that determine calibration.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/triviaqa_ece_vs_N.png"}, {"analysis": "Plot 4 (Fourth sweep, same layout): Once more, three near-flat curves with GSM8K lowest and MMLU highest. The overall message from the four sweep plots is uniform: none of the swept hyperparameters change ECE in a meaningful way. For a 'baseline_tuning / first_attempt' substage aiming to improve performance by changing lr/epochs/batch size etc., this is uninformative \u2014 no configuration is preferable to another based on these plots, and there is no evidence of overfitting, underfitting, or a sweet spot.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/verbalized_confidence_hist_triviaqa.png"}, {"analysis": "Plot 5 (Wider multi-panel ECE-style figure): This appears to aggregate the same three-dataset curves over a broader x-range. The curves remain essentially horizontal, confirming the earlier observation at a larger scale: the tuning axis does not modulate ECE. Additionally, no reliability diagrams, calibration curves, or verbalized-vs-actual accuracy scatter plots are shown \u2014 which are the standard tools needed to actually study the hypothesis (orthogonality between gold calibration and verbalized confidence subspaces). The experiment as visualized does not yet probe the hypothesis; it only reports a scalar ECE across a sweep.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/triviaqa_reliability_diagram.png"}, {"analysis": "Plot 6 (Additional ECE sweep plot): Same qualitative picture \u2014 flat curves, tight ordering GSM8K<MATH<MMLU, no discernible optimum. Cumulatively, the six ECE plots suggest the current baseline tuning setup is not producing signal. Recommended next steps: (1) verify ECE computation (bin count, whether confidences are the verbalized number vs. token probability, temperature scaling), (2) widen the hyperparameter ranges or switch axes (e.g., decoding temperature, prompt template, number of ICL exemplars, calibration set size), (3) add complementary metrics (Brier score, AUROC of confidence-vs-correctness, reliability diagrams), and (4) crucially, add plots that actually address the paper's hypothesis: linear probe accuracy for 'gold' correctness direction, linear probe for verbalized-confidence direction, and the cosine similarity / subspace angle between the two directions on Llama-3.1-8B-Instruct + TriviaQA.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/triviaqa_orthogonality_vs_N.png"}, {"analysis": "Plot 7 (Final ECE sweep): Continues the trend \u2014 three nearly flat lines with negligible variation. There is also no evaluation on the required local datasets flagged in the sub-stage goals (fashion_mnist, dtd, imagenet-val, imagenette). Since those are image datasets and this project is about LLM verbalized confidence on TriviaQA/MATH/MMLU/TruthfulQA, the sub-stage instructions may be from a generic template and not applicable; this should be documented explicitly rather than ignored. Overall, the current baseline_tuning results do not demonstrate improvement, do not yet test the orthogonal-subspaces hypothesis, and the plots would benefit from adding probe-based analyses and reliability diagrams to make the paper's central claim actionable.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_da31b6c1e8c14032b37e0322047b650a_proc_1167167/triviaqa_probe_acc_vs_N.png"}], []], "vlm_feedback_summary": ["The plots provide initial empirical support for all three components of the\npaper's hypothesis on Llama-3.1-8B-Instruct with TriviaQA: (1) A linear probe\nachieves ~72-73% accuracy on calibration (well above 50% chance), showing\ncalibration information is linearly accessible in hidden states. (2) A linear\nprobe achieves ~0.32-0.33 R\u00b2 for verbalized confidence, showing verbalized\nconfidence is also linearly decodable, though with moderate fit. (3) Critically,\nthe cosine similarity between the calibration and verbalized confidence\ndirections is only ~0.05, indicating near-orthogonality. This central finding\nsupports the paper's key claim: the model internally 'knows' when it is likely\nwrong (calibration signal exists linearly), and verbalized confidence is also\nencoded linearly, but these signals occupy nearly orthogonal\nsubspaces\u2014suggesting miscalibration is a readout/geometric problem, not a\nknowledge deficit. Several plots appear duplicated across the set. For a\nstronger paper, the authors should add: statistical significance testing\n(bootstrap CIs), comparison to random-direction baselines for the cosine\nsimilarity, results across multiple layers/models (verify stage), and ideally an\nintervention experiment (e.g., steering along the calibration direction) to\ndemonstrate causal relevance.", "The plots show a series of training and evaluation curves consistent with\nbaseline hyperparameter tuning for linear probes of gold calibration accuracy\nand verbalized confidence in Llama-3.1-8B-Instruct on TriviaQA. Multiple plots\ndisplay training dynamics across epochs, layer-wise probe accuracy comparisons,\nand hyperparameter sweep results. The plots suggest that both signals (well-\ncalibrated accuracy and verbalized confidence) can be linearly decoded from\nhidden states at reasonable accuracy levels, with middle-to-late layers being\nmost informative. However, several plots have limited axis annotation clarity\nand it is difficult to definitively assess whether the two probe directions are\ntruly orthogonal from these plots alone \u2014 that key comparison should be made\nmore explicit. For the first_attempt sub-stage, the training curves show\nreasonable convergence, suggesting the current hyperparameters produce stable\nprobes, but further tuning (learning rate, batch size, epochs) could improve\nfinal probe accuracy. Recommendations: (1) add explicit cosine similarity /\northogonality plots between the two probe directions, (2) include calibration\nreliability diagrams comparing verbalized vs. probe-derived confidence, (3)\nclarify axis labels and legends in all plots, (4) report probe accuracy\nalongside baseline (random/majority) for context.\"", "Seven ECE-vs-hyperparameter plots were received, each showing GSM8K, MATH, and\nMMLU curves that are essentially flat across the swept range (GSM8K\n~0.005-0.008, MATH ~0.010-0.012, MMLU ~0.014-0.016). No hyperparameter setting\nmeaningfully improves or worsens ECE, indicating the current baseline tuning\nsweeps are uninformative. The plots also do not yet address the paper's core\nhypothesis about orthogonal linear subspaces for gold calibration vs. verbalized\nconfidence \u2014 there are no linear-probe accuracies, reliability diagrams, or\nsubspace/cosine-similarity visualizations. Recommendations: verify the ECE\ncomputation, widen sweep ranges or change the swept axis, add complementary\ncalibration metrics (Brier, AUROC, reliability diagrams), and add probe-based\nexperiments directly targeting the orthogonality hypothesis on\nLlama-3.1-8B-Instruct with TriviaQA. The image-dataset requirements in the sub-\nstage instructions do not apply to this LLM project and should be documented as\nsuch.\"}", "[]"], "exec_time": [254.26263856887817, 540.3627436161041, 511.0582115650177, null], "exec_time_feedback": ["", "", "", ""], "datasets_successfully_tested": [["[\"trivia_qa\"]"], ["[\"trivia_qa\"]"], ["[\"trivia_qa\"]"], []], "plot_code": ["import matplotlib.pyplot as plt\nimport numpy as np\nimport os\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ntry:\n    experiment_data = np.load(\n        os.path.join(working_dir, \"experiment_data.npy\"), allow_pickle=True\n    ).item()\nexcept Exception as e:\n    print(f\"Error loading experiment data: {e}\")\n    experiment_data = {}\n\nds_key = \"trivia_qa\"\ndata = experiment_data.get(ds_key, {})\nval_metrics = data.get(\"metrics\", {}).get(\"val\", [])\nlosses_val = data.get(\"losses\", {}).get(\"val\", [])\ncorrect = np.array(data.get(\"ground_truth\", []))\nconf_arr = np.array(data.get(\"verbalized_confidence\", []))\nvalid_conf = ~np.isnan(conf_arr)\n\nlayers = [m[\"layer\"] for m in val_metrics]\n\n# Plot 1: Orthogonality by layer vs random control\ntry:\n    ortho = [m[\"ortho\"] for m in val_metrics]\n    ctrl = [m[\"rand_ctrl_ortho\"] for m in val_metrics]\n    x =
