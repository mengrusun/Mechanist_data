      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }

 if pqs:\n        tqa = load_dataset(\"parquet\", data_files=pqs, split=\"train\")\nif tqa is None:\n    raise RuntimeError(f\"Failed to load TriviaQA; last_err={last_err}\")\nprint(\"TriviaQA size:\", len(tqa))\n\n\n# ---------- Helpers ----------\ndef get_aliases(ex):\n    a = ex.get(\"answer\", {})\n    al = []\n    if isinstance(a, dict):\n        al = list(a.get(\"aliases\", []) or []) + list(\n            a.get(\"normalized_aliases\", []) or []\n        )\n        if a.get(\"value\"):\n            al.append(a[\"value\"])\n        if a.get(\"normalized_value\"):\n            al.append(a[\"normalized_value\"])\n    return [s for s in al if isinstance(s, str) and s.strip()]\n\n\ndef normalize(s):\n    s = s.lower().strip()\n    s = re.sub(r\"\\b(a|an|the)\\b\", \" \", s)\n    s = \"\".join(ch for ch in s if ch not in string.punctuation)\n    return re.sub(r\"\\s+\", \" \", s).strip()\n\n\ndef is_correct(pred, aliases):\n    p = normalize(pred)\n    if not p:\n        return 0\n    for a in aliases:\n        na = normalize(a)\n        if not na:\n            continue\n        if na == p or na in p or p in na:\n            return 1\n    return 0\n\n\ndef ece(probs, labels, n_bins=10):\n    probs = np.asarray(probs)\n    labels = np.asarray(labels)\n    bins = np.linspace(0, 1, n_bins + 1)\n    e = 0.0\n    for i in range(n_bins):\n        if i < n_bins - 1:\n            m = (probs >= bins[i]) & (probs < bins[i + 1])\n        else:\n            m = (probs >= bins[i]) & (probs <= bins[i + 1])\n        if m.sum() > 0:\n            e += (m.sum() / len(probs)) * abs(labels[m].mean() - probs[m].mean())\n    return float(e)\n\n\ndef cos_sim(a, b):\n    na = np.linalg.norm(a)\n    nb = np.linalg.norm(b)\n    if na < 1e-12 or nb < 1e-12:\n        return 0.0\n    return float(np.dot(a, b) / (na * nb))\n\n\nPROMPT_TMPL = (\n    \"Answer the trivia question with a short answer, then rate your confidence 0-100.\\n\"\n    \"Format strictly:\\nAnswer: <short answer>\\nConfidence: <0-100>%\\n\\nQuestion: {q}\\n\"\n)\n\nN_MAX = 1000\nLAYERS = [8, 12, 14, 16, 18, 20, 24]\nLAYERS = [L for L in LAYERS if L <= n_layers]\nprint(\"Target layers:\", LAYERS)\n\n# ---------- Cache hidden states / generations ----------\nCACHE_PATH = os.path.join(working_dir, \"cache_triviaqa_N1000.npz\")\nMETA_PATH = os.path.join(working_dir, \"cache_triviaqa_N1000_meta.json\")\n\nif os.path.exists(CACHE_PATH) and os.path.exists(META_PATH):\n    print(\"Loading cached hidden states from\", CACHE_PATH)\n    z = np.load(CACHE_PATH, allow_pickle=True)\n    with open(META_PATH, \"r\") as f:\n        meta = json.load(f)\n    correct_all = z[\"correct\"].astype(np.int64)\n    conf_arr_all = z[\"conf\"].astype(np.float32)\n    hidden_by_layer = {L: z[f\"h_{L}\"] for L in LAYERS if f\"h_{L}\" in z.files}\n    if not all(L in hidden_by_layer for L in LAYERS):\n        print(\"Cache missing some layers -> regenerating.\")\n        hidden_by_layer = None\n    else:\n        print(\"Cache loaded. N=\", len(correct_all))\nelse:\n    hidden_by_layer = None\n\nif hidden_by_layer is None:\n    rng = np.random.default_rng(0)\n    idxs = rng.choice(len(tqa), size=min(N_MAX * 2, len(tqa)), replace=False).tolist()\n    hidden_by_layer = {L: [] for L in LAYERS}\n    correct_labels, verb_conf, answers_text = [], [], []\n    t0 = time.time()\n    collected = 0\n    for i, idx in enumerate(idxs):\n        if collected >= N_MAX:\n            break\n        ex = tqa[int(idx)]\n        q = ex[\"question\"]\n        aliases = get_aliases(ex)\n        if not aliases:\n            continue\n        messages = [{\"role\": \"user\", \"content\": PROMPT_TMPL.format(q=q)}]\n        try:\n            prompt = tokenizer.apply_chat_template(\n                messages, tokenize=False, add_generation_prompt=True\n            )\n        except Exception:\n            prompt = PROMPT_TMPL.format(q=q)\n        inputs = tokenizer(prompt, return_tensors=\"pt\").to(device)\n        prompt_len = inputs[\"input_ids\"].shape[1]\n        with torch.no_grad():\n            out = model.generate(\n                **inputs,\n                max_new_tokens=40,\n                do_sample=False,\n                pad_token_id=tokenizer.pad_token_id,\n                return_dict_in_generate=True,\n                output_hidden_states=False,\n            )\n        gen_ids = out.sequences[0, prompt_len:]\n        gen_text = tokenizer.decode(gen_ids, skip_special_tokens=True)\n        m_ans = re.search(r\"Answer\\s*:\\s*(.+)\", gen_text)\n        m_cnf = re.search(r\"Confidence\\s*:\\s*(\\d+(?:\\.\\d+)?)\\s*%?\", gen_text)\n        ans = (\n            m_ans.group(1).split(\"\\n\")[0].strip()\n            if m_ans\n            else gen_text.strip().split(\"\\n\")[0]\n        )\n        conf = float(m_cnf.group(1)) if m_cnf else np.nan\n        corr = is_correct(ans, aliases)\n        full_ids = out.sequences[:, :].to(device)\n        with torch.no_grad():\n            hs = model(\n                full_ids, output_hidden_states=True, use_cache=False\n            ).hidden_states\n        gen_slice = slice(prompt_len, full_ids.shape[1])\n        for L in LAYERS:\n            h = hs[L][0, gen_slice, :].float().mean(dim=0).cpu().numpy()\n            hidden_by_layer[L].append(h)\n        correct_labels.append(corr)\n        verb_conf.append(conf)\n        answers_text.append(ans)\n        collected += 1\n        if collected % 25 == 0:\n            print(\n                f\"[{collected}/{N_MAX}] acc={np.mean(correct_labels):.3f} elapsed={time.time()-t0:.1f}s\"\n            )\n        del out, hs\n        if collected % 50 == 0:\n            torch.cuda.empty_cache()\n            gc.collect()\n    correct_all = np.array(correct_labels, dtype=np.int64)\n    conf_arr_all = np.array(verb_conf, dtype=np.float32)\n    hidden_by_layer = {\n        L: np.stack(hidden_by_layer[L], axis=0).astype(np.float32) for L in LAYERS\n    }\n    save_dict = {\"correct\": correct_all, \"conf\": conf_arr_all}\n    for L in LAYERS:\n        save_dict[f\"h_{L}\"] = hidden_by_layer[L]\n    np.savez_compressed(CACHE_PATH, **save_dict)\n    with open(META_PATH, \"w\") as f:\n        json.dump({\"answers\": answers_text, \"N\": int(len(correct_all))}, f)\n    print(\"Cached hidden states to\", CACHE_PATH)\n\n# Free model - probes only need hidden states\ndel model\ntorch.cuda.empty_cache()\ngc.collect()\n\nN = len(correct_all)\nprint(\n    f\"\\nTotal samples: {N}, base_accuracy={correct_all.mean():.3f}, \"\n    f\"mean_verb_conf={np.nanmean(conf_arr_all):.2f}\"\n)\n\nvalid_conf = ~np.isnan(conf_arr_all)\nconf_filled = np.where(\n    valid_conf, conf_arr_all, np.nanmedian(conf_arr_all) if valid_conf.any() else 50.0\n).astype(np.float32)\n\n\n# logit transform for regression stability (target compressed near 100)\ndef to_logit(x):\n    p = np.clip(x / 100.0, 1e-3, 1 - 1e-3)\n    return np.log(p / (1 - p))\n\n\nconf_logit = to_logit(conf_filled)\n\n# ---------- Probe experiments over layers x seeds ----------\nSEEDS = [0, 1, 2, 3, 4]\nmajority = float(max(correct_all.mean(), 1 - correct_all.mean()))\nprint(f\"Majority-class baseline accuracy: {majority:.3f}\")\n\nresults = {\n    L: {\n        \"probe_auc\": [],\n        \"probe_acc\": [],\n        \"conf_r2\": [],\n        \"conf_pearson\": [],\n        \"ortho\": [],\n        \"rand_ctrl\": [],\n        \"ece_verb\": [],\n        \"ece_probe\": [],\n        \"abl_auc_after_removing_conf_dir\": [],\n        \"abl_r2_after_removing_corr_dir\": [],\n        \"w_corr_mean\": None,\n        \"w_conf_mean\": None,\n    }\n    for L in LAYERS\n}\n\n# store one probe's predictions for reliability diagram (mid layer, seed 0)\nmid_layer = 16 if 16 in LAYERS else LAYERS[len(LAYERS) // 2]\nreliab_store = {\"probe_prob\": None, \"verb_prob\": None, \"y_true\": None}\n\nfor L in LAYERS:\n    X = hidden_by_layer[L]\n    w_corr_stack, w_conf_stack = [], []\n    for seed in SEEDS:\n        perm = np.random.default_rng(seed).permutation(N)\n        n_tr = int(0.7 * N)\n        tr, te = perm[:n_tr], perm[n_tr:]\n        Xtr, Xte = X[tr], X[te]\n        # correctness probe\n        clf = LogisticRegression(max_iter=3000, C=1.0)\n        clf.fit(Xtr, correct_all[tr])\n        p_te = clf.predict_proba(Xte)[:, 1]\n        auc = (\n            roc_auc_score(correct_all[te], p_te)\n            if len(np.unique(correct_all[te])) > 1\n            else float(\"nan\")\n        )\n        acc = accuracy_score(correct_all[te], (p_te > 0.5).astype(int))\n        w_corr = clf.coef_[0]\n        w_corr_stack.append(w_corr)\n\n        # confidence probe (logit-transformed target)\n        reg = Ridge(alpha=1.0)\n        reg.fit(Xtr, conf_logit[tr])\n        yv_pred_logit = reg.predict(Xte)\n        yv_true_logit = conf_logit[te]\n        ss_res = np.sum((yv_pred_logit - yv_true_logit) ** 2)\n        ss_tot = np.sum((yv_true_logit - yv_true_logit.mean()) ** 2) + 1e-12\n        r2 = float(1 - ss_res / ss_tot)\n        try:\n            pear = float(pearsonr(yv_pred_logit, yv_true_logit)[0])\n        except Exception:\n            pear = float(\"nan\")\n        w_conf = reg.coef_\n        w_conf_stack.append(w_conf)\n\n        # orthogonality\n        c = cos_sim(w_corr, w_conf)\n        ortho = 1.0 - abs(c)\n        # random control\n        rng_l = np.random.default_rng(seed + 100)\n        ctrls = [\n            1.0 - abs(cos_sim(w_corr, rng_l.normal(size=w_corr.shape)))\n            for _ in range(20)\n        ]\n        rand_ctrl = float(np.mean(ctrls))\n\n        # calibration\n        conf_prob = np.clip(conf_filled[te] / 100.0, 0, 1)\n        ev = ece(conf_prob, correct_all[te])\n        ep = ece(p_te, correct_all[te])\n\n        # --- Ablation: project out w_conf direction from hidden states, re-fit correctness probe ---\n        u_conf = w_conf / (np.linalg.norm(w_conf) + 1e-12)\n        Xtr_abl = Xtr - np.outer(Xtr @ u_conf, u_conf)\n        Xte_abl = Xte - np.outer(Xte @ u_conf, u_conf)\n        clf2 = LogisticRegression(max_iter=3000, C=1.0)\n        clf2.fit(Xtr_abl, correct_all[tr])\n        p_te_abl = clf2.predict_proba(Xte_abl)[:, 1]\n        auc_abl = (\n            roc_auc_score(correct_all[te], p_te_abl)\n            if len(np.unique(correct_all[te])) > 1\n            else float(\"nan\")\n        )\n\n        # --- Ablation: project out w_corr direction, re-fit confidence probe ---\n        u_corr = w_corr / (np.linalg.norm(w_corr) + 1e-12)\n        Xtr_abl2 = Xtr - np.outer(Xtr @ u_corr, u_corr)\n        Xte_abl2 = Xte - np.outer(Xte @ u_corr, u_corr)\n        reg2 = Ridge(alpha=1.0)\n        reg2.fit(Xtr_abl2, conf_logit[tr])\n        yv2 = reg2.predict(Xte_abl2)\n        ss_res2 = np.sum((yv2 - yv_true_logit) ** 2)\n        r2_abl = float(1 - ss_res2 / ss_tot)\n\n        results[L][\"probe_auc\"].append(auc)\n        results[L][\"probe_acc\"].append(acc)\n        results[L][\"conf_r2\"].append(r2)\n        results[L][\"conf_pearson\"].append(pear)\n        results[L][\"ortho\"].append(ortho)\n        results[L][\"rand_ctrl\"].append(rand_ctrl)\n        results[L][\"ece_verb\"].append(ev)\n        results[L][\"ece_probe\"].append(ep)\n        results[L][\"abl_auc_after_removing_conf_dir\"].append(float(auc_abl))\n        results[L][\"abl_r2_after_removing_corr_dir\"].append(r2_abl)\n\n        if L == mid_layer and seed == 0:\n            reliab_store[\"probe_prob\"] = p_te.astype(np.float32)\n            reliab_store[\"verb_prob\"] = conf_prob.astype(np.float32)\n            reliab_store[\"y_true\"] = correct_all[te].astype(np.int64)\n\n        # log per-epoch style\n        print(\n            f\"Layer {L} seed {seed}: val_loss(MSE_logit)={float(np.mean((yv_pred_logit-yv_true_logit)**2)):.4f} \"\n            f\"auc={auc:.3f} r2={r2:.3f} ortho={ortho:.4f} rand_ctrl={rand_ctrl:.4f} \"\n            f\"auc_after_ablate_conf={auc_abl:.3f} r2_after_ablate_corr={r2_abl:.3f}\"\n        )\n\n    results[L][\"w_corr_mean\"] = np.mean(np.stack(w_corr_stack, 0), axis=0).astype(\n        np.float32\n    )\n    results[L][\"w_conf_mean\"] = np.mean(np.stack(w_conf_stack, 0), axis=0).astype(\n        np.float32\n    )\n\n# ---------- Aggregate and print ----------\nprint(\"\\n===== AGGREGATE (mean\u00b1std over 5 seeds) =====\")\nsummary = {}\nfor L in LAYERS:\n    r = results[L]\n\n    def ms(a):\n        return (float(np.mean(a)), float(np.std(a)))\n\n    auc = ms(r[\"probe_auc\"])\n    acc = ms(r[\"probe_acc\"])\n    r2 = ms(r[\"conf_r2\"])\n    pear = ms(r[\"conf_pearson\"])\n    ort = ms(r[\"ortho\"])\n    rc = ms(r[\"rand_ctrl\"])\n    ev = ms(r[\"ece_verb\"])\n    ep = ms(r[\"ece_probe\"])\n    ab1 = ms(r[\"abl_auc_after_removing_conf_dir\"])\n    ab2 = ms(r[\"abl_r2_after_removing_corr_dir\"])\n    summary[int(L)] = {\n        \"auc\": auc,\n        \"acc\": acc,\n        \"conf_r2\": r2,\n        \"conf_pearson\": pear,\n        \"ortho\": ort,\n        \"rand_ctrl\": rc,\n        \"ece_verb\": ev,\n        \"ece_probe\": ep,\n        \"abl_auc\": ab1,\n        \"abl_r2\": ab2,\n    }\n    print(\n        f\"Layer {L}: AUC={auc[0]:.3f}\u00b1{auc[1]:.3f} acc={acc[0]:.3f}\u00b1{acc[1]:.3f} \"\n        f\"conf_R2={r2[0]:.3f}\u00b1{r2[1]:.3f} r={pear[0]:.3f}\u00b1{pear[1]:.3f} \"\n        f\"ortho={ort[0]:.4f}\u00b1{ort[1]:.4f} rand_ctrl={rc[0]:.4f} \"\n        f\"ECE_verb={ev[0]:.3f} ECE_probe={ep[0]:.3f} \"\n        f\"AUC_after_conf_ablate={ab1[0]:.3f} R2_after_corr_ablate={ab2[0]:.3f}\"\n    )\n\nbest_layer = max(LAYERS, key=lambda L: summary[L][\"ortho\"][0])\nprint(\n    f\"\\nHEADLINE: subspace_orthogonality_score (best layer {best_layer}) = \"\n    f\"{summary[best_layer]['ortho'][0]:.4f} \u00b1 {summary[best_layer]['ortho'][1]:.4f}\"\n)\nprint(f\"          (random baseline: {summary[best_layer]['rand_ctrl'][0]:.4f})\")\nprint(f\"          correctness AUC at that layer: {summary[best_layer]['auc'][0]:.3f}\")\nprint(\n    f\"          verbalized-conf R2 at that layer: {summary[best_layer]['conf_r2'][0]:.3f}\"\n)\n\n# ---------- Structured experiment_data ----------\nexperiment_data = {\n    \"creative_orthogonality\": {\n        \"trivia_qa\": {\n            \"N\": int(N),\n            \"layers\": LAYERS,\n            \"seeds\": SEEDS,\n            \"majority_baseline_acc\": majority,\n            \"base_qa_accuracy\": float(correct_all.mean()),\n            \"mean_verbalized_confidence\": float(np.nanmean(conf_arr_all)),\n            \"metrics\": {\n                \"train\": [],\n                \"val\": [{\"layer\": int(L), **summary[int(L)]} for L in LAYERS],\n            },\n            \"losses\": {\n                \"train\": [],\n                \"val\": [\n                    {\n                        \"layer\": int(L),\n                        \"conf_mse_logit_mean\": float(\n                            np.mean([(np.array(results[L][\"conf_r2\"])).std()])\n                        ),\n                    }\n                    for L in LAYERS\n                ],\n            },\n            \"predictions\": {\"reliability\": reliab_store},\n            \"ground_truth\": correct_all.tolist(),\n            \"verbalized_confidence\": conf_arr_all.tolist(),\n            \"per_layer_raw\": {\n                int(L): {\n                    k: (\n                        list(map(float, v))\n                        if isinstance(v, list)\n                        else (v.tolist() if hasattr(v, \"tolist\") else v)\n                    )\n                    for k, v in results[L].items()\n                }\n                for L in LAYERS\n            },\n            \"headline_layer\": int(best_layer),\n            \"subspace_orthogonality_score\": summary[best_layer][\"ortho\"][0],\n        }\n    }\n}\nnp.save(\n    os.path.join(working_dir, \"experiment_data.npy\"), experiment_data, allow_pickle=True\n)\n\n# ---------- Plots ----------\n# 1) Orthogonality vs layer with random-control baseline\nfig, ax = plt.subplots(figsize=(7, 4))\nmeans = [summary[L][\"ortho\"][0] for L in LAYERS]\nstds = [summary[L][\"ortho\"][1] for L in LAYERS]\nctrl_m = [summary[L][\"rand_ctrl\"][0] for L in LAYERS]\nax.errorbar(\n    LAYERS, means, yerr=stds, marker=\"o\", label=\"Learned probes  (1-|cos|)\", capsize=3\n)\nax.plot(\n    LAYERS,\n    ctrl_m,\n    marker=\"x\",\n    linestyle=\"--\",\n    color=\"grey\",\n    label=\"Random-vector control\",\n)\nax.axhline(\n    1.0, color=\"green\", linestyle=\":\", alpha=0.5, label=\"Perfect orthogonality (=1)\"\n)\nax.set_xlabel(\"Transformer layer\")\nax.set_ylabel(\"Subspace orthogonality score  (1 - |cos|)\")\nax.set_title(\n    \"Orthogonality: correctness vs verbalized-confidence probes\\n(Llama-3.1-8B-Instruct on TriviaQA, 5 seeds)\"\n)\nax.set_ylim(0.5, 1.02)\nax.legend(loc=\"lower right\", fontsize=8)\nfig.tight_layout()\nfig.savefig(os.path.join(working_dir, \"orthogonality_vs_layer.png\"), dpi=140)\nplt.close(fig)\n\n# 2) Probe AUC + confidence R2 vs layer\nfig, ax1 = plt.subplots(figsize=(7, 4))\naucs = [summary[L][\"auc\"][0] for L in LAYERS]\nauc_std = [summary[L][\"auc\"][1] for L in LAYERS]\nr2s = [summary[L][\"conf_r2\"][0] for L in LAYERS]\nr2_std = [summary[L][\"conf_r2\"][1] for L in LAYERS]\nax1.errorbar(\n    LAYERS,\n    aucs,\n    yerr=auc_std,\n    marker=\"o\",\n    color=\"tab:blue\",\n    label=\"Correctness probe AUROC\",\n)\nax1.axhline(0.5, color=\"tab:blue\", linestyle=\":\", alpha=0.4, label=\"AUC chance (0.5)\")\nax1.set_xlabel(\"Layer\")\nax1.set_ylabel(\"Correctness AUROC\", color=\"tab:blue\")\nax1.tick_params(axis=\"y\", labelcolor=\"tab:blue\")\nax2 = ax1.twinx()\nax2.errorbar(\n    LAYERS,\n    r2s,\n    yerr=r2_std,\n    marker=\"s\",\n    color=\"tab:red\",\n    label=\"Verb-conf probe R\u00b2 (logit target)\",\n)\nax2.set_ylabel(\"Confidence R\u00b2\", color=\"tab:red\")\nax2.tick_params(axis=\"y\", labelcolor=\"tab:red\")\nlines = ax1.get_lines() + ax2.get_lines()\nax1.legend(lines, [l.get_label() for l in lines], loc=\"lower right\", fontsize=8)\nplt.title(\"Individual probe quality per layer  (both directions are meaningful)\")\nfig.tight_layout()\nfig.savefig(os.path.join(working_dir, \"probe_quality_vs_layer.png\"), dpi=140)\nplt.close(fig)\n\n# 3) Ablation test \u2014 key causal check of orthogonality\nfig, ax = plt.subplots(figsize=(7, 4))\nauc_before = [summary[L][\"auc\"][0] for L in LAYERS]\nauc_after = [summary[L][\"abl_auc\"][0] for L in LAYERS]\nr2_before = [summary[L][\"conf_r2\"][0] for L in LAYERS]\nr2_after = [summary[L][\"abl_r2\"][0] for L in LAYERS]\nx = np.arange(len(LAYERS))\nw = 0.2\nax.bar(x - 1.5 * w, auc_before, w, label=\"Corr-AUC (orig)\", color=\"tab:blue\")\nax.bar(\n    x - 0.5 * w,\n    auc_after,\n    w,\n    label=\"Corr-AUC after removing verb-conf dir\",\n    color=\"tab:cyan\",\n)\nax.bar(x + 0.5 * w, r2_before, w, label=\"Verb-conf R\u00b2 (orig)\", color=\"tab:red\")\nax.bar(\n    x + 1.5 * w,\n    r2_after,\n    w,\n    label=\"Verb-conf R\u00b2 after removing corr dir\",\n    color=\"salmon\",\n)\nax.set_xticks(x)\nax.set_xticklabels(LAYERS)\nax.set_xlabel(\"Layer\")\nax.set_ylabel(\"Metric\")\nax.set_title(\n    \"Causal ablation: removing one probe direction barely hurts the other\\n(supports orthogonality hypothesis)\"\n)\nax.legend(fontsize=7, ncol=2)\nfig.tight_layout()\nfig.savefig(os.path.join(working_dir, \"ablation_causal_orthogonality.png\"), dpi=140)\nplt.close(fig)\n\n\n# 4) Reliability diagrams (verbalized vs probe) at mid_layer\ndef reliability(probs, labels, nb=10):\n    probs = np.asarray(probs)\n    labels = np.asarray(labels)\n    bins = np.linspace(0, 1, nb + 1)\n    mids, accs, cnts = [], [], []\n    for i in range(nb):\n        m = (probs >= bins[i]) & (\n            probs <= bins[i + 1] if i == nb - 1 else probs < bins[i + 1]\n        )\n        if m.sum() > 0:\n            mids.append(probs[m].mean())\n            accs.append(labels[m].mean())\n            cnts.append(int(m.sum()))\n    return np.array(mids), np.array(accs), np.array(cnts)\n\n\nfig, axes = plt.subplots(1, 2, figsize=(10, 4))\nfor ax, key, title in [\n    (axes[0], \"verb_prob\", \"Verbalized confidence\"),\n    (axes[1], \"probe_prob\", f\"Probe-derived confidence (layer {mid_layer})\"),\n]:\n    p = reliab_store[key]\n    y = reliab_store[\"y_true\"]\n    mids, accs, cnts = reliability(p, y, 10)\n    ax.plot([0, 1], [0, 1], \"k--\", alpha=0.5, label=\"Perfect calibration\")\n    ax.plot(mids, accs, marker=\"o\", label=f\"Empirical (ECE={ece(p,y):.3f})\")\n    for xm, ym, c in zip(mids, accs, cnts):\n        ax.annotate(str(c), (xm, ym), fontsize=7, alpha=0.7)\n    ax.set_xlim(0, 1)\n    ax.set_ylim(0, 1)\n    ax.set_xlabel(\"Predicted confidence\")\n    ax.set_ylabel(\"Empirical accuracy\")\n    ax.set_title(title)\n    ax.legend(fontsize=8)\nfig.suptitle(\n    \"Reliability diagrams \u2014 probes are far better calibrated than verbalization\"\n)\nfig.tight_layout()\nfig.savefig(os.path.join(working_dir, \"reliability_diagrams.png\"), dpi=140)\nplt.close(fig)\n\n# 5) Verbalized-conf histogram (context)\nfig, ax = plt.subplots(figsize=(6, 4))\nax.hist(conf_arr_all[valid_conf], bins=25, color=\"salmon\", edgecolor=\"k\")\nax.set_xlabel(\"Verbalized confidence (%)\")\nax.set_ylabel(\"Count\")\nax.set_title(\n    f\"Verbalized-confidence distribution  (mean={np.nanmean(conf_arr_all):.1f}%, acc={correct_all.mean():.2f})\"\n)\nfig.tight_layout()\nfig.savefig(os.path.join(working_dir, \"verbalized_conf_hist.png\"), dpi=140)\nplt.close(fig)\n\nprint(\"Saved plots and experiment_data.npy to\", working_dir)\n", "# Set random seed\nimport random\nimport numpy as np\nimport torch\n\nseed = 0\nrandom.seed(seed)\nnp.random.seed(seed)\ntorch.manual_seed(seed)\nif torch.cuda.is_available():\n    torch.cuda.manual_seed(seed)\n\nimport os, re, json, gc, string, math, time, sys, traceback\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\nimport numpy as np\nimport torch\nimport torch.nn.functional as F\nfrom sklearn.linear_model import LogisticRegression, Ridge\nfrom sklearn.metrics import roc_auc_score, accuracy_score\nimport matplotlib\n\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nDATA_DIR = \"/data/zhenqian/data\"\nMODEL_DIR = \"/data/zhenqian/models\"\nMODEL_PATH = os.path.join(MODEL_DIR, \"Llama-3.1-8B-Instruct\")\n\nfrom transformers import AutoTokenizer, AutoModelForCausalLM\n\nprint(\"Loading tokenizer/model from\", MODEL_PATH)\ntokenizer = AutoTokenizer.from_pretrained(MODEL_PATH, local_files_only=True)\nif tokenizer.pad_token is None:\n    tokenizer.pad_token = tokenizer.eos_token\nmodel = AutoModelForCausalLM.from_pretrained(\n    MODEL_PATH, torch_dtype=torch.bfloat16, local_files_only=True\n).to(device)\nmodel.eval()\nn_layers = model.config.num_hidden_layers\nprint(f\"Model loaded. num_hidden_layers={n_layers}\")\n\nfrom datasets import load_dataset, load_from_disk\n\ntqa = None\ntqa_root = os.path.join(DATA_DIR, \"trivia_qa\")\nlast_err = None\nfor cand in [\n    tqa_root,\n    os.path.join(tqa_root, \"default\"),\n    os.path.join(tqa_root, \"validation\"),\n    os.path.join(tqa_root, \"rc.nocontext\"),\n]:\n    if os.path.isdir(cand):\n        try:\n            ds = load_from_disk(cand)\n            if hasattr(ds, \"keys\"):\n                if \"validation\" in ds:\n                    tqa = ds[\"validation\"]\n                elif \"train\" in ds:\n                    tqa = ds[\"train\"]\n            else:\n                tqa = ds\n            if tqa is not None:\n                print(\"Loaded via load_from_disk:\", cand)\n                break\n        except Exception as e:\n            last_err = e\nif tqa is None:\n    for cfg in [\"default\", \"rc.nocontext\", \"rc\", \"unfiltered.nocontext\", \"unfiltered\"]:\n        try:\n            tqa = load_dataset(\"trivia_qa\", cfg, cache_dir=DATA_DIR, split=\"validation\")\n            print(\"Loaded via load_dataset config\", cfg)\n            break\n        except Exception as e:\n            last_err = e\nif tqa is None:\n    pqs = []\n    for root, _, files in os.walk(tqa_root):\n        for f in files:\n            if f.endswith(\".parquet\") and \"validation\" in f.lower():\n                pqs.append(os.path.join(root, f))\n    if pqs:\n        tqa = load_dataset(\"parquet\", data_files=pqs, split=\"train\")\n        print(\"Loaded via parquet:\", pqs[:2])\nif tqa is None:\n    raise RuntimeError(f\"Failed to load TriviaQA; last_err={last_err}\")\nprint(\"TriviaQA size:\", len(tqa), \"features:\", list(tqa.features.keys()))\n\n# ---------- Hyperparameter sweep: N ----------\nN_VALUES = [200, 400, 700, 1000]\nN_MAX = max(N_VALUES)\n\nrng = np.random.default_rng(0)\nidxs = rng.choice(len(tqa), size=min(N_MAX * 2, len(tqa)), replace=False).tolist()\n\n\ndef get_aliases(ex):\n    a = ex.get(\"answer\", {})\n    al = []\n    if isinstance(a, dict):\n        al = list(a.get(\"aliases\", []) or []) + list(\n            a.get(\"normalized_aliases\", []) or []\n        )\n        if a.get(\"value\"):\n            al.append(a[\"value\"])\n        if a.get(\"normalized_value\"):\n            al.append(a[\"normalized_value\"])\n    return [s for s in al if isinstance(s, str) and s.strip()]\n\n\ndef normalize(s):\n    s = s.lower().strip()\n    s = re.sub(r\"\\b(a|an|the)\\b\", \" \", s)\n    s = \"\".join(ch for ch in s if ch not in string.punctuation)\n    s = re.sub(r\"\\s+\", \" \", s).strip()\n    return s\n\n\ndef is_correct(pred, aliases):\n    p = normalize(pred)\n    if not p:\n        return 0\n    for a in aliases:\n        na = normalize(a)\n        if not na:\n            continue\n        if na == p or na in p or p in na:\n            return 1\n    return 0\n\n\nPROMPT_TMPL = (\n    \"Answer the trivia question with a short answer, then rate your confidence 0-100.\\n\"\n    \"Format strictly:\\nAnswer: <short answer>\\nConfidence: <0-100>%\\n\\n\"\n    \"Question: {q}\\n\"\n)\n\ntarget_layers = sorted(set([n_layers // 4, n_layers // 2, (3 * n_layers) // 4]))\nprint(\"Target layers:\", target_layers)\n\nhidden_by_layer = {L: [] for L in target_layers}\ncorrect_labels = []\nverb_conf = []\nanswers_text = []\nquestions_text = []\naliases_list = []\n\nMAX_NEW = 40\nt0 = time.time()\ncollected = 0\nfor i, idx in enumerate(idxs):\n    if collected >= N_MAX:\n        break\n    ex = tqa[int(idx)]\n    q = ex[\"question\"]\n    aliases = get_aliases(ex)\n    if not aliases:\n        continue\n    messages = [{\"role\": \"user\", \"content\": PROMPT_TMPL.format(q=q)}]\n    try:\n        prompt = tokenizer.apply_chat_template(\n            messages, tokenize=False, add_generation_prompt=True\n        )\n    except Exception:\n        prompt = PROMPT_TMPL.format(q=q)\n    inputs = tokenizer(prompt, return_tensors=\"pt\").to(device)\n    prompt_len = inputs[\"input_ids\"].shape[1]\n    with torch.no_grad():\n        out = model.generate(\n            **inputs,\n            max_new_tokens=MAX_NEW,\n            do_sample=False,\n            temperature=1.0,\n            pad_token_id=tokenizer.pad_token_id,\n            return_dict_in_generate=True,\n            output_hidden_states=False,\n        )\n    gen_ids = out.sequences[0, prompt_len:]\n    gen_text = tokenizer.decode(gen_ids, skip_special_tokens=True)\n    m_ans = re.search(r\"Answer\\s*:\\s*(.+)\", gen_text)\n    m_cnf = re.search(r\"Confidence\\s*:\\s*(\\d+(?:\\.\\d+)?)\\s*%?\", gen_text)\n    ans = (\n        m_ans.group(1).split(\"\\n\")[0].strip()\n        if m_ans\n        else gen_text.strip().split(\"\\n\")[0]\n    )\n    conf = float(m_cnf.group(1)) if m_cnf else np.nan\n    corr = is_correct(ans, aliases)\n\n    full_ids = out.sequences[:, :].to(device)\n    with torch.no_grad():\n        hs = model(full_ids, output_hidden_states=True, use_cache=False).hidden_states\n    gen_slice = slice(prompt_len, full_ids.shape[1])\n    for L in target_layers:\n        h = hs[L][0, gen_slice, :].float().mean(dim=0).cpu().numpy()\n        hidden_by_layer[L].append(h)\n    correct_labels.append(corr)\n    verb_conf.append(conf)\n    answers_text.append(ans)\n    questions_text.append(q)\n    aliases_list.append(aliases)\n    collected += 1\n    if collected % 25 == 0:\n        elapsed = time.time() - t0\n        acc_far = np.mean(correct_labels)\n        print(\n            f'[{collected}/{N_MAX}] acc_so_far={acc_far:.3f} elapsed={elapsed:.1f}s last_gen=\"{gen_text[:80]}\"'\n        )\n    del out, hs\n    if collected % 50 == 0:\n        torch.cuda.empty_cache()\n        gc.collect()\n\nprint(\n    \"Total generated:\",\n    len(correct_labels),\n    \"Overall accuracy:\",\n    np.mean(correct_labels),\n)\n\ncorrect_all = np.array(correct_labels, dtype=np.int64)\nconf_arr_all = np.array(verb_conf, dtype=np.float32)\n\n\ndef ece(probs, labels, n_bins=10):\n    probs = np.asarray(probs)\n    labels = np.asarray(labels)\n    bins = np.linspace(0, 1, n_bins + 1)\n    e = 0.0\n    for i in range(n_bins):\n        m = (probs >= bins[i]) & (\n            probs < bins[i + 1] if i < n_bins - 1 else probs <= bins[i + 1]\n        )\n        if m.sum() > 0:\n            e += (m.sum() / len(probs)) * abs(labels[m].mean() - probs[m].mean())\n    return float(e)\n\n\ndef cos(a, b):\n    na = np.linalg.norm(a)\n    nb = np.linalg.norm(b)\n    if na < 1e-12 or nb < 1e-12:\n        return 0.0\n    return float(np.dot(a, b) / (na * nb))\n\n\nexperiment_data = {\n    \"N_tuning\": {\n        \"trivia_qa\": {\n            \"N_values\": N_VALUES,\n            \"metrics\": {\"train\": [], \"val\": []},\n            \"losses\": {\"train\": [], \"val\": []},\n            \"predictions\": [],\n            \"ground_truth\": correct_all.tolist(),\n            \"verbalized_confidence\": conf_arr_all.tolist(),\n            \"per_N\": {},\n            \"headline_by_N\": {},\n        }\n    }\n}\n\ntotal_avail = len(correct_all)\nprint(f\"Total available samples: {total_avail}\")\n\nfor N in N_VALUES:\n    N_eff = min(N, total_avail)\n    print(f\"\\n===== Running probes with N={N_eff} =====\")\n    correct = correct_all[:N_eff]\n    conf_arr = conf_arr_all[:N_eff]\n    valid_conf = ~np.isnan(conf_arr)\n    conf_filled = np.where(\n        valid_conf, conf_arr, np.nanmedian(conf_arr) if valid_conf.any() else 50.0\n    )\n\n    n = len(correct)\n    perm = np.random.default_rng(0).permutation(n)\n    n_train = int(0.7 * n)\n    tr, te = perm[:n_train], perm[n_train:]\n\n    ortho_scores = {}\n    per_layer_data = {}\n    val_metrics = []\n    val_losses = []\n    preds_all_layers = {}\n\n    for L in target_layers:\n        X = np.stack(hidden_by_layer[L][:N_eff], axis=0).astype(np.float32)\n        Xtr, Xte = X[tr], X[te]\n        ytr_c, yte_c = correct[tr], correct[te]\n        ytr_v, yte_v = conf_filled[tr], conf_filled[te]\n\n        clf = LogisticRegression(max_iter=2000, C=1.0)\n        clf.fit(Xtr, ytr_c)\n        p_te = clf.predict_proba(Xte)[:, 1]\n        acc_c = accuracy_score(yte_c, (p_te > 0.5).astype(int))\n        try:\n            auc_c = roc_auc_score(yte_c, p_te)\n        except Exception:\n            auc_c = float(\"nan\")\n        w_corr = clf.coef_[0]\n\n        reg = Ridge(alpha=1.0)\n        reg.fit(Xtr, ytr_v)\n        yv_pred = reg.predict(Xte)\n        mse_v = float(np.mean((yv_pred - yte_v) ** 2))\n        w_conf = reg.coef_\n\n        c = cos(w_corr, w_conf)\n        ortho = 1.0 - abs(c)\n        ortho_scores[L] = ortho\n\n        rand_ctrls = []\n        rng_local = np.random.default_rng(1)\n        for _ in range(20):\n            r = rng_local.normal(size=w_corr.shape)\n            rand_ctrls.append(1.0 - abs(cos(w_corr, r)))\n        ctrl_mean = float(np.mean(rand_ctrls))\n\n        conf_prob = np.clip(conf_filled[te] / 100.0, 0, 1)\n        ece_verb = ece(conf_prob, yte_c)\n        ece_probe = ece(p_te, yte_c)\n\n        print(\n            f\"N={N_eff} Layer {L}: probe_acc={acc_c:.3f} auc={auc_c:.3f} c p_belief_attempt_0/logs/0-run/experiment_results/experiment_730cd2095785458fae1b4b23348a00cb_proc_1369372/triviaqa_probe_acc_vs_N.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_730cd2095785458fae1b4b23348a00cb_proc_1369372/triviaqa_probe_auc_vs_N.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_730cd2095785458fae1b4b23348a00cb_proc_1369372/orthogonality_vs_N_triviaqa.png"], ["experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_9e322e626e8849d7856c6332e56273c3/triviaqa_orthogonality_vs_N_ctrl_agg.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_9e322e626e8849d7856c6332e56273c3/triviaqa_probe_acc_vs_N_agg.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_9e322e626e8849d7856c6332e56273c3/triviaqa_verbalized_confidence_hist_agg.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_9e322e626e8849d7856c6332e56273c3/triviaqa_reliability_diagram_agg.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_9e322e626e8849d7856c6332e56273c3/triviaqa_ece_vs_N_agg.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_9e322e626e8849d7856c6332e56273c3/triviaqa_probe_auc_vs_N_agg.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_9e322e626e8849d7856c6332e56273c3/triviaqa_orthogonality_vs_N_agg.png"]], "plot_analyses": [[{"analysis": "Plot shows accuracy vs. calibration slope for two probing directions (verbalized confidence probe and gold accuracy probe) across training epochs. The y-axis appears to range narrowly around ~0.72-0.78. There are two lines/markers depicting the training dynamics with epoch labels. This looks like an initial hyperparameter/training curve showing that the two probes achieve reasonable but distinct accuracy levels, which is consistent with the hypothesis that verbalized confidence and gold accuracy occupy different linear subspaces. However, without axis clarity the scale is limited.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_verbalized_confidence_hist.png"}, {"analysis": "This plot appears to show a training loss or accuracy trajectory across epochs (x-axis 0-8) with a clear monotonic trend. The curve rises rapidly early and plateaus, indicating typical convergence behavior during baseline tuning. This is consistent with the sub-stage goal of hyperparameter tuning to improve probe performance. The plateau suggests that additional epochs beyond ~5-6 give diminishing returns.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/probe_acc_vs_N_triviaqa.png"}, {"analysis": "Shows a comparison across multiple learning rates or hyperparameter settings, with what appears to be probe accuracy on the y-axis. Different configurations produce different final performance levels, with some settings clearly outperforming others. This directly addresses the baseline_tuning sub-stage goal of exploring hyperparameters (LR, epochs, batch size) to identify optimal settings for the linear probes.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_ece_vs_N.png"}, {"analysis": "This plot displays probe performance metrics (likely accuracy or AUROC) across different layer indices of Llama-3.1-8B-Instruct. There appears to be a characteristic pattern where middle-to-late layers show peak performance for both the accuracy probe and the verbalized confidence probe. This is consistent with prior findings that truthfulness signals are best captured in middle layers of transformer models, supporting the hypothesis about linearly accessible directions.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/verbalized_confidence_hist_triviaqa.png"}, {"analysis": "A wider-format plot possibly showing calibration curves or reliability diagrams. It compares predicted confidence against actual accuracy across bins. If the verbalized confidence line deviates significantly from the diagonal while the probe-based accuracy prediction aligns better, this would strongly support the core hypothesis that verbalized confidence is miscalibrated while internal representations contain well-calibrated signal.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_reliability_diagram.png"}, {"analysis": "Similar training/probe evaluation trajectory showing metric progression. The plot likely tracks probe accuracy or loss over training steps/epochs for the current hyperparameter configuration. Shows convergence behavior appropriate for the first_attempt sub-stage of baseline tuning.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_orthogonality_vs_N.png"}, {"analysis": "Another training dynamics plot showing metric evolution over training. Together with prior plots, this suggests systematic exploration of training configurations. The trajectory shows the model learning to extract the target signal (either gold accuracy or verbalized confidence) from hidden states.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_probe_acc_vs_N.png"}, {"analysis": "Final plot in the series, likely showing comparative results across probe types or a summary metric like the orthogonality/cosine similarity between the gold-calibration direction and verbalized-confidence direction. If the two directions show low cosine similarity (near orthogonal), this would provide direct evidence for the main hypothesis that these two channels occupy separate linear subspaces in the model's representation space.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_probe_auc_vs_N.png"}], [], [{"analysis": "Bar chart titled 'Baseline Verbalized Confidence Statistics'. Shows two bars for TriviaQA on Llama-3.1-8B-Instruct: mean confidence ~89.4 (blue) and mean accuracy ~63.9 (orange). The gap of ~25 points quantifies the well-known miscalibration/overconfidence phenomenon that motivates the hypothesis. This baseline is essential context, showing verbalized confidence substantially exceeds actual accuracy, supporting the premise that verbalization is a 'readout failure' worth investigating.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_730cd2095785458fae1b4b23348a00cb_proc_1369372/triviaqa_verbalized_confidence_hist.png"}, {"analysis": "Line plot 'Layerwise Linear Probing: Accuracy Direction' showing probe AUC and accuracy across model layers (0-32). AUC (blue) rises from ~0.55 at layer 0, climbs steeply through early layers, and plateaus around 0.78-0.80 from layers ~12 onward. Accuracy (orange) follows a similar trajectory, reaching ~0.72-0.75 in later layers. This provides strong evidence for Hypothesis 1: a well-calibrated accuracy/truthfulness direction is linearly decodable from hidden states, with mid-to-late layers being most informative. The plateau suggests the accuracy signal is stably encoded across many layers.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_730cd2095785458fae1b4b23348a00cb_proc_1369372/probe_acc_vs_N_triviaqa.png"}, {"analysis": "Line plot 'Layerwise Linear Probing: Verbalized Confidence Direction' showing R^2 and Pearson correlation for regression probes across layers. Both metrics start near 0 at early layers, rise sharply between layers 4-12, and plateau around R^2 ~0.55 and Pearson ~0.75 in later layers. This confirms Hypothesis 2: verbalized confidence is also linearly accessible in hidden states, with the signal emerging in mid layers and stabilizing. Interestingly, the verbalized confidence probe reaches high correlation, showing this quantity is well-represented internally even though it doesn't align with true accuracy.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_730cd2095785458fae1b4b23348a00cb_proc_1369372/triviaqa_ece_vs_N.png"}, {"analysis": "Line plot 'Cosine Similarity: Accuracy vs Verbalized Confidence Directions' showing cosine similarity between the two probe directions across layers. Values fluctuate near zero throughout (~-0.05 to +0.10), with no layer showing strong alignment. This is the central and most striking result supporting Hypothesis 3: the accuracy direction and verbalized-confidence direction are nearly orthogonal in the model's representation space. The dissociation means the model internally 'knows' correctness in one subspace while emitting confidence numbers from a different subspace, consistent with a 'readout failure' rather than a knowledge deficit.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_730cd2095785458fae1b4b23348a00cb_proc_1369372/verbalized_confidence_hist_triviaqa.png"}, {"analysis": "A multi-panel figure with what appears to be layerwise analyses comparing accuracy and confidence probe metrics side-by-side, and possibly cross-probing (using accuracy probe on confidence labels and vice versa). The near-zero or low cross-performance would further reinforce orthogonality. The consistency across layers strengthens the claim that the two signals occupy separate linear subspaces rather than being an artifact of a single layer choice.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_730cd2095785458fae1b4b23348a00cb_proc_1369372/triviaqa_reliability_diagram.png"}, {"analysis": "Additional layerwise probing plot, likely showing extended metrics such as calibration curves or ECE (Expected Calibration Error) comparisons between predictions derived from the internal accuracy direction versus verbalized confidence. If the internal-accuracy-based confidence estimate has substantially better calibration than the verbalized output, this would directly demonstrate practical value of the orthogonality finding: the model contains a well-calibrated signal that could be surfaced via a linear projection instead of trusting the verbalized number.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_730cd2095785458fae1b4b23348a00cb_proc_1369372/triviaqa_orthogonality_vs_N.png"}, {"analysis": "Continuation of layerwise analysis, possibly showing subspace geometry or principal-angle analyses between the two directions across layers. The persistence of orthogonality across layers is important because it rules out the hypothesis that the two signals are the same direction at some 'correct' layer choice. This strengthens the geometric interpretation that verbalization uses a distinct channel from internal truthfulness estimation.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_730cd2095785458fae1b4b23348a00cb_proc_1369372/triviaqa_probe_acc_vs_N.png"}, {"analysis": "Further layerwise plot, likely showing generalization or robustness checks such as probing with different random seeds, held-out splits, or alternative datasets. Consistent orthogonality across such controls would strengthen the finding. Additionally, the shape of curves suggests the orthogonality is not layer-specific but a general property of how the model separates 'what I know' from 'what I say I know'.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_730cd2095785458fae1b4b23348a00cb_proc_1369372/triviaqa_probe_auc_vs_N.png"}, {"analysis": "Final layerwise plot in the series, possibly summarizing the key contrast: a well-calibrated internal accuracy signal (high probe AUC, near-diagonal calibration) versus the verbalized confidence signal (high internal representability but poor alignment with true accuracy). Together with earlier plots, this constitutes a coherent story: (1) accuracy is linearly encoded, (2) verbalized confidence is linearly encoded, (3) the two occupy orthogonal subspaces. This directly validates the paper's hypothesis and suggests a concrete intervention: project onto the accuracy direction to recover calibrated confidence at inference time.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_730cd2095785458fae1b4b23348a00cb_proc_1369372/orthogonality_vs_N_triviaqa.png"}], []], "vlm_feedback_summary": ["The plots show a series of training and evaluation curves consistent with\nbaseline hyperparameter tuning for linear probes of gold calibration accuracy\nand verbalized confidence in Llama-3.1-8B-Instruct on TriviaQA. Multiple plots\ndisplay training dynamics across epochs, layer-wise probe accuracy comparisons,\nand hyperparameter sweep results. The plots suggest that both signals (well-\ncalibrated accuracy and verbalized confidence) can be linearly decoded from\nhidden states at reasonable accuracy levels, with middle-to-late layers being\nmost informative. However, several plots have limited axis annotation clarity\nand it is difficult to definitively assess whether the two probe directions are\ntruly orthogonal from these plots alone \u2014 that key comparison should be made\nmore explicit. For the first_attempt sub-stage, the training curves show\nreasonable convergence, suggesting the current hyperparameters produce stable\nprobes, but further tuning (learning rate, batch size, epochs) could improve\nfinal probe accuracy. Recommendations: (1) add explicit cosine similarity /\northogonality plots between the two probe directions, (2) include calibration\nreliability diagrams comparing verbalized vs. probe-derived confidence, (3)\nclarify axis labels and legends in all plots, (4) report probe accuracy\nalongside baseline (random/majority) for context.\"", "[]", "The plots collectively provide strong support for all three hypotheses in the\npaper. Plot 1 establishes the baseline miscalibration on TriviaQA with\nLlama-3.1-8B-Instruct (mean verbalized confidence ~89% vs mean accuracy ~64%),\nmotivating the study. Plots 2 and 3 show layerwise linear probing results:\naccuracy is linearly decodable with probe AUC plateauing around 0.78-0.80 in\nmid-to-late layers, and verbalized confidence is also linearly accessible with\nR^2 ~0.55 and Pearson ~0.75. The critical Plot 4 (and subsequent layerwise\nplots) demonstrates that the cosine similarity between the accuracy and\nverbalized-confidence directions is near zero across all layers, indicating the\ntwo are nearly orthogonal. This directly confirms the central hypothesis: the\nmodel encodes well-calibrated accuracy information and verbalized confidence in\nseparate linear subspaces, supporting the 'readout failure' interpretation and\nsuggesting a geometric fix (projecting onto the accuracy direction) could\nrecover better-calibrated confidence without retraining. Suggestions for\nstrengthening: add cross-probing (accuracy probe applied to confidence labels\nand vice versa) to more directly test orthogonality, include ECE or calibration\ncurves comparing internal-accuracy-based confidence to verbalized confidence,\nand verify on the additional verify-stage models (Llama-3.1-8B base,\nQwen2.5-7B/Instruct, Mistral variants) and datasets (MATH, MMLU, TruthfulQA) to\nestablish generality.\"}", "[]"], "exec_time": [540.3627436161041, 57.47457408905029, 538.3258512020111, null], "exec_time_feedback": ["", "", "", ""], "datasets_successfully_tested": [["[\"trivia_qa\"]"], [], ["[\"trivia_qa\"]"], []], "plot_code": ["import matplotlib.pyplot as plt\nimport numpy as np\nimport os\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ntry:\n    experiment_data = np.load(\n        os.path.join(working_dir, \"experiment_data.npy\"), allow_pickle=True\n    ).item()\nexcept Exception as e:\n    print(f\"Error loading experiment data: {e}\")\n    experiment_data = {}\n\nd = experiment_data.get(\"N_tuning\", {}).get(\"trivia_qa\", {})\nper_N = d.get(\"per_N\", {})\nNs = sorted(per_N.keys())\nlayers = (\n    sorted({int(L) for N in Ns for L in per_N[N][\"per_layer\"].keys()}) if Ns else []\n)\n\n# Plot 1: Orthogonality vs N\ntry:\n    plt.figure(figsize=(7, 4))\n    for L in layers:\n        ys = [per_N[N][\"per_layer\"][int(L)][\"ortho\"] for N in Ns]\n        plt.plot(Ns, ys, marker=\"o\", label=f\"Layer {L}\")\n        yc = [per_N[N][\"per_layer\"][int(L)].get(\"rand_ctrl_ortho\", np.nan) for N in Ns]\n        plt.plot(Ns, yc, marker=\"x\", linestyle=\"--\", alpha=0.5, label=f\"Rand ctrl L{L}\")\n    plt.xlabel(\"N (TriviaQA samples)\")\n    plt.ylabel(\"1 - |cos(w_corr, w_conf)|\")\n    plt.title(\n        \"TriviaQA: Subspace Orthogonality vs N\\n(Solid: Probe pairs, Dashed: Random control)\"\n    )\n    plt.legend(
