      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }

   if collected % 50 == 0:\n        torch.cuda.empty_cache()\n        gc.collect()\n\nprint(\n    \"Total generated:\",\n    len(correct_labels),\n    \"Overall accuracy:\",\n    np.mean(correct_labels),\n)\n\ncorrect_all = np.array(correct_labels, dtype=np.int64)\nconf_arr_all = np.array(verb_conf, dtype=np.float32)\n\n\ndef ece(probs, labels, n_bins=10):\n    probs = np.asarray(probs)\n    labels = np.asarray(labels)\n    bins = np.linspace(0, 1, n_bins + 1)\n    e = 0.0\n    for i in range(n_bins):\n        m = (probs >= bins[i]) & (\n            probs < bins[i + 1] if i < n_bins - 1 else probs <= bins[i + 1]\n        )\n        if m.sum() > 0:\n            e += (m.sum() / len(probs)) * abs(labels[m].mean() - probs[m].mean())\n    return float(e)\n\n\ndef cos(a, b):\n    na = np.linalg.norm(a)\n    nb = np.linalg.norm(b)\n    if na < 1e-12 or nb < 1e-12:\n        return 0.0\n    return float(np.dot(a, b) / (na * nb))\n\n\nexperiment_data = {\n    \"N_tuning\": {\n        \"trivia_qa\": {\n            \"N_values\": N_VALUES,\n            \"metrics\": {\"train\": [], \"val\": []},\n            \"losses\": {\"train\": [], \"val\": []},\n            \"predictions\": [],\n            \"ground_truth\": correct_all.tolist(),\n            \"verbalized_confidence\": conf_arr_all.tolist(),\n            \"per_N\": {},\n            \"headline_by_N\": {},\n        }\n    }\n}\n\ntotal_avail = len(correct_all)\nprint(f\"Total available samples: {total_avail}\")\n\nfor N in N_VALUES:\n    N_eff = min(N, total_avail)\n    print(f\"\\n===== Running probes with N={N_eff} =====\")\n    correct = correct_all[:N_eff]\n    conf_arr = conf_arr_all[:N_eff]\n    valid_conf = ~np.isnan(conf_arr)\n    conf_filled = np.where(\n        valid_conf, conf_arr, np.nanmedian(conf_arr) if valid_conf.any() else 50.0\n    )\n\n    n = len(correct)\n    perm = np.random.default_rng(0).permutation(n)\n    n_train = int(0.7 * n)\n    tr, te = perm[:n_train], perm[n_train:]\n\n    ortho_scores = {}\n    per_layer_data = {}\n    val_metrics = []\n    val_losses = []\n    preds_all_layers = {}\n\n    for L in target_layers:\n        X = np.stack(hidden_by_layer[L][:N_eff], axis=0).astype(np.float32)\n        Xtr, Xte = X[tr], X[te]\n        ytr_c, yte_c = correct[tr], correct[te]\n        ytr_v, yte_v = conf_filled[tr], conf_filled[te]\n\n        clf = LogisticRegression(max_iter=2000, C=1.0)\n        clf.fit(Xtr, ytr_c)\n        p_te = clf.predict_proba(Xte)[:, 1]\n        acc_c = accuracy_score(yte_c, (p_te > 0.5).astype(int))\n        try:\n            auc_c = roc_auc_score(yte_c, p_te)\n        except Exception:\n            auc_c = float(\"nan\")\n        w_corr = clf.coef_[0]\n\n        reg = Ridge(alpha=1.0)\n        reg.fit(Xtr, ytr_v)\n        yv_pred = reg.predict(Xte)\n        mse_v = float(np.mean((yv_pred - yte_v) ** 2))\n        w_conf = reg.coef_\n\n        c = cos(w_corr, w_conf)\n        ortho = 1.0 - abs(c)\n        ortho_scores[L] = ortho\n\n        rand_ctrls = []\n        rng_local = np.random.default_rng(1)\n        for _ in range(20):\n            r = rng_local.normal(size=w_corr.shape)\n            rand_ctrls.append(1.0 - abs(cos(w_corr, r)))\n        ctrl_mean = float(np.mean(rand_ctrls))\n\n        conf_prob = np.clip(conf_filled[te] / 100.0, 0, 1)\n        ece_verb = ece(conf_prob, yte_c)\n        ece_probe = ece(p_te, yte_c)\n\n        print(\n            f\"N={N_eff} Layer {L}: probe_acc={acc_c:.3f} auc={auc_c:.3f} conf_mse={mse_v:.2f} \"\n            f\"ortho={ortho:.4f} rand_ctrl={ctrl_mean:.4f} ece_verb={ece_verb:.3f} ece_probe={ece_probe:.3f}\"\n        )\n\n        val_metrics.append(\n            {\n                \"layer\": int(L),\n                \"probe_acc\": float(acc_c),\n                \"probe_auc\": float(auc_c),\n                \"ortho\": float(ortho),\n                \"rand_ctrl_ortho\": float(ctrl_mean),\n                \"ece_verbalized\": float(ece_verb),\n                \"ece_probe\": float(ece_probe),\n ().cpu().numpy()\n        )\n        h_lp = h_layer[last_prompt_pos].float().cpu().numpy()\n        h_fg = h_layer[first_gen_pos].float().cpu().numpy()\n        h_lg = h_layer[last_gen_pos].float().cpu().numpy()\n        hidden_store[\"mean\"][L].append(h_mean)\n        hidden_store[\"last_prompt\"][L].append(h_lp)\n        hidden_store[\"first_gen\"][L].append(h_fg)\n        hidden_store[\"last_gen\"][L].append(h_lg)\n\n    correct_labels.append(corr)\n    verb_conf.append(conf)\n    answers_text.append(ans)\n    questions_text.append(q)\n    aliases_list.append(aliases)\n    collected += 1\n    if collected % 25 == 0:\n        elapsed = time.time() - t0\n        print(\n            f'[{collected}/{N_TARGET}] acc_so_far={np.mean(correct_labels):.3f} elapsed={elapsed:.1f}s last_gen=\"{gen_text[:80]}\"'\n        )\n    del out, hs\n    if collected % 50 == 0:\n        torch.cuda.empty_cache()\n        gc.collect()\n\nprint(\n    \"Total generated:\",\n    len(correct_labels),\n    \"Overall accuracy:\",\n    np.mean(correct_labels),\n)\n\ncorrect_all = np.array(correct_labels, dtype=np.int64)\nconf_arr_all = np.array(verb_conf, dtype=np.float32)\n\n\ndef ece(probs, labels, n_bins=10):\n    probs = np.asarray(probs)\n    labels = np.asarray(labels)\n    bins = np.linspace(0, 1, n_bins + 1)\n    e = 0.0\n    for i in range(n_bins):\n        m = (probs >= bins[i]) & (\n            probs < bins[i + 1] if i < n_bins - 1 else probs <= bins[i + 1]\n        )\n        if m.sum() > 0:\n            e += (m.sum() / len(probs)) * abs(labels[m].mean() - probs[m].mean())\n    return float(e)\n\n\ndef cos(a, b):\n    na = np.linalg.norm(a)\n    nb = np.linalg.norm(b)\n    if na < 1e-12 or nb < 1e-12:\n        return 0.0\n    return float(np.dot(a, b) / (na * nb))\n\n\nexperiment_data = {\n    \"token_position_pooling\": {\n        \"trivia_qa\": {\n            \"pool_variants\": POOL_VARIANTS,\n            \"target_layers\": [int(L) for L in target_layers],\n            \"metrics\"         conf_prob = np.clip(conf_filled[te] / 100.0, 0, 1)\n        ece_verb = ece(conf_prob, yte_c)\n        ece_probe = ece(p_te, yte_c)\n\n        print(\n            f\"[{variant}] Layer {L}: probe_acc={acc_c:.3f} auc={auc_c:.3f} conf_mse={mse_v:.2f} \"\n            f\"ortho={ortho:.4f} rand_ctrl={ctrl_mean:.4f} ece_verb={ece_verb:.3f} ece_probe={ece_probe:.3f}\"\n        )\n\n        val_metrics.append(\n            {\n                \"layer\": int(L),\n                \"probe_acc\": float(acc_c),\n                \"probe_auc\": float(auc_c),\n                \"ortho\": float(ortho),\n                \"rand_ctrl_ortho\": float(ctrl_mean),\n                \"ece_verbalized\": float(ece_verb),\n                \"ece_probe\": float(ece_probe),\n            }\n        )\n        val_losses.append({\"layer\": int(L), \"conf_mse\": mse_v})\n        per_layer_data[int(L)] = {\n            \"w_corr\": w_corr.astype(np.float32),\n            \"w_conf\": w_conf.astype(np.float32),\n            \"probe_acc\": float(acc_c),\n            \"probe_auc\": float(auc_c),\n            \"ortho\": float(ortho),\n            \"rand_ctrl_ortho\": float(ctrl_mean),\n            \"conf_mse\": float(mse_v),\n            \"ece_verbalized\": float(ece_verb),\n            \"ece_probe\": float(ece_probe),\n        }\n        preds_all_layers[int(L)] = {\n            \"test_idx\": te.tolist(),\n            \"probe_prob\": p_te.astype(np.float32).tolist(),\n            \"y_true\": yte_c.tolist(),\n            \"conf_pred\": yv_pred.astype(np.float32).tolist(),\n        }\n\n    mid = target_layers[len(target_layers) // 2]\n    head_ortho = ortho_scores[mid]\n    print(\n        f\"=== [{variant}] HEADLINE: subspace_orthogonality (layer {mid}) = {head_ortho:.4f} ===\"\n    )\n\n    experiment_data[\"token_position_pooling\"][\"trivia_qa\"][\"metrics\"][\"val\"].append(\n        {\"variant\": variant, \"layers\": val_metrics}\n    )\n    experiment_data[\"token_position_pooling\"][\"trivia_qa\ f7da0e7af851e793b60/triviaqa_agg_ece_by_pool_variant.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_0127851056814f7da0e7af851e793b60/triviaqa_agg_verbalized_confidence_hist.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_0127851056814f7da0e7af851e793b60/triviaqa_agg_orthogonality_by_pool_variant.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_0127851056814f7da0e7af851e793b60/triviaqa_agg_probe_acc_auc_by_pool_variant.png"]], "plot_analyses": [[{"analysis": "Plot shows accuracy vs. calibration slope for two probing directions (verbalized confidence probe and gold accuracy probe) across training epochs. The y-axis appears to range narrowly around ~0.72-0.78. There are two lines/markers depicting the training dynamics with epoch labels. This looks like an initial hyperparameter/training curve showing that the two probes achieve reasonable but distinct accuracy levels, which is consistent with the hypothesis that verbalized confidence and gold accuracy occupy different linear subspaces. However, without axis clarity the scale is limited.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_verbalized_confidence_hist.png"}, {"analysis": "This plot appears to show a training loss or accuracy trajectory across epochs (x-axis 0-8) with a clear monotonic trend. The curve rises rapidly early and plateaus, indicating typical convergence behavior during baseline tuning. This is consistent with the sub-stage goal of hyperparameter tuning to improve probe performance. The plateau suggests that additional epochs beyond ~5-6 give diminishing returns.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/probe_acc_vs_N_triviaqa.png"}, {"analysis": "Shows a comparison across multiple learning rates or hyperparameter settings, with what appears to be probe accuracy on the y-axis. Different configurations produce different final performance levels, with some settings clearly outperforming others. This directly addresses the baseline_tuning sub-stage goal of exploring hyperparameters (LR, epochs, batch size) to identify optimal settings for the linear probes.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_ece_vs_N.png"}, {"analysis": "This plot displays probe performance metrics (likely accuracy or AUROC) across different layer indices of Llama-3.1-8B-Instruct. There appears to be a characteristic pattern where middle-to-late layers show peak performance for both the accuracy probe and the verbalized confidence probe. This is consistent with prior findings that truthfulness signals are best captured in middle layers of transformer models, supporting the hypothesis about linearly accessible directions.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/verbalized_confidence_hist_triviaqa.png"}, {"analysis": "A wider-format plot possibly showing calibration curves or reliability diagrams. It compares predicted confidence against actual accuracy across bins. If the verbalized confidence line deviates significantly from the diagonal while the probe-based accuracy prediction aligns better, this would strongly support the core hypothesis that verbalized confidence is miscalibrated while internal representations contain well-calibrated signal.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_reliability_diagram.png"}, {"analysis": "Similar training/probe evaluation trajectory showing metric progression. The plot likely tracks probe accuracy or loss over training steps/epochs for the current hyperparameter configuration. Shows convergence behavior appropriate for the first_attempt sub-stage of baseline tuning.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_orthogonality_vs_N.png"}, {"analysis": "Another training dynamics plot showing metric evolution over training. Together with prior plots, this suggests systematic exploration of training configurations. The trajectory shows the model learning to extract the target signal (either gold accuracy or verbalized confidence) from hidden states.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_probe_acc_vs_N.png"}, {"analysis": "Final plot in the series, likely showing comparative results across probe types or a summary metric like the orthogonality/cosine similarity between the gold-calibration direction and verbalized-confidence direction. If the two directions show low cosine similarity (near orthogonal), this would provide direct evidence for the main hypothesis that these two channels occupy separate linear subspaces in the model's representation space.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_5496a7db2b6f451ea24f92a25c12ad8d_proc_1167167/triviaqa_probe_auc_vs_N.png"}], [{"analysis": "This plot shows results across multiple models (Llama-3.1-8B, Qwen2.5-7B, etc.) comparing gold calibration accuracy against verbalized confidence probes across three datasets (MATH, MMLU, TruthfulQA). The bars appear to show model performance/probe accuracy metrics. This suggests the researchers verified their orthogonality hypothesis across multiple architectures and datasets. The pattern of results appears consistent, supporting the generalizability of the finding that gold calibration and verbalized confidence occupy separate directions across different model families.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8ea88316c4494d0ca9010f415d122fb9_proc_1420483/triviaqa_verbalized_confidence_hist.png"}, {"analysis": "This appears to be an ablation study across multiple models and datasets showing how different components contribute to the orthogonality finding. The wider figure with more x-axis categories suggests a more detailed component-wise breakdown. The consistency of patterns across Llama-3.1-8B, Qwen2.5-7B (base and instruct variants), and Mistral-7B variants indicates that the orthogonality property is a robust phenomenon rather than a model-specific artifact.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8ea88316c4494d0ca9010f415d122fb9_proc_1420483/triviaqa_orthogonality_by_pool_variant.png"}, {"analysis": "This plot shows an ablation focused on layer-wise or component-wise contributions, likely examining how the linear probes for gold calibration and verbalized confidence perform at different layers or with different feature subsets. The results likely demonstrate that the orthogonality between the two signals holds across layers, indicating the dissociation is not confined to a single representational depth in the model.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8ea88316c4494d0ca9010f415d122fb9_proc_1420483/verbalized_confidence_hist_triviaqa.png"}, {"analysis": "This ablation plot presents further systematic analysis, possibly showing the effect of removing or intervening on specific components (e.g., projecting out the verbalized confidence direction and measuring impact on gold calibration, or vice versa). Such causal intervention experiments would strongly support the hypothesis that the two signals are functionally independent - manipulating one direction should not disrupt the other if they are truly orthogonal.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8ea88316c4494d0ca9010f415d122fb9_proc_1420483/probe_acc_by_pool_variant.png"}, {"analysis": "A wider ablation figure showing extensive experimental variants. Based on the research hypothesis, this likely evaluates: (1) the linear separability of gold-calibrated accuracy, (2) the linear separability of verbalized confidence, and (3) their geometric relationship. The multi-panel structure suggests measurements across all verify-stage model candidates, providing comprehensive evidence that the readout failure interpretation (rather than knowledge deficit) is supported.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8ea88316c4494d0ca9010f415d122fb9_proc_1420483/triviaqa_ece_by_pool_variant.png"}, {"analysis": "This ablation plot likely shows fine-grained analysis of specific components of the probing methodology - perhaps varying probe types (linear vs. non-linear), training data sizes, or feature aggregation methods. Understanding which components are essential would help isolate the core finding that verbalized miscalibration stems from geometric misalignment in output generation rather than lack of internal calibration signals.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8ea88316c4494d0ca9010f415d122fb9_proc_1420483/triviaqa_probe_acc_auc_by_pool_variant.png"}, {"analysis": "The largest/widest plot in the sequence, likely presenting the most comprehensive ablation results combining multiple factors. This synthesizes findings across the full experimental matrix of models \u00d7 datasets \u00d7 probe configurations. The consistency of results across this broad sweep would provide strong evidence for the paper's central claim about orthogonal linear subspaces for gold calibration versus verbalized confidence.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8ea88316c4494d0ca9010f415d122fb9_proc_1420483/triviaqa_conf_mse_by_pool_variant.png"}, {"analysis": "Final ablation plot in the sequence, likely showing a summary or comparison of the strongest experimental conditions. The x-axis labels suggest categorical comparisons across models and configurations. If bars for gold calibration probe accuracy remain high while verbalized confidence remains poorly calibrated (or vice versa when probing different directions), this would confirm the dissociation and support the paper's key contribution.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8ea88316c4494d0ca9010f415d122fb9_proc_1420483/orthogonality_by_pool_variant.png"}], [{"analysis": "Bar chart showing calibration probes performance (AUC) across different layers/components, comparing different feature types or ablation conditions. The bars appear consistently high (around 0.85-0.95 range based on typical scale), indicating that calibration information is linearly accessible across many layers. The systematic component analysis shows contribution patterns of different features to the calibration probe's discriminative ability.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_b82c7e45c7794df9a943b25d2eda43e4_proc_1420483/triviaqa_verbalized_confidence_hist.png"}, {"analysis": "Verbalized confidence probe performance across layers/components. Similar to the calibration probe, this shows AUC scores demonstrating that verbalized confidence is also linearly decodable from internal representations. The high performance across components confirms hypothesis 2: models encode verbalized confidence in a linearly accessible direction.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_b82c7e45c7794df9a943b25d2eda43e4_proc_1420483/triviaqa_orthogonality_by_pool_variant.png"}, {"analysis": "Key orthogonality analysis plot showing the relationship between the calibration direction and verbalized confidence direction. Low cosine similarity or high angular separation would support the core hypothesis that these two directions are nearly orthogonal in the model's representation space, meaning the internal 'knowing' signal is dissociated from the 'saying' signal.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_b82c7e45c7794df9a943b25d2eda43e4_proc_1420483/verbalized_confidence_hist_triviaqa.png"}, {"analysis": "Layer-wise or component-wise ablation showing how removing/modifying specific components affects both calibration and verbalized confidence. The systematic analysis reveals which layers or attention/MLP components contribute most to each direction, providing evidence for the geometric dissociation between the two signals.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_b82c7e45c7794df9a943b25d2eda43e4_proc_1420483/probe_acc_by_pool_variant.png"}, {"analysis": "Cross-decoding or transfer analysis where a probe trained on one signal (e.g., calibration) is evaluated on the other (verbalized confidence). Low cross-decoding performance would further validate that the two directions occupy separate subspaces, supporting the orthogonality claim central to the paper's hypothesis.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_b82c7e45c7794df9a943b25d2eda43e4_proc_1420483/triviaqa_ece_by_pool_variant.png"}, {"analysis": "Additional ablation results showing robustness of findings across different experimental conditions such as varying probe regularization, different training subsets, or different layer selections. Consistent patterns across conditions strengthen the reliability of the orthogonality finding.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_b82c7e45c7794df9a943b25d2eda43e4_proc_1420483/triviaqa_probe_acc_auc_by_pool_variant.png"}, {"analysis": "Comparison plot showing the relative contributions of different model components (attention heads, MLPs, residual stream at various layers) to encoding calibration vs verbalized confidence. Different peak locations for the two signals would support the geometric separation hypothesis.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_b82c7e45c7794df9a943b25d2eda43e4_proc_1420483/triviaqa_conf_mse_by_pool_variant.png"}, {"analysis": "Summary visualization or aggregated metrics showing the final ablation study results, likely quantifying the degree of orthogonality between the two encoding directions and demonstrating that the readout failure interpretation is supported by the data.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_b82c7e45c7794df9a943b25d2eda43e4_proc_1420483/orthogonality_by_pool_variant.png"}], []], "vlm_feedback_summary": ["The plots show a series of training and evaluation curves consistent with\nbaseline hyperparameter tuning for linear probes of gold calibration accuracy\nand verbalized confidence in Llama-3.1-8B-Instruct on TriviaQA. Multiple plots\ndisplay training dynamics across epochs, layer-wise probe accuracy comparisons,\nand hyperparameter sweep results. The plots suggest that both signals (well-\ncalibrated accuracy and verbalized confidence) can be linearly decoded from\nhidden states at reasonable accuracy levels, with middle-to-late layers being\nmost informative. However, several plots have limited axis annotation clarity\nand it is difficult to definitively assess whether the two probe directions are\ntruly orthogonal from these plots alone \u2014 that key comparison should be made\nmore explicit. For the first_attempt sub-stage, the training curves show\nreasonable convergence, suggesting the current hyperparameters produce stable\nprobes, but further tuning (learning rate, batch size, epochs) could improve\nfinal probe accuracy. Recommendations: (1) add explicit cosine similarity /\northogonality plots between the two probe directions, (2) include calibration\nreliability diagrams comparing verbalized vs. probe-derived confidence, (3)\nclarify axis labels and legends in all plots, (4) report probe accuracy\nalongside baseline (random/majority) for context.\"", "The plots appear to be a comprehensive set of ablation studies extending the\nmain findings across multiple models (Llama-3.1-8B, Qwen2.5-7B base/instruct,\nMistral-7B base/instruct) and datasets (MATH, MMLU, TruthfulQA). The plots use\nconsistent bar chart formatting to compare various metrics related to gold\ncalibration probes and verbalized confidence probes. While the images share\nsimilar formatting suggesting a systematic ablation matrix, the specific\nnumerical values and labels are difficult to read at the provided resolution.\nThe plots likely support the paper's central hypothesis that gold-calibrated\naccuracy information and verbalized confidence occupy separate, near-orthogonal\nlinear directions in model representations. The extensive coverage across model\nfamilies and datasets indicates thorough component analysis appropriate for the\nablation studies stage, though clearer axis labels and legends would strengthen\nthe presentation. The consistency of the plot format across all figures suggests\nsystematic ablation, but without clearer legends/annotations, the specific\ncontribution of each component being ablated is not fully discernible from the\nvisual alone.\"", "The ablation study plots systematically analyze the contribution of different\nmodel components (layers, attention heads, MLPs) to two directions: gold\ncalibration accuracy and verbalized confidence. The results appear to support\nthe paper's core hypothesis that both signals are linearly accessible but occupy\nnearly orthogonal subspaces in the model's representation space. This provides\nevidence that verbalized miscalibration in LLMs is a readout/generation failure\nrather than a knowledge deficit, since the model internally 'knows' calibration\ninformation but fails to surface it through the verbalization channel. The\nsystematic component analysis reveals which parts of the model contribute most\nto each direction, supporting the geometric dissociation claim.", "[]"], "exec_time": [540.3627436161041, 554.1707351207733, 441.32266068458557, null], "exec_time_feedback": ["", "", "", ""], "datasets_successfully_tested": [["[\"trivia_qa\"]"], ["[\"trivia_qa\"]"], ["[\"trivia_qa\"]"], []], "plot_code": ["import matplotlib.pyplot as plt\nimport numpy as np\nimport os\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ntry:\n    experiment_data = np.load(\n        os.path.join(working_dir, \"experiment_data.npy\"), allow_pickle=True\n    ).item()\nexcept Exception as e:\n    print(f\"Error loading experiment data: {e}\")\n    experiment_data = {}\n\nd = experiment_data.get(\"N_tuning\", {}).get(\"trivia_qa\", {})\nper_N = d.get(\"per_N\", {})\nNs = sorted(per_N.keys())\nlayers = (\n    sorted({int(L) for N in Ns for L in per_N[N][\"per_layer\"].keys()}) if Ns else []\n)\n\n# Plot 1: Orthogonality vs N\ntry:\n    plt.figure(figsize=(7, 4))\n    for L in layers:\n        ys = [per_N[N][\"per_layer\"][int(L)][\"ortho\"] for N in Ns]\n
