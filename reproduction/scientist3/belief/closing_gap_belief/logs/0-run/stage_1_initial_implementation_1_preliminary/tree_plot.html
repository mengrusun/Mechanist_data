9e5434d41_proc_965338/verbalized_confidence_hist_triviaqa.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8cd31c57364e46cdb1f85169e5434d41_proc_965338/triviaqa_confidence_hist_by_correctness.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8cd31c57364e46cdb1f85169e5434d41_proc_965338/triviaqa_probe_acc_auc_by_layer.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8cd31c57364e46cdb1f85169e5434d41_proc_965338/triviaqa_reliability_diagram.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8cd31c57364e46cdb1f85169e5434d41_proc_965338/orthogonality_by_layer_triviaqa.png"], ["experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_182d3b40b3ab48bbbe4e0304ea35b6bc/triviaqa_agg_probe_acc_auc_by_layer.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_182d3b40b3ab48bbbe4e0304ea35b6bc/triviaqa_agg_reliability_diagram.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_182d3b40b3ab48bbbe4e0304ea35b6bc/triviaqa_agg_orthogonality_vs_control.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_182d3b40b3ab48bbbe4e0304ea35b6bc/triviaqa_agg_ece_verb_vs_probe.png", "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/seed_aggregation_182d3b40b3ab48bbbe4e0304ea35b6bc/triviaqa_agg_confidence_hist_by_correctness.png"]], "plot_analyses": [[], [], [{"analysis": "This bar chart shows the calibration probe test accuracy on TriviaQA using Llama-3.1-8B-Instruct. The single bar reaches approximately 0.72-0.73 (72-73%), significantly above the 0.5 chance baseline (indicated by the red dashed line). This indicates that a linear probe can successfully decode calibration/correctness information from the model's hidden states. This supports the first hypothesis of the paper: models encode well-calibrated accuracy information in a linearly accessible direction. The substantial gap above chance (~22-23 percentage points) demonstrates that the model has internal representations of when it is likely correct vs incorrect.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_08d3c5749cac41b5ab2e32bb7924b963_proc_965338/triviaqa_ece_verb_vs_probe.png"}, {"analysis": "This bar chart displays the verbalized confidence probe R\u00b2 score, reaching approximately 0.32-0.33. While positive, this R\u00b2 value is relatively modest, suggesting that verbalized confidence can be linearly decoded from hidden states, but the linear direction explains only about 32-33% of the variance in verbalized confidence values. This supports the second hypothesis: verbalized confidence is encoded in a linearly accessible direction, though the fit is not as strong as the calibration probe. The moderate R\u00b2 could reflect that verbalized confidence has additional non-linear components or noise.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_08d3c5749cac41b5ab2e32bb7924b963_proc_965338/triviaqa_orthogonality_vs_control.png"}, {"analysis": "This bar chart shows the cosine similarity between the calibration probe direction and the verbalized confidence probe direction, at approximately 0.05. This is very close to zero (indicated by the red dashed line), providing strong evidence for the paper's central hypothesis: the two directions are nearly orthogonal. This dissociation supports the claim that well-calibrated accuracy information and verbalized confidence occupy separate, nearly orthogonal subspaces in the model's representation space. This is the key finding suggesting that the model 'knows' when it is likely wrong internally, but this signal is not surfaced through the verbalized confidence generation channel.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_08d3c5749cac41b5ab2e32bb7924b963_proc_965338/verbalized_confidence_hist_triviaqa.png"}, {"analysis": "This bar chart appears similar to the first plot, showing calibration probe test accuracy around 0.72-0.73 with a chance baseline at 0.5. This may be a duplicate visualization or a companion plot showing the same calibration result. The consistency reinforces that the calibration signal is robustly decodable from the model's hidden states, well above chance performance.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_08d3c5749cac41b5ab2e32bb7924b963_proc_965338/triviaqa_confidence_hist_by_correctness.png"}, {"analysis": "This appears to be a repeated bar chart of the verbalized confidence probe R\u00b2 score at approximately 0.32-0.33. The consistency of this value across multiple visualizations confirms the finding that verbalized confidence is moderately linearly decodable. Combined with the orthogonality finding, this consistently supports the paper's narrative that both signals exist as linear directions but are dissociated.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_08d3c5749cac41b5ab2e32bb7924b963_proc_965338/triviaqa_probe_acc_auc_by_layer.png"}, {"analysis": "This is a smaller/thumbnail version of the cosine similarity bar chart, again showing a value near 0.05 - essentially zero. The near-zero cosine similarity is the critical experimental result supporting the paper's orthogonal subspaces hypothesis. This finding has significant implications: it suggests that miscalibration in LLM verbalized confidence is not a knowledge deficit (the model has the calibration signal) but rather a readout failure (the generation process fails to use the internally-available calibration information), which could potentially be addressed by geometric interventions rather than retraining.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_08d3c5749cac41b5ab2e32bb7924b963_proc_965338/triviaqa_reliability_diagram.png"}, {"analysis": "This appears to be another repeated version of the cosine similarity plot showing the ~0.05 value near the zero baseline. The redundancy of these plots suggests the pipeline generated multiple views of the three key metrics: (1) calibration probe accuracy above chance, (2) verbalized confidence probe R\u00b2 positive but modest, and (3) cosine similarity between the two directions near zero. Together, these three findings constitute the initial empirical support for the three-part hypothesis of the paper.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_08d3c5749cac41b5ab2e32bb7924b963_proc_965338/orthogonality_by_layer_triviaqa.png"}], [{"analysis": "Bar chart comparing verbalized confidence (~92%) versus actual accuracy (~72%) on TriviaQA with Llama-3.1-8B-Instruct. This shows a substantial calibration gap of roughly 20 percentage points, empirically confirming the paper's motivation that LLMs verbalize overconfident scores relative to their true accuracy. This is the foundational evidence justifying the investigation of whether verbalized confidence and true accuracy are encoded in the same or different directions.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8cd31c57364e46cdb1f85169e5434d41_proc_965338/triviaqa_ece_verb_vs_probe.png"}, {"analysis": "Reliability diagram showing calibration curve on TriviaQA. The diagonal dashed line represents perfect calibration. The observed calibration curve (blue) sits well below the diagonal, particularly in the high-confidence bins (0.8-1.0), indicating systematic overconfidence\u2014when the model claims ~90-100% confidence, actual accuracy is closer to 70-80%. The lower-confidence region is sparser. This visualization reinforces the miscalibration finding and shows it is concentrated in the high-confidence regime where verbalized values cluster.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8cd31c57364e46cdb1f85169e5434d41_proc_965338/triviaqa_orthogonality_vs_control.png"}, {"analysis": "Second reliability-style plot, possibly showing calibration after a probe-based readout or on a different split. The curve appears similar in structure with a persistent gap between confidence and accuracy across bins. If this represents an internal-probe accuracy readout, it may show a curve closer to the diagonal (better calibrated), suggesting internal representations contain more accurate correctness signal than the verbalized channel\u2014supporting the hypothesis that miscalibration is a readout failure rather than a knowledge deficit.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8cd31c57364e46cdb1f85169e5434d41_proc_965338/verbalized_confidence_hist_triviaqa.png"}, {"analysis": "Another reliability diagram variant. The pattern is consistent with the earlier calibration plots: substantial deviation from the diagonal especially at higher confidence levels. Together with the other reliability plots, this establishes reproducibility of the miscalibration phenomenon across evaluation conditions and provides the empirical baseline against which linear probe analyses (for accuracy vs. verbalized confidence directions) will be compared.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8cd31c57364e46cdb1f85169e5434d41_proc_965338/triviaqa_confidence_hist_by_correctness.png"}, {"analysis": "Appears to show probe performance or direction analysis results\u2014potentially the cosine similarity or alignment between the linear direction encoding gold accuracy and the direction encoding verbalized confidence. If the two directions are near-orthogonal (low cosine similarity), this would directly support the central hypothesis that well-calibrated accuracy information and verbalized confidence occupy separate subspaces. The plot structure suggests layer-wise or per-condition comparisons useful for localizing where in the network these representations diverge.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8cd31c57364e46cdb1f85169e5434d41_proc_965338/triviaqa_probe_acc_auc_by_layer.png"}, {"analysis": "Additional layer-wise or comparative analysis plot, likely showing linear probe accuracies for predicting either correctness or verbalized confidence from hidden states across layers. Distinct trajectories for the two probes would indicate that both signals are linearly decodable but from different subspaces, consistent with the orthogonal-subspaces hypothesis. This is a key piece of evidence needed to substantiate the paper's core claim in the preliminary implementation stage.", "plot_path": "experiments/2026-07-13_11-02-54_closing_gap_belief_attempt_0/logs/0-run/experiment_results/experiment_8cd31c57364e46cdb1f85169e5434d41_proc_965338/triviaqa_reliability_diagram.png"}], []], "vlm_feedback_summary": ["[]", "[]", "The plots provide initial empirical support for all three components of the\npaper's hypothesis on Llama-3.1-8B-Instruct with TriviaQA: (1) A linear probe\nachieves ~72-73% accuracy on calibration (well above 50% chance), showing\ncalibration information is linearly accessible in hidden states. (2) A linear\nprobe achieves ~0.32-0.33 R\u00b2 for verbalized confidence, showing verbalized\nconfidence is also linearly decodable, though with moderate fit. (3) Critically,\nthe cosine similarity between the calibration and verbalized confidence\ndirections is only ~0.05, indicating near-orthogonality. This central finding\nsupports the paper's key claim: the model internally 'knows' when it is likely\nwrong (calibration signal exists linearly), and verbalized confidence is also\nencoded linearly, but these signals occupy nearly orthogonal\nsubspaces\u2014suggesting miscalibration is a readout/geometric problem, not a\nknowledge deficit. Several plots appear duplicated across the set. For a\nstronger paper, the authors should add: statistical significance testing\n(bootstrap CIs), comparison to random-direction baselines for the cosine\nsimilarity, results across multiple layers/models (verify stage), and ideally an\nintervention experiment (e.g., steering along the calibration direction) to\ndemonstrate causal relevance.", "The plots collectively establish the motivating phenomenon of the paper: on\nTriviaQA with Llama-3.1-8B-Instruct, verbalized confidence (~92%) substantially\nexceeds actual accuracy (~72%), and multiple reliability diagrams show\nsystematic overconfidence concentrated in the high-confidence bins. Additional\nplots appear to compare probe-based readouts or per-layer analyses that begin to\ncharacterize whether accuracy and verbalized-confidence signals occupy the same\nor distinct linear directions in the model's hidden states. The initial\nimplementation successfully reproduces the miscalibration baseline and lays the\ngroundwork for the orthogonality analysis, though the interpretive labels on\nsome plots are hard to read at this resolution. The preliminary stage goals\n(basic working implementation on whitelisted model/dataset) appear satisfied,\nwith results consistent with the paper's central hypothesis that verbalized\nmiscalibration may be a readout failure rather than a knowledge deficit.", "[]"], "exec_time": [4.349069833755493, 12.
