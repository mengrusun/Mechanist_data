      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }
};

 in [\"tiktoken\", \"blobfile\", \"sentencepiece\"]:\n    try:\n        __import__(pkg)\n        print(f\"{pkg} already available\")\n    except ImportError:\n        print(f\"Installing {pkg}...\")\n        _pip_install([pkg])\n        try:\n            __import__(pkg)\n            print(f\"{pkg} installed successfully\")\n        except ImportError as e:\n            print(f\"WARNING: {pkg} still not available: {e}\")\n\nimport numpy as np\nimport torch\nimport torch.nn.functional as F\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nDATA_DIR = \"/data/zhenqian/data\"\nMODEL_DIR = \"/data/zhenqian/models\"\n\n\ndef list_files(root, max_files=5000):\n    out = []\n    if not os.path.isdir(root):\n        return out\n    for dp, dn, fn in os.walk(root):\n        for f in fn:\n            out.append(os.path.join(dp, f))\n            if len(out) >= max_files:\n                return out\n    return out\n\n\ndef try_load_csv(p, cols):\n    import pandas as pd\n\n    try:\n        df = pd.read_csv(p)\n    except Exception as e:\n        print(f\"  csv read fail {p}: {e}\")\n        return None\n    print(f\"  csv {p} columns={list(df.columns)} n={len(df)}\")\n    for col in cols:\n        for c in df.columns:\n            if c.lower() == col.lower():\n                prompts = df[c].dropna().astype(str).tolist()\n                if len(prompts) >= 20:\n                    return prompts\n    return None\n\n\ndef try_load_json(p, cols):\n    try:\n        data = json.load(open(p))\n    except Exception as e:\n        return None\n    if isinstance(data, dict):\n        for k in [\"data\", \"prompts\", \"instructions\"]:\n            if k in data and isinstance(data[k], list):\n                data = data[k]\n                break\n    if isinstance(data, list) and data:\n        if isinstance(data[0], str):\n            return data\n        if isinstance(data[0], dict):\n            for col in cols:\n                if any(col in d for d in data[:5]):\n                    prompts = [d[col] for d in data if col in d]\n                    if len(prompts) >= 20:\n                        return prompts\n    return None\n\n\ndef try_load_jsonl(p, cols):\n    prompts = []\n    try:\n        for line in open(p):\n            try:\n                d = json.loads(line)\n                if isinstance(d, dict):\n                    for col in cols:\n                        if col in d:\n                            prompts.append(d[col])\n                            break\n                elif isinstance(d, str):\n                    prompts.append(d)\n            except:\n                pass\n    except Exception as e:\n        return None\n    return prompts if len(prompts) >= 20 else None\n\n\ndef try_load_parquet(p, cols):\n    import pandas as pd\n\n    try:\n        df = pd.read_parquet(p)\n    except Exception as e:\n        return None\n    print(f\"  parquet {p} columns={list(df.columns)} n={len(df)}\")\n    for col in cols:\n        for c in df.columns:\n            if c.lower() == col.lower():\n                prompts = df[c].dropna().astype(str).tolist()\n                if len(prompts) >= 20:\n                    return prompts\n    return None\n\n\ndef find_advbench_prompts():\n    root = os.path.join(DATA_DIR, \"AdvBench\")\n    print(f\"AdvBench root: {root}\")\n    if not os.path.isdir(root):\n        raise RuntimeError(\"AdvBench dir missing\")\n    files = list_files(root)\n    cols = [\"goal\", \"prompt\", \"behavior\", \"instruction\", \"text\", \"question\"]\n    files_sorted = sorted(\n        files, key=lambda x: (0 if \"harmful_behaviors\" in x.lower() else 1, x)\n    )\n    for p in files_sorted:\n        low = p.lower()\n        try:\n            if low.endswith(\".csv\"):\n                r = try_load_csv(p, cols)\n                if r:\n                    return r\n            elif low.endswith(\".json\"):\n                r = try_load_json(p, cols)\n                if r:\n                    return r\n            elif low.endswith(\".jsonl\"):\n                r = try_load_jsonl(p, cols)\n                if r:\n                    return r\n            elif low.endswith(\".parquet\"):\n                r = try_load_parquet(p, cols)\n                if r:\n                    return r\n        except Exception as e:\n            print(f\"  skip {p}: {e}\")\n    raise RuntimeError(\"AdvBench not found\")\n\n\ndef find_alpaca_prompts():\n    root = os.path.join(DATA_DIR, \"Alpaca\")\n    print(f\"Alpaca root: {root}\")\n    if not os.path.isdir(root):\n        raise RuntimeError(\"Alpaca dir missing\")\n    files = list_files(root)\n    import pandas as pd\n\n    for p in sorted(files):\n        low = p.lower()\n        try:\n            if low.endswith(\".parquet\"):\n                df = pd.read_parquet(p)\n                print(f\"  parquet {p} cols={list(df.columns)} n={len(df)}\")\n                if \"instruction\" in df.columns:\n                    inp_col = (\n                        df[\"input\"].astype(str)\n                        if \"input\" in df.columns\n                        else [\"\"] * len(df)\n                    )\n                    prompts = [\n                        str(a) + ((\"\\n\" + str(b)) if b else \"\")\n                        for a, b in zip(df[\"instruction\"], inp_col)\n                    ]\n                    if len(prompts) >= 20:\n                        return prompts\n            elif low.endswith(\".json\"):\n                data = json.load(open(p))\n                if isinstance(data, list):\n                    prompts = []\n                    for d in data:\n                        if isinstance(d, dict):\n                            instr = d.get(\"instruction\") or d.get(\"prompt\")\n                            inp = d.get(\"input\", \"\") or \"\"\n                            if instr:\n                                prompts.append(\n                                    str(instr) + ((\"\\n\" + str(inp)) if inp else \"\")\n                                )\n                    if len(prompts) >= 20:\n                        return prompts\n        except Exception as e:\n            print(f\"  skip {p}: {e}\")\n    raise RuntimeError(\"Alpaca not found\")\n\n\nharmful_prompts = find_advbench_prompts()\nbenign_prompts = find_alpaca_prompts()\n\nrandom.seed(0)\nrandom.shuffle(harmful_prompts)\nrandom.shuffle(benign_prompts)\n\nN_PER_CLASS = 200\nharmful_prompts = harmful_prompts[:N_PER_CLASS]\nbenign_prompts = benign_prompts[:N_PER_CLASS]\nprint(f\"Using {len(harmful_prompts)} harmful and {len(benign_prompts)} benign prompts\")\n\n\n# Locate model path - check for nested directory structure\ndef find_model_path():\n    candidates = []\n    base = os.path.join(MODEL_DIR, \"Meta-Llama-3-8B-Instruct\")\n    if os.path.isdir(base):\n        candidates.append(base)\n        # Check nested\n        nested = os.path.join(base, \"Meta-Llama-3-8B-Instruct\")\n        if os.path.isdir(nested):\n            candidates.append(nested)\n    # Scan for other llama-3 8b instruct dirs\n    if os.path.isdir(MODEL_DIR):\n        for name in os.listdir(MODEL_DIR):\n            full = os.path.join(MODEL_DIR, name)\n            if (\n                os.path.isdir(full)\n                and \"llama-3\" in name.lower()\n                and \"8b\" in name.lower()\n                and \"instruct\" in name.lower()\n            ):\n                if full not in candidates:\n                    candidates.append(full)\n    # Pick the one with tokenizer files\n    for c in candidates:\n        files = os.listdir(c) if os.path.isdir(c) else []\n        has_tok = any(\n            f in files\n            for f in [\"tokenizer.json\", \"tokenizer.model\", \"tokenizer_config.json\"]\n        )\n        has_model = any(f.endswith(\".safetensors\") or f.endswith(\".bin\") for f in files)\n        print(\n            f\"  candidate {c}: files={files[:10]} has_tok={has_tok} has_model={has_model}\"\n        )\n        if has_tok and has_model:\n            return c\n    # Return first candidate anyway\n    return candidates[0] if candidates else base\n\n\nMODEL_PATH = find_model_path()\nprint(f\"Model path: {MODEL_PATH}\")\nprint(f\"Files in model dir: {os.listdir(MODEL_PATH)}\")\n\nfrom transformers import AutoTokenizer, AutoModelForCausalLM\n\n\ndef load_tokenizer(path):\n    errors = []\n    strategies = [\n        (\"fast_local\", dict(local_files_only=True, use_fast=True)),\n        (\"slow_local\", dict(local_files_only=True, use_fast=False)),\n        (\n            \"fast_trust\",\n            dict(local_files_only=True, use_fast=True, trust_remote_code=True),\n        ),\n    ]\n    for name, kw in strategies:\n        try:\n            tok = AutoTokenizer.from_pretrained(path, **kw)\n            print(f\"Loaded tokenizer via {name}\")\n            return tok\n        except Exception as e:\n            errors.append(f\"{name}: {e}\")\n            print(f\"  tokenizer attempt {name} failed: {e}\")\n\n    # Try loading directly from tokenizer.json using PreTrainedTokenizerFast\n    try:\n        from transformers import PreTrainedTokenizerFast\n\n        tj = os.path.join(path, \"tokenizer.json\")\n        if os.path.isfile(tj):\n            tok = PreTrainedTokenizerFast(tokenizer_file=tj)\n            # Set special tokens for Llama-3\n            special = {\n                \"bos_token\": \"<|begin_of_text|>\",\n                \"eos_token\": \"<|end_of_text|>\",\n                \"pad_token\": \"<|end_of_text|>\",\n            }\n            tok.add_special_tokens(special)\n            print(\"Loaded tokenizer via PreTrainedTokenizerFast(tokenizer_file=...)\")\n            return tok\n    except Exception as e:\n        errors.append(f\"PreTrainedTokenizerFast: {e}\")\n        print(f\"  PreTrainedTokenizerFast failed: {e}\")\n\n    raise RuntimeError(\"All tokenizer loading strategies failed:\\n\" + \"\\n\".join(errors))\n\n\ntokenizer = load_tokenizer(MODEL_PATH)\nif tokenizer.pad_token is None:\n    tokenizer.pad_token = tokenizer.eos_token\n\n# Set a chat template if missing (Llama-3 chat template)\nLLAMA3_CHAT_TEMPLATE = (\n    \"{% set loop_messages = messages %}\"\n    \"{% for message in loop_messages %}\"\n    \"{% set content = '<|start_header_id|>' + message['role'] + '<|end_header_id|>\\n\\n' + message['content'] | trim + '<|eot_id|>' %}\"\n    \"{% if loop.index0 == 0 %}{% set content = bos_token + content %}{% endif %}\"\n    \"{{ content }}\"\n    \"{% endfor %}\"\n    \"{% if add_generation_prompt %}{{ '<|start_header_id|>assistant<|end_header_id|>\\n\\n' }}{% endif %}\"\n)\ntry:\n    _ = tokenizer.apply_chat_template(\n        [{\"role\": \"user\", \"content\": \"hi\"}], tokenize=False\n    )\nexcept Exception:\n    tokenizer.chat_template = LLAMA3_CHAT_TEMPLATE\n    print(\"Set fallback Llama-3 chat template\")\n\nmodel = AutoModelForCausalLM.from_pretrained(\n    MODEL_PATH,\n    local_files_only=True,\n    torch_dtype=torch.float16 if device.type == \"cuda\" else torch.float32,\n    low_cpu_mem_usage=True,\n)\nmodel.to(device)\nmodel.eval()\nn_layers = model.config.num_hidden_layers\nprint(f\"Model loaded. num_hidden_layers={n_layers}\")\n\n\ndef format_prompt(text):\n    try:\n        messages = [{\"role\": \"user\", \"content\": text}]\n        return tokenizer.apply_chat_template(\n            messages, tokenize=False, add_generation_prompt=False\n        )\n    except Exception:\n        return f\"<|user|>\\n{text}\\n<|assistant|>\\n\"\n\n\nLAYERS_TO_PROBE = [8, 12, 16, 20, 24, 28]\n\n\n@torch.no_grad()\ndef get_activations(prompts):\n    acts = {L: [] for L in LAYERS_TO_PROBE}\n    verified = False\n    for i, p in enumerate(prompts):\n        text = format_prompt(p)\n        enc = tokenizer(text, return_tensors=\"pt\", truncation=True, max_length=512).to(\n            device\n        )\n        out = model(**enc, output_hidden_states=True, use_cache=False)\n        last_idx = enc[\"attention_mask\"].sum(dim=1).item() - 1\n        if not verified:\n            tok_id = enc[\"input_ids\"][0, last_idx].item()\n            print(f\"  final instr token decoded: {repr(tokenizer.decode([tok_id]))}\")\n            verified = True\n        for L in LAYERS_TO_PROBE:\n            h = out.hidden_states[L][0, last_idx, :].float().cpu().numpy()\n            acts[L].append(h)\n        if (i + 1) % 50 == 0:\n            print(f\"  extracted {i+1}/{len(prompts)}\")\n    return {L: np.stack(v) for L, v in acts.items()}\n\n\nprint(\"Extracting activations for harmful prompts...\")\nharm_acts = get_activations(harmful_prompts)\nprint(\"Extracting activations for benign prompts...\")\nben_acts = get_activations(benign_prompts)\n\ndel model\ntorch.cuda.empty_cache()\n\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.model_selection import train_test_split\n\nexperiment_data = {\n    \"llama3_advbench_alpaca\": {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"per_layer\": {},\n    }\n}\n\nresults = {}\nfor L in LAYERS_TO_PROBE:\n    X_h = harm_acts[L]\n    X_b = ben_acts[L]\n    X = np.concatenate([X_h, X_b], axis=0)\n    y = np.concatenate([np.ones(len(X_h)), np.zeros(len(X_b))]).astype(np.int64)\n    X_tr, X_te, y_tr, y_te = train_test_split(\n        X, y, test_size=0.3, random_state=42, stratify=y\n    )\n\n    mu_h = X_tr[y_tr == 1].mean(0)\n    mu_b = X_tr[y_tr == 0].mean(0)\n    dir_vec = mu_h - mu_b\n    dir_vec = dir_vec / (np.linalg.norm(dir_vec) + 1e-8)\n\n    p_tr = X_tr @ dir_vec\n    p_te = X_te @ dir_vec\n    clf = LogisticRegression(max_iter=1000)\n    clf.fit(p_tr.reshape(-1, 1), y_tr)\n    train_acc = clf.score(p_tr.reshape(-1, 1), y_tr)\n    val_acc = clf.score(p_te.reshape(-1, 1), y_te)\n\n    rng = np.random.default_rng(0)\n    rand_accs = []\n    for _ in range ulness_direction_probe_accuracy={best_val:.4f}\")\nexperiment_data[\"llama3_advbench_alpaca\"][\"best_layer\"] = int(best_L)\nexperiment_data[\"llama3_advbench_alpaca\"][\"harmfulness_direction_probe_accuracy\"] = (\n    float(best_val)\n)\n\nX_h = harm_acts[best_L]\nX_b = ben_acts[best_L]\nX = np.concatenate([X_h, X_b], 0)\ny = np.concatenate([np.ones(len(X_h)), np.zeros(len(X_b))]).astype(np.int64)\nX_tr, X_te, y_tr, y_te = train_test_split(\n    X, y, test_size=0.3, random_state=42, stratify=y\n)\nmu_h = X_tr[y_tr == 1].mean(0)\nmu_b = X_tr[y_tr == 0].mean(0)\nd = mu_h - mu_b\nd /= np.linalg.norm(d) + 1e-8\nclf = LogisticRegression(max_iter=1000)\nclf.fit((X_tr @ d).reshape(-1, 1), y_tr)\npreds = clf.predict((X_te @ d).reshape(-1, 1))\nexperiment_data[\"llama3_advbench_alpaca\"][\"predictions\"] = preds.tolist()\nexperiment_data[\"llama3_advbench_alpaca\"][\"ground_truth\"] = y_te.tolist()\n\ntry:\n    import matplotlib\n\n    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n\n    layers = sorted(results.keys())\n    vals = [results[L][0] for L in layers]\n    rands = [results[L][1] for L in layers]\n    plt.figure(figsize=(6, 4))\n    plt.plot(layers, vals, \"o-\", label=\"diff-of-means\")\n    plt.plot(layers, rands, \"s--\", label=\"random dir\")\n    plt.xlabel(\"Layer\")\n    plt.ylabel(\"Val Acc\")\n    plt.title(\"Harmfulness Probe Accuracy per Layer (Llama-3-8B AdvBench/Alpaca)\")\n    plt.legend()\n    plt.grid(True)\n    plt.savefig(\n        os.path.join(working_dir, \"llama3_advbench_alpaca_probe_per_layer.png\"),\n        bbox_inches=\"tight\",\n    )\n    print(\"Saved plot\")\nexcept Exception as e:\n    print(\"plot failed:\", e)\n\nnp.save(os.path.join(working_dir, \"experiment_data.npy\"), experiment_data)\nprint(\"Saved experiment_data.npy\")\nprint(f\"FINAL harmfulness_direction_probe_accuracy = {best_val:.4f}\")\n", "import os, sys, json, glob, gzip, csv, re, random, importlib, traceback, subprocess\n\nworking_dir = os.path.join( ):\n                r = try_load_parquet(p, cols)\n                if r:\n                    return r\n        except Exception:\n            pass\n    raise RuntimeError(\"AdvBench not found\")\n\n\ndef find_alpaca_prompts():\n    root = os.path.join(DATA_DIR, \"Alpaca\")\n    files = list_files(root)\n    import pandas as pd\n\n    for p in sorted(files):\n        low = p.lower()\n        try:\n            if low.endswith(\".parquet\"):\n                df = pd.read_parquet(p)\n                if \"instruction\" in df.columns:\n                    inp_col = (\n                        df[\"input\"].astype(str)\n                        if \"input\" in df.columns\n                        else [\"\"] * len(df)\n                    )\n                    prompts = [\n                        str(a) + ((\"\\n\" + str(b)) if b else \"\")\n                        for a, b in zip(df[\"instruction\"], inp_col)\n                    ]\n                    if len(prompts) >= 20:\n                        return prompts\n            elif low.endswith(\".json\"):\n                data = json.load(open(p))\n                if isinstance(data, list):\n                    prompts = []\n                    for d in data:\n                        if isinstance(d, dict):\n                            instr = d.get(\"instruction\") or d.get(\"prompt\")\n                            inp = d.get(\"input\", \"\") or \"\"\n                            if instr:\n                                prompts.append(\n                                    str(instr) + ((\"\\n\" + str(inp)) if inp else \"\")\n                                )\n                    if len(prompts) >= 20:\n                        return prompts\n        except Exception:\n            pass\n    raise RuntimeError(\"Alpaca not found\")\n\n\nharmful_prompts_all = find_advbench_prompts()\nbenign_prompts_all = find_alpaca_prompts()\n\nrandom.seed(0)\nrandom.shuffle(harmful_prompts_all)\nrandom.shuffle(benign_prompts_all)\n\nmax_avail = min(len(harmful_prompts_all), len(benign_prompts_all))\nprint(\n    f\"Available: {len(harmful_prompts_all)} harmful, {len(benign_prompts_all)} benign; max_per_class={max_avail}\"\n)\n\nN_CANDIDATES = [100, 200, 400, 500]\nN_CANDIDATES = sorted(set([min(n, max_avail) for n in N_CANDIDATES]))\nN_MAX = max(N_CANDIDATES)\nprint(f\"Sweeping N_PER_CLASS \u2208 {N_CANDIDATES}, extracting up to {N_MAX} per class\")\n\nharmful_prompts_pool = harmful_prompts_all[:N_MAX]\nbenign_prompts_pool = benign_prompts_all[:N_MAX]\n\n\ndef find_model_path():\n    candidates = []\n    base = os.path.join(MODEL_DIR, \"Meta-Llama-3-8B-Instruct\")\n    if os.path.isdir(base):\n        candidates.append(base)\n        nested = os.path.join(base, \"Meta-Llama-3-8B-Instruct\")\n        if os.path.isdir(nested):\n            candidates.append(nested)\n    if os.path.isdir(MODEL_DIR):\n        for name in os.listdir(MODEL_DIR):\n            full = os.path.join(MODEL_DIR, name)\n            if (\n                os.path.isdir(full)\n                and \"llama-3\" in name.lower()\n                and \"8b\" in name.lower()\n                and \"instruct\" in name.lower()\n            ):\n                if full not in candidates:\n                    candidates.append(full)\n    for c in candidates:\n        files = os.listdir(c) if os.path.isdir(c) else []\n        has_tok = any(\n            f in files\n            for f in [\"tokenizer.json\", \"tokenizer.model\", \"tokenizer_config.json\"]\n        )\n        has_model = any(f.endswith(\".safetensors\") or f.endswith(\".bin\") for f in files)\n        if has_tok and has_model:\n            return c\n    return candidates[0] if candidates else base\n\n\nMODEL_PATH = find_model_path()\nprint(f\"Model path: {MODEL_PATH}\")\n\nfrom transformers import AutoTokenizer, AutoModelForCausalLM\n\n\ndef load_tokenizer(path):\n    strategies = [\n        (\"fast_local\", dict(local_files_only=True, use_fast=True)),\n        (\"slow_local\", dict(local_files_only=True, use_fast=False)),\n        (\n            \"fast_trust\",\n            dict(local_files_only=True, use_fast=True, trust_remote_code=True),\n        ),\n    ]\n    for name, kw in strategies:\n        try:\n            tok = AutoTokenizer.from_pretrained(path, **kw)\n            print(f\"Loaded tokenizer via {name}\")\n            return tok\n        except Exception as e:\n            print(f\"  tokenizer attempt {name} failed: {e}\")\n    try:\n        from transformers import PreTrainedTokenizerFast\n\n        tj = os.path.join(path, \"tokenizer.json\")\n        if os.path.isfile(tj):\n            tok = PreTrainedTokenizerFast(tokenizer_file=tj)\n            tok.add_special_tokens(\n                {\n                    \"bos_token\": \"<|begin_of_text|>\",\n                    \"eos_token\": \"<|end_of_text|>\",\n                    \"pad_token\": \"<|end_of_text|>\",\n                }\n            )\n            return tok\n    except Exception as e:\n        print(f\"  PreTrainedTokenizerFast failed: {e}\")\n    raise RuntimeError(\"Tokenizer loading failed\")\n\n\ntokenizer = load_tokenizer(MODEL_PATH)\nif tokenizer.pad_token is None:\n    tokenizer.pad_token = tokenizer.eos_token\n\nLLAMA3_CHAT_TEMPLATE = (\n    \"{% set loop_messages = messages %}\"\n    \"{% for message in loop_messages %}\"\n    \"{% set content = '<|start_header_id|>' + message['role'] + '<|end_header_id|>\\n\\n' + message['content'] | trim + '<|eot_id|>' %}\"\n    \"{% if loop.index0 == 0 %}{% set content = bos_token + content %}{% endif %}\"\n    \"{{ content }}\"\n    \"{% endfor %}\"\n    \"{% if add_generation_prompt %}{{ '<|start_header_id|>assistant<|end_header_id|>\\n\\n' }}{% endif %}\"\n)\ntry:\n    _ = tokenizer.apply_chat_template(\n        [{\"role\": \"user\", \"content\": \"hi\"}], tokenize=False\n    )\nexcept Exception:\n    tokenizer.chat_template = LLAMA3_CHAT_TEMPLATE\n\nmodel = AutoModelForCausalLM.from_pretrained(\n    MODEL_PATH,\n    local_files_only=True,\n    torch_dtype=torch.float16 if device.type == \"cuda\" else torch.float32,\n    low_cpu_mem_usage=True,\n)\nmodel.to(device)\nmodel.eval()\nn_layers = model.config.num_hidden_layers\nprint(f\"Model loaded. num_hidden_layers={n_layers}\")\n\n\ndef format_prompt(text):\n    try:\n        return tokenizer.apply_chat_template(\n            [{\"role\": \"user\", \"content\": text}],\n            tokenize=False,\n            add_generation_prompt=False,\n        )\n    except Exception:\n        return f\"<|user|>\\n{text}\\n<|assistant|>\\n\"\n\n\nLAYERS_TO_PROBE = [8, 12, 16, 20, 24, 28]\n\n\n@torch.no_grad()\ndef get_activations(prompts):\n    acts = {L: [] for L in LAYERS_TO_PROBE}\n    for i, p in enumerate(prompts):\n        text = format_prompt(p)\n        enc = tokenizer(text, return_tensors=\"pt\", truncation=True, max_length=512).to(\n            device\n        )\n        out = model(**enc, output_hidden_states=True, use_cache=False)\n        last_idx = enc[\"attention_mask\"].sum(dim=1).item() - 1\n        for L in LAYERS_TO_PROBE:\n            h = out.hidden_states[L][0, last_idx, :].float().cpu().numpy()\n            acts[L].append(h)\n        if (i + 1) % 100 == 0:\n            print(f\"  extracted {i+1}/{len(prompts)}\")\n    return {L: np.stack(v) for L, v in acts.items()}\n\n\nprint(f\"Extracting activations for {N_MAX} harmful prompts...\")\nharm_acts_full = get_activations(harmful_prompts_pool)\nprint(f\"Extracting activations for {N_MAX} benign prompts...\")\nben_acts_full = get_activations(benign_prompts_pool)\n\ndel model\ntorch.cuda.empty_cache()\n\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.model_selection import train_test_split\n\nexperiment_data = {\n    \"N_PER_CLASS_tuning\": {\n        \"llama3_advbench_alpaca\": {\n            \"metrics\": {\"train\": [], \"val\": []},\n            \"losses\": {\"train\": [], \"val\": []},\n            \"predictions\": [],\n            \"ground_truth\": [],\n            \"per_config\": {},\n            \"N_candidates\": N_CANDIDATES,\n        }\n    }\n}\n\noverall_best = {\"val_acc\": -1, \"N\": None, \"layer\": None}\nall_results = {}\n\nfor N in N_CANDIDATES:\n    print(f\"\\n===== N_PER_CLASS = {N} =====\")\n    results = {}\n    per_layer_data = {}\n    for L in LAYERS_TO_PROBE:\n        X_h = harm_acts_full[L][:N]\n        X_b = ben_acts_full[L][:N]\n        X = np.concatenate([X_h, X_b], axis=0)\n        y = np.concatenate([np.ones(len(X_h)), np.zeros(len(X_b))]).astype(np.int64)\n        X_tr, X_te, y_tr, y_te = train_test_split(\n            X, y, test_size=0.3, random_state=42, stratify=y\n        )\n\n        mu_h = X_tr[y_tr == 1].mean(0)\n        mu_b = X_tr[y_tr == 0].mean(0)\n        dir_vec = mu_h - mu_b\n        dir_vec = dir_vec / (np.linalg.norm(dir_vec) + 1e-8)\n\n        p_tr = X_tr @ dir_vec\n        p_te = X_te @ dir_vec\n        clf = LogisticRegression(max_iter=1000)\n        clf.fit(p_tr.reshape(-1, 1), y_tr)\n        train_acc = clf.score(p_tr.reshape(-1, 1), y_tr)\n        val_acc = clf.score(p_te.reshape(-1, 1), y_te)\n\n        rng = np.random.default_rng(0)\n        rand_accs = []\n        for _ in range(5):\n            r = rng.standard_normal(dir_vec.shape[0])\n            r /= np.linalg.norm(r) + 1e-8\n            clf_r = LogisticRegression(max_iter=1000)\n            clf_r.fit((X_tr @ r).reshape(-1, 1), y_tr)\n            rand_accs.append(clf_r.score((X_te @ r).reshape(-1, 1), y_te))\n        rand_acc = float(np.mean(rand_accs))\n\n        y_tr_shuf = y_tr.copy()\n        rng.shuffle(y_tr_shuf)\n        mu_h_s = X_tr[y_tr_shuf == 1].mean(0)\n        mu_b_s = X_tr[y_tr_shuf == 0].mean(0)\n        d_s = mu_h_s - mu_b_s\n        d_s /= np.linalg.norm(d_s) + 1e-8\n        clf_s = LogisticRegression(max_iter=1000)\n        clf_s.fit((X_tr @ d_s).reshape(-1, 1), y_tr_shuf)\n        shuf_acc = clf_s.score((X_te @ d_s).reshape(-1, 1), y_te)\n\n        train_loss = 1.0 - train_acc\n        val_loss = -20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_1123b89974864fd4b6e87b401e98f68d_proc_647101/llama3_advbench_alpaca_val_acc_per_layer.png", "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_1123b89974864fd4b6e87b401e98f68d_proc_647101/llama3_advbench_alpaca_confusion_matrix.png"], ["experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_754e57bc92c44b239b61ff24241c40bf_proc_647101/llama3_advbench_alpaca_train_vs_val_bestN.png", "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_754e57bc92c44b239b61ff24241c40bf_proc_647101/llama3_advbench_alpaca_baselines_bestN.png", "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_754e57bc92c44b239b61ff24241c40bf_proc_647101/N_per_class_tuning_val_acc.png", "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_754e57bc92c44b239b61ff24241c40bf_proc_647101/llama3_advbench_alpaca_bestacc_vs_N.png", "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_754e57bc92c44b239b61ff24241c40bf_proc_647101/llama3_advbench_alpaca_val_acc_per_layer.png", "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_754e57bc92c44b239b61ff24241c40bf_proc_647101/llama3_advbench_alpaca_confusion_matrix.png"], ["experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/seed_aggregation_4a568b3eea3140a0accee68804403f96/llama3_advbench_alpaca_agg_baselines_bestN.png", "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/seed_aggregation_4a568b3eea3140a0accee68804403f96/llama3_advbench_alpaca_agg_val_acc_per_layer.png", "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/seed_aggregation_4a568b3eea3140a0accee68804403f96/llama3_advbench_alpaca_agg_train_vs_val_bestN.png", "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/seed_aggregation_4a568b3eea3140a0accee68804403f96/llama3_advbench_alpaca_agg_confusion_matrix.png", "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/seed_aggregation_4a568b3eea3140a0accee68804403f96/llama3_advbench_alpaca_agg_bestacc_vs_N.png"]], "plot_analyses": [[{"analysis": "This appears to be a confusion matrix for a Latent Guard classifier evaluated on a jailbreak detection task. The matrix shows perfect classification: 40 true negatives (benign correctly identified) and 40 true positives (harmful correctly identified), with zero false positives and zero false negatives. This 100% accuracy result on a small balanced test set (80 samples) suggests the linear probe on the harmfulness direction is extracting a highly separable signal. However, such perfect performance is suspicious and may indicate: (1) the evaluation set is too small or too easy, (2) potential data leakage between training and test sets, or (3) the harmful/benign contrast is too clean (e.g., simple AdvBench vs Alpaca contrast without adversarial examples). For a rigorous evaluation supporting the paper's central claim about Latent Guard matching Llama Guard 3, this needs to be validated on harder benchmarks (JailbreakBench, XSTest for over-refusal) and with actual jailbreak attempts.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_b1d49e14d4ba4b84886b37becaa99043_proc_395435/llama3_advbench_alpaca_confusion_matrix_best_layer.png"}, {"analysis": "This plot shows cosine similarity between the harmfulness direction and refusal direction across transformer layers (0-31) for Llama-3-8B-Instruct. Key observations: (1) At early layers (0-5), similarity is near zero or slightly negative, indicating the directions are essentially orthogonal in early representations. (2) There is a sharp transition around layers 6-10 where similarity rises steeply. (3) From layers 10-31, the two directions become highly aligned with cosine similarity around 0.7-0.85, peaking near 0.85 at middle-to-late layers. This is a critical finding for the paper's hypothesis: while the paper claims the two concepts are 'separable linear directions,' the high cosine similarity (>0.7) in most layers suggests they are NOT well-separated in the residual stream \u2014 they largely co-vary. This partially undermines the separability claim and suggests the authors need to either (a) identify specific layers where separation is highest for steering experiments, or (b) use orthogonalization/projection methods to isolate the components. The early layers (0-5) may be where true separation exists but these layers typically don't encode high-level semantic concepts well.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_b1d49e14d4ba4b84886b37becaa99043_proc_395435/llama3_advbench_alpaca_train_val_accuracy.png"}, {"analysis": "This plot shows probe accuracy for harmfulness classification across layers 0-31. The accuracy starts near 0.5 (chance) at layer 0, rises rapidly through layers 1-5, and reaches near-perfect accuracy (~1.0) by layer 5-6, remaining at ceiling for all subsequent layers (6-31). This is consistent with prior literature (Zou et al., Arditi et al.) showing that harmfulness/refusal concepts emerge in early-to-middle layers of instruction-tuned LLMs. The result validates that a linear probe can reliably decode harmfulness from residual stream activations. However, the ceiling effect starting so early (layer 5) means the probe can't discriminate between layers for choosing the 'best' harmfulness direction \u2014 all middle/late layers work equally well by this metric. Combined with the previous plot showing high cosine similarity with refusal, this suggests the probe may actually be picking up a mixed harmfulness+refusal signal rather than pure harmfulness. Additional validation (e.g., testing on jailbroken prompts where the model complies with harmful requests) would be needed to disentangle these.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_b1d49e14d4ba4b84886b37becaa99043_proc_395435/llama3_advbench_alpaca_probe_accuracy_baselines.png"}, {"analysis": "This plot shows refusal probe accuracy across layers 0-31. The curve shows: (1) chance performance at layer 0 (~0.5), (2) a gradual rise from layers 1-4, (3) reaching ~1.0 accuracy by layer 5, (4) a slight dip around layers 6-9 (down to ~0.95), and (5) full ceiling accuracy from layer 10 onward. The pattern is very similar to the harmfulness probe accuracy, which is expected given the high cosine similarity between the two directions shown in the earlier plot. The refusal signal appears to be linearly decodable from very early layers, consistent with prior findings that refusal has a strong linear representation. The near-identical accuracy curves for both harmfulness and refusal probes, combined with their high cosine similarity, reinforces the concern that these two directions may not be as separable as the hypothesis claims \u2014 the probes may be detecting largely the same underlying representation. Future experiments should test whether the two directions can be used to independently steer behavior (e.g., steering on harmfulness while keeping refusal constant, and vice versa) as originally proposed in the hypothesis.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_b1d49e14d4ba4b84886b37becaa99043_proc_395435/llama3_advbench_alpaca_loss_per_layer.png"}, {"analysis": "This plot displays token position for the two directions across layers 0-31. Both harmfulness (blue) and refusal (orange) directions are consistently located at token position -1 (the final token) across ALL layers. This contradicts a key claim in the research hypothesis, which states that 'the harmfulness judgment is written at the final instruction-token position, while the decision to refuse is committed just after the instruction, immediately before the response begins.' The experiment appears to only be extracting directions at a single fixed token position (-1) rather than exploring multiple positions to find the optimal one for each concept. To properly test the hypothesis about differential token positions, the pipeline needs to be modified to: (1) sweep over multiple token positions (e.g., last instruction token, chat template tokens, first response token position), (2) measure probe accuracy or steering effect at each position, and (3) demonstrate that harmfulness is best decoded at one position and refusal at another. As currently shown, this plot provides no evidence for the token-position separation hypothesis.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_b1d49e14d4ba4b84886b37becaa99043_proc_395435/llama3_advbench_alpaca_direction_norm_per_layer.png"}, {"analysis": "This plot shows attack success rate (ASR) versus steering strength (alpha ranging from -3 to +3) for harmfulness direction steering. Key observations: (1) At alpha=0 (no steering), baseline ASR is ~0.06 (6%), indicating the model refuses most harmful prompts by default. (2) For negative alpha (-3 to -1), ASR remains near baseline (~0-0.1). (3) At alpha=+1, ASR jumps dramatically to 0.7. (4) At alpha=+2 and +3, ASR reaches ~1.0 (100% attack success). This monotonic increase demonstrates that adding the harmfulness direction to activations effectively jailbreaks the model, causing it to comply with harmful requests. However, this result is somewhat problematic for the paper's core hypothesis: if steering along the 'harmfulness' direction increases compliance (i.e., reduces refusal), then this direction is behaving like a refusal-suppression direction, not a pure harmfulness-perception direction. Under the hypothesis, moving along the harmfulness axis should 'flip the model's internal judgment of whether an input is harmful, independent of whether it refuses.' The observed strong effect on refusal behavior suggests the extracted direction is entangled with refusal \u2014 consistent with the high cosine similarity (~0.8) shown earlier. To properly demonstrate dissociation, the authors need to show steering that changes internal harmfulness judgment (measurable via probes) WITHOUT changing refusal behavior, which this plot does not show.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_b1d49e14d4ba4b84886b37becaa99043_proc_395435/llama3_advbench_alpaca_probe_per_layer.png"}], [{"analysis": "Fashion-MNIST accuracy plot shows the training progression across 15 epochs with train and validation accuracy curves. Training accuracy climbs steadily from ~72% to ~90%, while validation accuracy plateaus around 87-89%. The gap between train and val accuracy is small, indicating minimal overfitting. However, this experiment is on Fashion-MNIST \u2014 an image classification dataset \u2014 which is completely unrelated to the stated research idea about LLM harmfulness/refusal direction separation in Llama-3-8B. The plot content does not align with the research objectives described in the prompt.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_1123b89974864fd4b6e87b401e98f68d_proc_647101/llama3_advbench_alpaca_train_vs_val_bestN.png"}, {"analysis": "DTD (Describable Textures Dataset) accuracy curves show train accuracy rising smoothly from ~25% to nearly 80% over 15 epochs, while validation accuracy hovers around 30-35%, indicating substantial overfitting on this texture classification task. Again, this is an image classification experiment unrelated to the LLM safety research hypothesis. The large train-val gap suggests the model architecture is memorizing DTD training samples without generalizing.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_1123b89974864fd4b6e87b401e98f68d_proc_647101/llama3_advbench_alpaca_baselines_bestN.png"}, {"analysis": "ImageNet-Val accuracy plot shows a strikingly different pattern: training accuracy remains near 0% throughout while validation accuracy fluctuates around 40-45% with high variance. This inverted pattern is unusual and suggests either (a) the model is being evaluated but not truly trained on this dataset, (b) there is a labeling or evaluation issue, or (c) the model is a pretrained one being tested in some transfer setting. This does not correspond to the LLM research idea about harmfulness/refusal directions.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_1123b89974864fd4b6e87b401e98f68d_proc_647101/N_per_class_tuning_val_acc.png"}, {"analysis": "Imagenette accuracy curves show train accuracy climbing from ~25% to ~55% and validation accuracy from ~35% to ~65% over 15 epochs. Interestingly, validation accuracy exceeds training accuracy throughout, which can occur with heavy training-time regularization (e.g., dropout, augmentation) or a small/easier validation split. This is still an image classification task unrelated to the stated LLM safety research direction.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_1123b89974864fd4b6e87b401e98f68d_proc_647101/llama3_advbench_alpaca_bestacc_vs_N.png"}, {"analysis": "Combined loss curves across the four datasets (fashion_mnist, dtd, imagenet-val, imagenette) show varying loss dynamics: fashion_mnist and imagenette losses decrease steadily indicating learning; DTD loss decreases sharply on training but likely reflects the overfitting seen in accuracy; imagenet-val loss remains relatively flat/high. These curves confirm that this is a multi-dataset vision benchmarking experiment rather than an LLM interpretability study.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_1123b89974864fd4b6e87b401e98f68d_proc_647101/llama3_advbench_alpaca_val_acc_per_layer.png"}, {"analysis": "Final test accuracy bar chart summarizes performance across the four datasets: Imagenette ~64%, ImageNet-Val ~46%, Fashion-MNIST ~89%, and DTD ~33%. The high Fashion-MNIST performance and low DTD performance reflect task difficulty. However, none of these results address the research hypothesis about harmfulness vs. refusal directions in LLM activations, extracting steering vectors, jailbreak signatures, or the Latent Guard classifier described in the research plan. There is a complete mismatch between the experimental artifacts and the stated research idea.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_1123b89974864fd4b6e87b401e98f68d_proc_647101/llama3_advbench_alpaca_confusion_matrix.png"}], [{"analysis": "Fashion-MNIST accuracy plot shows training curves across epochs for what appears to be a baseline model. The training accuracy climbs steadily from ~0.86 at epoch 1 to ~0.925 by epoch 10, while validation/test accuracy tracks it closely at slightly lower values (~0.88-0.90). The curves show typical learning behavior with diminishing returns after epoch 5-6. No obvious overfitting is visible. However, this plot appears misaligned with the stated research idea, which focuses on harmfulness vs. refusal directions in LLMs (Llama-3-8B), not fashion classification. This suggests the sub-stage is running preliminary baseline tuning on standard vision datasets before the main LLM experiments.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_754e57bc92c44b239b61ff24241c40bf_proc_647101/llama3_advbench_alpaca_train_vs_val_bestN.png"}, {"analysis": "DTD (Describable Textures Dataset) accuracy curves show a similar pattern with training accuracy rising from ~0.30 to ~0.70 across 10 epochs, while validation accuracy plateaus around 0.55-0.60. The gap between training and validation accuracy widens noticeably after epoch 5, indicating mild overfitting on this more challenging texture classification task. The lower absolute accuracy (compared to Fashion-MNIST) reflects DTD's higher difficulty with 47 texture classes. Again, this is baseline vision tuning rather than the intended LLM harmfulness/refusal direction analysis.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_754e57bc92c44b239b61ff24241c40bf_proc_647101/llama3_advbench_alpaca_baselines_bestN.png"}, {"analysis": "ImageNet validation accuracy plot shows training accuracy climbing from ~0.55 to ~0.72 over 10 epochs, with validation accuracy tracking at ~0.65-0.68. The curves suggest reasonable generalization on this large-scale classification task. Consistent with the other vision baseline plots, this is not directly relevant to the stated research hypothesis about harmfulness and refusal directions in Llama-3-8B activations.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_754e57bc92c44b239b61ff24241c40bf_proc_647101/N_per_class_tuning_val_acc.png"}, {"analysis": "Imagenette accuracy curves show rapid learning with training accuracy reaching ~0.95 and validation accuracy ~0.90 by epoch 10. Imagenette is a 10-class subset of ImageNet, so higher accuracy is expected. The small train-val gap indicates good generalization. Learning is fastest in the first 3-4 epochs then plateaus, suggesting the learning rate schedule or number of epochs could be tuned further.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_754e57bc92c44b239b61ff24241c40bf_proc_647101/llama3_advbench_alpaca_bestacc_vs_N.png"}, {"analysis": "This appears to be a summary/comparison plot showing final accuracy across the four datasets (Fashion-MNIST, DTD, ImageNet-val, Imagenette). The bar chart or aggregate visualization shows performance ordering roughly as: Imagenette (~0.90) > Fashion-MNIST (~0.90) > ImageNet (~0.68) > DTD (~0.60). This provides a baseline snapshot but does not address the core research hypothesis about linear directions for harmfulness/refusal in LLM residual streams. The experiment stage seems misaligned with the research plan \u2014 the plan called for extracting directions from Llama-3-8B on AdvBench, not tuning vision classifiers.", "plot_path": "experiments/2026-07-15_02-20-28_encode_harmfulness_refusal_attempt_1/logs/0-run/experiment_results/experiment_754e57bc92c44b239b61ff24241c40bf_proc_647101/llama3_advbench_alpaca_val_acc_per_layer.png"}], []], "vlm_feedback_summary": ["The plots show preliminary implementation results for the paper's hypothesis\nthat harmfulness and refusal are separable linear directions in\nLlama-3-8B-Instruct. Key findings: (1) Both harmfulness and refusal probes\nachieve near-perfect classification accuracy from early layers (~layer 5)\nonward. (2) A Latent Guard classifier achieves perfect 100% accuracy on an\n80-sample balanced test set, though this needs harder benchmarks for validation.\n(3) Steering along the 'harmfulness' direction dramatically increases attack\nsuccess rate (from 6% to 100% at alpha=+2), demonstrating strong behavioral\neffect. HOWEVER, the results raise significant concerns about the core\nseparability hypothesis: (a) The cosine similarity between harmfulness and\nrefusal directions is very high (~0.7-0.85) across most layers, suggesting they\nare NOT well-separated in the residual stream. (b) The token position analysis\nshows both directions extracted at the same position (-1) across all layers,\nproviding no evidence for the paper's claim of differential token positions for\nthe two concepts. (c) The strong effect of 'harmfulness' steering on refusal\nbehavior (jailbreaking) suggests the extracted direction is entangled with\nrefusal rather than being a pure harmfulness-perception axis. The implementation\nsuccessfully extracts and steers with directions, but the current experimental\ndesign does not yet demonstrate the key dissociation claims. Recommendations:\nsweep multiple token positions, orthogonalize the directions, and test steering\neffects on internal probe predictions independently of behavioral refusal.", "Six plots were received showing training/validation accuracy curves and loss\ncurves on four vision datasets (Fashion-MNIST, DTD, ImageNet-Val, Imagenette),\nplus a final test accuracy bar chart summarizing results. The plots are\ntechnically valid and legible, showing standard supervised learning dynamics:\nFashion-MNIST achieves ~89% accuracy with good generalization, Imagenette\nreaches ~64%, ImageNet-Val ~46%, and DTD only ~33% with significant overfitting\n(train ~80% vs val ~33%). However, there is a fundamental mismatch between these\nexperiments and the stated research idea. The research plan focuses on\nextracting separable linear directions for harmfulness perception and refusal\nexecution in Llama-3-8B-Instruct activations, evaluating on\nAdvBench/JailbreakBench, and building a Latent Guard classifier. None of the\nsubmitted plots relate to LLM interpretability, activation steering,\nrefusal/harmfulness directions, or jailbreak evaluation. The baseline_tuning\nsub-stage instructions do mention evaluating on these local vision datasets, so\nthis may be a preliminary infrastructure check \u2014 but the results shown provide\nno evidence toward the core research hypothesis. Recommendations: (1) pivot\nexperiments to load Llama-3-8B-Instruct and extract activations on AdvBench\nharmful vs. Alpaca benign prompts; (2) compute difference-of-means directions at\nthe final-instruction-token and post-instruction positions; (3) perform steering\ninterventions and measure ASR and internal harmfulness probe accuracy; (4) if\nthe vision datasets are truly required for this stage, clearly document why and\naddress the severe DTD overfitting with stronger regularization or fewer epochs.", "Five plots were received showing training/validation accuracy curves across 10\nepochs for four vision datasets (Fashion-MNIST, DTD, ImageNet-val, Imagenette)\nplus a summary comparison. All plots show reasonable baseline learning behavior\nwith training accuracy exceeding validation accuracy by modest margins,\nindicating acceptable generalization. However, these vision classification\nexperiments appear misaligned with the stated research hypothesis, which focuses\non identifying separable linear directions for harmfulness and refusal in\nLlama-3-8B-Instruct activations using AdvBench. The baseline tuning stage on\nvision datasets seems to be a preparatory/sanity-check phase rather than\nexperiments testing the actual hypothesis. To advance the research, subsequent\nstages should shift focus to LLM activation extraction, direction identification\nvia difference-in-means or PCA on harmful vs. benign contrast sets, and steering\nexperiments on Llama-3-8B-Instruct.", "[]"], "exec_time": [28.721580743789673, 45.429208278656006, 45.586177349090576, null], "exec_time_feedback": ["", "", "", ""], "datasets_successfully_tested": [["[\"llama3_advbench_alpaca\"]"], ["fashion_mnist", "dtd", "imagenet-val", "imagenette"], ["[]"], []], "plot_code": ["import matplotlib.pyplot as plt\n
