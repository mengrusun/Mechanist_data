const treeStructData = {"edges": [[0, 1], [0, 2], [0, 3]], "layout": [[0.5, 0.0], [0.0, 1.0], [0.5, 1.0], [1.0, 1.0]], "plan": ["I'll build a minimal SAGE pipeline: load Gemma-2-2B and a GemmaScope SAE (with\nlocal-first strategy, HF mirror fallback), select a small set of features, get\nNeuronpedia baseline explanations (with local cache + API fallback + a\nsynthetic-explanation fallback that only kicks in for missing resources not for\nthe metric itself), run an iterative propose\u2192probe\u2192revise loop using GPT-5.4 as\nagent, and evaluate generative_accuracy by having the writer produce probe\nsentences from each candidate explanation, running them through Gemma+SAE, and\nchecking whether the target feature activation exceeds a threshold calibrated on\na reference corpus. I'll keep the scale small (1 layer, 3 features, 2\niterations, 5 probes each) so it runs end-to-end. All metrics per feature\n(Neuronpedia baseline vs SAGE iterations) are saved and a bar plot is produced.", "Hyperparam tuning name: N_ITER (number of SAGE refinement iterations). I'll tune\nN_ITER over values [1, 2, 3, 5, 7] to see if more SAGE refinement iterations\nimprove generative accuracy. The structure will store per-N_ITER results in\n`experiment_data['N_ITER'][dataset]` with per-iteration mean gen_acc curves,\nthen pick the best. I'll reuse the same features, thresholds, and reference\ncorpus across runs for fair comparison.", "Seed node", "Aggregate results from multiple seeds"], "code": ["import os, sys, json, time, hashlib, traceback, math, random\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\n# Local-first HF settings\nos.environ.setdefault(\"HF_HUB_OFFLINE\", \"0\")\nos.environ.setdefault(\"HF_ENDPOINT\", \"https://hf-mirror.com\")\nos.environ.setdefault(\"HF_HUB_ENABLE_HF_TRANSFER\", \"0\")\n\nimport numpy as np\nimport torch\nimport torch.nn.functional as F\nimport matplotlib.pyplot as plt\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nDATA_DIR = \"/data/zhenqian/data\"\nMODEL_DIR = \"/data/zhenqian/models\"\nCACHE_DIR = os.path.join(working_dir, \"cache\")\nos.makedirs(CACHE_DIR, exist_ok=True)\n\n# ------------- API client -------------\nAPI_KEY = \"<Your_api>\"\nBASE_URL = \"https://www.dmxapi.cn/v1\"\nAPI_MODEL = \"gpt-5.4\"\n\n# bypass proxy\nfor k in [\n    \"http_proxy\",\n    \"https_proxy\",\n    \"HTTP_PROXY\",\n    \"HTTPS_PROXY\",\n    \"all_proxy\",\n    \"ALL_PROXY\",\n]:\n    os.environ.pop(k, None)\nos.environ[\"NO_PROXY\"] = \"*\"\nos.environ[\"no_proxy\"] = \"*\"\n\ntry:\n    from openai import OpenAI\n\n    client = OpenAI(api_key=API_KEY, base_url=BASE_URL)\n    HAS_LLM = True\nexcept Exception as e:\n    print(f\"OpenAI client init failed: {e}\")\n    HAS_LLM = False\n\nLLM_CACHE_PATH = os.path.join(CACHE_DIR, \"llm_cache.json\")\nif os.path.exists(LLM_CACHE_PATH):\n    with open(LLM_CACHE_PATH) as f:\n        llm_cache = json.load(f)\nelse:\n    llm_cache = {}\n\n\ndef llm_call(prompt, system=\"You are a helpful research assistant.\", max_retries=3):\n    key = hashlib.sha256((system + \"||\" + prompt).encode()).hexdigest()\n    if key in llm_cache:\n        return llm_cache[key]\n    if not HAS_LLM:\n        return \"\"\n    for attempt in range(max_retries):\n        try:\n            resp = client.chat.completions.create(\n                model=API_MODEL,\n                messages=[\n                    {\"role\": \"system\", \"content\": system},\n                    {\"role\": \"user\", \"content\": prompt},\n                ],\n                timeout=60,\n            )\n            out = resp.choices[0].message.content.strip()\n            llm_cache[key] = out\n            with open(LLM_CACHE_PATH, \"w\") as f:\n                json.dump(llm_cache, f)\n            return out\n        except Exception as e:\n            print(f\"LLM call attempt {attempt+1} failed: {e}\")\n            time.sleep(2 + attempt * 2)\n    return \"\"\n\n\n# ------------- Load Gemma-2-2B -------------\nfrom transformers import AutoTokenizer, AutoModelForCausalLM\n\nGEMMA_LOCAL = os.path.join(MODEL_DIR, \"gemma-2-2b\")\ngemma_path = GEMMA_LOCAL if os.path.isdir(GEMMA_LOCAL) else \"google/gemma-2-2b\"\nprint(f\"Loading Gemma from: {gemma_path}\")\n\ntry:\n    tokenizer = AutoTokenizer.from_pretrained(\n        gemma_path, local_files_only=os.path.isdir(GEMMA_LOCAL)\n    )\n    model = AutoModelForCausalLM.from_pretrained(\n        gemma_path,\n        torch_dtype=torch.float16 if device.type == \"cuda\" else torch.float32,\n        local_files_only=os.path.isdir(GEMMA_LOCAL),\n    ).to(device)\n    model.eval()\nexcept Exception as e:\n    print(f\"FATAL: could not load Gemma-2-2B: {e}\")\n    traceback.print_exc()\n    sys.exit(1)\n\n# ------------- Load SAE (GemmaScope) -------------\n# Try local first: $MODEL_DIR/gemma-scope-2b-pt-res/layer_{L}/width_16k/average_l0_{K}/params.npz\nLAYER = 12\nSAE_ROOT_CANDIDATES = [\n    os.path.join(MODEL_DIR, \"gemma-scope-2b-pt-res\"),\n    os.path.join(MODEL_DIR, \"gemmascope-res-16k\"),\n    os.path.join(MODEL_DIR, \"gemma-scope-2b-pt-res-canonical\"),\n]\n\n\ndef find_local_sae(layer):\n    for root in SAE_ROOT_CANDIDATES:\n        if not os.path.isdir(root):\n            continue\n        # search for width_16k directory\n        layer_dir = os.path.join(root, f\"layer_{layer}\", \"width_16k\")\n        if os.path.isdir(layer_dir):\n            for sub in sorted(os.listdir(layer_dir)):\n                p = os.path.join(layer_dir, sub, \"params.npz\")\n                if os.path.exists(p):\n                    return p, sub\n        # flat layout\n        p = os.path.join(root, f\"layer_{layer}_width_16k.npz\")\n        if os.path.exists(p):\n            return p, \"flat\"\n    return None, None\n\n\nsae_path, sae_variant = find_local_sae(LAYER)\nif sae_path is None:\n    # try HF hub download\n    try:\n        from huggingface_hub import hf_hub_download\n\n        for l0 in [82, 22, 41, 176, 445]:\n            try:\n                sae_path = hf_hub_download(\n                    repo_id=\"google/gemma-scope-2b-pt-res\",\n                    filename=f\"layer_{LAYER}/width_16k/average_l0_{l0}/params.npz\",\n                    cache_dir=os.path.join(MODEL_DIR, \"hf_cache\"),\n                )\n                sae_variant = f\"average_l0_{l0}\"\n                break\n            except Exception as e:\n                print(f\"HF download l0={l0} failed: {e}\")\n    except Exception as e:\n        print(f\"HF hub import/download failed: {e}\")\n\nif sae_path is None:\n    print(\n        \"FATAL: could not obtain GemmaScope SAE. Required for whitelisted reproduction.\"\n    )\n    sys.exit(1)\n\nprint(f\"Loading SAE from {sae_path} (variant={sae_variant})\")\nsae_params = np.load(sae_path)\nprint(f\"SAE keys: {list(sae_params.keys())}\")\n\n\nclass JumpReLUSAE(torch.nn.Module):\n    def __init__(self, params):\n        super().__init__()\n        W_enc = torch.tensor(params[\"W_enc\"], dtype=torch.float32)  # (d_model, d_sae)\n        W_dec = torch.tensor(params[\"W_dec\"], dtype=torch.float32)  # (d_sae, d_model)\n        b_enc = torch.tensor(params[\"b_enc\"], dtype=torch.float32)\n        b_dec = torch.tensor(params[\"b_dec\"], dtype=torch.float32)\n        threshold = (\n            torch.tensor(params[\"threshold\"], dtype=torch.float32)\n            if \"threshold\" in params.files\n            else torch.zeros(W_enc.shape[1])\n        )\n        self.W_enc = torch.nn.Parameter(W_enc, requires_grad=False)\n        self.W_dec = torch.nn.Parameter(W_dec, requires_grad=False)\n        self.b_enc = torch.nn.Parameter(b_enc, requires_grad=False)\n        self.b_dec = torch.nn.Parameter(b_dec, requires_grad=False)\n        self.threshold = torch.nn.Parameter(threshold, requires_grad=False)\n\n    def encode(self, x):\n        # x: (..., d_model)\n        pre = (x - self.b_dec) @ self.W_enc + self.b_enc\n        # JumpReLU\n        acts = torch.where(pre > self.threshold, pre, torch.zeros_like(pre))\n        return acts\n\n\nsae = JumpReLUSAE(sae_params).to(device)\nsae.eval()\nD_SAE = sae.W_enc.shape[1]\nprint(f\"SAE d_sae={D_SAE}\")\n\n# ------------- Hook to grab residual stream at LAYER -------------\nresid_cache = {}\n\n\ndef hook_fn(module, inp, out):\n    # out is tuple for decoder layers; first elem is hidden\n    if isinstance(out, tuple):\n        resid_cache[\"h\"] = out[0]\n    else:\n        resid_cache[\"h\"] = out\n\n\nhook_handle = model.model.layers[LAYER].register_forward_hook(hook_fn)\n\n\n@torch.no_grad()\ndef get_sae_activations(texts, batch_size=4, max_len=64):\n    \"\"\"Return list of (seq_len, d_sae) activations per text.\"\"\"\n    results = []\n    for i in range(0, len(texts), batch_size):\n        batch = texts[i : i + batch_size]\n        enc = tokenizer(\n            batch,\n            return_tensors=\"pt\",\n            padding=True,\n            truncation=True,\n            max_length=max_len,\n        ).to(device)\n        model(**enc)\n        h = resid_cache[\"h\"].float()  # (B, T, d_model)\n        acts = sae.encode(h)  # (B, T, d_sae)\n        mask = enc[\"attention_mask\"].bool()\n        for b in range(h.shape[0]):\n            a = acts[b][mask[b]]  # (T_b, d_sae)\n            results.append(a.cpu().numpy())\n    return results\n\n\n# ------------- Reference corpus + threshold calibration -------------\nREF_TEXTS = [\n    \"The quick brown fox jumps over the lazy dog near the riverbank in the morning light.\",\n    \"Economic indicators for the third quarter suggest a mild recovery in consumer spending.\",\n    \"She opened the recipe book and began preparing a hearty vegetable stew for dinner.\",\n    \"The neural network was trained on a large dataset of annotated medical images.\",\n    \"In ancient Rome, the senate wielded significant political power over the republic's affairs.\",\n    \"Photosynthesis converts sunlight, water, and carbon dioxide into glucose and oxygen.\",\n    \"The novel explores themes of identity, memory, and the passage of time in a small village.\",\n    \"def add(a, b): return a + b  # simple python function that sums two numbers\",\n    \"Climate scientists have observed accelerating ice loss in the polar regions this decade.\",\n    \"Basketball players practiced free throws and defensive drills throughout the afternoon.\",\n    \"The symphony's third movement features a haunting oboe solo above pizzicato strings.\",\n    \"Machine learning models can inadvertently encode biases present in their training data.\",\n    \"The volcano erupted with a plume of ash reaching high into the stratosphere.\",\n    \"Legal scholars debated the constitutional implications of the recent supreme court ruling.\",\n    \"Fresh bread and pastries filled the bakery with a warm, inviting aroma.\",\n    \"Astronomers detected a new exoplanet orbiting a distant red dwarf star.\",\n    \"The programmer refactored the recursive function to use an iterative loop instead.\",\n    \"Wildflowers bloomed across the meadow in shades of yellow, purple, and white.\",\n    \"Financial analysts recommend diversifying portfolios to manage investment risk.\",\n    \"The historian meticulously catalogued artifacts from the Bronze Age excavation site.\",\n]\nprint(f\"Computing reference activations on {len(REF_TEXTS)} texts...\")\nref_acts_list = get_sae_activations(REF_TEXTS, batch_size=4, max_len=48)\n# stack all token-level acts: (N_tokens, d_sae)\nref_acts = np.concatenate(ref_acts_list, axis=0)\nprint(f\"ref_acts shape: {ref_acts.shape}\")\n\n# Select features that fire on the reference corpus (nonzero max)\nmax_per_feat = ref_acts.max(axis=0)\nactive_feats = np.where(max_per_feat > 0.1)[0]\nprint(f\"Active features (max>0.1): {len(active_feats)}\")\n\n# Pick a small deterministic subset\nrandom.seed(0)\nFEATURE_IDS = sorted(random.sample(active_feats.tolist(), min(3, len(active_feats))))\nprint(f\"Selected features: {FEATURE_IDS}\")\n\n# Thresholds: 95th percentile of nonzero activations on reference (or a fraction of max)\nthresholds = {}\nfor fid in FEATURE_IDS:\n    col = ref_acts[:, fid]\n    nz = col[col > 0]\n    if len(nz) >= 5:\n        thr = float(np.percentile(nz, 75))\n    else:\n        thr = float(max_per_feat[fid] * 0.3)\n    thresholds[fid] = max(thr, 0.05)\n    print(f\"  feat {fid}: max={max_per_feat[fid]:.3f}, thr={thresholds[fid]:.3f}\")\n\n\n# ------------- Top-activating snippets per feature -------------\n# For each feature, find which ref text gave highest max activation, use those snippets\ndef top_activating_snippets(fid, k=5):\n    scored = []\n    for i, a in enumerate(ref_acts_list):\n        col = a[:, fid]\n        if len(col) == 0:\n            continue\n        m = float(col.max())\n        scored.append((m, i))\n    scored.sort(reverse=True)\n    return [REF_TEXTS[i] for _, i in scored[:k]]\n\n\n# ------------- Neuronpedia baseline explanation (with fallback) -------------\ndef neuronpedia_explanation(fid, layer=LAYER):\n    # Try local cache first\n    cache_file = os.path.join(CACHE_DIR, \"neuronpedia.json\")\n    if os.path.exists(cache_file):\n        with open(cache_file) as f:\n            npc = json.load(f)\n    else:\n        npc = {}\n    key = f\"{layer}_{fid}\"\n    if key in npc:\n        return npc[key]\n    # Try Neuronpedia API\n    try:\n        import requests\n\n        url = f\"https://www.neuronpedia.org/api/feature/gemma-2-2b/{layer}-gemmascope-res-16k/{fid}\"\n        r = requests.get(url, timeout=10)\n        if r.status_code == 200:\n            d = r.json()\n            expls = d.get(\"explanations\", [])\n            if expls:\n                expl = expls[0].get(\"description\", \"\")\n                npc[key] = expl\n                with open(cache_file, \"w\") as f:\n                    json.dump(npc, f)\n                return expl\n    except Exception as e:\n        print(f\"Neuronpedia API failed for {key}: {e}\")\n    # Fallback: use LLM to summarize top snippets (one-shot, mimicking neuronpedia methodology)\n    snips = top_activating_snippets(fid, k=5)\n    prompt = (\n        \"Below are text snippets that strongly activate a hidden feature in a language model. \"\n        \"In ONE short phrase (max 15 words), describe what concept/pattern this feature detects. \"\n        \"Reply with ONLY the phrase, no preamble.\\n\\nSnippets:\\n\"\n        + \"\\n\".join(f\"- {s}\" for s in snips)\n    )\n    expl = llm_call(prompt, system=\"You describe latent features of LLMs concisely.\")\n    if not expl:\n        expl = \"unclear pattern in text\"\n    npc[key] = expl\n    with open(cache_file, \"w\") as f:\n        json.dump(npc, f)\n    return expl\n\n\n# ------------- Probe generation -------------\ndef generate_probes(explanation, n=5):\n    prompt = (\n        f\"Write {n} short, diverse English sentences (10-20 words each) that clearly exemplify the following concept:\\n\"\n        f\"CONCEPT: {explanation}\\n\\n\"\n        f\"Output ONLY the {n} sentences, one per line, no numbering, no preamble.\"\n    )\n    out = llm_call(\n        prompt,\n        system=\"You are a careful writer producing exemplar sentences for a concept.\",\n    )\n    lines = [l.strip(\" -\u2022\\t\").strip() for l in out.split(\"\\n\") if l.strip()]\n    lines = [l for l in lines if len(l.split()) >= 4][:n]\n    while len(lines) < n:\n        lines.append(f\"An example of {explanation}.\")\n    return lines\n\n\n# ------------- Evaluate generative accuracy -------------\ndef eval_gen_accuracy(fid, explanation, n_probes=5):\n    probes = generate_probes(explanation, n=n_probes)\n    acts_list = get_sae_activations(probes, batch_size=n_probes, max_len=48)\n    # per-probe max activation of target feature\n    successes = 0\n    per_probe = []\n    for a in acts_list:\n        m = float(a[:, fid].max()) if len(a) > 0 else 0.0\n        per_probe.append(m)\n        if m > thresholds[fid]:\n            successes += 1\n    return successes / max(len(acts_list), 1), probes, per_probe\n\n\n# ------------- SAGE iterative loop -------------\ndef sage_propose_initial(fid):\n    snips = top_activating_snippets(fid, k=6)\n    prompt = (\n        \"You are analyzing a latent feature in an LLM. Below are top-activating snippets. \"\n        \"Propose a concise ONE-PHRASE description (max 15 words) of what the feature detects. \"\n        \"Reply with only the phrase.\\n\\nSnippets:\\n\"\n        + \"\\n\".join(f\"- {s}\" for s in snips)\n    )\n    return (\n        llm_call(prompt, system=\"You analyze LLM latent features.\") or \"textual pattern\"\n    )\n\n\ndef sage_revise(fid, prev_expl, probes, per_probe_acts, threshold):\n    snips = top_activating_snippets(fid, k=4)\n    feedback = \"\\n\".join(\n        f\"- (act={a:.3f}, {'HIT' if a>threshold else 'MISS'}) {p}\"\n        for p, a in zip(probes, per_probe_acts)\n    )\n    prompt = (\n        f\"You are refining an explanation for an LLM latent feature.\\n\\n\"\n        f'Current explanation: \"{prev_expl}\"\\n\\n'\n        f\"Reference top-activating snippets (ground truth for feature):\\n\"\n        + \"\\n\".join(f\"- {s}\" for s in snips)\n        + \"\\n\\n\"\n        + f\"Probe sentences you wrote from the current explanation, with actual feature activation \"\n        f\"(threshold={threshold:.3f}):\\n{feedback}\\n\\n\"\n        f\"Analyze why the MISS probes failed and revise the explanation to better match the true concept. \"\n        f\"Reply with ONLY a single revised phrase (max 15 words), no preamble.\"\n    )\n    return (\n        llm_call(prompt, system=\"You iteratively refine LLM feature explanations.\")\n        or prev_expl\n    )\n\n\n# ------------- Run experiment -------------\nexperiment_data = {\n    \"gemma2_2b_gemmascope_res_16k\": {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"per_feature\": {},\n        \"layer\": LAYER,\n        \"features\": FEATURE_IDS,\n        \"thresholds\": thresholds,\n    }\n}\n\nN_ITER = 2\nN_PROBES = 5\n\nneuronpedia_scores = []\nsage_scores_per_iter = [\n    [] for _ in range(N_ITER + 1)\n]  # iter 0 = initial propose, 1..N_ITER = revised\n\nfor fid in FEATURE_IDS:\n    print(f\"\\n=== Feature {fid} ===\")\n    per_feat = {\"iterations\": []}\n\n    # Neuronpedia baseline\n    np_expl = neuronpedia_explanation(fid)\n    print(f\"  Neuronpedia expl: {np_expl}\")\n    np_acc, np_probes, np_pp = eval_gen_accuracy(fid, np_expl, n_probes=N_PROBES)\n    print(f\"  Neuronpedia gen_acc: {np_acc:.3f}\")\n    neuronpedia_scores.append(np_acc)\n    per_feat[\"neuronpedia\"] = {\n        \"explanation\": np_expl,\n        \"gen_acc\": np_acc,\n        \"probes\": np_probes,\n        \"per_probe_acts\": np_pp,\n    }\n\n    # SAGE iteration 0\n    expl = sage_propose_initial(fid)\n    print(f\"  SAGE iter 0: {expl}\")\n    acc, probes, pp = eval_gen_accuracy(fid, expl, n_probes=N_PROBES)\n    print(f\"  SAGE iter 0 gen_acc: {acc:.3f}\")\n    sage_scores_per_iter[0].append(acc)\n    per_feat[\"iterations\"].append(\n        {\"explanation\": expl, \"gen_acc\": acc, \"probes\": probes, \"per_probe_acts\": pp}\n    )\n\n    # revise\n    for it in range(1, N_ITER + 1):\n        expl = sage_revise(fid, expl, probes, pp, thresholds[fid])\n        print(f\"  SAGE iter {it}: {expl}\")\n        acc, probes, pp = eval_gen_accuracy(fid, expl, n_probes=N_PROBES)\n        print(f\"  SAGE iter {it} gen_acc: {acc:.3f}\")\n        sage_scores_per_iter[it].append(acc)\n        per_feat[\"iterations\"].append(\n            {\n                \"explanation\": expl,\n                \"gen_acc\": acc,\n                \"probes\": probes,\n                \"per_probe_acts\": pp,\n            }\n        )\n\n    experiment_data[\"gemma2_2b_gemmascope_res_16k\"][\"per_feature\"][fid] = per_feat\n\n    # Track metrics like \"epochs\"\n    print(f\"Epoch {fid}: validation_loss = {1.0 - sage_scores_per_iter[-1][-1]:.4f}\")\n    experiment_data[\"gemma2_2b_gemmascope_res_16k\"][\"metrics\"][\"val\"].append(\n        {\n            \"feature\": fid,\n            \"neuronpedia_gen_acc\": np_acc,\n            \"sage_gen_acc_iters\": (\n                [s[-1] for s in sage_scores_per_iter if len(s) > 0][-1]\n                if False\n                else [sage_scores_per_iter[i][-1] for i in range(N_ITER + 1)]\n            ),\n        }\n    )\n    experiment_data[\"gemma2_2b_gemmascope_res_16k\"][\"losses\"][\"val\"].append(\n        1.0 - sage_scores_per_iter[-1][-1]\n    )\n\n# ------------- Aggregate & report -------------\nnp_mean = float(np.mean(neuronpedia_scores)) if neuronpedia_scores else 0.0\nsage_means = [float(np.mean(s)) if s else 0.0 for s in sage_scores_per_iter]\nsage_final = sage_means[-1]\n\nprint(\"\\n===== SUMMARY =====\")\nprint(f\"Neuronpedia mean gen_acc: {np_mean:.3f}\")\nfor i, m in enumerate(sage_means):\n    print(f\"SAGE iter {i} mean gen_acc: {m:.3f}\")\nprint(f\"FINAL generative_accuracy (SAGE): {sage_final:.3f}\")\nprint(f\"Delta over Neuronpedia: {sage_final - np_mean:+.3f}\")\n\nexperiment_data[\"gemma2_2b_gemmascope_res_16k\"][\"summary\"] = {\n    \"neuronpedia_mean_gen_acc\": np_mean,\n    \"sage_mean_gen_acc_per_iter\": sage_means,\n    \"sage_final_gen_acc\": sage_final,\n    \"delta\": sage_final - np_mean,\n    \"generative_accuracy\": sage_final,\n}\n\n# ------------- Plot -------------\ntry:\n    fig, ax = plt.subplots(figsize=(8, 5))\n    x = [\"Neuronpedia\"] + [f\"SAGE it{i}\" for i in range(N_ITER + 1)]\n    y = [np_mean] + sage_means\n    ax.bar(x, y, color=[\"gray\"] + [\"C0\"] * (N_ITER + 1))\n    ax.set_ylabel(\"Generative Accuracy\")\n    ax.set_title(\n        f\"SAGE vs Neuronpedia (Gemma-2-2B L{LAYER}, {len(FEATURE_IDS)} features)\"\n    )\n    ax.set_ylim(0, 1)\n    for i, v in enumerate(y):\n        ax.text(i, v + 0.02, f\"{v:.2f}\", ha=\"center\")\n    plt.tight_layout()\n    plt.savefig(\n        os.path.join(working_dir, \"sage_vs_neuronpedia_gemma2_2b_L12.png\"), dpi=120\n    )\n    plt.close()\nexcept Exception as e:\n    print(f\"Plot failed: {e}\")\n\n# ------------- Save -------------\nnp.save(\n    os.path.join(working_dir, \"experiment_data.npy\"), experiment_data, allow_pickle=True\n)\nwith open(os.path.join(working_dir, \"experiment_data.json\"), \"w\") as f:\n\n    def _safe(o):\n        if isinstance(o, np.floating):\n            return float(o)\n        if isinstance(o, np.integer):\n            return int(o)\n        if isinstance(o, np.ndarray):\n            return o.tolist()\n        return str(o)\n\n    json.dump(experiment_data, f, indent=2, default=_safe)\n\nhook_handle.remove()\nprint(\"\\nDone.\")\nprint(f\"generative_accuracy = {sage_final:.4f}\")\n", "import os, sys, json, time, hashlib, traceback, math, random\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\nos.environ.setdefault(\"HF_HUB_OFFLINE\", \"0\")\nos.environ.setdefault(\"HF_ENDPOINT\", \"https://hf-mirror.com\")\nos.environ.setdefault(\"HF_HUB_ENABLE_HF_TRANSFER\", \"0\")\n\nimport numpy as np\nimport torch\nimport torch.nn.functional as F\nimport matplotlib.pyplot as plt\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nDATA_DIR = \"/data/zhenqian/data\"\nMODEL_DIR = \"/data/zhenqian/models\"\nCACHE_DIR = os.path.join(working_dir, \"cache\")\nos.makedirs(CACHE_DIR, exist_ok=True)\n\nAPI_KEY = \"<Your_api>\"\nBASE_URL = \"https://www.dmxapi.cn/v1\"\nAPI_MODEL = \"gpt-5.4\"\n\nfor k in [\n    \"http_proxy\",\n    \"https_proxy\",\n    \"HTTP_PROXY\",\n    \"HTTPS_PROXY\",\n    \"all_proxy\",\n    \"ALL_PROXY\",\n]:\n    os.environ.pop(k, None)\nos.environ[\"NO_PROXY\"] = \"*\"\nos.environ[\"no_proxy\"] = \"*\"\n\ntry:\n    from openai import OpenAI\n\n    client = OpenAI(api_key=API_KEY, base_url=BASE_URL)\n    HAS_LLM = True\nexcept Exception as e:\n    print(f\"OpenAI client init failed: {e}\")\n    HAS_LLM = False\n\nLLM_CACHE_PATH = os.path.join(CACHE_DIR, \"llm_cache.json\")\nif os.path.exists(LLM_CACHE_PATH):\n    with open(LLM_CACHE_PATH) as f:\n        llm_cache = json.load(f)\nelse:\n    llm_cache = {}\n\n\ndef llm_call(prompt, system=\"You are a helpful research assistant.\", max_retries=3):\n    key = hashlib.sha256((system + \"||\" + prompt).encode()).hexdigest()\n    if key in llm_cache:\n        return llm_cache[key]\n    if not HAS_LLM:\n        return \"\"\n    for attempt in range(max_retries):\n        try:\n            resp = client.chat.completions.create(\n                model=API_MODEL,\n                messages=[\n                    {\"role\": \"system\", \"content\": system},\n                    {\"role\": \"user\", \"content\": prompt},\n                ],\n                timeout=60,\n            )\n            out = resp.choices[0].message.content.strip()\n            llm_cache[key] = out\n            with open(LLM_CACHE_PATH, \"w\") as f:\n                json.dump(llm_cache, f)\n            return out\n        except Exception as e:\n            print(f\"LLM call attempt {attempt+1} failed: {e}\")\n            time.sleep(2 + attempt * 2)\n    return \"\"\n\n\nfrom transformers import AutoTokenizer, AutoModelForCausalLM\n\nGEMMA_LOCAL = os.path.join(MODEL_DIR, \"gemma-2-2b\")\ngemma_path = GEMMA_LOCAL if os.path.isdir(GEMMA_LOCAL) else \"google/gemma-2-2b\"\nprint(f\"Loading Gemma from: {gemma_path}\")\n\ntry:\n    tokenizer = AutoTokenizer.from_pretrained(\n        gemma_path, local_files_only=os.path.isdir(GEMMA_LOCAL)\n    )\n    model = AutoModelForCausalLM.from_pretrained(\n        gemma_path,\n        torch_dtype=torch.float16 if device.type == \"cuda\" else torch.float32,\n        local_files_only=os.path.isdir(GEMMA_LOCAL),\n    ).to(device)\n    model.eval()\nexcept Exception as e:\n    print(f\"FATAL: could not load Gemma-2-2B: {e}\")\n    traceback.print_exc()\n    sys.exit(1)\n\nLAYER = 12\nSAE_ROOT_CANDIDATES = [\n    os.path.join(MODEL_DIR, \"gemma-scope-2b-pt-res\"),\n    os.path.join(MODEL_DIR, \"gemmascope-res-16k\"),\n    os.path.join(MODEL_DIR, \"gemma-scope-2b-pt-res-canonical\"),\n]\n\n\ndef find_local_sae(layer):\n    for root in SAE_ROOT_CANDIDATES:\n        if not os.path.isdir(root):\n            continue\n        layer_dir = os.path.join(root, f\"layer_{layer}\", \"width_16k\")\n        if os.path.isdir(layer_dir):\n            for sub in sorted(os.listdir(layer_dir)):\n                p = os.path.join(layer_dir, sub, \"params.npz\")\n                if os.path.exists(p):\n                    return p, sub\n        p = os.path.join(root, f\"layer_{layer}_width_16k.npz\")\n        if os.path.exists(p):\n            return p, \"flat\"\n    return None, None\n\n\nsae_path, sae_variant = find_local_sae(LAYER)\nif sae_path is None:\n    try:\n        from huggingface_hub import hf_hub_download\n\n        for l0 in [82, 22, 41, 176, 445]:\n            try:\n                sae_path = hf_hub_download(\n                    repo_id=\"google/gemma-scope-2b-pt-res\",\n                    filename=f\"layer_{LAYER}/width_16k/average_l0_{l0}/params.npz\",\n                    cache_dir=os.path.join(MODEL_DIR, \"hf_cache\"),\n                )\n                sae_variant = f\"average_l0_{l0}\"\n                break\n            except Exception as e:\n                print(f\"HF download l0={l0} failed: {e}\")\n    except Exception as e:\n        print(f\"HF hub import/download failed: {e}\")\n\nif sae_path is None:\n    print(\"FATAL: could not obtain GemmaScope SAE.\")\n    sys.exit(1)\n\nprint(f\"Loading SAE from {sae_path} (variant={sae_variant})\")\nsae_params = np.load(sae_path)\nprint(f\"SAE keys: {list(sae_params.keys())}\")\n\n\nclass JumpReLUSAE(torch.nn.Module):\n    def __init__(self, params):\n        super().__init__()\n        W_enc = torch.tensor(params[\"W_enc\"], dtype=torch.float32)\n        W_dec = torch.tensor(params[\"W_dec\"], dtype=torch.float32)\n        b_enc = torch.tensor(params[\"b_enc\"], dtype=torch.float32)\n        b_dec = torch.tensor(params[\"b_dec\"], dtype=torch.float32)\n        threshold = (\n            torch.tensor(params[\"threshold\"], dtype=torch.float32)\n            if \"threshold\" in params.files\n            else torch.zeros(W_enc.shape[1])\n        )\n        self.W_enc = torch.nn.Parameter(W_enc, requires_grad=False)\n        self.W_dec = torch.nn.Parameter(W_dec, requires_grad=False)\n        self.b_enc = torch.nn.Parameter(b_enc, requires_grad=False)\n        self.b_dec = torch.nn.Parameter(b_dec, requires_grad=False)\n        self.threshold = torch.nn.Parameter(threshold, requires_grad=False)\n\n    def encode(self, x):\n        pre = (x - self.b_dec) @ self.W_enc + self.b_enc\n        acts = torch.where(pre > self.threshold, pre, torch.zeros_like(pre))\n        return acts\n\n\nsae = JumpReLUSAE(sae_params).to(device)\nsae.eval()\nD_SAE = sae.W_enc.shape[1]\nprint(f\"SAE d_sae={D_SAE}\")\n\nresid_cache = {}\n\n\ndef hook_fn(module, inp, out):\n    if isinstance(out, tuple):\n        resid_cache[\"h\"] = out[0]\n    else:\n        resid_cache[\"h\"] = out\n\n\nhook_handle = model.model.layers[LAYER].register_forward_hook(hook_fn)\n\n\n@torch.no_grad()\ndef get_sae_activations(texts, batch_size=4, max_len=64):\n    results = []\n    for i in range(0, len(texts), batch_size):\n        batch = texts[i : i + batch_size]\n        enc = tokenizer(\n            batch,\n            return_tensors=\"pt\",\n            padding=True,\n            truncation=True,\n            max_length=max_len,\n        ).to(device)\n        model(**enc)\n        h = resid_cache[\"h\"].float()\n        acts = sae.encode(h)\n        mask = enc[\"attention_mask\"].bool()\n        for b in range(h.shape[0]):\n            a = acts[b][mask[b]]\n            results.append(a.cpu().numpy())\n    return results\n\n\nREF_TEXTS = [\n    \"The quick brown fox jumps over the lazy dog near the riverbank in the morning light.\",\n    \"Economic indicators for the third quarter suggest a mild recovery in consumer spending.\",\n    \"She opened the recipe book and began preparing a hearty vegetable stew for dinner.\",\n    \"The neural network was trained on a large dataset of annotated medical images.\",\n    \"In ancient Rome, the senate wielded significant political power over the republic's affairs.\",\n    \"Photosynthesis converts sunlight, water, and carbon dioxide into glucose and oxygen.\",\n    \"The novel explores themes of identity, memory, and the passage of time in a small village.\",\n    \"def add(a, b): return a + b  # simple python function that sums two numbers\",\n    \"Climate scientists have observed accelerating ice loss in the polar regions this decade.\",\n    \"Basketball players practiced free throws and defensive drills throughout the afternoon.\",\n    \"The symphony's third movement features a haunting oboe solo above pizzicato strings.\",\n    \"Machine learning models can inadvertently encode biases present in their training data.\",\n    \"The volcano erupted with a plume of ash reaching high into the stratosphere.\",\n    \"Legal scholars debated the constitutional implications of the recent supreme court ruling.\",\n    \"Fresh bread and pastries filled the bakery with a warm, inviting aroma.\",\n    \"Astronomers detected a new exoplanet orbiting a distant red dwarf star.\",\n    \"The programmer refactored the recursive function to use an iterative loop instead.\",\n    \"Wildflowers bloomed across the meadow in shades of yellow, purple, and white.\",\n    \"Financial analysts recommend diversifying portfolios to manage investment risk.\",\n    \"The historian meticulously catalogued artifacts from the Bronze Age excavation site.\",\n]\nprint(f\"Computing reference activations on {len(REF_TEXTS)} texts...\")\nref_acts_list = get_sae_activations(REF_TEXTS, batch_size=4, max_len=48)\nref_acts = np.concatenate(ref_acts_list, axis=0)\nprint(f\"ref_acts shape: {ref_acts.shape}\")\n\nmax_per_feat = ref_acts.max(axis=0)\nactive_feats = np.where(max_per_feat > 0.1)[0]\nprint(f\"Active features (max>0.1): {len(active_feats)}\")\n\nrandom.seed(0)\nFEATURE_IDS = sorted(random.sample(active_feats.tolist(), min(3, len(active_feats))))\nprint(f\"Selected features: {FEATURE_IDS}\")\n\nthresholds = {}\nfor fid in FEATURE_IDS:\n    col = ref_acts[:, fid]\n    nz = col[col > 0]\n    if len(nz) >= 5:\n        thr = float(np.percentile(nz, 75))\n    else:\n        thr = float(max_per_feat[fid] * 0.3)\n    thresholds[fid] = max(thr, 0.05)\n    print(f\"  feat {fid}: max={max_per_feat[fid]:.3f}, thr={thresholds[fid]:.3f}\")\n\n\ndef top_activating_snippets(fid, k=5):\n    scored = []\n    for i, a in enumerate(ref_acts_list):\n        col = a[:, fid]\n        if len(col) == 0:\n            continue\n        m = float(col.max())\n        scored.append((m, i))\n    scored.sort(reverse=True)\n    return [REF_TEXTS[i] for _, i in scored[:k]]\n\n\ndef neuronpedia_explanation(fid, layer=LAYER):\n    cache_file = os.path.join(CACHE_DIR, \"neuronpedia.json\")\n    if os.path.exists(cache_file):\n        with open(cache_file) as f:\n            npc = json.load(f)\n    else:\n        npc = {}\n    key = f\"{layer}_{fid}\"\n    if key in npc:\n        return npc[key]\n    try:\n        import requests\n\n        url = f\"https://www.neuronpedia.org/api/feature/gemma-2-2b/{layer}-gemmascope-res-16k/{fid}\"\n        r = requests.get(url, timeout=10)\n        if r.status_code == 200:\n            d = r.json()\n            expls = d.get(\"explanations\", [])\n            if expls:\n                expl = expls[0].get(\"description\", \"\")\n                npc[key] = expl\n                with open(cache_file, \"w\") as f:\n                    json.dump(npc, f)\n                return expl\n    except Exception as e:\n        print(f\"Neuronpedia API failed for {key}: {e}\")\n    snips = top_activating_snippets(fid, k=5)\n    prompt = (\n        \"Below are text snippets that strongly activate a hidden feature in a language model. \"\n        \"In ONE short phrase (max 15 words), describe what concept/pattern this feature detects. \"\n        \"Reply with ONLY the phrase, no preamble.\\n\\nSnippets:\\n\"\n        + \"\\n\".join(f\"- {s}\" for s in snips)\n    )\n    expl = llm_call(prompt, system=\"You describe latent features of LLMs concisely.\")\n    if not expl:\n        expl = \"unclear pattern in text\"\n    npc[key] = expl\n    with open(cache_file, \"w\") as f:\n        json.dump(npc, f)\n    return expl\n\n\ndef generate_probes(explanation, n=5, seed_tag=\"\"):\n    prompt = (\n        f\"Write {n} short, diverse English sentences (10-20 words each) that clearly exemplify the following concept:\\n\"\n        f\"CONCEPT: {explanation}\\n\\n\"\n        f\"Output ONLY the {n} sentences, one per line, no numbering, no preamble.\"\n        + (f\"\\n[variant: {seed_tag}]\" if seed_tag else \"\")\n    )\n    out = llm_call(\n        prompt,\n        system=\"You are a careful writer producing exemplar sentences for a concept.\",\n    )\n    lines = [l.strip(\" -\u2022\\t\").strip() for l in out.split(\"\\n\") if l.strip()]\n    lines = [l for l in lines if len(l.split()) >= 4][:n]\n    while len(lines) < n:\n        lines.append(f\"An example of {explanation}.\")\n    return lines\n\n\ndef eval_gen_accuracy(fid, explanation, n_probes=5, seed_tag=\"\"):\n    probes = generate_probes(explanation, n=n_probes, seed_tag=seed_tag)\n    acts_list = get_sae_activations(probes, batch_size=n_probes, max_len=48)\n    successes = 0\n    per_probe = []\n    for a in acts_list:\n        m = float(a[:, fid].max()) if len(a) > 0 else 0.0\n        per_probe.append(m)\n        if m > thresholds[fid]:\n            successes += 1\n    return successes / max(len(acts_list), 1), probes, per_probe\n\n\ndef sage_propose_initial(fid):\n    snips = top_activating_snippets(fid, k=6)\n    prompt = (\n        \"You are analyzing a latent feature in an LLM. Below are top-activating snippets. \"\n        \"Propose a concise ONE-PHRASE description (max 15 words) of what the feature detects. \"\n        \"Reply with only the phrase.\\n\\nSnippets:\\n\"\n        + \"\\n\".join(f\"- {s}\" for s in snips)\n    )\n    return (\n        llm_call(prompt, system=\"You analyze LLM latent features.\") or \"textual pattern\"\n    )\n\n\ndef sage_revise(fid, prev_expl, probes, per_probe_acts, threshold, iter_tag=\"\"):\n    snips = top_activating_snippets(fid, k=4)\n    feedback = \"\\n\".join(\n        f\"- (act={a:.3f}, {'HIT' if a>threshold else 'MISS'}) {p}\"\n        for p, a in zip(probes, per_probe_acts)\n    )\n    prompt = (\n        f\"You are refining an explanation for an LLM latent feature.{iter_tag}\\n\\n\"\n        f'Current explanation: \"{prev_expl}\"\\n\\n'\n        f\"Reference top-activating snippets (ground truth for feature):\\n\"\n        + \"\\n\".join(f\"- {s}\" for s in snips)\n        + \"\\n\\n\"\n        + f\"Probe sentences you wrote from the current explanation, with actual feature activation \"\n        f\"(threshold={threshold:.3f}):\\n{feedback}\\n\\n\"\n        f\"Analyze why the MISS probes failed and revise the explanation to better match the true concept. \"\n        f\"Reply with ONLY a single revised phrase (max 15 words), no preamble.\"\n    )\n    return (\n        llm_call(prompt, system=\"You iteratively refine LLM feature explanations.\")\n        or prev_expl\n    )\n\n\n# ==================== Hyperparameter Tuning: N_ITER ====================\nN_ITER_VALUES = [1, 2, 3, 5, 7]\nN_PROBES = 5\nDATASET_NAME = \"gemma2_2b_gemmascope_res_16k\"\n\nexperiment_data = {\n    \"N_ITER\": {\n        DATASET_NAME: {\n            \"metrics\": {\"train\": [], \"val\": []},\n            \"losses\": {\"train\": [], \"val\": []},\n            \"predictions\": [],\n            \"ground_truth\": [],\n            \"layer\": LAYER,\n            \"features\": FEATURE_IDS,\n            \"thresholds\": thresholds,\n            \"n_iter_values\": N_ITER_VALUES,\n            \"runs\": {},  # keyed by N_ITER\n        }\n    }\n}\n\n# Neuronpedia baseline (once, shared across all N_ITER runs)\nneuronpedia_scores = []\nneuronpedia_per_feat = {}\nfor fid in FEATURE_IDS:\n    np_expl = neuronpedia_explanation(fid)\n    print(f\"[NP] feat {fid}: {np_expl}\")\n    np_acc, np_probes, np_pp = eval_gen_accuracy(\n        fid, np_expl, n_probes=N_PROBES, seed_tag=\"np\"\n    )\n    print(f\"[NP] feat {fid} gen_acc: {np_acc:.3f}\")\n    neuronpedia_scores.append(np_acc)\n    neuronpedia_per_feat[fid] = {\n        \"explanation\": np_expl,\n        \"gen_acc\": np_acc,\n        \"probes\": np_probes,\n        \"per_probe_acts\": np_pp,\n    }\nnp_mean = float(np.mean(neuronpedia_scores)) if neuronpedia_scores else 0.0\nexperiment_data[\"N_ITER\"][DATASET_NAME][\"neuronpedia\"] = {\n    \"per_feature\": neuronpedia_per_feat,\n    \"mean_gen_acc\": np_mean,\n}\nprint(f\"\\nNeuronpedia mean gen_acc: {np_mean:.3f}\\n\")\n\ntuning_summary = {}\n\nfor N_ITER in N_ITER_VALUES:\n    print(f\"\\n########## N_ITER = {N_ITER} ##########\")\n    sage_scores_per_iter = [[] for _ in range(N_ITER + 1)]\n    per_feature_runs = {}\n\n    for fid in FEATURE_IDS:\n        print(f\"\\n=== [N_ITER={N_ITER}] Feature {fid} ===\")\n        per_feat = {\"iterations\": []}\n\n        # For fair comparison across N_ITER values, use same seed_tag scheme.\n        # Iter 0 is identical across N_ITER; revisions add iter idx to prompt tag (empty for reproducibility).\n        expl = sage_propose_initial(fid)\n        print(f\"  SAGE iter 0: {expl}\")\n        acc, probes, pp = eval_gen_accuracy(fid, expl, n_probes=N_PROBES, seed_tag=\"\")\n        print(f\"  SAGE iter 0 gen_acc: {acc:.3f}\")\n        sage_scores_per_iter[0].append(acc)\n        per_feat[\"iterations\"].append(\n            {\n                \"explanation\": expl,\n                \"gen_acc\": acc,\n                \"probes\": probes,\n                \"per_probe_acts\": pp,\n            }\n        )\n\n        for it in range(1, N_ITER + 1):\n            expl = sage_revise(fid, expl, probes, pp, thresholds[fid], iter_tag=\"\")\n            print(f\"  SAGE iter {it}: {expl}\")\n            acc, probes, pp = eval_gen_accuracy(\n                fid, expl, n_probes=N_PROBES, seed_tag=\"\"\n            )\n            print(f\"  SAGE iter {it} gen_acc: {acc:.3f}\")\n            sage_scores_per_iter[it].append(acc)\n            per_feat[\"iterations\"].append(\n                {\n                    \"explanation\": expl,\n                    \"gen_acc\": acc,\n                    \"probes\": probes,\n                    \"per_probe_acts\": pp,\n                }\n            )\n\n        per_feature_runs[fid] = per_feat\n\n    sage_means = [float(np.mean(s)) if s else 0.0 for s in sage_scores_per_iter]\n    sage_final = sage_means[-1]\n    print(f\"\\n[N_ITER={N_ITER}] means per iter: {[f'{m:.3f}' for m in sage_means]}\")\n    print(\n        f\"[N_ITER={N_ITER}] FINAL gen_acc: {sage_final:.3f} (delta vs NP: {sage_final - np_mean:+.3f})\"\n    )\n\n    run_data = {\n        \"n_iter\": N_ITER,\n        \"per_feature\": per_feature_runs,\n        \"sage_mean_gen_acc_per_iter\": sage_means,\n        \"sage_final_gen_acc\": sage_final,\n        \"delta_over_neuronpedia\": sage_final - np_mean,\n    }\n    experiment_data[\"N_ITER\"][DATASET_NAME][\"runs\"][str(N_ITER)] = run_data\n\n    # Log metrics/losses in the standard structure\n    experiment_data[\"N_ITER\"][DATASET_NAME][\"metrics\"][\"val\"].append(\n        {\n            \"n_iter\": N_ITER,\n            \"sage_final_gen_acc\": sage_final,\n            \"sage_mean_gen_acc_per_iter\": sage_means,\n            \"neuronpedia_mean_gen_acc\": np_mean,\n        }\n    )\n    experiment_data[\"N_ITER\"][DATASET_NAME][\"losses\"][\"val\"].append(\n        {\"n_iter\": N_ITER, \"val_loss\": 1.0 - sage_final}\n    )\n    tuning_summary[N_ITER] = sage_final\n\n# Pick best N_ITER\nbest_n_iter = max(tuning_summary, key=lambda k: tuning_summary[k])\nbest_score = tuning_summary[best_n_iter]\n\nprint(\"\\n===== HYPERPARAM TUNING SUMMARY (N_ITER) =====\")\nprint(f\"Neuronpedia mean gen_acc: {np_mean:.3f}\")\nfor n_iter, sc in tuning_summary.items():\n    marker = \" <-- BEST\" if n_iter == best_n_iter else \"\"\n    print(f\"  N_ITER={n_iter}: final gen_acc = {sc:.3f}{marker}\")\nprint(f\"\\nBest N_ITER = {best_n_iter} with generative_accuracy = {best_score:.4f}\")\nprint(f\"Delta over Neuronpedia: {best_score - np_mean:+.3f}\")\n\nexperiment_data[\"N_ITER\"][DATASET_NAME][\"summary\"] = {\n    \"neuronpedia_mean_gen_acc\": np_mean,\n    \"tuning_summary\": {str(k): v for k, v in tuning_summary.items()},\n    \"best_n_iter\": best_n_iter,\n    \"best_sage_final_gen_acc\": best_score,\n    \"generative_accuracy\": best_score,\n    \"delta\": best_score - np_mean,\n}\n\n# ------------- Plot -------------\ntry:\n    fig, axes = plt.subplots(1, 2, figsize=(14, 5))\n    # Plot 1: final acc vs N_ITER\n    xs = sorted(tuning_summary.keys())\n    ys = [tuning_summary[x] for x in xs]\n    axes[0].plot(xs, ys, \"o-\", label=\"SAGE final gen_acc\")\n    axes[0].axhline(\n        np_mean, color=\"gray\", linestyle=\"--\", label=f\"Neuronpedia ({np_mean:.2f})\"\n    )\n    axes[0].set_xlabel(\"N_ITER (SAGE refinement iterations)\")\n    axes[0].set_ylabel(\"Generative Accuracy\")\n    axes[0].set_title(\"Hyperparam tuning: N_ITER\")\n    axes[0].set_ylim(0, 1)\n    axes[0].legend()\n    for x, y in zip(xs, ys):\n        axes[0].text(x, y + 0.02, f\"{y:.2f}\", ha=\"center\")\n\n    # Plot 2: mean acc curves per iteration for each N_ITER\n    for n_iter in xs:\n        means = experiment_data[\"N_ITER\"][DATASET_NAME][\"runs\"][str(n_iter)][\n            \"sage_mean_gen_acc_per_iter\"\n        ]\n        axes[1].plot(range(len(means)), means, \"o-\", label=f\"N_ITER={n_iter}\")\n    axes[1].axhline(np_mean, color=\"gray\", linestyle=\"--\", label=f\"Neuronpedia\")\n    axes[1].set_xlabel(\"SAGE iteration index\")\n    axes[1].set_ylabel(\"Mean generative accuracy\")\n    axes[1].set_title(\"SAGE refinement trajectories\")\n    axes[1].set_ylim(0, 1)\n    axes[1].legend()\n\n    plt.tight_layout()\n    plt.savefig(\n        os.path.join(working_dir, \"sage_n_iter_tuning_gemma2_2b_L12.png\"), dpi=120\n    )\n    plt.close()\nexcept Exception as e:\n    print(f\"Plot failed: {e}\")\n\n# ------------- Save -------------\nnp.save(\n    os.path.join(working_dir, \"experiment_data.npy\"), experiment_data, allow_pickle=True\n)\nwith open(os.path.join(working_dir, \"experiment_data.json\"), \"w\") as f:\n\n    def _safe(o):\n        if isinstance(o, np.floating):\n            return float(o)\n        if isinstance(o, np.integer):\n            return int(o)\n        if isinstance(o, np.ndarray):\n            return o.tolist()\n        return str(o)\n\n    json.dump(experiment_data, f, indent=2, default=_safe)\n\nhook_handle.remove()\nprint(\"\\nDone.\")\nprint(f\"generative_accuracy = {best_score:.4f} (best N_ITER = {best_n_iter})\")\n", "# Set random seed\nimport random\nimport numpy as np\nimport torch\n\nseed = 0\nrandom.seed(seed)\nnp.random.seed(seed)\ntorch.manual_seed(seed)\nif torch.cuda.is_available():\n    torch.cuda.manual_seed(seed)\n\nimport os, sys, json, time, hashlib, traceback, math, random\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\n# Local-first HF settings\nos.environ.setdefault(\"HF_HUB_OFFLINE\", \"0\")\nos.environ.setdefault(\"HF_ENDPOINT\", \"https://hf-mirror.com\")\nos.environ.setdefault(\"HF_HUB_ENABLE_HF_TRANSFER\", \"0\")\n\nimport numpy as np\nimport torch\nimport torch.nn.functional as F\nimport matplotlib.pyplot as plt\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nDATA_DIR = \"/data/zhenqian/data\"\nMODEL_DIR = \"/data/zhenqian/models\"\nCACHE_DIR = os.path.join(working_dir, \"cache\")\nos.makedirs(CACHE_DIR, exist_ok=True)\n\n# ------------- API client -------------\nAPI_KEY = \"<Your_api>\"\nBASE_URL = \"https://www.dmxapi.cn/v1\"\nAPI_MODEL = \"gpt-5.4\"\n\n# bypass proxy\nfor k in [\n    \"http_proxy\",\n    \"https_proxy\",\n    \"HTTP_PROXY\",\n    \"HTTPS_PROXY\",\n    \"all_proxy\",\n    \"ALL_PROXY\",\n]:\n    os.environ.pop(k, None)\nos.environ[\"NO_PROXY\"] = \"*\"\nos.environ[\"no_proxy\"] = \"*\"\n\ntry:\n    from openai import OpenAI\n\n    client = OpenAI(api_key=API_KEY, base_url=BASE_URL)\n    HAS_LLM = True\nexcept Exception as e:\n    print(f\"OpenAI client init failed: {e}\")\n    HAS_LLM = False\n\nLLM_CACHE_PATH = os.path.join(CACHE_DIR, \"llm_cache.json\")\nif os.path.exists(LLM_CACHE_PATH):\n    with open(LLM_CACHE_PATH) as f:\n        llm_cache = json.load(f)\nelse:\n    llm_cache = {}\n\n\ndef llm_call(prompt, system=\"You are a helpful research assistant.\", max_retries=3):\n    key = hashlib.sha256((system + \"||\" + prompt).encode()).hexdigest()\n    if key in llm_cache:\n        return llm_cache[key]\n    if not HAS_LLM:\n        return \"\"\n    for attempt in range(max_retries):\n        try:\n            resp = client.chat.completions.create(\n                model=API_MODEL,\n                messages=[\n                    {\"role\": \"system\", \"content\": system},\n                    {\"role\": \"user\", \"content\": prompt},\n                ],\n                timeout=60,\n            )\n            out = resp.choices[0].message.content.strip()\n            llm_cache[key] = out\n            with open(LLM_CACHE_PATH, \"w\") as f:\n                json.dump(llm_cache, f)\n            return out\n        except Exception as e:\n            print(f\"LLM call attempt {attempt+1} failed: {e}\")\n            time.sleep(2 + attempt * 2)\n    return \"\"\n\n\n# ------------- Load Gemma-2-2B -------------\nfrom transformers import AutoTokenizer, AutoModelForCausalLM\n\nGEMMA_LOCAL = os.path.join(MODEL_DIR, \"gemma-2-2b\")\ngemma_path = GEMMA_LOCAL if os.path.isdir(GEMMA_LOCAL) else \"google/gemma-2-2b\"\nprint(f\"Loading Gemma from: {gemma_path}\")\n\ntry:\n    tokenizer = AutoTokenizer.from_pretrained(\n        gemma_path, local_files_only=os.path.isdir(GEMMA_LOCAL)\n    )\n    model = AutoModelForCausalLM.from_pretrained(\n        gemma_path,\n        torch_dtype=torch.float16 if device.type == \"cuda\" else torch.float32,\n        local_files_only=os.path.isdir(GEMMA_LOCAL),\n    ).to(device)\n    model.eval()\nexcept Exception as e:\n    print(f\"FATAL: could not load Gemma-2-2B: {e}\")\n    traceback.print_exc()\n    sys.exit(1)\n\n# ------------- Load SAE (GemmaScope) -------------\n# Try local first: $MODEL_DIR/gemma-scope-2b-pt-res/layer_{L}/width_16k/average_l0_{K}/params.npz\nLAYER = 12\nSAE_ROOT_CANDIDATES = [\n    os.path.join(MODEL_DIR, \"gemma-scope-2b-pt-res\"),\n    os.path.join(MODEL_DIR, \"gemmascope-res-16k\"),\n    os.path.join(MODEL_DIR, \"gemma-scope-2b-pt-res-canonical\"),\n]\n\n\ndef find_local_sae(layer):\n    for root in SAE_ROOT_CANDIDATES:\n        if not os.path.isdir(root):\n            continue\n        # search for width_16k directory\n        layer_dir = os.path.join(root, f\"layer_{layer}\", \"width_16k\")\n        if os.path.isdir(layer_dir):\n            for sub in sorted(os.listdir(layer_dir)):\n                p = os.path.join(layer_dir, sub, \"params.npz\")\n                if os.path.exists(p):\n                    return p, sub\n        # flat layout\n        p = os.path.join(root, f\"layer_{layer}_width_16k.npz\")\n        if os.path.exists(p):\n            return p, \"flat\"\n    return None, None\n\n\nsae_path, sae_variant = find_local_sae(LAYER)\nif sae_path is None:\n    # try HF hub download\n    try:\n        from huggingface_hub import hf_hub_download\n\n        for l0 in [82, 22, 41, 176, 445]:\n            try:\n                sae_path = hf_hub_download(\n                    repo_id=\"google/gemma-scope-2b-pt-res\",\n                    filename=f\"layer_{LAYER}/width_16k/average_l0_{l0}/params.npz\",\n                    cache_dir=os.path.join(MODEL_DIR, \"hf_cache\"),\n                )\n                sae_variant = f\"average_l0_{l0}\"\n                break\n            except Exception as e:\n                print(f\"HF download l0={l0} failed: {e}\")\n    except Exception as e:\n        print(f\"HF hub import/download failed: {e}\")\n\nif sae_path is None:\n    print(\n        \"FATAL: could not obtain GemmaScope SAE. Required for whitelisted reproduction.\"\n    )\n    sys.exit(1)\n\nprint(f\"Loading SAE from {sae_path} (variant={sae_variant})\")\nsae_params = np.load(sae_path)\nprint(f\"SAE keys: {list(sae_params.keys())}\")\n\n\nclass JumpReLUSAE(torch.nn.Module):\n    def __init__(self, params):\n        super().__init__()\n        W_enc = torch.tensor(params[\"W_enc\"], dtype=torch.float32)  # (d_model, d_sae)\n        W_dec = torch.tensor(params[\"W_dec\"], dtype=torch.float32)  # (d_sae, d_model)\n        b_enc = torch.tensor(params[\"b_enc\"], dtype=torch.float32)\n        b_dec = torch.tensor(params[\"b_dec\"], dtype=torch.float32)\n        threshold = (\n            torch.tensor(params[\"threshold\"], dtype=torch.float32)\n            if \"threshold\" in params.files\n            else torch.zeros(W_enc.shape[1])\n        )\n        self.W_enc = torch.nn.Parameter(W_enc, requires_grad=False)\n        self.W_dec = torch.nn.Parameter(W_dec, requires_grad=False)\n        self.b_enc = torch.nn.Parameter(b_enc, requires_grad=False)\n        self.b_dec = torch.nn.Parameter(b_dec, requires_grad=False)\n        self.threshold = torch.nn.Parameter(threshold, requires_grad=False)\n\n    def encode(self, x):\n        # x: (..., d_model)\n        pre = (x - self.b_dec) @ self.W_enc + self.b_enc\n        # JumpReLU\n        acts = torch.where(pre > self.threshold, pre, torch.zeros_like(pre))\n        return acts\n\n\nsae = JumpReLUSAE(sae_params).to(device)\nsae.eval()\nD_SAE = sae.W_enc.shape[1]\nprint(f\"SAE d_sae={D_SAE}\")\n\n# ------------- Hook to grab residual stream at LAYER -------------\nresid_cache = {}\n\n\ndef hook_fn(module, inp, out):\n    # out is tuple for decoder layers; first elem is hidden\n    if isinstance(out, tuple):\n        resid_cache[\"h\"] = out[0]\n    else:\n        resid_cache[\"h\"] = out\n\n\nhook_handle = model.model.layers[LAYER].register_forward_hook(hook_fn)\n\n\n@torch.no_grad()\ndef get_sae_activations(texts, batch_size=4, max_len=64):\n    \"\"\"Return list of (seq_len, d_sae) activations per text.\"\"\"\n    results = []\n    for i in range(0, len(texts), batch_size):\n        batch = texts[i : i + batch_size]\n        enc = tokenizer(\n            batch,\n            return_tensors=\"pt\",\n            padding=True,\n            truncation=True,\n            max_length=max_len,\n        ).to(device)\n        model(**enc)\n        h = resid_cache[\"h\"].float()  # (B, T, d_model)\n        acts = sae.encode(h)  # (B, T, d_sae)\n        mask = enc[\"attention_mask\"].bool()\n        for b in range(h.shape[0]):\n            a = acts[b][mask[b]]  # (T_b, d_sae)\n            results.append(a.cpu().numpy())\n    return results\n\n\n# ------------- Reference corpus + threshold calibration -------------\nREF_TEXTS = [\n    \"The quick brown fox jumps over the lazy dog near the riverbank in the morning light.\",\n    \"Economic indicators for the third quarter suggest a mild recovery in consumer spending.\",\n    \"She opened the recipe book and began preparing a hearty vegetable stew for dinner.\",\n    \"The neural network was trained on a large dataset of annotated medical images.\",\n    \"In ancient Rome, the senate wielded significant political power over the republic's affairs.\",\n    \"Photosynthesis converts sunlight, water, and carbon dioxide into glucose and oxygen.\",\n    \"The novel explores themes of identity, memory, and the passage of time in a small village.\",\n    \"def add(a, b): return a + b  # simple python function that sums two numbers\",\n    \"Climate scientists have observed accelerating ice loss in the polar regions this decade.\",\n    \"Basketball players practiced free throws and defensive drills throughout the afternoon.\",\n    \"The symphony's third movement features a haunting oboe solo above pizzicato strings.\",\n    \"Machine learning models can inadvertently encode biases present in their training data.\",\n    \"The volcano erupted with a plume of ash reaching high into the stratosphere.\",\n    \"Legal scholars debated the constitutional implications of the recent supreme court ruling.\",\n    \"Fresh bread and pastries filled the bakery with a warm, inviting aroma.\",\n    \"Astronomers detected a new exoplanet orbiting a distant red dwarf star.\",\n    \"The programmer refactored the recursive function to use an iterative loop instead.\",\n    \"Wildflowers bloomed across the meadow in shades of yellow, purple, and white.\",\n    \"Financial analysts recommend diversifying portfolios to manage investment risk.\",\n    \"The historian meticulously catalogued artifacts from the Bronze Age excavation site.\",\n]\nprint(f\"Computing reference activations on {len(REF_TEXTS)} texts...\")\nref_acts_list = get_sae_activations(REF_TEXTS, batch_size=4, max_len=48)\n# stack all token-level acts: (N_tokens, d_sae)\nref_acts = np.concatenate(ref_acts_list, axis=0)\nprint(f\"ref_acts shape: {ref_acts.shape}\")\n\n# Select features that fire on the reference corpus (nonzero max)\nmax_per_feat = ref_acts.max(axis=0)\nactive_feats = np.where(max_per_feat > 0.1)[0]\nprint(f\"Active features (max>0.1): {len(active_feats)}\")\n\n# Pick a small deterministic subset\nrandom.seed(0)\nFEATURE_IDS = sorted(random.sample(active_feats.tolist(), min(3, len(active_feats))))\nprint(f\"Selected features: {FEATURE_IDS}\")\n\n# Thresholds: 95th percentile of nonzero activations on reference (or a fraction of max)\nthresholds = {}\nfor fid in FEATURE_IDS:\n    col = ref_acts[:, fid]\n    nz = col[col > 0]\n    if len(nz) >= 5:\n        thr = float(np.percentile(nz, 75))\n    else:\n        thr = float(max_per_feat[fid] * 0.3)\n    thresholds[fid] = max(thr, 0.05)\n    print(f\"  feat {fid}: max={max_per_feat[fid]:.3f}, thr={thresholds[fid]:.3f}\")\n\n\n# ------------- Top-activating snippets per feature -------------\n# For each feature, find which ref text gave highest max activation, use those snippets\ndef top_activating_snippets(fid, k=5):\n    scored = []\n    for i, a in enumerate(ref_acts_list):\n        col = a[:, fid]\n        if len(col) == 0:\n            continue\n        m = float(col.max())\n        scored.append((m, i))\n    scored.sort(reverse=True)\n    return [REF_TEXTS[i] for _, i in scored[:k]]\n\n\n# ------------- Neuronpedia baseline explanation (with fallback) -------------\ndef neuronpedia_explanation(fid, layer=LAYER):\n    # Try local cache first\n    cache_file = os.path.join(CACHE_DIR, \"neuronpedia.json\")\n    if os.path.exists(cache_file):\n        with open(cache_file) as f:\n            npc = json.load(f)\n    else:\n        npc = {}\n    key = f\"{layer}_{fid}\"\n    if key in npc:\n        return npc[key]\n    # Try Neuronpedia API\n    try:\n        import requests\n\n        url = f\"https://www.neuronpedia.org/api/feature/gemma-2-2b/{layer}-gemmascope-res-16k/{fid}\"\n        r = requests.get(url, timeout=10)\n        if r.status_code == 200:\n            d = r.json()\n            expls = d.get(\"explanations\", [])\n            if expls:\n                expl = expls[0].get(\"description\", \"\")\n                npc[key] = expl\n                with open(cache_file, \"w\") as f:\n                    json.dump(npc, f)\n                return expl\n    except Exception as e:\n        print(f\"Neuronpedia API failed for {key}: {e}\")\n    # Fallback: use LLM to summarize top snippets (one-shot, mimicking neuronpedia methodology)\n    snips = top_activating_snippets(fid, k=5)\n    prompt = (\n        \"Below are text snippets that strongly activate a hidden feature in a language model. \"\n        \"In ONE short phrase (max 15 words), describe what concept/pattern this feature detects. \"\n        \"Reply with ONLY the phrase, no preamble.\\n\\nSnippets:\\n\"\n        + \"\\n\".join(f\"- {s}\" for s in snips)\n    )\n    expl = llm_call(prompt, system=\"You describe latent features of LLMs concisely.\")\n    if not expl:\n        expl = \"unclear pattern in text\"\n    npc[key] = expl\n    with open(cache_file, \"w\") as f:\n        json.dump(npc, f)\n    return expl\n\n\n# ------------- Probe generation -------------\ndef generate_probes(explanation, n=5):\n    prompt = (\n        f\"Write {n} short, diverse English sentences (10-20 words each) that clearly exemplify the following concept:\\n\"\n        f\"CONCEPT: {explanation}\\n\\n\"\n        f\"Output ONLY the {n} sentences, one per line, no numbering, no preamble.\"\n    )\n    out = llm_call(\n        prompt,\n        system=\"You are a careful writer producing exemplar sentences for a concept.\",\n    )\n    lines = [l.strip(\" -\u2022\\t\").strip() for l in out.split(\"\\n\") if l.strip()]\n    lines = [l for l in lines if len(l.split()) >= 4][:n]\n    while len(lines) < n:\n        lines.append(f\"An example of {explanation}.\")\n    return lines\n\n\n# ------------- Evaluate generative accuracy -------------\ndef eval_gen_accuracy(fid, explanation, n_probes=5):\n    probes = generate_probes(explanation, n=n_probes)\n    acts_list = get_sae_activations(probes, batch_size=n_probes, max_len=48)\n    # per-probe max activation of target feature\n    successes = 0\n    per_probe = []\n    for a in acts_list:\n        m = float(a[:, fid].max()) if len(a) > 0 else 0.0\n        per_probe.append(m)\n        if m > thresholds[fid]:\n            successes += 1\n    return successes / max(len(acts_list), 1), probes, per_probe\n\n\n# ------------- SAGE iterative loop -------------\ndef sage_propose_initial(fid):\n    snips = top_activating_snippets(fid, k=6)\n    prompt = (\n        \"You are analyzing a latent feature in an LLM. Below are top-activating snippets. \"\n        \"Propose a concise ONE-PHRASE description (max 15 words) of what the feature detects. \"\n        \"Reply with only the phrase.\\n\\nSnippets:\\n\"\n        + \"\\n\".join(f\"- {s}\" for s in snips)\n    )\n    return (\n        llm_call(prompt, system=\"You analyze LLM latent features.\") or \"textual pattern\"\n    )\n\n\ndef sage_revise(fid, prev_expl, probes, per_probe_acts, threshold):\n    snips = top_activating_snippets(fid, k=4)\n    feedback = \"\\n\".join(\n        f\"- (act={a:.3f}, {'HIT' if a>threshold else 'MISS'}) {p}\"\n        for p, a in zip(probes, per_probe_acts)\n    )\n    prompt = (\n        f\"You are refining an explanation for an LLM latent feature.\\n\\n\"\n        f'Current explanation: \"{prev_expl}\"\\n\\n'\n        f\"Reference top-activating snippets (ground truth for feature):\\n\"\n        + \"\\n\".join(f\"- {s}\" for s in snips)\n        + \"\\n\\n\"\n        + f\"Probe sentences you wrote from the current explanation, with actual feature activation \"\n        f\"(threshold={threshold:.3f}):\\n{feedback}\\n\\n\"\n        f\"Analyze why the MISS probes failed and revise the explanation to better match the true concept. \"\n        f\"Reply with ONLY a single revised phrase (max 15 words), no preamble.\"\n    )\n    return (\n        llm_call(prompt, system=\"You iteratively refine LLM feature explanations.\")\n        or prev_expl\n    )\n\n\n# ------------- Run experiment -------------\nexperiment_data = {\n    \"gemma2_2b_gemmascope_res_16k\": {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"per_feature\": {},\n        \"layer\": LAYER,\n        \"features\": FEATURE_IDS,\n        \"thresholds\": thresholds,\n    }\n}\n\nN_ITER = 2\nN_PROBES = 5\n\nneuronpedia_scores = []\nsage_scores_per_iter = [\n    [] for _ in range(N_ITER + 1)\n]  # iter 0 = initial propose, 1..N_ITER = revised\n\nfor fid in FEATURE_IDS:\n    print(f\"\\n=== Feature {fid} ===\")\n    per_feat = {\"iterations\": []}\n\n    # Neuronpedia baseline\n    np_expl = neuronpedia_explanation(fid)\n    print(f\"  Neuronpedia expl: {np_expl}\")\n    np_acc, np_probes, np_pp = eval_gen_accuracy(fid, np_expl, n_probes=N_PROBES)\n    print(f\"  Neuronpedia gen_acc: {np_acc:.3f}\")\n    neuronpedia_scores.append(np_acc)\n    per_feat[\"neuronpedia\"] = {\n        \"explanation\": np_expl,\n        \"gen_acc\": np_acc,\n        \"probes\": np_probes,\n        \"per_probe_acts\": np_pp,\n    }\n\n    # SAGE iteration 0\n    expl = sage_propose_initial(fid)\n    print(f\"  SAGE iter 0: {expl}\")\n    acc, probes, pp = eval_gen_accuracy(fid, expl, n_probes=N_PROBES)\n    print(f\"  SAGE iter 0 gen_acc: {acc:.3f}\")\n    sage_scores_per_iter[0].append(acc)\n    per_feat[\"iterations\"].append(\n        {\"explanation\": expl, \"gen_acc\": acc, \"probes\": probes, \"per_probe_acts\": pp}\n    )\n\n    # revise\n    for it in range(1, N_ITER + 1):\n        expl = sage_revise(fid, expl, probes, pp, thresholds[fid])\n        print(f\"  SAGE iter {it}: {expl}\")\n        acc, probes, pp = eval_gen_accuracy(fid, expl, n_probes=N_PROBES)\n        print(f\"  SAGE iter {it} gen_acc: {acc:.3f}\")\n        sage_scores_per_iter[it].append(acc)\n        per_feat[\"iterations\"].append(\n            {\n                \"explanation\": expl,\n                \"gen_acc\": acc,\n                \"probes\": probes,\n                \"per_probe_acts\": pp,\n            }\n        )\n\n    experiment_data[\"gemma2_2b_gemmascope_res_16k\"][\"per_feature\"][fid] = per_feat\n\n    # Track metrics like \"epochs\"\n    print(f\"Epoch {fid}: validation_loss = {1.0 - sage_scores_per_iter[-1][-1]:.4f}\")\n    experiment_data[\"gemma2_2b_gemmascope_res_16k\"][\"metrics\"][\"val\"].append(\n        {\n            \"feature\": fid,\n            \"neuronpedia_gen_acc\": np_acc,\n            \"sage_gen_acc_iters\": (\n                [s[-1] for s in sage_scores_per_iter if len(s) > 0][-1]\n                if False\n                else [sage_scores_per_iter[i][-1] for i in range(N_ITER + 1)]\n            ),\n        }\n    )\n    experiment_data[\"gemma2_2b_gemmascope_res_16k\"][\"losses\"][\"val\"].append(\n        1.0 - sage_scores_per_iter[-1][-1]\n    )\n\n# ------------- Aggregate & report -------------\nnp_mean = float(np.mean(neuronpedia_scores)) if neuronpedia_scores else 0.0\nsage_means = [float(np.mean(s)) if s else 0.0 for s in sage_scores_per_iter]\nsage_final = sage_means[-1]\n\nprint(\"\\n===== SUMMARY =====\")\nprint(f\"Neuronpedia mean gen_acc: {np_mean:.3f}\")\nfor i, m in enumerate(sage_means):\n    print(f\"SAGE iter {i} mean gen_acc: {m:.3f}\")\nprint(f\"FINAL generative_accuracy (SAGE): {sage_final:.3f}\")\nprint(f\"Delta over Neuronpedia: {sage_final - np_mean:+.3f}\")\n\nexperiment_data[\"gemma2_2b_gemmascope_res_16k\"][\"summary\"] = {\n    \"neuronpedia_mean_gen_acc\": np_mean,\n    \"sage_mean_gen_acc_per_iter\": sage_means,\n    \"sage_final_gen_acc\": sage_final,\n    \"delta\": sage_final - np_mean,\n    \"generative_accuracy\": sage_final,\n}\n\n# ------------- Plot -------------\ntry:\n    fig, ax = plt.subplots(figsize=(8, 5))\n    x = [\"Neuronpedia\"] + [f\"SAGE it{i}\" for i in range(N_ITER + 1)]\n    y = [np_mean] + sage_means\n    ax.bar(x, y, color=[\"gray\"] + [\"C0\"] * (N_ITER + 1))\n    ax.set_ylabel(\"Generative Accuracy\")\n    ax.set_title(\n        f\"SAGE vs Neuronpedia (Gemma-2-2B L{LAYER}, {len(FEATURE_IDS)} features)\"\n    )\n    ax.set_ylim(0, 1)\n    for i, v in enumerate(y):\n        ax.text(i, v + 0.02, f\"{v:.2f}\", ha=\"center\")\n    plt.tight_layout()\n    plt.savefig(\n        os.path.join(working_dir, \"sage_vs_neuronpedia_gemma2_2b_L12.png\"), dpi=120\n    )\n    plt.close()\nexcept Exception as e:\n    print(f\"Plot failed: {e}\")\n\n# ------------- Save -------------\nnp.save(\n    os.path.join(working_dir, \"experiment_data.npy\"), experiment_data, allow_pickle=True\n)\nwith open(os.path.join(working_dir, \"experiment_data.json\"), \"w\") as f:\n\n    def _safe(o):\n        if isinstance(o, np.floating):\n            return float(o)\n        if isinstance(o, np.integer):\n            return int(o)\n        if isinstance(o, np.ndarray):\n            return o.tolist()\n        return str(o)\n\n    json.dump(experiment_data, f, indent=2, default=_safe)\n\nhook_handle.remove()\nprint(\"\\nDone.\")\nprint(f\"generative_accuracy = {sage_final:.4f}\")\n", "# plotting aggregation code"], "term_out": ["['Using device: cuda', '\\n', 'Loading Gemma from:\n/data/zhenqian/models/gemma-2-2b', '\\n', '[transformers] `torch_dtype` is\ndeprecated! Use `dtype` instead!\\n', '\\rLoading weights:   0%|          | 0/288\n[00:00<?, ?it/s]', '\\rLoading weights:   0%|          | 1/288 [00:00<04:30,\n1.06it/s]', '\\rLoading weights:  31%|###       | 88/288 [00:01<00:01,\n112.23it/s]', '\\rLoading weights:  45%|####5     | 131/288 [00:01<00:01,\n125.90it/s]', '\\rLoading weights:  56%|#####6    | 162/288 [00:01<00:00,\n127.21it/s]', '\\rLoading weights:  65%|######4   | 186/288 [00:01<00:00,\n131.34it/s]', '\\rLoading weights:  72%|#######1  | 207/288 [00:01<00:00,\n130.51it/s]', '\\rLoading weights:  78%|#######8  | 225/288 [00:02<00:00,\n127.42it/s]', '\\rLoading weights:  85%|########5 | 245/288 [00:02<00:00,\n128.50it/s]', '\\rLoading weights:  92%|#########2| 265/288 [00:02<00:00,\n142.18it/s]', '\\rLoading weights:  98%|#########7| 282/288 [00:02<00:00,\n140.85it/s]', '', '\\rLoading weights: 100%|##########| 288/288 [00:02<00:00,\n117.28it/s]', '\\n', 'Loadin bserve a clear trend across feature frequencies. This suggests the experiment is at a very preliminary stage with limited feature coverage. For a proper analysis, many more features across different frequency ranges would need to be evaluated.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_7e415c6ca1794be6a2b188e975cd098f_proc_3987024/gemma2_2b_per_feature_accuracy_curves.png"}, {"analysis": "This bar chart compares three explanation methods (Neuronpedia, SAGE-1shot, SAGE-iter) across three metrics: Generative Accuracy, Predictive Accuracy (Pearson r), and Cost per Feature (USD). All methods show a Generative Accuracy of exactly 1.0, which is suspicious and likely indicates either a trivial evaluation setup or an extremely small sample size where all methods succeeded. Predictive Accuracy values are very low (~0.05-0.10) for all methods, with the values being nearly identical across methods. Cost per Feature appears near zero for all methods on this scale. The uniformity of results across methods suggests either (1) the sample size is too small to differentiate methods, (2) the evaluation metrics are not sensitive enough, or (3) there is an implementation issue. This preliminary result does not yet demonstrate the hypothesized advantage of the iterative SAGE approach over Neuronpedia baselines.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_7e415c6ca1794be6a2b188e975cd098f_proc_3987024/gemma2_2b_mean_gen_accuracy_bar.png"}, {"analysis": "This heatmap shows 'Per-Feature Predictive Accuracy (Pearson r)' with features on the x-axis (feature_5769, feature_10352) and methods on the y-axis (Neuronpedia, SAGE-1shot, SAGE-iter). Only 2 features are shown, which is far too few to draw meaningful conclusions. The values range approximately from 0.00 to 0.20, with SAGE-iter showing the highest value (~0.19) on feature_5769, while other combinations show much lower values (near 0 to 0.10). The color scale runs from dark purple (low) to yellow (high). While SAGE-iter appears to slightly outperform on one feature, the extremely limited number of features evaluated makes any conclusions premature. A proper evaluation would require dozens or hundreds of features across different layers and activation patterns.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_7e415c6ca1794be6a2b188e975cd098f_proc_3987024/gemma2_2b_per_probe_activation_heatmap.png"}, {"analysis": "This bar chart shows 'Iterative Refinement: Predictive Accuracy over Rounds' comparing round_1 vs round_final (final round after iteration). Two features are shown: feature_5769 and feature_10352. For feature_5769, there is a substantial improvement from round_1 (~0.09) to round_final (~0.19), roughly doubling the predictive accuracy. For feature_10352, both rounds show very low accuracy (~0.02-0.03) with minimal improvement from iteration. This provides some preliminary evidence that iterative refinement can improve explanations for some features, but the effect is highly feature-dependent. The result is encouraging for the hypothesis that iteration helps, but with only 2 features, it's impossible to characterize when iteration helps and when it doesn't. More features and multiple iteration rounds (not just first vs last) would strengthen this analysis.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_7e415c6ca1794be6a2b188e975cd098f_proc_3987024/sage_vs_neuronpedia_gemma2_2b_L12.png"}, {"analysis": "This scatter plot titled 'Predictive vs Generative Accuracy' shows the relationship between predictive accuracy (x-axis, 0 to 1) and generative accuracy (y-axis, 0 to 1) for the three methods. All data points appear clustered at generative accuracy = 1.0, forming a horizontal line at the top of the plot. The predictive accuracy values are spread across a low range (approximately 0.0 to 0.2). This confirms that all methods trivially achieve perfect generative accuracy in this preliminary experiment, which is not informative. In a meaningful evaluation, generative accuracy should vary across features and methods to allow discrimination. The lack of variation on the y-axis suggests either the generative test is too easy, uses a lenient threshold, or the sample of features/prompts is not challenging enough. This is a critical issue to address before scaling up experiments.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_7e415c6ca1794be6a2b188e975cd098f_proc_3987024/gemma2_2b_val_loss_per_feature.png"}], [{"analysis": "Plot shows Accuracy (%) vs Iteration for what appears to be a hyperparameter tuning experiment. Two lines are present: a blue line (Model A / Config 1) starting at approximately 78-80% and gradually rising to about 85-87% over 10 iterations, and an orange line (Model B / Config 2) starting near 82% and rising to approximately 90-92%. The trends suggest that the second configuration outperforms the first consistently across iterations. However, without clearer axis labels or a legend visible in the description, the specifics of what is being compared (learning rates, batch sizes, etc.) are ambiguous. The plot does not appear to be directly related to the stated research idea about SAE feature explanation for LLMs (Gemma-2-2B with gemmascope-res-16k), which is concerning given the sub-stage goal is baseline tuning for that pipeline.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_8c84e38fe83a4e7bb40ac484e7262f99_proc_4068890/gemma2_2b_gemmascope_res_16k_refinement_trajectories.png"}, {"analysis": "This plot appears to show a bar chart or grouped comparison across different datasets or conditions. It seems to di ear evaluation of\nfeature explanation quality, (3) Focus on image datasets rather than LLM\ninterpretability tasks, (4) Missing the iterative propose-test-revise loop\nevaluation that is central to the SAGE hypothesis.\"", "The plots show what appears to be a first-attempt baseline_tuning run of the\nSAGE iterative explanation pipeline for SAE features. Critical issues observed:\n(1) Training/loss curves are essentially flat at zero, showing no learning\ndynamics. (2) All three methods (Neuronpedia baseline, SAGE single-candidate,\nSAGE multi-candidate) show virtually identical performance on both generative\nand predictive accuracy metrics, contradicting the core hypothesis that SAGE\nshould outperform Neuronpedia. (3) The iteration ablation shows completely flat\naccuracy across 1, 2, 3, and 5 iterations, strongly suggesting the iterative\npropose-test-revise loop is not actually improving explanations\u2014a critical\nfailure mode for this research. (4) Layer-wise comparisons (early/mid/late) show\nno differentiation either. Overall, the results appear to be either placeholder\nvalues, a non-functional pipeline, or a run where the iterative feedback\nmechanism is not connected to real activation-based revision. The hyperparameter\ntuning stage should focus on ensuring the pipeline actually incorporates\nactivation feedback into explanation revision, verifying the API calls to GPT-5\nreturn meaningful revised candidates, and checking that the probe-input\nactivation querying is functioning. Consider adding logging/intermediate outputs\nto verify each stage of the propose-test-revise loop is operating on real data\nbefore attempting hyperparameter sweeps.", "[]"], "exec_time": [60.113988399505615, 128.58354568481445, 19.64879298210144, null], "exec_time_feedback": ["", "", "", ""], "datasets_successfully_tested": [["[\"gemma2_2b_gemmascope_res_16k\"]"], ["[\"gemma2_2b_gemmascope_res_16k\"]"], ["[]"], []], "plot_code": ["import matplotlib.pyplot as plt\nimport nump
