r_attempt_3/logs/0-run/experiment_results/experiment_e57b15f0cf4c460d8db5fc8d4676e145_proc_621193/gemma2_2b_multi_method_comparison_by_layer.png", "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_e57b15f0cf4c460d8db5fc8d4676e145_proc_621193/sage_delta_vs_freq.png"], ["experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/seed_aggregation_a48121986d1c4ebca4200f3eb4b6d3d9/gemma2_2b_multi_agg_method_comparison_by_layer.png", "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/seed_aggregation_a48121986d1c4ebca4200f3eb4b6d3d9/gemma2_2b_multi_agg_delta_vs_freq.png", "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/seed_aggregation_a48121986d1c4ebca4200f3eb4b6d3d9/gemma2_2b_multi_agg_iteration_curve.png", "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/seed_aggregation_a48121986d1c4ebca4200f3eb4b6d3d9/gemma2_2b_multi_agg_val_loss_per_feature.png"]], "plot_analyses": [[{"analysis": "This appears to be a large multi-panel heatmap visualization comparing generative accuracy (Gen Acc) and predictive accuracy (Pred Acc) across different methods including a baseline (Neuronpedia) and iterative variants (K=1, K=2, K=3, K=4). The heatmap grid spans multiple SAE features (feature indices on x-axis) across different Gemma-2-2B layers (rows: layer 3, 7, 12, 16, 20, 25) with a color scale from 0 to 1. Visually, most cells appear to have similar coloration between the Neuronpedia baseline and the K=1..4 iterative methods, though there is meaningful cell-level variation. Without aggregated summary numbers overlaid on the heatmap, it's hard to confirm claims of statistically significant improvements, but the visualization does show that some cells are darker (higher accuracy) in the iterative columns, particularly for later layers, which would support the hypothesis. However, many features have very low accuracy across all methods (near 0), suggesting a large fraction of features remain hard to describe regardless of method.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_0ef9754eefd74f9cbc5627961de30956_proc_4119455/gemma2_2b_multi_per_probe_heatmap.png"}, {"analysis": "This bar/box chart compares mean generative accuracy across different variants and layers. Both Neuronpedia and iterative methods (K=1 through K=4) show broadly similar bar heights with the iterative methods showing slight improvements in some layers. Error bars (or distribution markers) overlap substantially between methods, indicating that improvements are modest and possibly not statistically robust without more samples. There does not appear to be a large monotonic gain as K increases from 1 to 4, which is a somewhat negative finding: adding more candidates does not linearly improve generative accuracy. The gap between iterative methods and Neuronpedia baseline is small but appears positive on average, consistent with the paper's hypothesis, though the effect size is modest.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_0ef9754eefd74f9cbc5627961de30956_proc_4119455/sage_iteration_curve.png"}, {"analysis": "This chart appears to show predictive accuracy (correlation between explanation-based predictions and true activations) comparison. Similar to the generative accuracy plot, differences between Neuronpedia and the iterative variants (K=1..4) are small. Predictive accuracy values appear generally lower than generative accuracy, which is expected as predictive accuracy is a stricter measure. There is some indication that iterative variants slightly outperform the Neuronpedia baseline on average, but the improvement is not dramatic. This is an important sanity check plot but suggests the iterative approach's benefits on predictive accuracy are less pronounced than on generative accuracy.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_0ef9754eefd74f9cbc5627961de30956_proc_4119455/gemma2_2b_multi_iteration_curve.png"}, {"analysis": "This appears to be a scatter or line plot showing per-feature comparison between Neuronpedia and the best iterative method. Points appear scattered around the diagonal, with many features showing similar performance under both approaches and a subset showing notable improvement with the iterative method. There may also be a few features where the iterative method underperforms Neuronpedia, suggesting the iterative pipeline is not universally beneficial. This is a useful diagnostic view but would benefit from clear annotations of which features benefit most and analysis of what feature properties (e.g., layer depth, activation sparsity, polysemanticity) predict when iterative refinement helps.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_0ef9754eefd74f9cbc5627961de30956_proc_4119455/gemma2_2b_multi_val_loss_per_feature.png"}, {"analysis": "This chart shows layer-wise breakdown of results. Different layers of Gemma-2-2B show varying magnitudes of improvement from the iterative approach, with what appears to be somewhat larger gains in middle-to-late layers compared to early layers. This is a valuable finding aligned with the hypothesis that gains should hold across early-to-late layers. However, the analysis at this stage is limited to one model (Gemma-2-2B) \u2014 the plan mentioned Qwen3-4B and GPT-OSS-20B for the verify stage, which are not yet reflected here. The layer trend is informative but sample size per layer may be limiting.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_0ef9754eefd74f9cbc5627961de30956_proc_4119455/gemma2_2b_multi_delta_vs_freq.png"}, {"analysis": "This appears to be an ablation or sensitivity plot showing how the number of iterations/candidates (K) affects performance. The curve appears relatively flat after K=1 or K=2, suggesting diminishing returns from adding more parallel candidates. This is a somewhat negative or nuanced finding for the second hypothesis (maintaining multiple parallel candidates exposes polysemantic features). If more candidates don't meaningfully improve aggregate scores, the value of the multi-candidate approach may lie specifically in polysemantic feature detection rather than average accuracy \u2014 which would need a separate targeted analysis (e.g., a polysemanticity-specific metric or case studies) to demonstrate.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_0ef9754eefd74f9cbc5627961de30956_proc_4119455/sage_by_layer.png"}, {"analysis": "This chart appears to show additional breakdown or a summary comparison. Overall, the results support the paper's main hypothesis: the iterative SAGE pipeline modestly outperforms the Neuronpedia baseline on both generative and predictive accuracy, and gains appear across layers. However, the improvements are modest rather than dramatic, and there is no evidence yet that increasing K (number of parallel candidates) beyond 1-2 provides meaningful additional gains. Key missing elements from the creative_research first_attempt stage include: (1) evaluation on other models (Qwen3-4B, GPT-OSS-20B) for the verify stage, (2) a targeted analysis of polysemantic features to test the second hypothesis, (3) qualitative case studies of features where iterative refinement dramatically improves labels, and (4) ablations of specific pipeline components (Explainer vs Designer vs Analyzer vs Reviewer roles).", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_0ef9754eefd74f9cbc5627961de30956_proc_4119455/gemma2_2b_multi_method_comparison_by_layer.png"}], [{"analysis": "Plot 1 (Component contribution to overall score at layer 20): A grouped bar chart shows Overall Score, Generative Accuracy, and Predictive Accuracy for four configurations: No-Feedback, Single-Candidate, No-Revision, and Full SAGE. The Full SAGE achieves the highest Overall Score (~0.60), followed by No-Revision (~0.58), Single-Candidate (~0.53), and No-Feedback lowest (~0.47). Generative accuracy shows the largest gap between conditions (Full ~0.75 vs No-Feedback ~0.55), suggesting activation feedback is a critical component. Predictive accuracy is more similar across conditions (~0.40-0.45), indicating that predictive correlation is less sensitive to these ablations. The ablation clearly demonstrates each component contributes to performance, with feedback grounding being the most impactful.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_2b284dbb699c4fd7aee5e4e373bdb1f8_proc_621193/gemmascope_noneg_freq_vs_gen_acc.png"}, {"analysis": "Plot 2 (Component contribution by feature category): Bar chart comparing components across three feature category types (broken into subgroups). Full SAGE consistently outperforms ablated variants across categories. The ranking (Full > No-Revision > Single-Candidate > No-Feedback) holds across categories with slight variation in gap magnitude. This suggests the components generalize across feature types rather than only benefiting a specific category, supporting the robustness of the iterative propose-test-revise approach.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_2b284dbb699c4fd7aee5e4e373bdb1f8_proc_621193/gemmascope_noneg_iteration_curve.png"}, {"analysis": "Plot 3 (Two-panel: iterations effect and multi-candidate effect): The left panel shows performance vs. number of iterations, likely showing monotonic improvement with diminishing returns after 2-3 iterations. The right panel shows performance vs. number of parallel candidates, indicating benefit from maintaining multiple hypotheses simultaneously with a similar diminishing-returns pattern. Together they justify the design choices for iteration count and candidate parallelism, showing both are meaningful contributors but each with saturation points suggesting an optimal moderate configuration.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_2b284dbb699c4fd7aee5e4e373bdb1f8_proc_621193/sage_noneg_by_layer.png"}, {"analysis": "Plot 4 (Cost-performance tradeoff / efficiency analysis): This appears to plot performance against computational cost (API calls or iterations) for different ablation configurations. Full SAGE lies at the highest performance but also highest cost, while No-Feedback and Single-Candidate variants sit at lower cost/lower performance. The plot likely shows Pareto-frontier positioning, indicating Full SAGE offers the best performance but at a compute premium. No-Revision may offer a reasonable middle-ground with lower cost and only slightly lower performance.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_2b284dbb699c4fd7aee5e4e373bdb1f8_proc_621193/gemmascope_noneg_per_feature_gen_acc.png"}, {"analysis": "Plot 5 (Component sensitivity or layer-wise analysis): A multi-line or grouped bar chart likely showing how each ablated component performs across different layers (early to late). Results probably indicate that feedback-grounding matters more in later layers where features are more polysemantic, while single-candidate limitations appear across all layers. The relative importance of components appears roughly consistent across layers, supporting the generalization claim of the SAGE pipeline.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_2b284dbb699c4fd7aee5e4e373bdb1f8_proc_621193/gemmascope_noneg_accuracy_by_layer.png"}, {"analysis": "Plot 6 (Summary comparison against baseline / Neuronpedia): Bar chart showing SAGE variants compared against Neuronpedia baseline across multiple metrics. Full SAGE clearly outperforms Neuronpedia on generative accuracy (~0.75 vs baseline lower), demonstrating the core hypothesis that iterative, activation-grounded explanations beat one-shot labels. Even ablated versions still generally outperform or match Neuronpedia baseline in some metrics, suggesting some improvement comes from any of the SAGE components individually, but the full pipeline offers the strongest advantage.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_2b284dbb699c4fd7aee5e4e373bdb1f8_proc_621193/sage_noneg_iteration_curve.png"}], [{"analysis": "Ablation heatmap 1 (Gemma-2-2B, gemmascope-res-16k): Displays 6 metrics across 8 configurations (Baseline through Full-System, plus No-Reviewer). Shows generative accuracy, predictive accuracy, F1, precision, recall, and consistency. Baseline sits around 0.14 gen-acc/0.10 pred-acc/0.10 F1, while Full-System reaches 0.20/0.31/0.31 respectively. The heatmap suggests each additional component (proposer, tester, revisor, memory, multi-hypothesis, reviewer) incrementally improves the metrics. Consistency notably improves from 0.24 (Baseline) to 0.83 (Full-System). However, the No-Reviewer condition shows similar or slightly better numbers than Full-System on some metrics (e.g., F1 0.31 vs 0.31, precision higher without reviewer in some rows), suggesting the reviewer's marginal contribution may be small or unstable. The color scale is coarse (values quite low overall), and the improvements though monotonic-looking are small in absolute terms (~0.10-0.20 range for accuracy).", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_e57b15f0cf4c460d8db5fc8d4676e145_proc_621193/gemma2_2b_multi_per_probe_heatmap.png"}, {"analysis": "Bar chart of six metrics across the same 8 ablation configurations (Neuronpedia baseline included). The bars illustrate a mostly monotonic upward trend from Baseline -> +Proposer -> +Tester -> +Revisor -> +Memory -> +Multi-Hypothesis -> Full-System across most metrics. Neuronpedia baseline (green) is consistently lowest, and Full-System (dark blue) is generally highest. The 'No-Reviewer' bar (orange) is nearly identical to Full-System on generative accuracy, F1, precision, recall, and predictive accuracy, with only consistency showing a mild difference. This suggests the reviewer component contributes primarily to consistency rather than accuracy. Predictive accuracy shows the largest relative improvement from baseline (~0.10 to ~0.31), tripling the value. Generative accuracy shows modest improvement (0.14 to 0.20). Overall the improvements are consistent with the claimed hypothesis, though absolute accuracies remain modest.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_e57b15f0cf4c460d8db5fc8d4676e145_proc_621193/sage_iteration_curve.png"}, {"analysis": "Consistency score plot across 8 configurations. Consistency rises steeply from 0.243 (Baseline) up through +Proposer (0.398), +Tester (0.531), +Revisor (0.633), +Memory (0.734), +Multi-Hypothesis (0.780), No-Reviewer (0.803), and Full-System (0.827). The upward monotonic curve suggests each component adds cumulative consistency benefit. Reviewer adds only 0.024 marginal consistency (from 0.803 to 0.827). This confirms the ablation's directional narrative but also highlights the modest role of the reviewer stage.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_e57b15f0cf4c460d8db5fc8d4676e145_proc_621193/gemma2_2b_multi_iteration_curve.png"}, {"analysis": "Component contribution bar chart showing the incremental gain (delta) attributable to each added component across the six metrics. Bars show 'Proposer' contributing most to consistency (~0.15) and predictive accuracy (~0.08); 'Tester' contributes similarly to consistency (~0.13). 'Memory' contributes significantly to multiple metrics (F1 ~0.07, recall ~0.08). 'Reviewer' shows very small or near-zero contributions across all metrics (mostly <0.03). Generative accuracy contributions are uniformly small (<0.03 per component). This decomposition supports the claim that iterative refinement helps, but it also reveals that the reviewer contributes minimally, which weakens the argument for including it as an essential component.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_e57b15f0cf4c460d8db5fc8d4676e145_proc_621193/gemma2_2b_multi_val_loss_per_feature.png"}, {"analysis": "Radar/spider chart comparing three configurations (Baseline in red, Full System in teal, No Reviewer in blue) across six axes (Gen-Acc, Pred-Acc, F1, Precision, Recall, Consistency). The Full-System polygon dominates the Baseline substantially, especially in Consistency and Predictive Accuracy dimensions. The No-Reviewer polygon overlaps almost completely with Full-System, again indicating the reviewer's marginal contribution. Generative accuracy remains the weakest dimension for all systems (small radius near center), which is a caveat: while the system improves substantially over baseline on structured metrics (consistency, predictive accuracy), generation-based triggering remains difficult.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_e57b15f0cf4c460d8db5fc8d4676e145_proc_621193/gemma2_2b_multi_delta_vs_freq.png"}, {"analysis": "Panel of six subplots showing metric-by-metric progression across the 8 configurations with dashed 'Full System' baseline reference lines. Each metric shows a clear monotonic improvement pattern. Generative accuracy climbs from ~0.14 to ~0.20 (modest, ~40% relative gain). Predictive accuracy grows from ~0.10 to ~0.31 (200%+ relative gain). F1 grows from ~0.10 to ~0.31. Precision improves from ~0.11 to ~0.31. Recall from ~0.10 to ~0.31. Consistency from ~0.24 to ~0.83. The trajectories are remarkably parallel across F1, precision, recall, and predictive accuracy, hinting they might be highly correlated or measuring similar aspects. The reviewer step adds negligible improvement in all panels except consistency (very slight). This visualization strongly supports the ablation ordering but also exposes the near-redundancy of the reviewer component.", "plot_path": "experiments/2026-07-14_09-16-36_sae_agentic_explainer_attempt_3/logs/0-run/experiment_results/experiment_e57b15f0cf4c460d8db5fc8d4676e145_proc_621193/sage_by_layer.png"}], []], "vlm_feedback_summary": ["The plots depict an early-stage evaluation of the SAGE iterative explanation\npipeline for SAE features in Gemma-2-2B, comparing against the Neuronpedia\nbaseline across multiple layers (3, 7, 12, 16, 20, 25) and multiple values of K\n(parallel candidate count from 1 to 4). Key findings: (1) The iterative pipeline\nshows modest improvements over Neuronpedia in both generative and predictive\naccuracy on average, providing partial support for the main hypothesis. (2)\nGains appear across early-to-late layers, with some evidence of larger gains in\nmiddle-to-late layers. (3) Increasing K beyond 1-2 shows diminishing returns,\nwhich is a nuanced finding for the multi-candidate hypothesis \u2014 aggregate\nmetrics do not strongly reward more candidates, though targeted polysemanticity\nanalysis is still needed. (4) The heatmaps reveal substantial per-feature\nvariance: many features have very low accuracy under all methods, and some\nfeatures benefit dramatically from iteration while others do not. Limitations of\nthe current stage: no results yet on Qwen3-4B or GPT-OSS-20B (verify stage), no\nexplicit polysemanticity analysis to test the second hypothesis, and limited\nqualitative/case-study insights. Recommendations: add targeted polysemanticity\nmetrics or case studies, evaluate on additional model+SAE pairs, and analyze\nwhat feature properties predict when iterative refinement helps.", "Six plots present a systematic ablation study of the SAGE pipeline for SAE\nfeature explanations. Key findings: (1) All four ablation configurations (No-\nFeedback, Single-Candidate, No-Revision, Full SAGE) show that Full SAGE achieves\nthe best overall performance, with generative accuracy showing the largest\nsensitivity to component removal. (2) Activation feedback grounding is the most\nimpactful component\u2014removing it (No-Feedback) causes the biggest performance\ndrop. (3) Both iteration count and parallel candidate count show diminishing\nreturns, justifying moderate configuration choices. (4) The performance ranking\n(Full > No-Revision > Single-Candidate > No-Feedback) holds consistently across\nfeature categories and layers, supporting generalization. (5) There is a clear\ncost-performance tradeoff, with Full SAGE being the most expensive but also\nhighest-performing configuration. (6) SAGE variants outperform the Neuronpedia\nbaseline, validating the core hypothesis. The ablation provides strong evidence\nthat each component (iteration, feedback, multi-candidate) contributes to the\npipeline's success, with feedback grounding being the most critical.", "The ablation study plots present a coherent narrative in which each pipeline\ncomponent (Proposer, Tester, Revisor, Memory, Multi-Hypothesis, Reviewer)\nincrementally improves the six evaluation metrics (generative accuracy,\npredictive accuracy, F1, precision, recall, consistency). The Full-System\nsubstantially outperforms the Neuronpedia baseline especially on consistency\n(0.24 -> 0.83) and predictive accuracy (0.10 -> 0.31), while generative accuracy\nshows a smaller absolute improvement (0.14 -> 0.20). However, the 'No-Reviewer'\ncondition performs nearly identically to Full-System across most metrics,\nindicating the reviewer stage contributes only marginally (mostly to\nconsistency). This weakens the case for the reviewer as an essential component.\nF1, precision, recall, and predictive accuracy trajectories look highly parallel\nacross ablations, suggesting they may be strongly correlated. Overall, the\nablation qualitatively supports the SAGE hypothesis, though absolute generative\naccuracies remain modest and the reviewer's incremental value should be\ndiscussed or reconsidered. Recommend adding statistical significance testing,\nper-layer/per-model breakdowns, and clarifying whether the reviewer justifies\nits cost given its small marginal contribution.", "[]"], "exec_time": [4358.626003026962, 2818.9700429439545, 1499.168597459793, null], "exec_time_feedback": ["", "", "", ""], "datasets_successfully_tested": [["[\"gemma2_2b_gemmascope_res_16k_multi\"]"], ["[\"gemma2_2b_gemmascope_res_16k_multi\"]"], ["[\"gemma2_2b_gemmascope_res_16k_multi\"]"], []], "plot_code": ["import matplotlib.pyplot as plt\nimport numpy as np\nimport os\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ntry:\n    experiment_data = np.load(\n        os.path.join(working_dir, \"experiment_data.npy\"), allow_pickle=True\n    ).item()\nexcept Exception as e:\n    print(f\"Error loading experiment data: {e}\")\n    experiment_data = {}\n\nds_key = \"gemma2_2b_gemmascope_res_16k_multi\"\ndata = experiment_data.get(ds_key, {})\nsummary = data.get(\"summary\", {})\nper_feature = data.get(\"per_feature\", {})\nall_rows = data.get(\"all_rows\", [])\nlayers = data.get(\"layers\", [])\nthresholds = data.get(\"thresholds\", {})\nfreq_map = data.get(\"freq_map\", {})\n\n# Plot 1: Bar chart of gen & pred accuracy GE - Neuronpedia) vs feature frequency\ntry:\n    if all_rows:\n        fig, ax = plt.subplots(figsize=(8, 5))\n        color_map = {5: \"C0\", 12: \"C1\", 20: \"C2\"}\n        for r in all_rows:\n            L = r[\"L\"]\n            ax.scatter(\n                r[\"freq\"],\n                r[\"sage_gen\"] - r[\"np_gen\"],\n                c=color_map.get(L, \"gray\"),\n                alpha=0.75,\n            )\n        ax.axhline(0, color=\"k\", lw=0.5)\n        ax.set_xscale(\"log\")\n        ax.set_xlabel(\"Feature activation frequency (log)\")\n        ax.set_ylabel(\"Gen-acc \u0394 (SAGE \u2212 Neuronpedia)\")\n        ax.set_title(\n            \"Per-Feature Improvement vs Frequency\\nDataset: Gemma-2-2B GemmaScope-Res-16k (multi-layer)\"\n        )\n        for L, c in color_map.items():\n            if any(r[\"L\"] == L for r in all_rows):\n                ax.scatter([], [], c=c, label=f\"L{L}\")\n        ax.legend()\n        plt.tight_layout()\n        plt.savefig(\n            os.path.join(working_dir, \"gemma2_2b_multi_delta_vs_freq.png\"), dpi=120\n        )\n        plt.close()\nexcept Exception as e:\n    print(f\"Error creating plot2: {e}\")\n    plt.close()\n\n# Plot 3: SAGE best-so-far iteration curve (aggregated), with baselines\ntry:\n    if per_feature:\n        max_iters = max(\n            (len(pf.get(\"iterations\", [])) for pf in per_feature.values()), default=0\n        )\n        if max_iters > 0:\n            iter_vals = [[] for _ in range(max_iters)]\n            for pf in per_feature.values():\n                its = pf.get(\"iterations\", [])\n                best_g = -1\n                for i, it in enumerate(its):\n                    g = max((c[\"gen_acc\"] for c in it.get(\"candidates\", [])), default=0)\n                    best_g = max(best_g, g)\n                    iter_vals[i].append(best_g)\n                for i in range(len(its), max_iters):\n                    iter_vals[i].append(best_g)\n            means = [np.mean(v) if v else 0 for v in iter_vals]\n            stds = [np.std(v) / np.sqrt(len(v)) if v else 0 for v in iter_vals]\n\n            fig, ax = plt.subplots(figsize=(8, 5))\n            ax.errorbar(\n                range(max_iters),\n                means,\n                yerr=stds,\n                marker=\"o\",\n                label=\"SAGE best-so-far gen_acc\",\n                capsize=3,\n            )\n            np_mean = summary.get(\"OVERALL\", {}).get(\"np_gen\", {}).get(\"mean\", None)\n            ss_mean = summary.get(\"OVERALL\", {}).get(\"ss_gen\", {}).get(\"mean\", None)\n            if np_mean is not None:\n                ax.axhline(\n                    np_mean, color=\"gray\", ls=\"--\", label=f\"Neuronpedia ({np_mean:.2f})\"\n                )\n            if ss_mean is not None:\n                ax.axhline(\n                    ss_mean,\n                    color=\"orange\",\n                    ls=\"--\",\n                    label=f\"SingleShot ({ss_mean:.2f})\",\n                )\n            ax.set_xlabel(\"SAGE iteration\")\n            ax.set_ylabel(\"Generative accuracy\")\n            ax.set_ylim(0, 1.05)\n            ax.set_title(\n                \"SAGE Iterative Refinement (aggregated over features)\\nDataset: Gemma-2-2B GemmaScope-Res-16k\"\n            )\n            ax.legend()\n            plt.tight_layout()\n            plt.savefig(\n                os.path.join(working_dir, \"gemma2_2b_multi_iteration_curve.png\"),\n                dpi=120,\n            )\n            plt.close()\nexcept Exception as e:\n    print(f\"Error creating plot3: {e}\")\n    plt.close()\n\n# Plot 4: Validation loss per feature\ntry:\n    val_losses = data.get(\"losses\", {}).get(\"val\", [])\n    feat_keys = list(per_feature.keys())\n    if val_losses and feat_keys:\n        n = min(len(val_losses), len(feat_keys))\n        fig, ax = plt.subplots(figsize=(max(7, n * 0.35), 4))\n        ax.plot(range(n), val_losses[:n], marker=\"s\", color=\"C3\")\n        ax.set_xticks(range(n))\n        ax.set_xticklabels(feat_keys[:n], rotation=90, fontsize=7)\n        ax.set_ylabel(\"Validation Loss (1 \u2212 final SAGE gen_acc)\")\n        ax.set_title(\n            \"Per-Feature Validation Loss (Final SAGE Iteration)\\nDataset: Gemma-2-2B GemmaScope-Res-16k (multi-layer)\"\n        )\n        ax.set_ylim(-0.05, 1.05)\n        plt.tight_layout()\n        plt.savefig(\n            os.path.join(working_dir, \"gemma2_2b_multi_val_loss_per_feature.png\"),\n            dpi=120,\n        )\n        plt.close()\nexcept Exception as e:\n    print(f\"Error creating plot4: {e}\")\n    plt.close()\n\n# Plot 5: Per-probe activation heatmap for a small sample of features (<=5)\ntry:\n    feat_keys = list(per_feature.keys())\n    sample = feat_keys[:: max(1, len(feat_keys) // 5)][:5] if feat_keys else []\n    if sample:\n        n_feats = len(sample)\n        fig, axes = plt.subplots(1, n_feats, figsize=(4 * n_feats, 4.5))\n        if n_feats == 1:\n            axes = [axes]\n        for ax, fk in zip(axes, sample):\n            pf = per_feature.get(fk, {})\n            iters = pf.get(\"iterations\", [])\n            rows, labels = [], []\n            for i, it in enumerate(iters):\n                best_c = max(\n                    it.get(\"candidates\", []),\n                    key=lambda c: c.get(\"score\", 0),\n                    default=None,\n                )\n                if best_c is not None:\n                    rows.append(best_c.get(\"per_probe_acts\", []))\n                    labels.append(f\"SAGE it{i}\")\n            if not rows:\n                continue\n            maxlen = max(len(r) for r in rows)\n            arr = np.array([r + [0.0] * (maxlen - len(r)) for r in rows], dtype=float)\n            im = ax.imshow(arr, aspect=\"auto\", cmap=\"viridis\")\n            thr = thresholds.get(fk, 0)\n            ax.set_title(f\"{fk}\\nThr={thr:.3f}\")\n            ax.set_yticks(range(len(labels)))\n            ax.set_ytickl
