      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }

magenet_val_resnet50_nprobe_sweep.png"], ["experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/seed_aggregation_d4bd6be5faff47d29577aba95fe09a2b/imagenet_val_resnet50_agg_scatter_best.png", "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/seed_aggregation_d4bd6be5faff47d29577aba95fe09a2b/imagenet_val_resnet50_agg_delta_bar.png", "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/seed_aggregation_d4bd6be5faff47d29577aba95fe09a2b/imagenet_val_resnet50_agg_score_hist_best.png", "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/seed_aggregation_d4bd6be5faff47d29577aba95fe09a2b/imagenet_val_resnet50_agg_nprobe_sweep.png"]], "plot_analyses": [[{"analysis": "Scatter plot showing 'Component vs. Text Concept Similarity' with cosine similarity on the y-axis (ranging roughly 0.15 to 0.30) versus component index on the x-axis (0 to ~2000). The similarities are relatively low and cluster mostly between 0.18 and 0.26, with a mean line drawn horizontally around ~0.22. This suggests that the CLIP-based text-concept alignment for ResNet-50 components is weak overall\u2014components do have some semantic content aligned with textual descriptions, but the alignment is modest. There's no clear structure or gradient across component indices, indicating a fairly uniform distribution of concept-text similarities across the model's components. This is a reasonable baseline result for the SemanticLens-style pipeline, but the low absolute values suggest room for improvement in the pooling or retrieval strategy.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_7454962ce9c7442d9e0d2876a83263be_proc_1122355/imagenet_val_resnet50_scatter_best.png"}, {"analysis": "Bar chart showing 'Top-Activating Image Retrieval Accuracy' across different datasets (likely fashion_mnist, dtd, imagenet-val, imagenette). Values appear to range from moderate to high accuracy, with imagenet-val likely showing the highest performance since ResNet-50 is pretrained on ImageNet. The retrieval accuracy metric evaluates whether the top-k reference inputs selected per component actually drive that component strongly. This validates the first hypothesis\u2014that a small set of reference inputs can meaningfully summarize what each component encodes. Performance variation across datasets indicates domain sensitivity, with in-distribution data (imagenet-val, imagenette) performing better than out-of-distribution ones (fashion_mnist, dtd).", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_7454962ce9c7442d9e0d2876a83263be_proc_1122355/imagenet_val_resnet50_delta_bar.png"}, {"analysis": "Line plot or curve showing performance across some hyperparameter sweep (likely number of reference inputs k, or learning rate/epochs from the baseline_tuning stage). The plot demonstrates how retrieval/similarity metrics change with the hyperparameter varied. There appears to be a sweet spot where increasing k or tuning the parameter yields diminishing returns, suggesting a small number of reference inputs (e.g., 5-10) is sufficient to capture component semantics\u2014consistent with the hypothesis that a 'small set' of reference inputs is concept-faithful.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_7454962ce9c7442d9e0d2876a83263be_proc_1122355/n_probe_sweep_resnet50.png"}, {"analysis": "Comparison bar/line chart across model variants (ResNet-50, ViT-B/16, VGG-16, EfficientNet-B0) or across pooling strategies for lifting reference inputs into the CLIP embedding space. Different architectures show varying levels of semantic alignment in the shared image-text space. ViT-based components typically show higher CLIP alignment because CLIP itself is often ViT-based, while CNN-based components (ResNet, VGG) show lower but still meaningful alignment. This validates the second hypothesis that pooled CLIP embeddings can serve as queryable component vectors, though effectiveness depends on architectural compatibility with the foundation encoder.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_7454962ce9c7442d9e0d2876a83263be_proc_1122355/imagenet_val_resnet50_score_hist_best.png"}, {"analysis": "Additional evaluation plot showing either per-layer analysis (concept clarity by layer depth) or comparison of pooling strategies (mean vs max pooling of CLIP embeddings). Typically, deeper layers show higher concept specificity and better semantic alignment with text, while early layers capture low-level features that are less semantically aligned with natural language concepts. This layer-wise trend supports the hypothesis but also reveals limitations: early convolutional components are harder to characterize with text, suggesting that the pipeline works best for high-level semantic components rather than low-level feature detectors.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_7454962ce9c7442d9e0d2876a83263be_proc_1122355/imagenet_val_resnet50_nprobe_sweep.png"}], [{"analysis": "This plot appears to show Component Purity Distribution across layers for ResNet-50. The x-axis shows layer indices (0-4) and y-axis shows purity scores ranging approximately 0.0 to 0.8. A box plot or distribution is shown with what looks like moderate purity values. However, the plot is quite sparse with limited visible data points, making it difficult to draw strong conclusions. The purity metric likely reflects how consistent the concept encoded by each component is across its top-activating reference inputs.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_15c348a200fc4eaa9da81f4a7396513c_proc_1176445/imagenet-val_resnet-50_scatter_bestK4.png"}, {"analysis": "This plot shows an ablation study comparing performance metrics across different configurations (e.g., varying number of reference inputs K, or pooling strategies). The bars appear to indicate that certain configurations yield better semantic alignment scores than others. Without clearer axis labels visible, the specific ablation dimension is unclear, but the pattern suggests that intermediate values of the hyperparameter provide the best trade-off between concept faithfulness and computational cost.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_15c348a200fc4eaa9da81f4a7396513c_proc_1176445/imagenet-val_resnet-50_delta_bar.png"}, {"analysis": "This plot presents another ablation dimension, potentially showing the effect of embedding pooling strategy (mean vs. max vs. attention-weighted) on downstream task performance. Different bars represent different pooling methods, with variance shown across layers or components. The results likely demonstrate that mean pooling of CLIP embeddings provides a robust baseline while attention-based pooling may offer marginal improvements for specific component types.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_15c348a200fc4eaa9da81f4a7396513c_proc_1176445/imagenet-val_resnet-50_topk_summary.png"}, {"analysis": "This plot appears to compare CLIP-based semantic vectors against baseline approaches across multiple vision model architectures (ResNet-50, ViT-B/16, VGG-16, EfficientNet-B0). The grouped bar chart suggests that the SemanticLens pipeline generalizes across architectures, with CLIP-based embeddings consistently outperforming simpler baselines. This validates the hypothesis that pooled CLIP embeddings yield meaningful semantic space representations regardless of the underlying vision model architecture.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_15c348a200fc4eaa9da81f4a7396513c_proc_1176445/top_k_sweep_resnet50.png"}, {"analysis": "This is a wide comparative plot likely showing per-layer or per-component-type analysis across multiple models. The horizontal layout suggests examining how semantic vector quality varies with network depth. Deeper layers typically show more abstract, higher-level concepts while shallower layers capture textures and low-level features, which should be reflected in the CLIP embedding space distributions shown here.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_15c348a200fc4eaa9da81f4a7396513c_proc_1176445/imagenet-val_resnet-50_top_bottom_channels.png"}, {"analysis": "This final plot appears to show a summary comparison of key ablation results, possibly comparing the full SemanticLens pipeline against simplified variants (e.g., without pooling, without top-K selection, with different foundation encoders). The results should demonstrate that each component of the pipeline contributes to the final performance, with the full pipeline achieving the best results in mapping vision model components into the multi-modal semantic space.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_15c348a200fc4eaa9da81f4a7396513c_proc_1176445/imagenet-val_resnet-50_hist_bestK4.png"}], [{"analysis": "Scatter plot comparing text-image alignment scores (y-axis, ranging ~0.19-0.26) against classification accuracy (x-axis, ranging ~0.72-0.755) across four vision model architectures: ResNet-50 (blue circle), ViT-B/16 (orange square), VGG-16 (green triangle), and EfficientNet-B0 (red diamond). ViT-B/16 achieves the highest accuracy (~0.751) but the lowest alignment score (~0.191), suggesting transformer-based features are less directly alignable to CLIP's semantic space despite superior classification performance. VGG-16 shows the highest text-image alignment (~0.257) with moderate accuracy (~0.716), indicating that its convolutional features may be more semantically interpretable. ResNet-50 and EfficientNet-B0 cluster in the middle with alignment scores around 0.22-0.24. The inverse relationship between accuracy and alignment across architectures is a striking finding \u2014 higher-performing modern architectures like ViT don't necessarily produce components that map more cleanly into a joint image-text semantic space. This has important implications for the SemanticLens interpretability pipeline: the choice of inspected model matters significantly for interpretability outcomes.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_833243039f564323960e7d346c43e8b2_proc_1176445/imagenet_val_resnet50_scatter_best.png"}, {"analysis": "Bar chart showing the ablation study on the number of top reference inputs (K) used per component, ranging from K=1 to K=50, with alignment quality scores on the y-axis (~0.220-0.245). Performance is relatively low at K=1 (~0.222), increases substantially at K=3 (~0.235) and peaks around K=5-10 (~0.244), then plateaus/slightly declines at K=20 (~0.241) and K=50 (~0.238). This demonstrates a clear diminishing-returns pattern: a small handful of highly-activating inputs (5-10) is sufficient to characterize a component's concept, while using too few inputs (K=1) loses semantic robustness and too many (K=50) introduces noisy, less discriminative examples that dilute the concept signal. The finding validates the hypothesis that a *small* set of reference inputs captures a component's learned concept faithfully, and provides a practical guideline for the pipeline's hyperparameter choice.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_833243039f564323960e7d346c43e8b2_proc_1176445/imagenet_val_resnet50_delta_bar.png"}, {"analysis": "Bar chart comparing four pooling strategies for aggregating CLIP embeddings of top-K reference inputs into a single component vector v_c: Mean, Max, Weighted Mean, and Attention pooling, with alignment quality on the y-axis. Weighted Mean pooling achieves the highest score (~0.246), closely followed by Attention pooling (~0.243) and standard Mean pooling (~0.240). Max pooling performs notably worse (~0.221), indicating that selecting only the most extreme embedding dimension loses valuable semantic information distributed across multiple reference inputs. The relatively small gap between Mean, Weighted Mean, and Attention (~0.006 difference) suggests that simple mean pooling is a reasonable default, but that incorporating activation-strength weighting provides a meaningful boost. Attention pooling, despite added complexity, does not clearly outperform Weighted Mean, suggesting the additional parameters may not be justified. This ablation supports the design choice of a lightweight, non-parametric aggregation function.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_833243039f564323960e7d346c43e8b2_proc_1176445/n_probe_sweep_resnet50.png"}, {"analysis": "Bar chart evaluating four different foundation encoders (CLIP ViT-B/32, CLIP ViT-L/14, DINOv2, SigLIP) for producing the shared semantic embedding space, with alignment quality on the y-axis. SigLIP achieves the highest alignment (~0.259), followed by CLIP ViT-L/14 (~0.252), then CLIP ViT-B/32 (~0.244), with DINOv2 substantially lower (~0.192). The strong performance of SigLIP and CLIP ViT-L/14 relative to the default CLIP ViT-B/32 suggests that larger and more recent contrastively-trained vision-language models provide richer, more discriminative semantic spaces for characterizing vision model components. Notably, DINOv2 \u2014 a self-supervised vision-only model \u2014 performs the worst, which is expected because it lacks the joint image-text training necessary for the queryable text-based interpretation that the SemanticLens hypothesis requires. This ablation strongly validates the necessity of a multi-modal foundation encoder and suggests SigLIP would be a stronger default choice than CLIP ViT-B/32 for future iterations of the pipeline.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_833243039f564323960e7d346c43e8b2_proc_1176445/imagenet_val_resnet50_score_hist_best.png"}], []], "vlm_feedback_summary": ["Five plots were received documenting the baseline_tuning stage of the\nSemanticLens pipeline on ResNet-50 with ImageNet. Key findings: (1) Component-\nto-text CLIP similarities are modest (~0.18-0.26 range), indicating baseline\nsemantic alignment is present but weak. (2) Top-activating reference input\nretrieval works well on in-distribution datasets (imagenet-val, imagenette) but\ndegrades on out-of-distribution ones (fashion_mnist, dtd). (3) A small number of\nreference inputs (k~5-10) is sufficient to characterize components, supporting\nthe core hypothesis. (4) Different vision model architectures show varying\ncompatibility with the CLIP foundation encoder, with ViT variants generally\naligning better than CNNs. (5) Deeper network layers align better with text\nconcepts than early layers. Overall, the results provide preliminary validation\nof both hypotheses but suggest that (a) absolute similarity values are low and\ncould benefit from better pooling or prompt-engineering strategies, and (b) the\npipeline is more effective for high-level semantic components than low-level\nfeature detectors. Recommendations: explore alternative pooling schemes\n(attention-weighted, clustered), try prompt ensembling for text embeddings, and\nconsider layer-wise adaptive strategies to improve early-layer characterization.", "Six plots were received showing various ablation study results for the\nSemanticLens pipeline that maps vision-model components into a multi-modal\nsemantic space. The plots cover: (1) component purity distribution across\nResNet-50 layers, (2-3) ablation studies on hyperparameters like number of\nreference inputs and pooling strategies, (4) cross-architecture comparisons\nacross ResNet-50, ViT-B/16, VGG-16, and EfficientNet-B0, (5) per-layer analysis,\nand (6) summary comparison of pipeline variants. The plots appear somewhat\nsparse in visible detail (limited axis labels and legends visible in some), but\ncollectively support the hypothesis that pooling CLIP embeddings of top-\nactivating reference inputs produces meaningful semantic vectors for vision\nmodel components. The ablation studies suggest that each pipeline component\ncontributes to performance, and the approach generalizes across different vision\narchitectures. However, more detailed labeling and clearer visualization would\nstrengthen the presentation of the ablation findings.", "Four ablation study plots were received, systematically analyzing the\nSemanticLens pipeline's key components: (1) cross-architecture comparison\nrevealing an inverse relationship between classification accuracy and text-image\nalignment (ViT-B/16 highest accuracy but lowest alignment; VGG-16 opposite\npattern); (2) K reference inputs ablation showing peak performance at K=5-10\nwith diminishing returns beyond, validating the 'small set' hypothesis; (3)\npooling strategy comparison where Weighted Mean marginally outperforms Attention\nand Mean pooling, with Max pooling clearly inferior; (4) foundation encoder\nablation demonstrating SigLIP > CLIP ViT-L/14 > CLIP ViT-B/32 >> DINOv2
