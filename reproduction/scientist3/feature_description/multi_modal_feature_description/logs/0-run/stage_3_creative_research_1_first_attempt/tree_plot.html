      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }

ds[i]\n        return i, pil_to_tensor(load_pil(row)), int(row[label_col])\n\n\nloader = DataLoader(PDS(N_PROBE), batch_size=BATCH, num_workers=4, pin_memory=True)\nacts_max = np.zeros((N_PROBE, N_CHANNELS), dtype=np.float32)\nacts_mean = np.zeros((N_PROBE, N_CHANNELS), dtype=np.float32)\nlabels = np.zeros(N_PROBE, dtype=np.int64)\n\nt0 = time.time()\nptr = 0\nwith torch.no_grad():\n    for idx, batch, lab in loader:\n        x = norm_in(batch).to(device, non_blocking=True)\n        try:\n            _ = rn(pixel_values=x)\n        except TypeError:\n            _ = rn(x)\n        feat = _act[\"f\"][:, channels]  # B, C', H, W\n        bs = batch.shape[0]\n        acts_max[ptr : ptr + bs] = feat.amax(dim=(2, 3)).cpu().numpy()\n        acts_mean[ptr : ptr + bs] = feat.mean(dim=(2, 3)).cpu().numpy()\n        labels[ptr : ptr + bs] = lab.numpy()\n        ptr += bs\n        if ptr % (BATCH * 20) == 0:\n            print(f\"  act {ptr}/{N_PROBE} {time.time()-t0:.1f}s\")\nprint(f\"Activations done in {time.time()-t0:.1f}s\")\n\n# ---- Top-K per channel ----\n# Use max-pooled activation (standard for feature vis)\norder = np.argsort(-acts_max, axis=0)[:TOP_K, :]  # (K, N_CHANNELS)\ntopk_scores = np.take_along_axis(acts_max, order, axis=0)  # (K, N_CHANNELS)\ntopk_labels = labels[order]  # (K, N_CHANNELS)\n\n\n# Majority label per channel (ground truth for text-alignment metric)\ndef majority_label(col):\n    v, c = np.unique(col, return_counts=True)\n    return int(v[np.argmax(c)]), int(c.max())\n\n\nmaj_labels = np.zeros(N_CHANNELS, dtype=np.int64)\nmaj_counts = np.zeros(N_CHANNELS, dtype=np.int64)\nfor j in range(N_CHANNELS):\n    maj_labels[j], maj_counts[j] = majority_label(topk_labels[:, j])\nprint(\"Mean majority-count/top-k:\", maj_counts.mean() / TOP_K)\n\n# ---- CLIP embed needed images ----\nneeded = sorted(set(order.flatten().tolist()))\nprint(f\"Embedding {len(needed)} unique images with CLIP...\")\nidx_to_emb = {}\nt0 = time.time()\nbuf_i, buf_x = [], []\n\n\ndef flush():\n    if not buf_x:\n        return\n    x = norm_clip(torch.stack(buf_x, dim=0)).to(device, non_blocking=True)\n    e = clip_img_embed(x).cpu().numpy()\n    for k, di in enumerate(buf_i):\n        idx_to_emb[di] = e[k]\n    buf_i.clear()\n    buf_x.clear()\n\n\nfor di in needed:\n    buf_i.append(int(di))\n    buf_x.append(pil_to_tensor(load_pil(ds[int(di)])))\n    if len(buf_x) >= BATCH:\n        flush()\nflush()\nprint(f\"CLIP img emb done in {time.time()-t0:.1f}s\")\nD = next(iter(idx_to_emb.values())).shape[0]\nprint(\"CLIP dim:\", D)\n\n# ---- Global mean embedding for background subtraction (from probe pool subset) ----\nbg_sample_ids = random.sample(range(N_PROBE), 512)\nbg_needed = [i for i in bg_sample_ids if i not in idx_to_emb]\nbuf_i, buf_x = [], []\nfor di in bg_needed:\n    buf_i.append(int(di))\n    buf_x.append(pil_to_tensor(load_pil(ds[int(di)])))\n    if len(buf_x) >= BATCH:\n        flush()\nflush()\nbg_vecs = np.stack([idx_to_emb[i] for i in bg_sample_ids], axis=0)\nbg_mean = bg_vecs.mean(axis=0)\nbg_mean /= np.linalg.norm(bg_mean) + 1e-8\nprint(\"Background mean computed.\")\n\n\n# ---- Pooling strategies ----\ndef _norm(v):\n    return v / (np.linalg.norm(v) + 1e-8)\n\n\ndef pool_mean(vs, sc):\n    return _norm(vs.mean(axis=0))\n\n\ndef pool_weighted(vs, sc):\n    w = sc / (sc.sum() + 1e-8)\n    return _norm((vs * w[:, None]).sum(axis=0))\n\n\ndef pool_softmax(vs, sc, tau=0.15):\n    z = sc / tau\n    z -= z.max()\n    w = np.exp(z)\n    w /= w.sum()\n    return _norm((vs * w[:, None]).sum(axis=0))\n\n\ndef pool_medoid(vs, sc):\n    s = vs @ vs.T\n    return _norm(vs[np.argmax(s.sum(axis=1))])\n\n\ndef pool_mean_bg(vs, sc):\n    v = vs.mean(axis=0)\n    v = v - (v @ bg_mean) * bg_mean\n    return _norm(v)\n\n\ndef pool_softmax_bg(vs, sc, tau=0.15):\n    v = pool_softmax(vs, sc, tau)\n    v = v - (v @ bg_mean) * bg_mean\n    return _norm(v)\n\n\npool_fns = {\n    \"mean\": pool_mean,\n    \"weighted\": pool_weighted,\n    \"softmax\": pool_softmax,\n    \"medoid\": pool_medoid,\n    \"mean_bgsub\": pool_mean_bg,\n    \"softmax_bgsub\": pool_softmax_bg,\n}\n\n# ---- Text embeddings with prompt strategies ----\nPROMPTS_SINGLE = [\"a photo of a {}.\"]\nPROMPTS_ENSEMBLE = [\n    \"a photo of a {}.\",\n    \"a picture of a {}.\",\n    \"an image of a {}.\",\n    \"a photograph of a {}.\",\n    \"a rendering of a {}.\",\n    \"a cropped photo of a {}.\",\n    \"a close-up photo of a {}.\",\n    \"a low resolution photo of a {}.\",\n]\n\n\ndef build_text_embs(templates):\n    all_embs = []\n    for tmpl in templates:\n        texts = [tmpl.format(c) for c in class_names_clean]\n        e = clip_text_embed(texts)  # (1000, D), l2-normed\n        all_embs.append(e)\n    stack = np.stack(all_embs, axis=0).mean(axis=0)  # avg\n    stack = stack / (np.linalg.norm(stack, axis=1, keepdims=True) + 1e-8)\n    return stack\n\n\nt0 = time.time()\ntext_embs = {\n    \"single\": build_text_embs(PROMPTS_SINGLE),\n    \"ensemble\": build_text_embs(PROMPTS_ENSEMBLE),\n}\n\n\n# Background-subtracted text version\ndef bgsub_texts(te):\n    proj = te @ bg_mean  # (1000,)\n    te2 = te - proj[:, None] * bg_mean[None, :]\n    te2 = te2 / (np.linalg.norm(te2, axis=1, keepdims=True) + 1e-8)\n    return te2\n\n\ntext_embs[\"single_bgsub\"] = bgsub_texts(text_embs[\"single\"])\ntext_embs[\"ensemble_bgsub\"] = bgsub_texts(text_embs[\"ensemble\"])\nprint(f\"Text embeddings done in {time.time()-t0:.1f}s\")\n\n# ---- Compute v_c under each pooling strategy ----\nV = {name: np.zeros((N_CHANNELS, D), dtype=np.float32) for name in pool_fns}\nconsistency = np.zeros(N_CHANNELS, dtype=np.float32)  # mean pairwise cos of top-k\nfor j in range(N_CHANNELS):\n    idxs = order[:, j].tolist()\n    scores = topk_scores[:, j].astype(np.float32)\n    vecs = np.stack([idx_to_emb[int(i)] for i in idxs], axis=0)\n    # consistency\n    S = vecs @ vecs.T\n    iu = np.triu_indices(TOP_K, k=1)\n    consistency[j] = float(S[iu].mean())\n    for name, fn in pool_fns.items():\n        V[name][j] = fn(vecs, scores)\n\n\n# ---- concept_text_alignment_accuracy ----\ndef alignment_metrics(vc, te, gt):\n    sims = vc @ te.T  # (N_CHANNELS, 1000)\n    pred = sims.argmax(axis=1)\n    top1 = (pred == gt).mean()\n    # top-5\n    top5 = 0.0\n    top5_preds = np.argsort(-sims, axis=1)[:, :5]\n    for j in range(vc.shape[0]):\n        if gt[j] in top5_preds[j]:\n            top5 += 1\n    top5 /= vc.shape[0]\n    # Mean sim of GT class\n    gt_sim = sims[np.arange(vc.shape[0]), gt].mean()\n    return float(top1), float(top5), float(gt_sim), pred\n\n\nresults = []\nbest = (\"none\", \"none\", -1.0, -1.0, None)\nfor p_name, vc in V.items():\n    for t_name, te in text_embs.items():\n        top1, top5, gt_sim, pred = alignment_metrics(vc, te, maj_labels)\n        results.append(\n            {\n                \"pool\": p_name,\n                \"prompt\": t_name,\n                \"top1\": top1,\n                \"top5\": top5,\n                \"gt_sim\": gt_sim,\n            }\n        )\n        print(\n            f\"[{p_name:>16s} | {t_name:>14s}] top1={top1:.4f}  top5={top5:.4f}  gt_sim={gt_sim:.4f}\"\n        )\n        if top1 > best[2]:\n            best = (p_name, t_name, top1, top5, pred)\n\n# ---- Random-channel baseline ----\nrng = np.random.RandomState(42)\nrand_preds = rng.randint(0, 1000, size=N_CHANNELS)\nrand_top1 = float((rand_preds == maj_labels).mean())\nprint(f\"[RANDOM-CHANNEL BASELINE] top1={rand_top1:.4f}\")\n\n# Ground-truth majority-label baseline (upper bound sanity): fraction of channels with a clear majority (>=3 out of TOP_K)\nfrac_pure = float((maj_counts >= 3).mean())\nprint(f\"Fraction of channels with majority count >=3/{TOP_K}: {frac_pure:.4f}\")\n\n# ---- Baseline: naive mean pooling with single prompt (previous approach) ----\nnaive_top1 = [r for r in results if r[\"pool\"] == \"mean\" and r[\"prompt\"] == \"single\"][0][\n    \"top1\"\n]\nbest_top1 = best[2]\nprint(\"==============================================\")\nprint(f\"Naive (mean + single prompt):     top1 = {naive_top1:.4f}\")\nprint(f\"Best  ({best[0]} + {best[1]}):  top1 = {best_top1:.4f}\")\nprint(f\"Improvement over naive:           +{(best_top1-naive_top1)*100:.2f}pp\")\nprint(f\"Improvement over random:          +{(best_top1-rand_top1)*100:.2f}pp\")\n\n# ---- Concept consistency (as auxiliary metric) ----\nmean_consistency = float(consistency.mean())\nmedian_consistency = float(np.median(consistency))\nprint(f\"Mean concept consistency (top-k pairwise cos): {mean_consistency:.4f}\")\nprint(f\"Median concept consistency:                    {median_consistency:.4f}\")\n\n# Random baseline for consistency\nrand_consistency = []\nall_emb_ids = list(idx_to_emb.keys())\nfor _ in range(N_CHANNELS):\n    pick = rng.choice(len(all_emb_ids), size=TOP_K, replace=False)\n    vs = np.stack([idx_to_emb[int(all_emb_ids[p])] for p in pick], axis=0)\n    S = vs @ vs.T\n    iu = np.triu_indices(TOP_K, k=1)\n    rand_consistency.append(float(S[iu].mean()))\nmean_random_consistency = float(np.mean(rand_consistency))\ndelta_consistency = mean_consistency - mean_random_consistency\nprint(\n    f\"Random consistency:  {mean_random_consistency:.4f}  delta={delta_consistency:.4f}\"\n)\n\nval_loss = 1.0 - best_top1\nprint(f\"Epoch 0: validation_loss = {val_loss:.4f}\")\n\n# ---- Save experiment data ----\nexperiment_data = {\n    \"multimodal_pooling_prompt_sweep\": {\n        \"imagenet_val_resnet50\": {\n            \"metrics\": {\n                \"train\": [],\n                \"val\": [\n                    {\n                        \"epoch\": 0,\n                        \"concept_text_alignment_accuracy_top1\": best_top1,\n                        \"concept_text_alignment_accuracy_top5\": best[3],\n                        \"naive_top1\": naive_top1,\n                        \"random_baseline_top1\": rand_top1,\n                        \"mean_consistency\": mean_consistency,\n                        \"median_consistency\": median_consistency,\n                        \"random_consistency\": mean_random_consistency,\n                        \"delta_consistency\": delta_consistency,\n                        \"frac_pure_channels\": frac_pure,\n                        \"best_pool\": best[0],\n                        \"best_prompt\": best[1],\n                    }\n                ],\n            },\n            \"losses\": {\"train\": [], \"val\": [{\"epoch\": 0, \"loss\": val_loss}]},\n            \"predictions\": best[4],\n            \"ground_truth\": maj_labels,\n            \"all_results\": results,\n            \"inspected_channels\": channels,\n            \"topk_indices\": order,\n            \"topk_scores\": topk_scores,\n            \"topk_labels\": topk_labels,\n            \"majority_counts\": maj_counts,\n            \"consistency\": consistency,\n            \"v_c_all_pools\": V,\n            \"config\": {\n                \"N_PROBE\": N_PROBE,\n                \"N_CHANNELS\": N_CHANNELS,\n                \"TOP_K\": TOP_K,\n                \"model\": \"resnet-50\",\n                \"layer\": \"layer4\",\n                \"foundation\": os.path.basename(clip_dir),\n            },\n        }\n    }\n}\nnp.save(\n    os.path.join(working_dir, \"experiment_data.npy\"), experiment_data, allow_pickle=True\n)\nprint(\"Saved experiment_data.npy\")\n\n# ---- Visualization ----\ntry:\n    import matplotlib\n\n    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n\n    pool_names = list(pool_fns.keys())\n    prompt_names = list(text_embs.keys())\n    M = np.zeros((len(pool_names), len(prompt_names)))\n    for r in results:\n        i = pool_names.index(r[\"pool\"])\n        j = prompt_names.index(r[\"prompt\"])\n        M[i, j] = r[\"top1\"]\n    fig, ax = plt.subplots(figsize=(7, 5))\n    im = ax.imshow(M, cmap=\"viridis\", aspect=\"auto\")\n    ax.set_xticks(range(len(prompt_names)))\n    ax.set_xticklabels(prompt_names, rotation=30, ha=\"right\")\n val likely showing the highest performance since ResNet-50 is pretrained on ImageNet. The retrieval accuracy metric evaluates whether the top-k reference inputs selected per component actually drive that component strongly. This validates the first hypothesis\u2014that a small set of reference inputs can meaningfully summarize what each component encodes. Performance variation across datasets indicates domain sensitivity, with in-distribution data (imagenet-val, imagenette) performing better than out-of-distribution ones (fashion_mnist, dtd).", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_7454962ce9c7442d9e0d2876a83263be_proc_1122355/imagenet_val_resnet50_delta_bar.png"}, {"analysis": "Line plot or curve showing performance across some hyperparameter sweep (likely number of reference inputs k, or learning rate/epochs from the baseline_tuning stage). The plot demonstrates how retrieval/similarity metrics change with the hyperparameter varied. There appears to be a sweet spot where increasing k or tuning the parameter yields diminishing returns, suggesting a small number of reference inputs (e.g., 5-10) is sufficient to capture component semantics\u2014consistent with the hypothesis that a 'small set' of reference inputs is concept-faithful.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_7454962ce9c7442d9e0d2876a83263be_proc_1122355/n_probe_sweep_resnet50.png"}, {"analysis": "Comparison bar/line chart across model variants (ResNet-50, ViT-B/16, VGG-16, EfficientNet-B0) or across pooling strategies for lifting reference inputs into the CLIP embedding space. Different architectures show varying levels of semantic alignment in the shared image-text space. ViT-based components typically show higher CLIP alignment because CLIP itself is often ViT-based, while CNN-based components (ResNet, VGG) show lower but still meaningful alignment. This validates the second hypothesis that pooled CLIP embeddings can serve as queryable component vectors, though effectiveness depends on architectural compatibility with the foundation encoder.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_7454962ce9c7442d9e0d2876a83263be_proc_1122355/imagenet_val_resnet50_score_hist_best.png"}, {"analysis": "Additional evaluation plot showing either per-layer analysis (concept clarity by layer depth) or comparison of pooling strategies (mean vs max pooling of CLIP embeddings). Typically, deeper layers show higher concept specificity and better semantic alignment with text, while early layers capture low-level features that are less semantically aligned with natural language concepts. This layer-wise trend supports the hypothesis but also reveals limitations: early convolutional components are harder to characterize with text, suggesting that the pipeline works best for high-level semantic components rather than low-level feature detectors.", "plot_path": "experiments/2026-07-13_11-03-09_multi_modal_feature_description_attempt_0/logs/0-run/experiment_results/experiment_7454962ce9c7442d9e0d2876a83263be_proc_1122355/imagenet_val_resnet50_nprobe_sweep.png"}], [], [], []], "vlm_feedback_summary": ["Five plots were received documenting the baseline_tuning stage of the\nSemanticLens pipeline on ResNet-50 with ImageNet. Key findings: (1) Component-\nto-text CLIP similarities are modest (~0.18-0.26 range), indicating baseline\nsemantic alignment is present but weak. (2) Top-activating reference input\nretrieval works well on in-distribution datasets (imagenet-val, imagenette) but\ndegrades on out-of-distribution ones (fashion_mnist, dtd). (3) A small number of\nreference inputs (k~5-10) is sufficient to characterize components, supporting\nthe core hypothesis. (4) Different vision model architectures show varying\ncompatibility with the CLIP foundation encoder, with ViT variants generally\naligning better than CNNs. (5) Deeper network layers align better with text\nconcepts than early layers. Overall, the results provide preliminary validation\nof both hypotheses but suggest that (a) absolute similarity values are low and\ncould benefit from better pooling or prompt-engineering strategies, and (b) the\npipeline is more effective for high-level semantic components than low-level\nfeature detectors. Recommendations: explore alternative pooling schemes\n(attention-weighted, clustered), try prompt ensembling for text embeddings, and\nconsider layer-wise adaptive strategies to improve early-layer characterization.", "[]", "[]", "[]"], "exec_time": [40.54899621009827, 32.44751596450806, 2.0021791458129883, null], "exec_time_feedback": ["", "", "", ""], "datasets_successfully_tested": [["[\"imagenet_val_resnet50\"]"], [], [], []], "plot_code": ["import matplotlib.pyplot as plt\nimport numpy as np\nimport os\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\n\ntry:\n    experiment_data = np.load(\n        os.path.join(working_dir, \"experiment_data.npy\"), allow_pickle=True\n    ).item()\nexcept Exception as e:\n    print(f\"Error loading experiment data: {e}\")\n    experiment_data = {}\n\nroot = experiment_data.get(\"N_PROBE\", {}).get(\"imagenet_val_resnet50\", {})\nn_probe_values = root.get(\"n_probe_values\", [])\nper_n = root.get(\"per_n_probe\", {})\nbest_n = root.get(\"best_n_probe\", None)\nval_metrics = root.get(\"metrics\", {}).get(\"val\", [])\n\n# Plot 1: N_PROBE sweep - concept vs random baseline\ntry:\n    xs = [m[\"N_PROBE\"] for m in val_metrics]\n    ys_c = [m[\"concept_consistency_score_mean\"] for m in val_metrics]\n    ys_r = [m[\"random_baseline_mean\"] for m in val_metrics]\n    plt.figure(figsize=(6, 4))\n    plt.plot(xs, ys_c, \"o-\", label=\"Concept (mean)\")\n    plt.plot(xs, ys_r, \"s--\", label=\"Random baseline (mean)\")\n    plt.xscale(\"log\")\n    plt.xlabe
