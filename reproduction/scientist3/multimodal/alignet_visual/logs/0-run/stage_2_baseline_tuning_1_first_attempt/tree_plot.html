      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }

ts/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/THINGS_val_loss_curves.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/THINGS_final_ooo_bar.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/n_epochs_tuning.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/THINGS_ooo_accuracy_curves.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/THINGS_train_loss_curves.png"], ["experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_24c2675d2842491b87080bbb1a808342_proc_2155478/THINGS_pred_vs_gt_distribution.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_24c2675d2842491b87080bbb1a808342_proc_2155478/THINGS_val_loss_curves.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_24c2675d2842491b87080bbb1a808342_proc_2155478/THINGS_final_ooo_bar.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_24c2675d2842491b87080bbb1a808342_proc_2155478/n_epochs_tuning.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_24c2675d2842491b87080bbb1a808342_proc_2155478/THINGS_ooo_accuracy_curves.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_24c2675d2842491b87080bbb1a808342_proc_2155478/THINGS_train_loss_curves.png"], ["experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/seed_aggregation_fffd20fa4e004df19d2d91b7ce538d99/THINGS_agg_val_loss_curves.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/seed_aggregation_fffd20fa4e004df19d2d91b7ce538d99/THINGS_agg_train_loss_curves.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/seed_aggregation_fffd20fa4e004df19d2d91b7ce538d99/THINGS_agg_pred_vs_gt_distribution.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/seed_aggregation_fffd20fa4e004df19d2d91b7ce538d99/THINGS_agg_ooo_accuracy_curves.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/seed_aggregation_fffd20fa4e004df19d2d91b7ce538d99/THINGS_agg_final_ooo_bar.png"]], "plot_analyses": [[{"analysis": "Training loss curves for two runs (Run 1 and Run 2) over 4 epochs, both showing distillation loss and KL divergence loss on shared axes. Both runs show a large initial drop in loss between the first two logged steps (from ~0.85 down to ~0.5 for distill loss) followed by a plateau around 0.45\u20130.5 for the remaining epochs. The KL loss remains extremely low (~0.02) and essentially flat throughout, indicating either that the KL term is very small in scale relative to the distillation loss or that the student's output distribution matches the teacher's very quickly. The two runs are nearly identical, showing training is reproducible. However, the plateauing behavior after epoch 1 suggests the model may have quickly converged to a local optimum with limited additional learning, which is a concern for the preliminary stage \u2014 worth checking whether the loss scaling between the two terms is appropriate.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_aec0d5421d47461a9209faeb7fb12579_proc_1247259/things_alignment_curve.png"}, {"analysis": "Spearman correlation with human similarity judgments across four model variants: Original DINOv2, Aligned Run 1, Aligned Run 2, and Teacher (SigLIP). All four bars appear at essentially identical heights near 0.6, with negligible visible differences between the original DINOv2 and the aligned versions. This is a critical negative result for the core hypothesis: the alignment procedure did NOT meaningfully improve Spearman correlation with human similarity judgments, which contradicts the paper's central claim. Either (a) the alignment loss is not being properly propagated, (b) the evaluation is not sensitive enough, (c) the teacher is not actually providing a strong human-similarity signal, or (d) the DINOv2 baseline is already near the ceiling on this benchmark. This warrants immediate investigation before proceeding to more elaborate experiments.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_aec0d5421d47461a9209faeb7fb12579_proc_1247259/THINGS_ooo_accuracy_curve.png"}, {"analysis": "Downstream one-shot classification accuracy across 5 datasets (Birds, UC Merced, Colon, and two Fine-grained sets) comparing Original DINOv2, Aligned Run 1, and Aligned Run 2. Performance is essentially identical across all three variants on every dataset, with accuracy ranging from ~0.15 (Colon, Fine-grained 1) to ~0.30 (UC Merced). The near-perfect overlap between original and aligned models suggests that alignment did not hurt downstream utility (supporting one part of the hypothesis: 'alignment is not at odds with utility'), but combined with plot 2's null result on similarity alignment, this more likely indicates that the alignment procedure is producing negligible changes to the model overall. The absolute accuracy numbers are also quite low (0.15\u20130.30), which is expected for one-shot but should be verified against reported baselines.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_aec0d5421d47461a9209faeb7fb12579_proc_1247259/things_ooo_alignment.png"}, {"analysis": "Hierarchical evaluation on the 'Levels' benchmark showing accuracy across three abstraction levels: coarse-grained semantic, fine-grained semantic, and class-boundary. All three model variants (Original, Aligned Run 1, Aligned Run 2) achieve virtually identical performance at each level: ~0.75 coarse, ~0.55 fine-grained, ~0.45 class-boundary. The monotonic drop from coarse to fine to class-boundary is expected and matches the intuition that finer distinctions are harder. However, the complete lack of separation between aligned and unaligned models again indicates the alignment is not producing measurable behavioral change. The hierarchical structure of the benchmark itself appears well-designed, but the current student updates are not translating into hierarchical alignment gains.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_aec0d5421d47461a9209faeb7fb12579_proc_1247259/things_ooo_accuracy.png"}, {"analysis": "OOD robustness on ImageNet-A comparing Original DINOv2, Aligned Run 1, Aligned Run 2, and Teacher (SigLIP). All four bars appear indistinguishable at roughly 0.09\u20130.10 accuracy. Two observations: (1) The absolute accuracy on ImageNet-A is extremely low (~10%), which for a ViT-B is plausible since ImageNet-A is adversarially filtered, but this evaluation seems to be using linear probing or zero-shot in a way that doesn't differentiate models well. (2) There is no visible improvement from alignment, again contradicting the hypothesis that alignment improves OOD robustness. The teacher SigLIP performing at the same low level is also surprising, since SigLIP typically has stronger OOD performance \u2014 this suggests the evaluation protocol itself may be flawed or too coarse.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_aec0d5421d47461a9209faeb7fb12579_proc_1247259/THINGS_final_accuracy_bar.png"}, {"analysis": "BREEDS subpopulation-shift robustness across four splits (entity13, living17, non-living26, entity30) for the same four models. All models cluster tightly around 0.10\u20130.12 accuracy on every split, with no meaningful separation. Again, the absolute numbers are very low \u2014 BREEDS accuracy for a properly evaluated ViT-B should be substantially higher (typically 40\u201370% depending on protocol), suggesting a serious evaluation setup issue such as: incorrect classifier head initialization, missing linear probe training, wrong label mapping, or evaluation on the wrong split. The uniformly low performance across all models including the teacher indicates a systematic evaluation bug rather than a meaningful comparison. This plot in particular signals that the downstream evaluation pipeline needs debugging before drawing any scientific conclusions from the preliminary results.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_aec0d5421d47461a9209faeb7fb12579_proc_1247259/THINGS_prediction_distribution.png"}], [{"analysis": "Bar chart comparing baseline vs aligned Spearman rank correlation with human triplet judgments on THINGS-like evaluation. Only two bars are shown for a single comparison (baseline DINOv2 ViT-B vs aligned). The aligned model shows a modest improvement over the baseline, consistent with the hypothesis that AligNet-style distillation from a SigLIP-So400m teacher shaped by human triplet judgments increases human-similarity alignment. However, absolute values and confidence intervals are not clearly indicated, and only a single dataset/level is reported, so we cannot yet verify multi-level (coarse/mid/fine) alignment gains as the hypothesis requires.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/THINGS_pred_vs_gt_distribution.png"}, {"analysis": "Training/tuning curve (likely alignment loss or Spearman metric vs epochs/steps) showing a monotonic trend as hyperparameters were tuned in this first_attempt sub-stage. The curve suggests the model is learning to align with the teacher signal \u2014 loss decreases (or correlation increases) smoothly, indicating a reasonable learning rate and batch size choice. There is no obvious sign of overfitting within the shown horizon, but no validation curve is displayed alongside training, so generalization behavior is not directly assessable from this plot.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/THINGS_val_loss_curves.png"}, {"analysis": "Downstream one-shot / linear probe accuracy comparison across evaluation datasets from the required local set (fashion_mnist, dtd, imagenet-val, imagenette). The aligned student is close to the baseline DINOv2 ViT-B on most datasets, with small gains or negligible losses. This supports the 'utility not sacrificed' claim of the hypothesis at a preliminary level, but the effect sizes look small and no error bars are shown, so statistical significance cannot be assessed. Also, the 10 fine-grained specialty datasets and BREEDS/ImageNet-A robustness benchmarks specified in the plan are not represented here \u2014 only the locally available datasets are used, which is consistent with sub-stage instructions but limits the strength of the utility claim.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/THINGS_final_ooo_bar.png"}, {"analysis": "Wide comparison bar plot across multiple metrics or hyperparameter settings (learning rate / epoch / batch size sweep). Different configurations produce visibly different alignment scores, indicating the tuning is having an effect. One configuration appears to dominate, suggesting a preferred hyperparameter set for subsequent stages. However, the axis labels and configuration identifiers would need to be clearer to draw strong conclusions; the trend seems to favor a moderate learning rate with more epochs, consistent with typical distillation setups.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/n_epochs_tuning.png"}, {"analysis": "Per-dataset breakdown plot (likely one-shot classification accuracy per downstream dataset for baseline vs aligned model). Aligned model matches baseline on imagenet-val and imagenette (both ImageNet-derived, so DINOv2 features already strong), shows a small improvement on dtd (textures) and a mixed result on fashion_mnist. This is broadly consistent with the utility-preservation hypothesis but does not yet demonstrate the OOD robustness improvement claimed (ImageNet-A and BREEDS were not evaluated). The improvements are modest and the evaluation coverage is limited to locally available datasets as instructed.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/THINGS_ooo_accuracy_curves.png"}, {"analysis": "Final summary plot showing aligned vs unaligned comparison across the evaluation suite, possibly including a human-similarity correlation metric and downstream utility metric together. The aligned student demonstrates improved human-similarity correlation while maintaining downstream accuracy, which is the central hypothesis of the paper. However, the improvements are small in absolute terms in this first_attempt sub-stage. This suggests hyperparameters are reasonable but further tuning (higher alignment loss weight, longer training, or different teacher-student temperature) may be needed to strengthen the effect. Multi-level hierarchical alignment (coarse/mid/fine) is not directly visualized \u2014 only aggregate correlation appears to be reported.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/THINGS_train_loss_curves.png"}], [{"analysis": "Bar chart titled 'Zero-shot Accuracy on Local Datasets (DINOv2 ViT-B)' shows classification accuracy across three datasets: fashion_mnist (~0.13), dtd (~0.055), and imagenette (~0.99). The imagenette result is very strong (near-perfect), consistent with DINOv2's strong feature representations on natural object imagery similar to ImageNet. However, fashion_mnist and DTD accuracies are very low, near or below random chance for a small number of classes. This suggests that the evaluation likely used zero-shot linear classification or a simple nearest-neighbor protocol that does not transfer well to grayscale fashion images and texture-only DTD. These numbers likely serve as a baseline reference before applying human-similarity alignment; they do NOT yet show any effect of the AligNet distillation. No comparison to aligned/finetuned variant is provided in this plot.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_24c2675d2842491b87080bbb1a808342_proc_2155478/THINGS_pred_vs_gt_distribution.png"}, {"analysis": "Training loss curve for the AligNet distillation step, decreasing from ~0.19 at step 0 to ~0.02 by step ~250 and remaining low afterward, ending around 0.015 at step 500. The loss decreases smoothly and monotonically with a clear knee around step 100, indicating stable optimization and successful convergence of the student toward the teacher's human-similarity structure. The lack of oscillation suggests the learning rate and batch size are well-tuned for this baseline attempt. However, no validation loss or alignment metric is shown, so it is unclear whether the low training loss corresponds to genuine gains in human-similarity alignment (Spearman with THINGS triplets) or to overfitting on the ImageNet pseudo-label distillation targets.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_24c2675d2842491b87080bbb1a808342_proc_2155478/THINGS_val_loss_curves.png"}, {"analysis": "Grouped bar chart comparing 'Baseline (DINOv2 ViT-B)' vs 'Aligned (DINOv2 ViT-B)' zero-shot accuracy on the three local datasets. The aligned model shows a very small drop on imagenette (still ~0.99), essentially no change on fashion_mnist (~0.13), and no visible change on DTD (~0.055). This indicates that AligNet distillation preserves downstream utility on natural-image classification (imagenette) \u2014 consistent with the hypothesis that alignment does not sacrifice utility \u2014 but also that the alignment procedure has not produced measurable improvements on these particular downstream tasks. Because these datasets are not designed to probe human-similarity structure, they mainly serve as a 'do no harm' check, which the aligned model appears to pass.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_24c2675d2842491b87080bbb1a808342_proc_2155478/THINGS_final_ooo_bar.png"}, {"analysis": "Second version of the baseline vs aligned comparison, now including an explicit 'THINGS Spearman \u03c1' panel or dataset entry (leftmost group). The aligned model shows a notably higher Spearman correlation with human triplet judgments compared to the baseline DINOv2 (approx. 0.55\u20130.60 aligned vs ~0.45 baseline, judging from the plot scale). Meanwhile, imagenette remains near 0.99 for both, and fashion_mnist / dtd remain unchanged and low. This is the key positive result: alignment yields a substantial improvement in human-similarity correlation (matching the central hypothesis) while preserving downstream utility on natural-image classification. The magnitude of the Spearman improvement is meaningful, though a single-seed comparison without error bars limits statistical confidence.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_24c2675d2842491b87080bbb1a808342_proc_2155478/n_epochs_tuning.png"}, {"analysis": "Repeat/refined version of the baseline-vs-aligned comparison bar chart. The pattern is consistent: aligned model achieves higher THINGS Spearman \u03c1 than baseline (clear gain of roughly 0.10 absolute), imagenette accuracy is essentially unchanged and remains near ceiling, and fashion_mnist and DTD accuracies remain very low and unchanged. This corroborates the main claim: distilling the SigLIP-So400m human-similarity teacher into DINOv2 ViT-B improves alignment with human similarity judgments without degrading (and without improving) simple zero-shot classification on unrelated benchmarks. Limitations remain the same: only one student backbone, only one seed, and only two utility datasets that are meaningfully informative (imagenette being at ceiling, the other two possibly being under-optimized evaluation protocols). No confidence intervals or statistical tests are shown.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_24c2675d2842491b87080bbb1a808342_proc_2155478/THINGS_ooo_accuracy_curves.png"}], []], "vlm_feedback_summary": ["Six plots were received from the preliminary implementation of the AligNet-style\nhierarchical human alignment experiment. The training curves (plot 1) show\nreproducible convergence across two runs but plateau quickly, with KL loss\nremaining near zero throughout. The core scientific evaluations, however, reveal\na critical issue: across every downstream evaluation \u2014 Spearman correlation with\nhuman similarity (plot 2), one-shot classification (plot 3), hierarchical Levels\nbenchmark (plot 4), ImageNet-A OOD robustness (plot 5), and BREEDS subpopulation\nshifts (plot 6) \u2014 the aligned student models (Run 1 and Run 2) show virtually no\ndifference from the original DINOv2 baseline. This suggests the alignment\nprocedure is not meaningfully modifying the student's representations,\ncontradicting all four stated hypotheses. Additionally, the absolute accuracy\nvalues on ImageNet-A (~10%) and BREEDS (~10\u201312%) are suspiciously low even for\nthe teacher SigLIP model, indicating likely bugs in the downstream evaluation\npipeline (e.g., missing linear probe training, wrong label mappings, or\nincorrect evaluation protocol). Before advancing to more sophisticated\nexperiments, the team should: (1) verify that alignment gradients are actually\nupdating the student weights and that the loss scale is appropriate, (2) sanity-\ncheck the evaluation pipeline against published baselines for DINOv2 ViT-B on\nthese benchmarks, and (3) confirm that the teacher (SigLIP) is being applied\ncorrectly, since it should produce visibly different similarity structure than\nDINOv2 in plot 2. The reproducibility across two runs is a positive sign for\nengineering correctness, but the null effect across all scientific metrics is\nthe dominant finding at this preliminary stage.", "Six plots were received from a baseline_tuning first_attempt sub-stage of a\nproject distilling human-similarity structure from a SigLIP-So400m teacher\n(fitted to THINGS triplet judgments) into a DINOv2 ViT-B student. The plots\nshow: (1) modest improvements in Spearman correlation with human similarity\nafter alignment, (2) a smooth training/tuning curve indicating stable\noptimization, (3) comparable downstream accuracy on the locally available\ndatasets (fashion_mnist, dtd, imagenet-val, imagenette), (4) a hyperparameter\nsweep identifying a preferred configuration, and (5-6) per-dataset and summary\ncomparisons supporting the 'alignment without sacrificing utility' claim.\nOverall the results directionally support the hypothesis but with small effect\nsizes. Key limitations: no error bars shown, multi-level hierarchical alignment\n(coarse/mid/fine) is not directly visualized, and evaluation is limited to local\ndatasets \u2014 BREEDS, ImageNet-A, and the 10 fine-grained specialty datasets are\nnot yet evaluated (consistent with sub-stage instructions). Recommendations:\nincrease alignment loss weight, extend training, add hierarchical evaluation\nsplits, and include error bars/multiple seeds in the next sub-stage.", "Five plots were received from the baseline_tuning stage of a Hierarchical Human\nAlignment experiment using DINOv2 ViT-B as the student and SigLIP-So400m as the\nhuman-similarity teacher. (1) A baseline zero-shot accuracy chart shows DINOv2\nViT-B achieves near-perfect accuracy on imagenette but very low accuracy on\nfashion_mnist and DTD, suggesting the zero-shot evaluation protocol is not well-\nsuited to those two datasets. (2) The AligNet distillation training loss\ndecreases smoothly from ~0.19 to ~0.015 over 500 steps, indicating stable\nconvergence. (3\u20135) Three baseline-vs-aligned comparison bar charts consistently\nshow that after alignment: (a) THINGS Spearman correlation with human triplet\njudgments improves substantially (roughly +0.10 absolute), directly supporting\nthe main hypothesis; (b) imagenette accuracy is preserved near ceiling (~0.99),\nsupporting the 'alignment does not sacrifice utility' claim; and (c)\nfashion_mnist and DTD accuracies remain unchanged and low, indicating no harm\nbut also no gain on those tasks. Overall the results are consistent with the\npaper's hypothesis, but the evidence is limited to a single backbone, no error\nbars, no OOD/robustness benchmarks (BREEDS, ImageNet-A) yet, and no evaluation\non the hierarchical Levels benchmark. Follow-up experiments should add multiple\nseeds, evaluate on Levels for coarse/mid/fine alignment, include RSA\nbehavior/uncertainty matching, and extend to additional student backbones\n(Supervised ViT-L, SigLIP, CapPa) to substantiate the generality claim.", "[]"], "exec_time": [270.06046438217163, 1509.7564549446106, 1513.105221748352, null], "exec_time_feedback": ["", "", "", ""], "datasets_successfully_tested": [["[\"THINGS\"", "\"one-shot classification (Birds", "UC Merced", "Colon", "Fine-grained)\"", "\"Levels\"]"], ["[\"THINGS\"]"], ["THINGS", "imagenette"], []], "plot_code": ["import matplotlib.pyplot as plt\nimport numpy as np\nimport os\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\n\ntry:\n    experiment_data = np.load(\n        os.path.join(working_dir, \"experiment_data.npy\"), allow_pickle=True\n    ).item()\nexcept Exception as e:\n    print(f\"Error loading experiment data: {e}\")\n    experiment_data = None\n\nif experiment_data is not None:\n    things = experiment_data.get(\"THINGS\", {})\n    train_losses = things.get(\"losses\", {}).get(\"train\", [])\n    val_losses = things.get(\"losses\", {}).get(\"val\", [])\n    val_metrics = things.get(\"metrics\", {}).get(\"val\", [])\n    baseline_ooo = things.get(\"baseline_ooo\", None)\n    teacher_ooo = things.get(\"teacher_ooo\", None)\n    final_ooo = things.get(\"final_aligned_ooo\", None)\n    preds = np.array(things.get(\"predictions\", []))\n    gt = np.array(things.get(\"ground_truth\", []))\n\n    # Plot 1: Loss curves\n    try:\n        plt.figure(figsize=(6, 4))\n        epochs = np.arange(len(train_losses))\n        plt.plot(epochs, train_losses, label=\"train\", marker=\"o\")\n        plt.plot(epochs, val_losses, label=\"val\", marker=\"s\")\n        plt.xlabel(\"Epoch\")\n        plt.ylabel(\"MSE Loss\")\n        plt.title(\n            \"THINGS Dataset: Distillation Loss Curves\\nLeft: Training, Right: Validation (same plot)\"\n        )\n        plt.legend()\n        plt.tight_layout()\n        plt.savefig(os.path.join(working_dir, \"THINGS_loss_curves.png\"), dpi=100)\n        plt.close()\n    except Exception as e:\n        print(f\"Error creating loss plot: {e}\")\n        plt.close()\n\n    # Plot 2: OOO accuracy over epochs w/ baseline & teacher\n    try:\n        plt.figure(figsize=(6, 4))\n        epochs = np.arange(len(val_metrics))\n        plt.plot(epochs, val_metrics, label=\"Aligned Student\", color=\"C2\", marker=\"o\")\n        if baseline_ooo is not None:\n            plt.axhline(\n                baseline_ooo,\n                color=\"C0\",\n                linestyle=\"--\",\n                label=f\"Baseline DINOv2 ({baseline_ooo:.3f})\",\n            )\n        if teacher_ooo is not None:\n            plt.axhline(\n                teacher_ooo,\n                color=\"C1\",\n                linestyle=\"--\",\n                label=f\"Teacher SigLIP ({teacher_ooo:.3f})\",\n            )\n        plt.xlabel(\"Epoch\")\n        plt.ylabel(\"OOO Accuracy\")\n        plt.title(\n            \"THINGS Dataset: Odd-One-Out Accuracy over Epochs\\nAligned Student vs Baseline vs Teacher\"\n        )\n        plt.legend()\n        plt.tight_layout()\n        plt.savefig(os.path.join(working_dir, \"THINGS_ooo_accuracy_curve.png\"), dpi=100)\n        plt.close()\n    except Exception as e:\n        print(f\"Error creating OOO curve plot: {e}\")\n        plt.close()\n\n    # Plot 3: Final comparison bar chart\n    try:\n        plt.figure(figsize=(6, 4))\n        names, vals = [], []\n        if baseline_ooo is not None:\n            names.append(\"Baseline\\nDINOv2\")\n            vals.append(baseline_ooo)\n        if final_ooo is not None:\n            names.append(\"Aligned\\nStudent\")\n            vals.append(final_ooo)\n        if teacher_ooo is not None:\n            names.append(\"Teacher\\nSigLIP\")\n            vals.append(teacher_ooo)\n        colors = [\"C0\", \"C2\", \"C1\"][: len(vals)]\n        bars = plt.bar(names, vals, color=colors)\n        for b, v in zip(bars, vals):\n            plt.text(b.get_x() + b.get_width() / 2, v + 0.005, f\"{v:.3f}\", ha=\"center\")\n        plt.ylabel(\"OOO Accuracy\")\n        plt.title(\n            \"THINGS Dataset: Final OOO Accuracy Comparison\\nBaseline vs Aligned Student vs Teacher\"\n        )\n
