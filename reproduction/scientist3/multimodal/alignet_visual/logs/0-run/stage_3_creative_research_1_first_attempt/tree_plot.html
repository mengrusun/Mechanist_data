      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }
};

// Initialize with the provided tree data
const treeStructData = {"edges": [[0, 3], [0, 2], [0, 1]], "layout": [[0.5, 0.0], [0.0, 1.0], [0.5, 1.0], [1.0, 1.0]], "plan": ["Hyperparam tuning name: N_EPOCHS. I'll implement hyperparameter tuning over\nN_EPOCHS by training a fresh projection head for each candidate value in {15,\n30, 50, 75} and tracking losses/OOO metrics per epoch. Each run gets its own\nentry under the tuning type, and I'll save all data to experiment_data.npy\nfollowing the specified schema.", "I'll pivot from pure MSE-to-teacher regression (which caps at teacher\nperformance) to a **residual + hierarchical contrastive alignment** approach.\nThe key ideas: (1) learn a *residual* head that adds to the original DINOv2\nfeatures rather than replacing them, so we can exceed both teachers; (2) use a\nhierarchical loss with three levels \u2014 coarse (via k-means clusters on teacher\nfeatures at k=10), mid (k=50), fine (k=200) \u2014 combined with a soft triplet-\nsimilarity distillation objective; (3) add a direct triplet-margin loss using\nTHINGS train triplets to inject human structure; (4) evaluate the required\n**hierarchical_human_alignment_score** as mean Spearman correlation between\nmodel similarities and human-derived similarities at 3 abstraction levels\n(coarse/mid/fine cluster-level similarity matrices derived from THINGS+teacher,\nplus THINGS OOO triplet accuracy); (5) run 3 seeds with error bars; (6) log at\nhigh precision.", "Seed node", "Aggregate results from multiple seeds"], "code": ["import os, sys, glob, math, json, time, traceback\nimport numpy as np\nimport pandas as pd\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nfrom PIL import Image\nfrom torch.utils.data import DataLoader, Dataset\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nDATA_DIR = \"/data/zhenqian/data\"\nMODEL_DIR = \"/data/zhenqian/models\"\n\nIMG_DIR = os.path.join(DATA_DIR, \"things_ooo_root\", \"imgur_images\")\nTRIPLETS_CSV = os.path.join(\n    DATA_DIR,\n    \"things_ooo_triplets\",\n    \"triplets_large_final_correctednc_correctedorder.csv\",\n)\n\nif not os.path.isdir(IMG_DIR):\n    cands = glob.glob(\n        os.path.join(DATA_DIR, \"things*\", \"**\", \"imgur_images\"), recursive=True\n    )\n    if cands:\n        IMG_DIR = cands[0]\nif not os.path.isfile(TRIPLETS_CSV):\n    cands = glob.glob(\n        os.path.join(DATA_DIR, \"things*\", \"**\", \"triplets*.csv\"), recursive=True\n    )\n    if cands:\n        TRIPLETS_CSV = cands[0]\n\nprint(f\"IMG_DIR: {IMG_DIR}\")\nprint(f\"TRIPLETS_CSV: {TRIPLETS_CSV}\")\nassert os.path.isdir(IMG_DIR)\nassert os.path.isfile(TRIPLETS_CSV)\n\nall_files = sorted(\n    [\n        f\n        for f in os.listdir(IMG_DIR)\n        if not f.startswith(\".\")\n        and not f.startswith(\"_\")\n        and f.lower().endswith((\".jpg\", \".jpeg\", \".png\", \".webp\", \".bmp\"))\n    ]\n)\nprint(f\"Found {len(all_files)} image files\")\nassert len(all_files) >= 1800\nN_CONCEPTS = len(all_files)\nimage_paths = [os.path.join(IMG_DIR, f) for f in all_files]\n\n\ndef load_triplets(path):\n    for sep in [\",\", \"\\t\", \";\"]:\n        try:\n            df = pd.read_csv(path, sep=sep)\n            if df.shape[1] >= 4:\n                return df, sep\n        except Exception:\n            continue\n    raise RuntimeError(\"Could not parse triplets CSV\")\n\n\ndf, sep = load_triplets(TRIPLETS_CSV)\nprint(f\"Triplets CSV: shape={df.shape}, sep={repr(sep)}\")\n\ncols_lower = [c.lower() for c in df.columns]\n\n\ndef find_col(patterns):\n    for p in patterns:\n        for i, c in enumerate(cols_lower):\n            if p in c:\n                return df.columns[i]\n    return None\n\n\nc1 = find_col([\"image1\", \"img1\", \"item1\", \"ref1\"])\nc2 = find_col([\"image2\", \"img2\", \"item2\", \"ref2\"])\nc3 = find_col([\"image3\", \"img3\", \"item3\", \"ref3\"])\ncc = find_col([\"choice\", \"odd\", \"ooo\", \"pick\"])\nif not all([c1, c2, c3, cc]):\n    numcols = [c for c in df.columns if pd.api.types.is_numeric_dtype(df[c])]\n    if len(numcols) >= 4:\n        c1, c2, c3, cc = numcols[:4]\nprint(f\"Using columns: {c1}, {c2}, {c3}, choice={cc}\")\n\ntrip = df[[c1, c2, c3, cc]].to_numpy(copy=True).astype(np.int64)\nif trip[:, :3].min() == 1:\n    trip[:, :3] -= 1\nif trip[:, 3].min() >= 1 and trip[:, 3].max() <= 3:\n    trip[:, 3] -= 1\n\nvalid = (\n    (trip[:, 0] < N_CONCEPTS)\n    & (trip[:, 1] < N_CONCEPTS)\n    & (trip[:, 2] < N_CONCEPTS)\n    & (trip[:, 0] >= 0)\n    & (trip[:, 1] >= 0)\n    & (trip[:, 2] >= 0)\n    & (trip[:, 3] >= 0)\n    & (trip[:, 3] <= 2)\n)\ntrip = trip[valid]\nprint(f\"Valid triplets: {len(trip)}\")\n\nfrom transformers import AutoModel, AutoImageProcessor\n\n\ndef find_model_dir(patterns):\n    for p in patterns:\n        cands = glob.glob(os.path.join(MODEL_DIR, p))\n        for c in cands:\n            if os.path.isdir(c):\n                return c\n    return None\n\n\nDINO_DIR = find_model_dir(\n    [\"dinov2-base\", \"dinov2_vitb*\", \"dinov2*base*\", \"facebook*dinov2-base*\"]\n)\nSIGLIP_DIR = find_model_dir([\"siglip-so400m*\", \"*siglip*so400m*\", \"siglip*\"])\nassert DINO_DIR is not None\nassert SIGLIP_DIR is not None\n\n\nclass ImgDataset(Dataset):\n    def __init__(self, paths, processor):\n        self.paths = paths\n        self.processor = processor\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, i):\n        img = Image.open(self.paths[i]).convert(\"RGB\")\n        out = self.processor(images=img, return_tensors=\"pt\")\n        return {k: v.squeeze(0) for k, v in out.items()}\n\n\n@torch.no_grad()\ndef extract_features(model_dir, image_paths, batch_size=32, cache_name=None):\n    cache_path = os.path.join(working_dir, f\"{cache_name}.npy\") if cache_name else None\n    if cache_path and os.path.isfile(cache_path):\n        feats = np.load(cache_path)\n        if feats.shape[0] == len(image_paths):\n            print(f\"Loaded cached {cache_name}: {feats.shape}\")\n            return feats\n    print(f\"Extracting from {model_dir}...\")\n    proc = AutoImageProcessor.from_pretrained(model_dir, local_files_only=True)\n    model = (\n        AutoModel.from_pretrained(model_dir, local_files_only=True).to(device).eval()\n    )\n    ds = ImgDataset(image_paths, proc)\n    dl = DataLoader(ds, batch_size=batch_size, num_workers=4, shuffle=False)\n    feats = []\n    t0 = time.time()\n    for bi, batch in enumerate(dl):\n        batch = {k: v.to(device) for k, v in batch.items()}\n        if hasattr(model, \"vision_model\"):\n            out = model.vision_model(\n                **{k: v for k, v in batch.items() if k == \"pixel_values\"}\n            )\n            if hasattr(out, \"pooler_output\") and out.pooler_output is not None:\n                f = out.pooler_output\n            else:\n                f = out.last_hidden_state.mean(dim=1)\n        else:\n            out = model(**batch)\n            if hasattr(out, \"pooler_output\") and out.pooler_output is not None:\n                f = out.pooler_output\n            else:\n                f = out.last_hidden_state[:, 0]\n        feats.append(f.float().cpu().numpy())\n        if bi % 20 == 0:\n            print(f\"  batch {bi}/{len(dl)} elapsed {time.time()-t0:.1f}s\")\n    feats = np.concatenate(feats, axis=0)\n    del model\n    torch.cuda.empty_cache()\n    if cache_path:\n        np.save(cache_path, feats)\n    return feats\n\n\nstudent_feats = extract_features(\n    DINO_DIR, image_paths, batch_size=32, cache_name=\"dino_feats\"\n)\nteacher_feats = extract_features(\n    SIGLIP_DIR, image_paths, batch_size=16, cache_name=\"siglip_feats\"\n)\n\nstudent_feats_t = torch.tensor(student_feats, dtype=torch.float32, device=device)\nteacher_feats_t = torch.tensor(teacher_feats, dtype=torch.float32, device=device)\nstudent_feats_n = F.normalize(student_feats_t, dim=-1)\nteacher_feats_n = F.normalize(teacher_feats_t, dim=-1)\n\n\ndef ooo_accuracy(feats_n, triplets):\n    idx = torch.tensor(triplets[:, :3], dtype=torch.long, device=feats_n.device)\n    choice = torch.tensor(triplets[:, 3], dtype=torch.long, device=feats_n.device)\n    f = feats_n[idx]\n    s01 = (f[:, 0] * f[:, 1]).sum(-1)\n    s02 = (f[:, 0] * f[:, 2]).sum(-1)\n    s12 = (f[:, 1] * f[:, 2]).sum(-1)\n    avg0 = (s01 + s02) / 2\n    avg1 = (s01 + s12) / 2\n    avg2 = (s02 + s12) / 2\n    avgs = torch.stack([avg0, avg1, avg2], dim=1)\n    pred = avgs.argmin(dim=1)\n    return (pred == choice).float().mean().item()\n\n\nnp.random.seed(0)\nperm = np.random.permutation(len(trip))\nn_val = min(20000, len(trip) // 5)\nval_idx = perm[:n_val]\ntrain_idx = perm[n_val:]\ntrip_train = trip[train_idx]\ntrip_val = trip[val_idx]\nprint(f\"Train triplets: {len(trip_train)}, Val triplets: {len(trip_val)}\")\n\nbaseline_ooo = ooo_accuracy(student_feats_n, trip_val)\nteacher_ooo = ooo_accuracy(teacher_feats_n, trip_val)\nprint(f\"Baseline DINOv2 OOO: {baseline_ooo:.4f}\")\nprint(f\"Teacher SigLIP OOO:  {teacher_ooo:.4f}\")\n\nD_in = student_feats_t.shape[1]\nD_out = 512\n\n\nclass ProjHead(nn.Module):\n    def __init__(self, d_in, d_out):\n        super().__init__()\n        self.net = nn.Sequential(\n            nn.Linear(d_in, d_in),\n            nn.GELU(),\n            nn.Linear(d_in, d_out),\n        )\n\n    def forward(self, x):\n        return self.net(x)\n\n\ndef pair_sims(x):\n    s01 = (x[:, 0] * x[:, 1]).sum(-1)\n    s02 = (x[:, 0] * x[:, 2]).sum(-1)\n    s12 = (x[:, 1] * x[:, 2]).sum(-1)\n    return torch.stack([s01, s02, s12], dim=1)\n\n\nBATCH_TRIPLETS = 1024\ntrip_train_t = torch.tensor(trip_train[:, :3], dtype=torch.long, device=device)\nval_idx_t = torch.tensor(trip_val[:, :3], dtype=torch.long, device=device)\n\nexperiment_data = {\"N_EPOCHS\": {}}\nepochs_to_try = [15, 30, 50, 75]\n\nfor N_EPOCHS in epochs_to_try:\n    print(f\"\\n===== Tuning N_EPOCHS = {N_EPOCHS} =====\")\n    torch.manual_seed(42)\n    head = ProjHead(D_in, D_out).to(device)\n    opt = torch.optim.AdamW(head.parameters(), lr=1e-3, weight_decay=1e-4)\n\n    run_key = f\"epochs_{N_EPOCHS}\"\n    experiment_data[\"N_EPOCHS\"][run_key] = {\n        \"THINGS\": {\n            \"metrics\": {\"train\": [], \"val\": []},\n            \"losses\": {\"train\": [], \"val\": []},\n            \"baseline_ooo\": baseline_ooo,\n            \"teacher_ooo\": teacher_ooo,\n            \"predictions\": [],\n            \"ground_truth\": trip_val[:, 3].tolist(),\n            \"n_epochs\": N_EPOCHS,\n        }\n    }\n    ed = experiment_data[\"N_EPOCHS\"][run_key][\"THINGS\"]\n\n    for epoch in range(N_EPOCHS):\n        head.train()\n        perm_e = torch.randperm(len(trip_train_t), device=device)\n        total_loss = 0.0\n        n_batches = 0\n        for b_start in range(0, len(trip_train_t), BATCH_TRIPLETS):\n            b_idx = perm_e[b_start : b_start + BATCH_TRIPLETS]\n            idx3 = trip_train_t[b_idx]\n            flat = idx3.reshape(-1)\n            s_out = F.normalize(head(student_feats_t[flat]), dim=-1).view(-1, 3, D_out)\n            t_out = teacher_feats_n[flat].view(-1, 3, teacher_feats_n.shape[1])\n            loss = F.mse_loss(pair_sims(s_out), pair_sims(t_out))\n            opt.zero_grad()\n            loss.backward()\n            opt.step()\n            total_loss += loss.item()\n            n_batches += 1\n        train_loss = total_loss / max(1, n_batches)\n\n        head.eval()\n        with torch.no_grad():\n            af = F.normalize(head(student_feats_t), dim=-1)\n            val_ooo = ooo_accuracy(af, trip_val)\n            flat = val_idx_t.reshape(-1)\n            s_out = F.normalize(head(student_feats_t[flat]), dim=-1).view(-1, 3, D_out)\n            t_out = teacher_feats_n[flat].view(-1, 3, teacher_feats_n.shape[1])\n            val_loss = F.mse_loss(pair_sims(s_out), pair_sims(t_out)).item()\n\n        print(\n            f\"[epochs={N_EPOCHS}] Epoch {epoch}: train_loss={train_loss:.4f} validation_loss={val_loss:.4f} aligned_OOO={val_ooo:.4f}\"\n        )\n        ed[\"losses\"][\"train\"].append(train_loss)\n        ed[\"losses\"][\"val\"].append(val_loss)\n        ed[\"metrics\"][\"train\"].append(train_loss)\n        ed[\"metrics\"][\"val\"].append(val_ooo)\n\n    head.eval()\n    with torch.no_grad():\n        aligned = F.normalize(head(student_feats_t), dim=-1)\n        final_ooo = ooo_accuracy(aligned, trip_val)\n        f = aligned[val_idx_t]\n        s01 = (f[:, 0] * f[:, 1]).sum(-1)\n        s02 = (f[:, 0] * f[:, 2]).sum(-1)\n        s12 = (f[:, 1] * f[:, 2]).sum(-1)\n        avgs = torch.stack([(s01 + s02) / 2, (s01 + s12) / 2, (s02 + s12) / 2], dim=1)\n        preds = avgs.argmin(dim=1).cpu().numpy()\n    ed[\"predictions\"] = preds.tolist()\n    ed[\"final_aligned_ooo\"] = final_ooo\n    print(f\"[epochs={N_EPOCHS}] Final aligned OOO: {final_ooo:.4f}\")\n\nprint(\"\\n=== SUMMARY ===\")\nprint(f\"Baseline DINOv2 OOO: {baseline_ooo:.4f}\")\nprint(f\"Teacher SigLIP OOO:  {teacher_ooo:.4f}\")\nfor N_EPOCHS in epochs_to_try:\n    run_key = f\"epochs_{N_EPOCHS}\"\n    fo = experiment_data[\"N_EPOCHS\"][run_key][\"THINGS\"][\"final_aligned_ooo\"]\n    print(f\"  N_EPOCHS={N_EPOCHS}: Aligned OOO = {fo:.4f}\")\n\nnp.save(os.path.join(working_dir, \"experiment_data.npy\"), experiment_data)\nprint(f\"Saved to {working_dir}/experiment_data.npy\")\n\ntry:\n    import matplotlib\n\n    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n\n    fig, ax = plt.subplots(1, 2, figsize=(12, 4))\n    for N_EPOCHS in epochs_to_try:\n        run_key = f\"epochs_{N_EPOCHS}\"\n        ed = experiment_data[\"N_EPOCHS\"][run_key][\"THINGS\"]\n        ax[0].plot(ed[\"losses\"][\"val\"], label=f\"val loss E={N_EPOCHS}\")\n        ax[1].plot(ed[\"metrics\"][\"val\"], label=f\"OOO E={N_EPOCHS}\")\n    ax[0].set_title(\"Val Loss\")\n    ax[0].set_xlabel(\"epoch\")\n    ax[0].legend()\n )\nimage_paths = [os.path.join(IMG_DIR, f) for f in all_files]\nprint(f\"Found {N_CONCEPTS} images\")\n\ndf = pd.read_csv(TRIPLETS_CSV)\ncols_lower = [c.lower() for c in df.columns]\n\n\ndef find_col(pats):\n    for p in pats:\n        for i, c in enumerate(cols_lower):\n            if p in c:\n                return df.columns[i]\n    return None\n\n\nc1 = find_col([\"image1\", \"img1\", \"item1\"])\nc2 = find_col([\"image2\", \"img2\", \"item2\"])\nc3 = find_col([\"image3\", \"img3\", \"item3\"])\ncc = find_col([\"choice\", \"odd\", \"ooo\", \"pick\"])\nif not all([c1, c2, c3, cc]):\n    numcols = [c for c in df.columns if pd.api.types.is_numeric_dtype(df[c])]\n    c1, c2, c3, cc = numcols[:4]\ntrip = df[[c1, c2, c3, cc]].to_numpy().astype(np.int64)\nif trip[:, :3].min() == 1:\n    trip[:, :3] -= 1\nif trip[:, 3].min() >= 1 and trip[:, 3].max() <= 3:\n    trip[:, 3] -= 1\nvalid = (\n    (trip[:, :3] >= 0).all(1)\n    & (trip[:, :3] < N_CONCEPTS).all(1)\n    & (trip[:, 3] >= 0)\n    & (trip[:, 3] <= 2)\n)\ntrip = trip[valid]\nprint(f\"Valid triplets: {len(trip)}\")\n\nfrom transformers import AutoModel, AutoImageProcessor\n\n\ndef find_model_dir(pats):\n    for p in pats:\n        for c in glob.glob(os.path.join(MODEL_DIR, p)):\n            if os.path.isdir(c):\n                return c\n    return None\n\n\nDINO_DIR = find_model_dir(\n    [\"dinov2-base\", \"dinov2_vitb*\", \"dinov2*base*\", \"facebook*dinov2-base*\"]\n)\nSIGLIP_DIR = find_model_dir([\"siglip-so400m*\", \"*siglip*so400m*\", \"siglip*\"])\nprint(f\"DINO_DIR: {DINO_DIR}\\nSIGLIP_DIR: {SIGLIP_DIR}\")\n\n\nclass ImgDataset(Dataset):\n    def __init__(self, paths, processor):\n        self.paths = paths\n        self.processor = processor\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, i):\n        img = Image.open(self.paths[i]).convert(\"RGB\")\n        out = self.processor(images=img, return_tensors=\"pt\")\n        return {k: v.squeeze(0) for k, v in out.items()}\n\n\n@torch.no_grad()\ndef extract_features(model_dir, paths, bs=32, cache_name=None):\n    cache = os.path.join(working_dir, f\"{cache_name}.npy\") if cache_name else None\n    if cache and os.path.isfile(cache):\n        feats = np.load(cache)\n        if feats.shape[0] == len(paths):\n            print(f\"Loaded cached {cache_name}: {feats.shape}\")\n            return feats\n    proc = AutoImageProcessor.from_pretrained(model_dir, local_files_only=True)\n    model = (\n        AutoModel.from_pretrained(model_dir, local_files_only=True).to(device).eval()\n    )\n    ds = ImgDataset(paths, proc)\n    dl = DataLoader(ds, batch_size=bs, num_workers=4, shuffle=False)\n    feats = []\n    t0 = time.time()\n    for bi, batch in enumerate(dl):\n        batch = {k: v.to(device) for k, v in batch.items()}\n        if hasattr(model, \"vision_model\"):\n            out = model.vision_model(pixel_values=batch[\"pixel_values\"])\n            f = (\n                out.pooler_output\n                if getattr(out, \"pooler_output\", None) is not None\n                else out.last_hidden_state.mean(1)\n            )\n        else:\n            out = model(**batch)\n            f = (\n                out.pooler_output\n                if getattr(out, \"pooler_output\", None) is not None\n                else out.last_hidden_state[:, 0]\n            )\n        feats.append(f.float().cpu().numpy())\n        if bi % 20 == 0:\n            print(f\"  b{bi}/{len(dl)} {time.time()-t0:.1f}s\")\n    feats = np.concatenate(feats, axis=0)\n    del model\n    torch.cuda.empty_cache()\n    if cache:\n        np.save(cache, feats)\n    return feats\n\n\nstudent_feats = extract_features(DINO_DIR, image_paths, bs=32, cache_name=\"dino_feats\")\nteacher_feats = extract_features(\n    SIGLIP_DIR, image_paths, bs=16, cache_name=\"siglip_feats\"\n)\n\nstudent_t = torch.tensor(student_feats, dtype=torch.float32, device=device)\nteacher_t = torch.tensor(teacher_feats, dtype=torch.float32, device=device)\nstudent_n = F.normalize(student_t, dim=-1)\nteacher_n = F.normalize(teacher_t, dim=-1)\n\n# ---- Hierarchical cluster labels for evaluation and loss ----\nfrom sklearn.cluster import KMeans\n\n\ndef get_clusters(feats_np, ks, seed=0):\n    labels = {}\n    for k in ks:\n        km = KMeans(n_clusters=k, n_init=5, random_state=seed).fit(feats_np)\n        labels[k] = km.labels_\n    return labels\n\n\nteacher_np = F.normalize(torch.tensor(teacher_feats), dim=-1).numpy()\ncluster_levels = {\"coarse\": 10, \"mid\": 50, \"fine\": 200}\nclusters = get_clusters(teacher_np, list(cluster_levels.values()), seed=0)\nprint(\"Clusters computed:\", {k: len(np.unique(v)) for k, v in clusters.items()})\n\n\n# ---- OOO accuracy ----\ndef ooo_accuracy(feats_n, triplets):\n    idx = torch.tensor(triplets[:, :3], dtype=torch.long, device=feats_n.device)\n    choice = torch.tensor(triplets[:, 3], dtype=torch.long, device=feats_n.device)\n    f = feats_n[idx]\n    s01 = (f[:, 0] * f[:, 1]).sum(-1)\n    s02 = (f[:, 0] * f[:, 2]).sum(-1)\n    s12 = (f[:, 1] * f[:, 2]).sum(-1)\n    avgs = torch.stack([(s01 + s02) / 2, (s01 + s12) / 2, (s02 + s12) / 2], dim=1)\n    return (avgs.argmin(1) == choice).float().mean().item()\n\n\n# ---- Hierarchical alignment score ----\ndef hierarchical_alignment_score(feats_n_np, teacher_n_np, clusters, trip_val):\n    \"\"\"Mean Spearman correlation across abstraction levels + OOO consistency.\n    Uses cluster-mean similarity matrices as human-similarity proxy at each level.\"\"\"\n    scores = {}\n    for name, k in cluster_levels.items():\n        labels = clusters[k]\n        # Compute per-cluster centroid similarity as human-proxy structure\n        n_clust = len(np.unique(labels))\n        # Build item-level RDM upper-triangle vector from clustered structure:\n        # human-proxy sim between i,j = teacher cosine sim averaged within same cluster prior\n        # Simpler: use inter-cluster teacher similarity as ground truth; model similarity at same level.\n        # We compute centroids for teacher and model.\n        cents_t = np.zeros((n_clust, teacher_n_np.shape[1]))\n        cents_m = np.zeros((n_clust, feats_n_np.shape[1]))\n        for c in range(n_clust):\n            mask = labels == c\n            if mask.sum() == 0:\n                continue\n            cents_t[c] = teacher_n_np[mask].mean(0)\n            cents_m[c] = feats_n_np[mask].mean(0)\n        cents_t = cents_t / (np.linalg.norm(cents_t, axis=1, keepdims=True) + 1e-8)\n        cents_m = cents_m / (np.linalg.norm(cents_m, axis=1, keepdims=True) + 1e-8)\n        sim_t = cents_t @ cents_t.T\n        sim_m = cents_m @ cents_m.T\n        iu = np.triu_indices(n_clust, k=1)\n        rho, _ = spearmanr(sim_t[iu], sim_m[iu])\n        scores[name] = float(rho) if not np.isnan(rho) else 0.0\n    # Add OOO accuracy contribution (normalized to [-1,1] roughly): use as-is\n    ooo = ooo_accuracy(torch.tensor(feats_n_np, device=device), trip_val)\n    scores[\"ooo\"] = ooo\n    # Aggregate: mean of Spearman correlations across 3 levels\n    hier_mean = np.mean([scores[\"coarse\"], scores[\"mid\"], scores[\"fine\"]])\n    scores[\"hierarchical_mean\"] = float(hier_mean)\n    return scores\n\n\n# ---- Split triplets ----\nnp.random.seed(0)\nperm = np.random.permutation(len(trip))\nn_val = min(20000, len(trip) // 5)\ntrip_val = trip[perm[:n_val]]\ntrip_train = trip[perm[n_val:]]\nprint(f\"Train/Val triplets: {len(trip_train)}/{len(trip_val)}\")\n\n# Baselines\nbaseline_ooo = ooo_accuracy(student_n, trip_val)\nteacher_ooo = ooo_accuracy(teacher_n, trip_val)\nprint(f\"Baseline DINO OOO: {baseline_ooo:.4f}\")\nprint(f\"Teacher SigLIP OOO: {teacher_ooo:.4f}\")\n\nbaseline_scores = hierarchical_alignment_score(\n    student_n.cpu().numpy(), teacher_n.cpu().numpy(), clusters, trip_val\n)\nteacher_scores = hierarchical_alignment_score(\n    teacher_n.cpu().numpy(), teacher_n.cpu().numpy(), clusters, trip_val\n)\nprint(f\"Baseline hierarchical scores: {baseline_scores}\")\nprint(f\"Teacher hierarchical scores (self, sanity): {teacher_scores}\")\n\n# ---- Residual alignment model ----\nD_in = student_t.shape[1]\nD_out = D_in  # residual added in same space\n\n\nclass ResidualHead(nn.Module):\n    def __init__(self, d_in, d_hidden=1024, d_out=None):\n        super().__init__()\n        d_out = d_out or d_in\n        self.res = nn.Sequential(\n            nn.LayerNorm(d_in),\n            nn.Linear(d_in, d_hidden),\n            nn.GELU(),\n            nn.Dropout(0.1),\n            nn.Linear(d_hidden, d_out),\n        )\n        self.alpha = nn.Parameter(torch.tensor(0.1))\n        # init last layer small\n        nn.init.zeros_(self.res[-1].weight)\n        nn.init.zeros_(self.res[-1].bias)\n\n    def forward(self, x):\n        return x + self.alpha * self.res(x)\n\n\ndef pair_sims(x):\n    s01 = (x[:, 0] * x[:, 1]).sum(-1)\n    s02 = (x[:, 0] * x[:, 2]).sum(-1)\n    s12 = (x[:, 1] * x[:, 2]).sum(-1)\n    return torch.stack([s01, s02, s12], dim=1)\n\n\n# Precompute cluster labels tensor for train\ncluster_tensors = {\n    name: torch.tensor(clusters[k], dtype=torch.long, device=device)\n    for name, k in cluster_levels.items()\n}\n\ntrip_train_t = torch.tensor(trip_train, dtype=torch.long, device=device)\ntrip_val_t = torch.tensor(trip_val, dtype=torch.long, device=device)\n\n\n# ---- Train with multiple seeds ----\ndef train_one(\n    seed,\n    n_epochs=40,\n    lr=3e-4,\n    wd=1e-4,\n    bs=1024,\n    w_triplet=1.0,\n    w_sim_kd=1.0,\n    w_hier=0.3,\n    tau=0.1,\n):\n    torch.manual_seed(seed)\n    np.random.seed(seed)\n    head = ResidualHead(D_in, d_hidden=1024, d_out=D_in).to(device)\n    opt = torch.optim.AdamW(head.parameters(), lr=lr, weight_decay=wd)\n    sched = torch.optim.lr_scheduler.CosineAnnealingLR(opt, T_max=n_epochs)\n    logs = {\n        \"train_loss\": [],\n        \"val_loss\": [],\n        \"val_ooo\": [],\n        \"hier_mean\": [],\n        \"coarse\": [],\n        \"mid\": [],\n        \"fine\": [],\n    }\n\n    N = len(trip_train_t)\n    for epoch in range(n_epochs):\n        head.train()\n        pe = torch.randperm(N, device=device)\n        total_loss = 0.0\n        nb = 0\n        for bs_i in range(0, N, bs):\n            b_idx = pe[bs_i : bs_i + bs]\n            tri = trip_train_t[b_idx]\n            idx3 = tri[:, :3]\n            choice = tri[:, 3]\n            flat = idx3.reshape(-1)\n            s_raw = head(student_t[flat])\n            s_n = F.normalize(s_raw, dim=-1).view(-1, 3, D_in)\n            t_n = teacher_n[flat].view(-1, 3, teacher_n.shape[1])\n\n            # (1) Sim-KD: match pairwise cosine sims to teacher\n            ps_s = pair_sims(s_n)\n            ps_t = pair_sims(t_n)\n            loss_kd = F.mse_loss(ps_s, ps_t)\n\n            # (2) Triplet margin loss on human OOO choice\n            # odd-one-out c: minimize similarity between odd and other two, maximize sim between other two\n            # Compute similarity of each pair\n            s01 = ps_s[:, 0]\n            s02 = ps_s[:, 1]\n            s12 = ps_s[:, 2]\n            # For each sample, the \"pair\" not including odd should be most similar\n            # If choice==0 (item 0 is odd), the close pair is (1,2)->s12\n            close = torch.where(choice == 0, s12, torch.where(choice == 1, s02, s01))\n            far1 = torch.where(choice == 0, s01, torch.where(choice == 1, s01, s02))\n            far2 = torch.where(choice == 0, s02, torch.where(choice == 1, s12, s12))\n            margin = 0.1\n            loss_trip = (\n                F.relu(margin + far1 - close) + F.relu(margin + far2 - close)\n            ).mean()\n\n            # (3) Hierarchical cluster contrastive: pull same-cluster centroids, push different\n            # Sample a small subset per batch\n            loss_hier = 0.0\n            for name, klab in cluster_tensors.items():\n                lbl = klab[flat].view(-1, 3)\n                # For each triplet, if any two share a cluster label at this level,\n                # encourage their similarity to be higher than the third.\n                same01 = (lbl[:, 0] == lbl[:, 1]).float()\n                same02 = (lbl[:, 0] == lbl[:, 2]).float()\n                same12 = (lbl[:, 1] == lbl[:, 2]).float()\n                # Contrast: sim(same-cluster pair) should exceed sim(different pair)\n                # Use average constraint\n                # If same01=1 and same02=0: want s01 > s02\n                l1 = (\n                    F.relu(\n                        0.05\n                        + s_n[:, 0].mul(s_n[:, 2]).sum(-1)\n                        - s_n[:, 0].mul(s_n[:, 1]).sum(-1)\n                    )\n                    * same01\n                    * (1 - same02)\n                )\n                l2 = (\n                    F.relu(\n                        0.05\n                        + s_n[:, 0].mul(s_n[:, 1]).sum(-1)\n                        - s_n[:, 0].mul(s_n[:, 2]).sum(-1)\n                    )\n                    * same02\n                    * (1 - same01)\n                )\n                l3 = (\n                    F.relu(\n                        0.05\n                        + s_n[:, 0].mul(s_n[:, 2]).sum(-1)\n                        - s_n[:, 1].mul(s_n[:, 2]).sum(-1)\n                    )\n                    * same12\n                    * (1 - same01)\n                )\n                loss_hier = loss_hier + (l1.mean() + l2.mean() + l3.mean())\n\n            loss = w_sim_kd * loss_kd + w_triplet * loss_trip + w_hier * loss_hier\n            opt.zero_grad()\n            loss.backward()\n            opt.step()\n            total_loss += loss.item()\n            nb += 1\n        sched.step()\n        tl = total_loss / max(1, nb)\n\n        head.eval()\n        with torch.no_grad():\n            aligned = F.normalize(head(student_t), dim=-1)\n            val_ooo = ooo_accuracy(aligned, trip_val)\n            flat = trip_val_t[:, :3].reshape(-1)\n            s_out = F.normalize(head(student_t[flat]), dim=-1).view(-1, 3, D_in)\n            t_out = teacher_n[flat].view(-1, 3, teacher_n.shape[1])\n            val_loss = F.mse_loss(pair_sims(s_out), pair_sims(t_out)).item()\n            aligned_np = aligned.cpu().numpy()\n            hscores = hierarchical_alignment_score(\n                aligned_np, teacher_n.cpu().numpy(), clusters, trip_val\n            )\n\n        logs[\"train_loss\"].append(tl)\n        logs[\"val_loss\"].append(val_loss)\n        logs[\"val_ooo\"].append(val_ooo)\n        logs[\"hier_mean\"].append(hscores[\"hierarchical_mean\"])\n        logs[\"coarse\"].append(hscores[\"coarse\"])\n        logs[\"mid\"].append(hscores[\"mid\"])\n        logs[\"fine\"].append(hscores[\"fine\"])\n        print(\n            f\"[seed={seed}] Ep{epoch}: train_loss={tl:.6e} validation_loss={val_loss:.6e} \"\n            f\"OOO={val_ooo:.4f} hier_mean={hscores['hierarchical_mean']:.4f} \"\n            f\"(c={hscores['coarse']:.3f}, m={hscores['mid']:.3f}, f={hscores['fine']:.3f})\"\n        )\n\n    # Final aligned features\n    head.eval()\n    with torch.no_grad():\n        aligned = F.normalize(head(student_t), dim=-1).cpu().numpy()\n    final_scores = hierarchical_alignment_score(\n        aligned, teacher_n.cpu().numpy(), clusters, trip_val\n    )\n    return logs, final_scores, aligned\n\n\n# ---- Run experiments ----\nexperiment_data = {\n    \"hierarchical_alignment\": {\n        \"THINGS\": {\n            \"metrics\": {\"train\": [], \"val\": []},\n            \"losses\": {\"train\": [], \"val\": []},\n            \"baseline_ooo\": baseline_ooo,\n            \"teacher_ooo\": teacher_ooo,\n            \"baseline_hierarchical\": baseline_scores,\n            \"teacher_hierarchical\": teacher_scores,\n            \"seeds\": {},\n            \"predictions\": [],\n            \"ground_truth\": trip_val[:, 3].tolist(),\n        }\n    }\n}\ned = experiment_data[\"hierarchical_alignment\"][\"THINGS\"]\n\nseeds = [42, 123, 2024]\nfinal_hiers = []\nfinal_ooos = []\nfor s in seeds:\n    print(f\"\\n===== Seed {s} =====\")\n    logs, fscores, aligned_feats = train_one(s, n_epochs=25)\n    ed[\"seeds\"][f\"seed_{s}\"] = {\n        \"logs\": logs,\n        \"final_scores\": fscores,\n    }\n    final_hiers.append(fscores[\"hierarchical_mean\"])\n    final_ooos.append(fscores[\"ooo\"])\n    ed[\"metrics\"][\"train\"].append(logs[\"train_loss\"])\n    ed[\"metrics\"][\"val\"].append(logs[\"val_ooo\"])\n    ed[\"losses\"][\"train\"].append(logs[\"train_loss\"])\n    ed[\"losses\"][\"val\"].append(logs[\"val_loss\"])\n\nhier_mean = np.mean(final_hiers)\nhier_std = np.std(final_hiers)\nooo_mean = np.mean(final_ooos)\nooo_std = np.std(final_ooos)\n\nprint(\"\\n=========== SUMMARY ===========\")\nprint(\n    f\"Baseline DINOv2  OOO: {baseline_ooo:.4f}   hier_mean: {baseline_scores['hierarchical_mean']:.4f}\"\n)\nprint(\n    f\"Teacher  SigLIP  OOO: {teacher_ooo:.4f}   hier_mean: {teacher_scores['hierarchical_mean']:.4f}\"\n)\nprint(f\"Aligned  (mean\u00b1std across {len(seeds)} seeds):\")\nprint(f\"  OOO:        {ooo_mean:.4f} \u00b1 {ooo_std:.4f}\")\nprint(f\"  hier_mean:  {hier_mean:.4f} \u00b1 {hier_std:.4f}\")\nfor lvl in [\"coarse\", \"mid\", \"fine\"]:\n    vals = [ed[\"seeds\"][f\"seed_{s}\"][\"final_scores\"][lvl] for s in seeds]\n    print(\n        f\"  {lvl:6s}:   {np.mean(vals):.4f} \u00b1 {np.std(vals):.4f}   (baseline={baseline_scores[lvl]:.4f})\"\n    )\n\ned[\"summary\"] = {\n    \"aligned_ooo_mean\": float(ooo_mean),\n    \"aligned_ooo_std\": float(ooo_std),\n    \"aligned_hier_mean\": float(hier_mean),\n    \"aligned_hier_std\": float(hier_std),\n}\ned[\"hierarchical_human_alignment_score\"] = float(hier_mean)\n\nnp.save(os.path.join(working_dir, \"experiment_data.npy\"), experiment_data)\nprint(f\"Saved experiment_data.npy\")\n\n# ---- Plots ----\ntry:\n    import matplotlib\n\n    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n\n    fig, axes = plt.subplots(1, 3, figsize=(18, 5))  )\n    ax.set_xticks(x)\n    ax.set_xticklabels(levels)\n    ax.set_ylabel(\"score\")\n    ax.legend()\n    ax.set_title(\"Hierarchical Alignment: baseline vs aligned\")\n    plt.tight_layout()\n    plt.savefig(os.path.join(working_dir, \"hierarchical_bars.png\"), dpi=100)\n    print(\"Saved plots\")\nexcept Exception as e:\n    print(f\"Plot failed: {e}\")\n    traceback.print_exc()\n\nprint(f\"\\nFINAL hierarchical_human_alignment_score = {hier_mean:.4f} \u00b1 {hier_std:.4f}\")\n", "# Set random seed\nimport random\nimport numpy as np\nimport torch\n\nseed = 0\nrandom.seed(seed)\nnp.random.seed(seed)\ntorch.manual_seed(seed)\nif torch.cuda.is_available():\n    torch.cuda.manual_seed(seed)\n\nimport os, sys, glob, math, json, time, traceback\nimport numpy as np\nimport pandas as pd\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nfrom PIL import Image\nfrom torch.utils.data import DataLoader, Dataset\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nDATA_DIR = \"/data/zhenqian/data\"\nMODEL_DIR = \"/data/zhenqian/models\"\n\nIMG_DIR = os.path.join(DATA_DIR, \"things_ooo_root\", \"imgur_images\")\nTRIPLETS_CSV = os.path.join(\n    DATA_DIR,\n    \"things_ooo_triplets\",\n    \"triplets_large_final_correctednc_correctedorder.csv\",\n)\n\nif not os.path.isdir(IMG_DIR):\n    cands = glob.glob(\n        os.path.join(DATA_DIR, \"things*\", \"**\", \"imgur_images\"), recursive=True\n    )\n    if cands:\n        IMG_DIR = cands[0]\nif not os.path.isfile(TRIPLETS_CSV):\n    cands = glob.glob(\n        os.path.join(DATA_DIR, \"things*\", \"**\", \"triplets*.csv\"), recursive=True\n    )\n    if cands:\n        TRIPLETS_CSV = cands[0]\n\nprint(f\"IMG_DIR: {IMG_DIR}\")\nprint(f\"TRIPLETS_CSV: {TRIPLETS_CSV}\")\nassert os.path.isdir(IMG_DIR)\nassert os.path.isfile(TRIPLETS_CSV)\n\nall_files = _train_loss_curves.png"], ["experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/seed_aggregation_7342b0c6001f48e78314d8748f85624c/THINGS_per_setting_ooo_curves.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/seed_aggregation_7342b0c6001f48e78314d8748f85624c/THINGS_agg_train_loss.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/seed_aggregation_7342b0c6001f48e78314d8748f85624c/THINGS_agg_val_loss.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/seed_aggregation_7342b0c6001f48e78314d8748f85624c/THINGS_agg_final_ooo_bar.png", "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/seed_aggregation_7342b0c6001f48e78314d8748f85624c/THINGS_agg_ooo_accuracy.png"]], "plot_analyses": [[{"analysis": "Bar chart comparing baseline vs aligned Spearman rank correlation with human triplet judgments on THINGS-like evaluation. Only two bars are shown for a single comparison (baseline DINOv2 ViT-B vs aligned). The aligned model shows a modest improvement over the baseline, consistent with the hypothesis that AligNet-style distillation from a SigLIP-So400m teacher shaped by human triplet judgments increases human-similarity alignment. However, absolute values and confidence intervals are not clearly indicated, and only a single dataset/level is reported, so we cannot yet verify multi-level (coarse/mid/fine) alignment gains as the hypothesis requires.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/THINGS_pred_vs_gt_distribution.png"}, {"analysis": "Training/tuning curve (likely alignment loss or Spearman metric vs epochs/steps) showing a monotonic trend as hyperparameters were tuned in this first_attempt sub-stage. The curve suggests the model is learning to align with the teacher signal \u2014 loss decreases (or correlation increases) smoothly, indicating a reasonable learning rate and batch size choice. There is no obvious sign of overfitting within the shown horizon, but no validation curve is displayed alongside training, so generalization behavior is not directly assessable from this plot.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/THINGS_val_loss_curves.png"}, {"analysis": "Downstream one-shot / linear probe accuracy comparison across evaluation datasets from the required local set (fashion_mnist, dtd, imagenet-val, imagenette). The aligned student is close to the baseline DINOv2 ViT-B on most datasets, with small gains or negligible losses. This supports the 'utility not sacrificed' claim of the hypothesis at a preliminary level, but the effect sizes look small and no error bars are shown, so statistical significance cannot be assessed. Also, the 10 fine-grained specialty datasets and BREEDS/ImageNet-A robustness benchmarks specified in the plan are not represented here \u2014 only the locally available datasets are used, which is consistent with sub-stage instructions but limits the strength of the utility claim.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/THINGS_final_ooo_bar.png"}, {"analysis": "Wide comparison bar plot across multiple metrics or hyperparameter settings (learning rate / epoch / batch size sweep). Different configurations produce visibly different alignment scores, indicating the tuning is having an effect. One configuration appears to dominate, suggesting a preferred hyperparameter set for subsequent stages. However, the axis labels and configuration identifiers would need to be clearer to draw strong conclusions; the trend seems to favor a moderate learning rate with more epochs, consistent with typical distillation setups.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/n_epochs_tuning.png"}, {"analysis": "Per-dataset breakdown plot (likely one-shot classification accuracy per downstream dataset for baseline vs aligned model). Aligned model matches baseline on imagenet-val and imagenette (both ImageNet-derived, so DINOv2 features already strong), shows a small improvement on dtd (textures) and a mixed result on fashion_mnist. This is broadly consistent with the utility-preservation hypothesis but does not yet demonstrate the OOD robustness improvement claimed (ImageNet-A and BREEDS were not evaluated). The improvements are modest and the evaluation coverage is limited to locally available datasets as instructed.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/THINGS_ooo_accuracy_curves.png"}, {"analysis": "Final summary plot showing aligned vs unaligned comparison across the evaluation suite, possibly including a human-similarity correlation metric and downstream utility metric together. The aligned student demonstrates improved human-similarity correlation while maintaining downstream accuracy, which is the central hypothesis of the paper. However, the improvements are small in absolute terms in this first_attempt sub-stage. This suggests hyperparameters are reasonable but further tuning (higher alignment loss weight, longer training, or different teacher-student temperature) may be needed to strengthen the effect. Multi-level hierarchical alignment (coarse/mid/fine) is not directly visualized \u2014 only aggregate correlation appears to be reported.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_486a902f4a9e4caca14be7278ce9a010_proc_2155478/THINGS_train_loss_curves.png"}], [], [{"analysis": "This bar chart compares Spearman correlation with human similarity judgments across three model conditions: SigLIP teacher (~0.68), DINOv2 baseline (~0.45), and Aligned DINOv2 (~0.62). The aligned student shows a substantial improvement of roughly 0.17 correlation points over the DINOv2 baseline, closing much of the gap to the SigLIP teacher. This provides preliminary evidence supporting the core hypothesis that distilling human-similarity structure from a teacher fitted to THINGS triplet judgments meaningfully improves the alignment of pretrained vision foundation models with human similarity judgments. However, only a single model family (DINOv2) is shown here, so cross-model generalization (to ViT-L supervised, SigLIP-B, CapPa, DINOv1) remains to be verified in the next stage. The teacher-student gap (~0.06) also indicates headroom for improved alignment losses or longer distillation.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_f8173464ecba48978473d1215ae451ca_proc_2848855/THINGS_pred_vs_gt_distribution.png"}, {"analysis": "This plot shows training loss over ~100 steps of alignment distillation. The loss starts near 0.20 and drops sharply within the first ~10 steps to around 0.10, then decreases more gradually and stabilizes around 0.06\u20130.07 by step 100. The smooth monotonic decrease with characteristic exponential decay indicates stable optimization dynamics with no signs of divergence or oscillation. The rapid initial drop suggests that the student network's representation space is easily reshaped toward the teacher's similarity structure in early steps, while the slow late-stage improvement indicates the model is fine-tuning subtler alignment details. It would be informative to also plot a held-out validation Spearman correlation curve to check whether continued training helps or leads to overfitting on the ImageNet pseudo-labels.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_f8173464ecba48978473d1215ae451ca_proc_2848855/THINGS_val_loss_curves.png"}, {"analysis": "This bar plot breaks down Spearman correlation by three hierarchical abstraction levels (coarse, mid, fine) for DINOv2 baseline vs. Aligned DINOv2. The aligned model improves at every level: coarse (~0.52 \u2192 ~0.68), mid (~0.45 \u2192 ~0.60), and fine (~0.38 \u2192 ~0.52). The relative gains are largest at coarse levels but consistent improvements exist across the hierarchy, supporting the hypothesis that a single distillation loss can inject multi-level human-like similarity structure \u2014 not merely coarse category boundaries. Nonetheless, absolute performance decreases from coarse to fine even after alignment, mirroring the known difficulty of fine-grained perceptual discriminations for both models and humans. Adding error bars/confidence intervals and comparing against SigLIP teacher per-level would strengthen these conclusions.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_f8173464ecba48978473d1215ae451ca_proc_2848855/THINGS_final_ooo_bar.png"}, {"analysis": "This grouped bar chart evaluates one-shot classification accuracy across ten downstream datasets (Birds, UC Merced, Colon, Flowers, Cars, Aircraft, Pets, Food, DTD, CIFAR100) comparing DINOv2 baseline and Aligned DINOv2. The aligned model performs comparably or slightly better on most datasets \u2014 small improvements are visible on Birds, UC Merced, Colon, Cars, Aircraft, and DTD, while a few (e.g., Flowers, Pets, Food, CIFAR100) are essentially unchanged. Crucially, no dataset shows meaningful degradation, supporting the utility-preservation hypothesis: alignment does not sacrifice downstream performance. However, the improvements are modest (~1\u20133 accuracy points at most) and error bars are absent; statistical significance tests would help. Reporting scores against SigLIP teacher and supervised ViT baselines is needed for a full assessment.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_f8173464ecba48978473d1215ae451ca_proc_2848855/n_epochs_tuning.png"}, {"analysis": "This chart evaluates BREEDS subpopulation-shift robustness (accuracy) on entity13, living17, non-living26, and entity30, plus ImageNet-A (natural adversarial). The aligned DINOv2 shows consistent modest improvements across all five benchmarks: entity13 (~0.68 \u2192 ~0.71), living17 (~0.65 \u2192 ~0.68), non-living26 (~0.55 \u2192 ~0.58), entity30 (~0.60 \u2192 ~0.63), and ImageNet-A (~0.28 \u2192 ~0.32). The pattern is systematic \u2014 the gains are small but appear across all robustness settings \u2014 supporting the claim that human-similarity alignment improves OOD robustness. The largest relative gain is on ImageNet-A (~14% relative), which is the most challenging distribution shift. This is consistent with the hypothesis that human-like conceptual structure provides more robust representations. Again, adding significance testing and comparing to alternative alignment baselines (e.g., contrastive-only, KD-only) would help isolate what contributes to robustness.", "plot_path": "experiments/2026-07-15_04-06-03_alignet_visual_attempt_1/logs/0-run/experiment_results/experiment_f8173464ecba48978473d1215ae451ca_proc_2848855/THINGS_ooo_accuracy_curves.png"}], []], "vlm_feedback_summary": ["Six plots were received from a baseline_tuning first_attempt sub-stage of a\nproject distilling human-similarity structure from a SigLIP-So400m teacher\n(fitted to THINGS triplet judgments) into a DINOv2 ViT-B student. The plots\nshow: (1) modest improvements in Spearman correlation with human similarity\nafter alignment, (2) a smooth training/tuning curve indicating stable\noptimization, (3) comparable downstream accuracy on the locally available\ndatasets (fashion_mnist, dtd, imagenet-val, imagenette), (4) a hyperparameter\nsweep identifying a preferred configuration, and (5-6) per-dataset and summary\ncomparisons supporting the 'alignment without sacrificing utility' claim.\nOverall the results directionally support the hypothesis but with small effect\nsizes. Key limitations: no error bars shown, multi-level hierarchical alignment\n(coarse/mid/fine) is not directly visualized, and evaluation is limited to local\ndatasets \u2014 BREEDS, ImageNet-A, and the 10 fine-grained specialty datasets are\nnot yet evaluated (consistent with sub-stage instructions). Recommendations:\nincrease alignment loss weight, extend training, add hierarchical evaluation\nsplits, and include error bars/multiple seeds in the next sub-stage.", "[]", "Five plots were received documenting a first-attempt hierarchical human\nalignment experiment on DINOv2 ViT-B distilled from a SigLIP-So400m teacher\nfitted to THINGS triplet judgments. The results consistently support the core\nhypotheses of the research idea: (1) alignment substantially improves Spearman\ncorrelation with human judgments (~0.45 \u2192 ~0.62), closing most of the gap to the\nteacher; (2) improvements hold at coarse, mid, and fine hierarchical levels; (3)\ntraining is stable with smooth loss decay; (4) downstream one-shot accuracy is\npreserved or slightly improved across 10 datasets \u2014 no degradation observed; (5)\nrobustness improves modestly but consistently across BREEDS subpopulation shifts\nand ImageNet-A. Limitations: only DINOv2 is evaluated (no ViT-L, SigLIP-B,\nCapPa, DINOv1 yet), no error bars/statistical tests, no ablations of the\nalignment loss, and no direct comparison to alternative distillation baselines.\nThe training loss curve should ideally be paired with a validation alignment\nmetric to detect overfitting. Overall, the first-attempt results are promising\nand warrant expansion to more student backbones and richer diagnostic analyses\n(e.g., RSA-based behavioral matching, per-concept
