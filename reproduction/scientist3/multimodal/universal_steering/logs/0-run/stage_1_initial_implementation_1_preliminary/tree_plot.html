      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }

 + out[1:]\n        else:\n            return out + self.alpha * self.vector.to(out.device, dtype=out.dtype).view(\n                1, 1, -1\n            )\n\n\nsteer_hook = SteerHook()\nhook_handle = get_layer_module(STEER_LAYER).register_forward_hook(steer_hook)\n\n\n@torch.no_grad()\ndef generate(prompt, max_new_tokens=80):\n    text = format_chat(prompt)\n    inputs = tokenizer(text, return_tensors=\"pt\", truncation=True, max_length=512).to(\n        device\n    )\n    out = model.generate(\n        **inputs,\n        max_new_tokens=max_new_tokens,\n        do_sample=True,\n        temperature=0.7,\n        top_p=0.9,\n        pad_token_id=tokenizer.eos_token_id,\n    )\n    gen = out[0, inputs[\"input_ids\"].shape[1] :]\n    return tokenizer.decode(gen, skip_special_tokens=True)\n\n\n# ---------- Judge with GPT-4o ----------\ndef judge_concept(concept, response):\n    if response is None or len(response.strip()) == 0:\n        return 0, \"empty\"\n    sys = (\n        \"You are an evaluator. Judge whether the assistant's response clearly reflects, embodies, \"\n        \"or expresses the given target concept. Respond with a JSON object like \"\n        '{\"reflects\": true} or {\"reflects\": false} and a brief reason.'\n    )\n    user = f\"Target concept: {concept}\\n\\nAssistant response:\\n{response}\\n\\nDoes the response clearly reflect the target concept?\"\n    out = chat(\n        JUDGE_MODEL,\n        [{\"role\": \"system\", \"content\": sys}, {\"role\": \"user\", \"content\": user}],\n        max_tokens=100,\n        temperature=0.0,\n    )\n    if out is None:\n        return 0, \"judge_failed\"\n    m = re.search(r'\"reflects\"\\s*:\\s*(true|false)', out.lower())\n    if m:\n        return (1 if m.group(1) == \"true\" else 0), out\n    # fallback simple check\n    if \"true\" in out.lower():\n        return 1, out\n    return 0, out\n\n\n# ---------- Steering evaluation ----------\nALPHA = 8.0  # steering strength (residual-stream addition scale)\nN_EVAL_PROMPTS = 3  # generic prompts per concept\n\nper_concept_records = []\nsucc_total, tot_total = 0, 0\nbaseline_succ_total, baseline_tot_total = 0, 0\n\neval_prompts = GENERIC_PROMPTS[:N_EVAL_PROMPTS]\n\nfor ci, entry in enumerate(CONCEPTS):\n    concept = entry[\"concept\"]\n    cls = entry[\"class\"]\n    vec = concept_vectors[concept]\n\n    # Baseline (no steering)\n    steer_hook.vector = None\n    steer_hook.alpha = 0.0\n    baseline_gens = []\n    for p in eval_prompts:\n        try:\n            r = generate(p, max_new_tokens=80)\n        except Exception as e:\n            r = \"\"\n            print(\"gen err:\", e)\n        baseline_gens.append(r)\n\n    # Steered\n    steer_hook.vector = vec\n    steer_hook.alpha = ALPHA\n    steered_gens = []\n    for p in eval_prompts:\n        try:\n            r = generate(p, max_new_tokens=80)\n        except Exception as e:\n            r = \"\"\n            print(\"gen err:\", e)\n        steered_gens.append(r)\n    steer_hook.vector = None\n    steer_hook.alpha = 0.0\n\n    # Judge\n    b_succ = 0\n    s_succ = 0\n    details = []\n    for p, br, sr in zip(eval_prompts, baseline_gens, steered_gens):\n        bj, br_reason = judge_concept(concept, br)\n        sj, sr_reason = judge_concept(concept, sr)\n        b_succ += bj\n        s_succ += sj\n        details.append(\n            {\n                \"prompt\": p,\n                \"baseline\": br,\n                \"steered\": sr,\n                \"baseline_judge\": bj,\n                \"steered_judge\": sj,\n            }\n        )\n\n    tot = len(eval_prompts)\n    baseline_succ_total += b_succ\n    baseline_tot_total += tot\n    succ_total += s_succ\n    tot_total += tot\n\n    rec = {\n        \"class\": cls,\n        \"concept\": concept,\n        \"baseline_success\": b_succ,\n        \"steered_success\": s_succ,\n        \"total\": tot,\n        \"details\": details,\n    }\n    per_concept_records.append(rec)\n    print(\n        f\"[{ci+1}/{len(CONCEPTS)}] {concept}: baseline {b_succ}/{tot}, steered {s_succ}/{tot}\"\n    )\n\n    # intermediate save\n    experiment_data[\"concept_benchmark\"][\"per_concept\"] = per_concept_records\n    experiment_data[\"concept_benchmark\"][\"metrics\"][\"val\"].append(\n        {\n            \"concept_index\": ci,\n            \"concept\": concept,\n            \"steered_success_rate_running\": succ_total / max(1, tot_total),\n            \"baseline_success_rate_running\": baseline_succ_total\n            / max(1, baseline_tot_total),\n        }\n    )\n    print(\n        f\"  running steered success rate = {succ_total/max(1,tot_total):.3f}, baseline = {baseline_succ_total/max(1,baseline_tot_total):.3f}\"\n    )\n\nhook_handle.remove()\n\nsteering_success_rate = succ_total / max(1, tot_total)\nbaseline_success_rate = baseline_succ_total / max(1, baseline_tot_total)\n\nprint(\"\\n===== FINAL =====\")\nprint(f\"Steering success rate: {steering_success_rate:.4f}  ({succ_total}/{tot_total})\")\nprint(\n    f\"Baseline success rate: {baseline_success_rate:.4f}  ({baseline_succ_total}/{baseline_tot_total})\"\n)\nprint(\n    f\"validation_loss = {1.0 - steering_success_rate:.4f}\"\n)  # proxy val loss = 1 - success\n\nexperiment_data[\"concept_benchmark\"][\n    \"overall_steering_success_rate\"\n] = steering_success_rate\nexperiment_data[\"concept_benchmark\"][\n    \"overall_baseline_success_rate\"\n] = baseline_success_rate\nexperiment_data[\"concept_benchmark\"][\"predictions\"] = [\n    r[\"steered_success\"] for r in per_concept_records\n]\nexperiment_data[\"concept_benchmark\"][\"ground_truth\"] = [\n    r[\"total\"] for r in per_concept_records\n]\nexperiment_data[\"concept_benchmark\"][\"losses\"][\"val\"].append(\n    1.0 - steering_success_rate\n)\nexperiment_data[\"concept_benchmark\"][\"config\"] = {\n    \"model_path\": MODEL_PATH,\n    \"steer_layer\": STEER_LAYER,\n    \"alpha\": ALPHA,\n    \"n_concepts\": len(CONCEPTS),\n    \"n_eval_prompts_per_concept\": ents/2026-07-15_04-03-48_universal_steering_attempt_1/logs/0-run/experiment_results/seed_aggregation_cbaaae52b26d44a98617ab8c97ea1703/concept_benchmark_agg_running_success_rate.png"]], "plot_analyses": [[{"analysis": "This bar chart shows steering strength ablation across values [0, 1, 2, 3, 5, 10] for a single concept. All non-zero steering strengths achieve the same steering success rate (approximately 1.0 or 100%), while strength=0 (the baseline/control) yields 0%. This is a somewhat trivial-looking ablation because there is no gradient of effect: any non-zero magnitude appears to fully steer the model. This suggests either (a) the concept is easy to steer and the strength range tested is well above the threshold needed, or (b) the evaluation metric is saturated/binary and doesn't discriminate between different strength magnitudes. A more informative ablation would probe smaller sub-unit strengths (e.g., 0.1, 0.25, 0.5, 0.75) to find the transition point, or use a continuous metric of concept expression rather than a binary success indicator.", "plot_path": "experiments/2026-07-15_04-03-48_universal_steering_attempt_1/logs/0-run/experiment_results/experiment_8285ea1fb3f2482b9d364811dbd36516_proc_1241075/concept_benchmark_success_by_class.png"}, {"analysis": "This bar chart compares steering success rates across 5 concept classes: fears, experts, moods, topophiles, and personas. All five classes achieve near-perfect steering success (~1.0), with essentially indistinguishable bars. This indicates the RFM-based concept vector extraction and steering procedure works uniformly well across diverse concept categories at the tested strength. However, the lack of variation is suspicious \u2014 either the benchmark is too easy, the judge (GPT-4o) is overly lenient in verifying steering, or only a very small subset of concepts was evaluated. For a compelling paper result, one would want to see either (a) some class-level variation to discuss which concept types are easier/harder to steer, or (b) comparison against baselines (e.g., prompting, unsupervised SAE features) showing RFM's advantage.", "plot_path": "experiments/2026-07-15_04-03-48_universal_steering_attempt_1/logs/0-run/experiment_results/experiment_8285ea1fb3f2482b9d364811dbd36516_proc_1241075/concept_benchmark_overall_success.png"}, {"analysis": "This line plot shows steering success rate vs. steering strength (0 through 10) with a single curve. At strength=0 the rate is 0, and at all strengths >=1 the rate is 1.0, forming a step function. This is consistent with the first bar plot and confirms the binary/saturated behavior of the steering evaluation. There is no smooth dose-response curve visible, which is a missed opportunity \u2014 a proper strength sweep should reveal the trade-off between steering efficacy and side effects (e.g., coherence degradation, off-topic generation). The plot would benefit from a second axis or curve showing a fluency/coherence metric to show whether higher strengths degrade output quality even while maintaining concept adherence.", "plot_path": "experiments/2026-07-15_04-03-48_universal_steering_attempt_1/logs/0-run/experiment_results/experiment_8285ea1fb3f2482b9d364811dbd36516_proc_1241075/concept_benchmark_running_success_rate.png"}, {"analysis": "This grouped bar chart shows per-concept steering success rates for what appears to be ~30 individual concepts (x-axis labels are unreadable due to density). Almost all concepts show 100% steering success with only 2-3 concepts showing partial success (~0.5) or failure. This gives more granularity than the aggregate class plot and does show some variation, indicating a few outlier concepts that are harder to steer. However, without readable labels or aggregated statistics (mean, std, distribution), it's difficult to draw conclusions. This is a preliminary/functional-correctness plot showing the pipeline works end-to-end on the 512-concept benchmark, but for a top-conference paper the analysis needs: (a) identification of which concepts fail and why, (b) comparison to baselines, (c) breakdown by concept class overlaid, and (d) statistical summary.", "plot_path": "experiments/2026-07-15_04-03-48_universal_steering_attempt_1/logs/0-run/experiment_results/experiment_8285ea1fb3f2482b9d364811dbd36516_proc_1241075/concept_benchmark_per_concept_success.png"}], [{"analysis": "This bar chart shows the RFM Concept Vector Norms across the 32 blocks of Llama-3.1-8B-Instruct for 5 concept classes (fears, experts, moods, topophiles, personas). The x-axis represents block indices 0-31, and the y-axis shows the L2 norm of the extracted concept vectors. Key observations: (1) Norms are near-zero for early blocks (0-5), indicating that early layers do not encode the target concepts well. (2) Norms grow steadily from blocks 6-15 and reach peak values around blocks 20-27, suggesting middle-to-late layers are the most concept-informative regions. (3) There is a noticeable dip around block 30-31, which is common as final layers focus on output token prediction rather than semantic concept encoding. (4) The five concept classes exhibit remarkably consistent norm profiles, suggesting the RFM extraction procedure produces stable vectors across diverse concept categories. This is a positive sanity check that the extraction pipeline is working as expected.", "plot_path": "experiments/2026-07-15_04-03-48_universal_steering_attempt_1/logs/0-run/experiment_results/experiment_9aa5f7633ec04f038b7e05d7b99ab0a8_proc_1241075/concept_benchmark_success_by_class.png"}, {"analysis": "This bar chart displays the number of concepts per class in the benchmark dataset. The five concept classes\u2014fears, experts, moods, topophiles, and personas\u2014each contain roughly 100+ concepts, totaling approximately 512 concepts. The distribution appears relatively balanced across classes, though 'personas' and 'topophiles' appear slightly larger than 'experts'. This balanced distribution ensures the RFM concept vector extraction procedure is evaluated across a diverse set of concept types without severe class imbalance issues. The dataset structure aligns with the paper's stated design of 512 concepts across 5 classes plus 400 generic statements.", "plot_path": "experiments/2026-07-15_04-03-48_universal_steering_attempt_1/logs/0-run/experiment_results/experiment_9aa5f7633ec04f038b7e05d7b99ab0a8_proc_1241075/concept_benchmark_overall_success.png"}, {"analysis": "This line plot shows the mean RFM concept vector norm per block, averaged across all 5 concept classes. It confirms the pattern seen in the first plot: norms are near zero for early blocks (0-5), then rise sharply from blocks 6-15, plateau around blocks 15-27 at peak values (~0.14), and drop noticeably at the final block (31). This 'inverted-U' shape is consistent with the well-established observation in interpretability research that mid-to-late transformer layers carry the richest semantic/conceptual information, while early layers handle low-level features and final layers focus on next-token logits. This plot provides strong evidence that concept representations are localized primarily in middle-to-late blocks, which is important for guiding where steering interventions should be applied.", "plot_path": "experiments/2026-07-15_04-03-48_universal_steering_attempt_1/logs/0-run/experiment_results/experiment_9aa5f7633ec04f038b7e05d7b99ab0a8_proc_1241075/concept_benchmark_running_success_rate.png"}, {"analysis": "This heatmap visualizes cosine similarity between concept vectors from different classes (fears, experts, moods, topophiles, personas) across all 32 blocks of the model. The color scale ranges from approximately -0.1 (dark blue) to 0.4+ (dark red). Key observations: (1) Diagonal entries (same-class pairs) show generally higher similarity, indicating within-class concept vectors are more aligned. (2) Cross-class similarities vary across blocks\u2014early blocks show near-zero similarity (uninformative), while middle blocks show more structured patterns. (3) Some class pairs (e.g., moods-personas, fears-moods) show elevated similarity in later blocks, which is semantically plausible since these concept types share affective/psychological dimensions. (4) The block-wise variation suggests that different layers encode different aspects of conceptual similarity. This analysis provides useful insight into concept representation geometry and could inform composability experiments (linear combinations of concept vectors) mentioned in the hypothesis.", "plot_path": "experiments/2026-07-15_04-03-48_universal_steering_attempt_1/logs/0-run/experiment_results/experiment_9aa5f7633ec04f038b7e05d7b99ab0a8_proc_1241075/concept_benchmark_per_concept_success.png"}], []], "vlm_feedback_summary": ["The four plots demonstrate a functionally working RFM-based concept steering\npipeline on Llama-3.1-8B-Instruct evaluated on the GPT-4o-generated concept\nbenchmark. All plots show near-saturated steering success rates (~100%) across\nstrength ablations, concept classes, and individual concepts, with the only\nexception being strength=0 (baseline). While this confirms basic correctness of\nthe implementation (Sub-stage 1 preliminary goal), the results are largely\nsaturated and lack the discriminative power needed for a strong paper. Key\nissues: (1) the steering strength sweep shows a step-function rather than a\nsmooth dose-response, suggesting either metric saturation or that the tested\nstrength range is uniformly above threshold; (2) no baselines (prompting, SAE\nfeatures, random directions) are shown for comparison; (3) no side-effect /\nfluency degradation metrics are reported to characterize the steering-coherence\ntrade-off; (4) per-concept plot labels are unreadable, and there's no\nstatistical summary or failure analysis. For subsequent stages, the experiments\nshould: probe finer-grained steering strengths (e.g., 0.1\u20131.0), include\nbaselines, add coherence/quality metrics, and analyze the concepts that fail to\nsteer.\"", "Four valid plots were received showing preliminary results from the RFM concept\nvector extraction procedure on Llama-3.1-8B-Instruct. The plots demonstrate: (1)\nper-block concept vector norms across 5 concept classes showing an inverted-U\npattern with peaks in middle-to-late blocks, (2) balanced concept counts per\nclass in the benchmark dataset (~100+ per class), (3) mean norm curve confirming\nmiddle-to-late layer localization of concept representations, and (4) cross-\nclass cosine similarity heatmap revealing structured concept geometry across\nblocks. The results are consistent with expected patterns from interpretability\nresearch: early layers show low concept-vector norms, middle-to-late layers\nencode the richest semantic information, and final layers dip as they focus on\ntoken prediction. The preliminary implementation appears functionally correct\nand provides a solid foundation for downstream steering and monitoring\nexperiments. However, these plots only show extraction sanity checks\u2014they do not\nyet demonstrate the core hypotheses about steering behavior, transferability\nacross languages, composability, or monitoring effectiveness. The next stage\nshould include actual steering interventions and evaluation with GPT-4o as\njudge.\"", "[]"], "exec_time": [477.89547657966614, 475.4670023918152, null], "exec_time_feedback": ["", "", ""], "datasets_successfully_tested": [["[\"concept_benchmark\"]"], ["[]"], []], "plot_code": ["import matplotlib.pyplot as plt\nimport numpy as np\nimport os\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\n\ntry:\n    experiment_data = np.load(\n        os.path.join(working_dir, \"experiment_data.npy\"), allow_pickle=True\n    ).item()\nexcept Exception as e:\n    print(f\"Error loading experiment data: {e}\")\n    experiment_data = {}\n\ndata = experiment_data.get(\"concept_benchmark\", {})\nper_concept = data.get(\"per_concept\", [])\ncfg = data.get(\"config\", {})\nalpha = cfg.get(\"alpha\", \"?\")\nlayer = cfg.get(\"steer_layer\", \"?\")\n\n# Plot 1: success rate by concept class\ntry:\n    plt.figure(figsize=(8, 5))\n    classes = sorted(set(r[\"class\"] for r in per_concept))\n    cls_success = {c: [] for c in classes}\n    cls_base = {c: [] for c in classes}\n    for r in per_concept:\n        cls_success[r[\"class\"]].append(r[\"steered_success\"] / r[\"total\"])\n        cls_base[r[\"class\"]].append(r[\"baseline_success\"] / r[\"total\"])\n    xs = np.arange(len(classes))\n    steered_means = [np.mean(cls_success[c]) for c in classes]\n    base_means = [np.mean(cls_base[c]) for c in classes]\n    plt.bar(xs - 0.2, base_means, width=0.4, label=\"baseline\")\n    plt.bar(xs + 0.2, steered_means, width=0.4, label=\"steered\")\n    plt.xticks(xs, classes, rotation=30)\n    plt.ylabel(\"Success rate\")\n    plt.title(\n        f\"Concept Benchmark: Success Rate by Class\\nLeft bar: Baseline, Right bar: Steered (\u03b1={alpha}, layer={layer})\"\n    )\n    plt.legend()\n    plt.tight_layout()\n    plt.savefig(os.path.join(working_dir, \"concept_benchmark_success_by_class.png\"))\n    plt.close()\nexcept Exception as e:\n    print(f\"Error creating plot1: {e}\")\n    plt.close()\n\n# Plot 2: per-concept success rate comparison\ntry:\n    plt.figure(figsize=(12, 6))\n    concepts = [r[\"concept\"] for r in per_concept]\n    base_rates = [r[\"baseline_success\"] / r[\"total\"] for r in per_concept]\n    steer_rates = [r[\"steered_success\"] / r[\"total\"] for r in per_concept]\n    xs = np.arange(len(concepts))\n    plt.bar(xs - 0.2, base_rates, width=0.4, label=\"baseline\")\n    plt.bar(xs + 0.2, steer_rates, width=0.4, label=\"steered\")\n    plt.xticks(xs, concepts, rotation=75, fontsize=8)\n    plt.ylabel(\"Success rate\")\n    plt.title(\n        f\"Concept Benchmark: Per-Concept Success Rates\\nLeft: Baseline, Right: Steered (\u03b1={alpha}, layer={layer})\"\n    )\n    plt.legend()\n    plt.tight_layout()\n    plt.savefig(os.path.join(working_dir, \"concept_benchmark_per_concept_success.png\"))\n    plt.close()\nexcept Exception as e:\n    print(f\"Error creating plot2: {e}\")\n    plt.close()\n\n# Plot 3: running success rate over concepts evaluated\ntry:\n    val_metrics = data.get(\"metrics\", {}).get(\"val\", [])\n    if val_metrics:\n        idx = [m[\"concept_index\"] for m in val_metrics]\n        steered_run = [m[\"steered_success_rate_running\"] for m in val_metrics]\n        baseline_run = [m[\"baseline_success_rate_running\"] for m in val_metrics]\n        plt.figure(figsize=(8, 5))\n        plt.plot(idx, baseline_run, label=\"baseline (running)\", marker=\"o\")\n        plt.plot(idx, steered_run, label=\"steered (running)\", marker=\"s\")\n        plt.xlabel(\"Concept index\")\n        plt.ylabel(\"Running success rate\")\n        plt.title(\n            \"Concept Benchmark: Running Success Rate\\nBaseline vs Steered across concepts evaluated\"\n        )\n        plt.legend()\n        plt.tight_layout()\n        plt.savefig(\n            os.path.join(working_dir, \"concept_benchmark_running_success_rate.png\")\n        )\n        plt.close()\nexcept Exception as e:\n    print(f\"Error creating plot3: {e}\")\n    plt.close()\n\n# Plot 4: overall comparison\ntry:\n    overall_steer = data.get(\"overall_steering_success_rate\", None)\n    overall_base = data.get(\"overall_baseline_success_rate\", None)\n    if overall_steer is not None and overall_base is not None:\n        plt.figure(figsize=(5, 5))\n        plt.bar(\n            [\"baseline\", \"steered\"],\n            [overall_base, overall_steer],\n            color=[\"gray\", \"steelblue\"],\n        )\n        plt.ylabel(\"Overall success rate\")\n        plt.ylim(0, 1)\n        for i, v in enumerate([overall_base, overall_steer]):\n            plt.text(i, v + 0.02, f\"{v:.3f}\", ha=\"center\")\n        plt.title(\n            f\"Concept Benchmark: Overall Success Rate\\nBaseline vs Steered (\u03b1={alpha}, l
