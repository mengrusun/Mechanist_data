      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }
};

const treeStructData = {"edges": [[0, 1], [0, 2], [0, 3]], "layout": [[0.5, 0.0], [0.0, 1.0], [0.5, 1.0], [1.0, 1.0]], "plan": ["The bug is that the Swiss-Prot download fails (UniProt REST returns\npartial/streaming JSON) and no local Swiss-Prot file was found, causing an\nassertion failure. I'll fix by (1) using the UniProt streaming endpoint with\nproper pagination/format, (2) adding a robust fallback to fetch individual\nreviewed entries by accession list via the search endpoint with smaller size\nlimits, and (3) trying alternative local paths more thoroughly. Also add TSV\nformat as a simpler fallback since JSON streaming can truncate.", "Looking at the previous solution, it achieves the basic SAE-vs-neuron comparison\nbut has a few gaps: (1) evaluated only one layer of ESM-2-8M with limited\nconcepts, (2) no random-feature or PCA baseline for calibration, (3) suspicious\n0.0 validation loss (not actually computing SAE reconstruction), (4) low mean F1\ncould indicate the concept-scoring threshold picking is suboptimal, (5) no per-\ncategory breakdown. My improvements: (a) sweep multiple ESM-2-8M layers (1, 3,\n5) to expose the layer-wise structure, (b) add a proper SAE reconstruction\nvalidation loss and report it, (c) add a random-projection baseline (same width\nas SAE) as calibration, (d) expand concept vocabulary (more entries, all\nconcepts with \u22655 residues), (e) compute per-category (BINDING/ACT_SITE/etc.)\nrecovery breakdown, (f) improve F1 search with more thresholds and include a\nnegative-activation direction for neurons, (g) save richer plots including per-\nlayer bars and per-category comparisons. This will strengthen the central\nsuperposition claim with proper baselines and layer-wise trends.", "Seed node", "Aggregate results from multiple seeds"], "code": ["import os, sys, json, gzip, io, re, time, math, random, urllib.parse\n\nfor stream in (\"stdout\", \"stderr\"):\n    s = getattr(sys, stream, None)\n    if s is not None and not hasattr(s, \"isatty\"):\n        try:\n            s.isatty = lambda: False\n        except Exception:\n            pass\nos.environ[\"TRANSFORMERS_VERBOSITY\"] = \"error\"\nos.environ[\"NO_COLOR\"] = \"1\"\nos.environ[\"HF_HUB_DISABLE_PROGRESS_BARS\"] = \"1\"\n\nimport numpy as np\nimport torch\nimport torch.nn.functional as F\nimport urllib.request\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nDATA_DIR = \"/data/zhenqian/data\"\nMODEL_DIR = \"/data/zhenqian/models\"\n\nexperiment_data = {\n    \"swissprot_esm2_8m\": {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"concept_counts\": {},\n        \"per_concept_f1\": {},\n    }\n}\n\nfrom transformers import AutoTokenizer, AutoModel\n\nesm_path = os.path.join(MODEL_DIR, \"esm2_t6_8M_UR50D\")\nif not os.path.isdir(esm_path):\n    candidates = [\n        d for d in os.listdir(MODEL_DIR) if \"esm2\" in d.lower() and \"8m\" in d.lower()\n    ]\n    if candidates:\n        esm_path = os.path.join(MODEL_DIR, candidates[0])\n    else:\n        esm_path = \"facebook/esm2_t6_8M_UR50D\"\nprint(f\"Loading ESM-2 from: {esm_path}\")\ntokenizer = AutoTokenizer.from_pretrained(esm_path)\nmodel = AutoModel.from_pretrained(esm_path, output_hidden_states=True)\nmodel.eval().to(device)\nn_layers = model.config.num_hidden_layers\nhidden_size = model.config.hidden_size\nprint(f\"ESM-2 layers={n_layers}, hidden={hidden_size}\")\n\nSAE_LAYER = 4\nsae_dir = os.path.join(MODEL_DIR, \"InterPLM-esm2-8m\", f\"layer_{SAE_LAYER}\")\nsae_ckpt = os.path.join(sae_dir, \"ae_normalized.pt\")\nsae_cfg_path = os.path.join(sae_dir, \"config.json\")\nassert os.path.isfile(sae_ckpt), f\"Missing SAE ckpt: {sae_ckpt}\"\n\nwith open(sae_cfg_path) as f:\n    sae_cfg = json.load(f)\nprint(\"SAE config:\", sae_cfg)\n\nsae_state = torch.load(sae_ckpt, map_location=\"cpu\")\nprint(\n    \"SAE keys:\",\n    list(sae_state.keys()) if isinstance(sae_state, dict) else type(sae_state),\n)\n\n\nclass SAE(torch.nn.Module):\n    def __init__(self, d_in, d_sae):\n        super().__init__()\n        self.W_enc = torch.nn.Parameter(torch.zeros(d_in, d_sae))\n        self.b_enc = torch.nn.Parameter(torch.zeros(d_sae))\n        self.W_dec = torch.nn.Parameter(torch.zeros(d_sae, d_in))\n        self.b_dec = torch.nn.Parameter(torch.zeros(d_in))\n\n    def encode(self, x):\n        z = (x - self.b_dec) @ self.W_enc + self.b_enc\n        return F.relu(z)\n\n\ndef get_tensor(state, keys):\n    for k in keys:\n        if k in state:\n            return state[k]\n    return None\n\n\nW_enc = get_tensor(sae_state, [\"W_enc\", \"encoder.weight\"])\nb_enc = get_tensor(sae_state, [\"b_enc\", \"encoder.bias\"])\nW_dec = get_tensor(sae_state, [\"W_dec\", \"decoder.weight\"])\nb_dec = get_tensor(sae_state, [\"b_dec\", \"decoder.bias\", \"bias\"])\n\nif W_enc.shape[0] != hidden_size:\n    W_enc = W_enc.T\nd_sae = W_enc.shape[1]\nif W_dec.shape[1] != hidden_size:\n    W_dec = W_dec.T\nassert W_dec.shape == (d_sae, hidden_size)\nassert b_enc.shape[0] == d_sae\nassert b_dec.shape[0] == hidden_size\n\nsae = SAE(hidden_size, d_sae)\nsae.W_enc.data.copy_(W_enc.float())\nsae.b_enc.data.copy_(b_enc.float())\nsae.W_dec.data.copy_(W_dec.float())\nsae.b_dec.data.copy_(b_dec.float())\nsae.eval().to(device)\nprint(f\"SAE loaded d_in={hidden_size}, d_sae={d_sae}\")\n\nnorm_mean = get_tensor(sae_state, [\"mean\", \"act_mean\", \"activation_mean\"])\nnorm_std = get_tensor(sae_state, [\"std\", \"act_std\", \"activation_std\"])\nif norm_mean is not None:\n    norm_mean = norm_mean.float().to(device)\nif norm_std is not None:\n    norm_std = norm_std.float().to(device)\n\n# ---------- Swiss-Prot loading ----------\nswissprot_cache = os.path.join(working_dir, \"swissprot_subset.json\")\n\n\ndef find_local_swissprot():\n    candidates = []\n    search_dirs = [DATA_DIR]\n    for base in search_dirs:\n        if not os.path.isdir(base):\n            continue\n        for root, _, files in os.walk(base):\n            for fn in files:\n                low = fn.lower()\n                if (\n                    \"sprot\" in low\n                    or \"swissprot\" in low\n                    or \"swiss_prot\" in low\n                    or \"uniprot_sprot\" in low\n                ) and (\n                    low.endswith(\".dat\")\n                    or low.endswith(\".dat.gz\")\n                    or low.endswith(\".txt\")\n                    or low.endswith(\".txt.gz\")\n                    or low.endswith(\".xml\")\n                    or low.endswith(\".xml.gz\")\n                    or low.endswith(\".json\")\n                    or low.endswith(\".json.gz\")\n                ):\n                    candidates.append(os.path.join(root, fn))\n    return candidates\n\n\ndef open_maybe_gz(p):\n    if p.endswith(\".gz\"):\n        return gzip.open(p, \"rt\", encoding=\"utf-8\", errors=\"replace\")\n    return open(p, \"rt\", encoding=\"utf-8\", errors=\"replace\")\n\n\ndef parse_uniprot_dat(path, max_entries=400, min_len=30, max_len=1000):\n    entries = []\n    with open_maybe_gz(path) as f:\n        acc = None\n        seq_lines = []\n        ft_entries = []\n        in_sq = False\n        cur_ft_type = None\n        cur_ft_from = None\n        cur_ft_to = None\n        cur_ft_desc = []\n\n        def flush_ft():\n            nonlocal cur_ft_type, cur_ft_from, cur_ft_to, cur_ft_desc\n            if (\n                cur_ft_type is not None\n                and cur_ft_from is not None\n                and cur_ft_to is not None\n            ):\n                ft_entries.append(\n                    (cur_ft_type, cur_ft_from, cur_ft_to, \" \".join(cur_ft_desc).strip())\n                )\n            cur_ft_type = None\n            cur_ft_from = None\n            cur_ft_to = None\n            cur_ft_desc = []\n\n        for line in f:\n            if line.startswith(\"AC \") and acc is None:\n                parts = line[5:].strip().split(\";\")\n                acc = parts[0].strip()\n            elif line.startswith(\"SQ \"):\n                in_sq = True\n            elif line.startswith(\"//\"):\n                flush_ft()\n                seq = \"\".join(seq_lines).replace(\" \", \"\").replace(\"\\n\", \"\")\n                if acc and seq and min_len <= len(seq) <= max_len and ft_entries:\n                    feats = {\n                        \"BINDING\": [],\n                        \"ACT_SITE\": [],\n                        \"MOTIF\": [],\n                        \"DOMAIN\": [],\n                        \"MOD_RES\": [],\n                    }\n                    for ftype, s, e, desc in ft_entries:\n                        key = None\n                        if ftype in (\n                            \"BINDING\",\n                            \"METAL\",\n                            \"NP_BIND\",\n                            \"CA_BIND\",\n                            \"DNA_BIND\",\n                        ):\n                            key = \"BINDING\"\n                        elif ftype in (\"ACT_SITE\",):\n                            key = \"ACT_SITE\"\n                        elif ftype in (\"MOTIF\",):\n                            key = \"MOTIF\"\n                        elif ftype in (\"DOMAIN\",):\n                            key = \"DOMAIN\"\n                        elif ftype in (\"MOD_RES\", \"LIPID\", \"CARBOHYD\"):\n                            key = \"MOD_RES\"\n                        if key:\n                            feats[key].append((s, e, desc or \"generic\"))\n                    if sum(len(v) for v in feats.values()) > 0:\n                        entries.append(\n                            {\"accession\": acc, \"sequence\": seq, \"features\": feats}\n                        )\n                        if len(entries) >= max_entries:\n                            break\n                acc = None\n                seq_lines = []\n                ft_entries = []\n                in_sq = False\n            elif in_sq:\n                seq_lines.append(line.strip())\n            elif line.startswith(\"FT   \"):\n                body = line[5:].rstrip(\"\\n\")\n                if body.startswith(\" \") or body.startswith(\"/\"):\n                    m = re.search(r'/note=\"([^\"]*)', body)\n                    if m:\n                        cur_ft_desc.append(m.group(1))\n                    else:\n                        stripped = body.strip().strip('\"')\n                        if (\n                            stripped\n                            and cur_ft_type is not None\n                            and not stripped.startswith(\"/\")\n                        ):\n                            cur_ft_desc.append(stripped)\n                else:\n                    flush_ft()\n                    m = re.match(\n                        r\"^(\\S+)\\s+(\\d+|<?\\d+|>?\\d+|\\?)\\.\\.(\\d+|<?\\d+|>?\\d+|\\?)\", body\n                    )\n                    if m:\n                        cur_ft_type = m.group(1).upper()\n                        try:\n                            cur_ft_from = int(re.sub(r\"[<>?]\", \"\", m.group(2)))\n                            cur_ft_to = int(re.sub(r\"[<>?]\", \"\", m.group(3)))\n                        except Exception:\n                            cur_ft_type = None\n                    else:\n                        m2 = re.match(r\"^(\\S+)\\s+(\\d+)\\s+(\\d+)\\s*(.*)$\", body)\n                        if m2:\n                            cur_ft_type = m2.group(1).upper()\n                            try:\n                                cur_ft_from = int(m2.group(2))\n                                cur_ft_to = int(m2.group(3))\n                                if m2.group(4):\n                                    cur_ft_desc.append(m2.group(4))\n                            except Exception:\n                                cur_ft_type = None\n    return entries\n\n\ndef extract_features_json(entry):\n    feats = {\"BINDING\": [], \"ACT_SITE\": [], \"MOTIF\": [], \"DOMAIN\": [], \"MOD_RES\": []}\n    type_map = {\n        \"Binding site\": \"BINDING\",\n        \"Binding\": \"BINDING\",\n        \"Metal binding\": \"BINDING\",\n        \"Active site\": \"ACT_SITE\",\n        \"Short sequence motif\": \"MOTIF\",\n        \"Motif\": \"MOTIF\",\n        \"Domain\": \"DOMAIN\",\n        \"Modified residue\": \"MOD_RES\",\n        \"Lipidation\": \"MOD_RES\",\n        \"Glycosylation\": \"MOD_RES\",\n    }\n    for feat in entry.get(\"features\", []):\n        ft = feat.get(\"type\", \"\")\n        key = type_map.get(ft)\n        if key is None:\n            continue\n        loc = feat.get(\"location\", {})\n        try:\n            start = int(loc.get(\"start\", {}).get(\"value\"))\n            end = int(loc.get(\"end\", {}).get(\"value\"))\n        except Exception:\n            continue\n        desc = feat.get(\"description\", \"\") or \"\"\n        ligand = feat.get(\"ligand\", {}).get(\"name\", \"\") if \"ligand\" in feat else \"\"\n        subtype = desc or ligand or \"generic\"\n        feats[key].append((start, end, subtype))\n    return feats\n\n\ndef http_get(url, timeout=180):\n    req = urllib.request.Request(\n        url,\n        headers={\n            \"User-Agent\": \"Mozilla/5.0 (research script)\",\n            \"Accept\": \"application/json\",\n        },\n    )\n    with urllib.request.urlopen(req, timeout=timeout) as r:\n        return r.read()\n\n\ndef download_swissprot_stream(target_n=400):\n    \"\"\"Use UniProt search endpoint with pagination via cursor to avoid partial JSON.\"\"\"\n    query = \"reviewed:true AND (ft_binding:* OR ft_act_site:* OR ft_motif:* OR ft_domain:* OR ft_mod_res:*)\"\n    fields = \"accession,sequence,ft_binding,ft_act_site,ft_motif,ft_domain,ft_mod_res\"\n    entries = []\n    # Use smaller page size (25) to avoid truncated JSON; loop until enough\n    size = 25\n    cursor = None\n    max_pages = 50\n    for _ in range(max_pages):\n        params = {\n            \"query\": query,\n            \"format\": \"json\",\n            \"size\": str(size),\n            \"fields\": fields,\n        }\n        if cursor:\n            params[\"cursor\"] = cursor\n        url = \"https://rest.uniprot.org/uniprotkb/search?\" + urllib.parse.urlencode(\n            params\n        )\n        try:\n            req = urllib.request.Request(\n                url,\n                headers={\n                    \"User-Agent\": \"Mozilla/5.0 (research script)\",\n                    \"Accept\": \"application/json\",\n                },\n            )\n            with urllib.request.urlopen(req, timeout=180) as r:\n                raw = r.read()\n                # get Link header for cursor\n                link_hdr = r.headers.get(\"Link\", \"\") or r.headers.get(\"link\", \"\")\n            data = json.loads(raw.decode())\n            results = data.get(\"results\", [])\n            if not results:\n                break\n            for e in results:\n                seq = e.get(\"sequence\", {}).get(\"value\", \"\")\n                if not seq or not (30 <= len(seq) <= 1000):\n                    continue\n                feats = extract_features_json(e)\n                if sum(len(v) for v in feats.values()) == 0:\n                    continue\n                entries.append(\n                    {\n                        \"accession\": e.get(\"primaryAccession\", \"\"),\n                        \"sequence\": seq,\n                        \"features\": feats,\n                    }\n                )\n                if len(entries) >= target_n:\n                    break\n            if len(entries) >= target_n:\n                break\n            # parse cursor from Link header\n            m = re.search(r\"cursor=([^&>]+)\", link_hdr)\n            if not m:\n                break\n            cursor = m.group(1)\n        except Exception as ex:\n            print(f\"  page fetch failed: {ex}\")\n            break\n    return entries\n\n\ndef download_swissprot_by_accessions(target_n=400):\n    \"\"\"Fallback: fetch a curated list of well-annotated Swiss-Prot accessions individually.\"\"\"\n    # Fetch a list of accessions first via a smaller list-only query\n    accs = []\n    try:\n        url = \"https://rest.uniprot.org/uniprotkb/search?\" + urllib.parse.urlencode(\n            {\n                \"query\": \"reviewed:true AND (ft_binding:* OR ft_act_site:*) AND length:[50 TO 800]\",\n                \"format\": \"list\",\n                \"size\": \"500\",\n            }\n        )\n        raw = http_get(url).decode()\n        accs = [a.strip() for a in raw.splitlines() if a.strip()]\n    except Exception as ex:\n        print(f\"  accession list fetch failed: {ex}\")\n        return []\n    print(f\"  got {len(accs)} accessions, fetching entries individually...\")\n    entries = []\n    for i, acc in enumerate(accs):\n        if len(entries) >= target_n:\n            break\n        try:\n            url = f\"https://rest.uniprot.org/uniprotkb/{acc}.json\"\n            raw = http_get(url, timeout=60)\n            e = json.loads(raw.decode())\n            seq = e.get(\"sequence\", {}).get(\"value\", \"\")\n            if not seq or not (30 <= len(seq) <= 1000):\n                continue\n            feats = extract_features_json(e)\n            if sum(len(v) for v in feats.values()) == 0:\n                continue\n            entries.append(\n                {\n                    \"accession\": e.get(\"primaryAccession\", acc),\n                    \"sequence\": seq,\n                    \"features\": feats,\n                }\n            )\n            if (i + 1) % 25 == 0:\n                print(f\"  fetched {len(entries)}/{target_n} so far ({i+1} tried)\")\n        except Exception:\n            continue\n    return entries\n\n\nsp_entries = None\nif os.path.isfile(swissprot_cache):\n    try:\n        with open(swissprot_cache) as f:\n            sp_entries = json.load(f)\n        print(f\"Loaded cached Swiss-Prot: {len(sp_entries)} entries\")\n    except Exception:\n        sp_entries = None\n\nif not sp_entries:\n    local_files = find_local_swissprot()\n    if local_files:\n        print(f\"Found local Swiss-Prot files: {local_files[:3]} ...\")\n        for lf in local_files:\n            try:\n                low = lf.lower()\n                if (\n                    low.endswith(\".dat\")\n                    or low.endswith(\".dat.gz\")\n                    or low.endswith(\".txt\")\n                    or low.endswith(\".txt.gz\")\n                ):\n                    sp_entries = parse_uniprot_dat(lf, max_entries=400)\n                elif low.endswith(\".json\") or low.endswith(\".json.gz\"):\n                    with open_maybe_gz(lf) as fh:\n                        raw = json.load(fh)\n                    entries = raw.get(\"results\", raw) if isinstance(raw, dict) else raw\n                    sp_entries = []\n                    for e in entries:\n                        seq = (\n                            e.get(\"sequence\", {}).get(\"value\", \"\")\n                            if isinstance(e.get(\"sequence\"), dict)\n                            else e.get(\"sequence\", \"\")\n                        )\n                        if not seq or not (30 <= len(seq) <= 1000):\n                            continue\n                        feats = extract_features_json(e)\n                        if sum(len(v) for v in feats.values()) == 0:\n                            continue\n                        sp_entries.append(\n                            {\n                                \"accession\": e.get(\n                                    \"primaryAccession\", e.get(\"accession\", \"\")\n                                ),\n                                \"sequence\": seq,\n                                \"features\": feats,\n                            }\n                        )\n                        if len(sp_entries) >= 400:\n                            break\n                if sp_entries:\n                    print(f\"Parsed {len(sp_entries)} entries from {lf}\")\n                    break\n            except Exception as ex:\n                print(f\"  failed to parse {lf}: {ex}\")\n                continue\n\nif not sp_entries:\n    print(\"Trying streaming search download...\")\n    try:\n        sp_entries = download_swissprot_stream(target_n=300)\n        print(f\"  streaming got {len(sp_entries) if sp_entries else 0}\")\n    except Exception as ex:\n        print(f\"  streaming failed: {ex}\")\n        sp_entries = []\n\nif not sp_entries or len(sp_entries) < 50:\n    print(\"Trying accession-by-accession fallback...\")\n    try:\n        more = download_swissprot_by_accessions(target_n=300)\n        if more:\n            sp_entries = (sp_entries or []) + more\n    except Exception as ex:\n        print(f\"  fallback failed: {ex}\")\n\nassert (\n    sp_entries and len(sp_entries) > 0\n), \"Could not obtain any Swiss-Prot entries. Please place a Swiss-Prot .dat/.dat.gz under $DATA_DIR.\"\n\ntry:\n    with open(swissprot_cache, \"w\") as f:\n        json.dump(sp_entries, f)\nexcept Exception:\n    pass\n\nprint(f\"Total Swiss-Prot entries: {len(sp_entries)}\")\n\n# Build concept dictionary\nfrom collections import defaultdict, Counter\n\nMAX_LEN = 512\nproteins = []\nfor e in sp_entries:\n    seq = e[\"sequence\"][:MAX_LEN]\n    proteins.append(\n        {\"accession\": e[\"accession\"], \"sequence\": seq, \"features\": e[\"features\"]}\n    )\n\n\ndef norm_subtype(s):\n    s = s.lower()\n    s = re.sub(r\"\\(.*?\\)\", \"\", s)\n    s = re.sub(r\"\\s+\", \" \", s).strip()\n    s = s.split(\";\")[0].strip()\n    return s[:60]\n\n\nconcept_prots = defaultdict(list)\nfor pi, prot in enumerate(proteins):\n    L = len(prot[\"sequence\"])\n    for ftype, flist in prot[\"features\"].items():\n        for s, e, sub in flist:\n            s = max(1, s)\n            e = min(L, e)\n            if s > e:\n                continue\n            sub_n = norm_subtype(sub) if sub else \"generic\"\n            for key in [f\"{ftype}::{sub_n}\", f\"{ftype}::ANY\"]:\n                concept_prots[key].append((pi, set(range(s - 1, e))))\n\nconcepts = {k: v for k, v in concept_prots.items() if len(v) >= 3}\nprint(f\"Total concepts (>=3 proteins): {len(concepts)}\")\n\nprot_lens = [len(p[\"sequence\"]) for p in proteins]\noffsets = np.cumsum([0] + prot_lens)\ntotal_res = int(offsets[-1])\nprint(f\"Total residues: {total_res} across {len(proteins)} proteins\")\n\nconcept_labels = {}\nfor ck, occs in concepts.items():\n    arr = np.zeros(total_res, dtype=bool)\n    for pi, pos_set in occs:\n        off = offsets[pi]\n        for p in pos_set:\n            if p < prot_lens[pi]:\n                arr[off + p] = True\n    if arr.sum() >= 5:\n        concept_labels[ck] = arr\nprint(f\"Concepts with >=5 positive residues: {len(concept_labels)}\")\n\nassert len(concept_labels) > 0, \"No usable concepts.\"\n\n# --- Extract activations ---\nneuron_cache = os.path.join(working_dir, f\"activations_layer{SAE_LAYER}_neuron.npz\")\nsae_memmap_path = os.path.join(\n    working_dir, f\"sae_acts_layer{SAE_LAYER}_N{total_res}_D{d_sae}.dat\"\n)\n\nneed_extract = True\nif os.path.isfile(neuron_cache) and os.path.isfile(sae_memmap_path):\n    try:\n        z = np.load(neuron_cache)\n        neuron_acts = z[\"neuron\"]\n        if neuron_acts.shape[0] == total_res and neuron_acts.shape[1] == hidden_size:\n            sae_acts = np.memmap(\n                sae_memmap_path, dtype=np.float32, mode=\"r\", shape=(total_res, d_sae)\n            )\n            print(\n                f\"Loaded cached activations: neuron {neuron_acts.shape}, sae {sae_ac
