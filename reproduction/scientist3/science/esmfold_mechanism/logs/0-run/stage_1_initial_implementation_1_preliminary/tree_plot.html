      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }
};

ve SS,\npredicted SS, and match booleans for downstream ablations.", "Given the two prior failures were shallow (stdio bug, missing PISCES file), the\npriority is a **defensively-patched, cache-enabled smoke-test baseline** on a\nsmall hardcoded panel of well-characterized \u03b2-hairpin proteins (GB1, ubiquitin,\nWW-Pin1, Trpzip2, plus Trp-cage as a negative control). I apply the `isatty`\nmonkey-patch and wrap ESMFold loading with stdout redirection, load ESMFold from\n`MODEL_DIR` (with a fallback search), predict structures, and use\n`biotite.structure.annotate_sse` for DSSP-like secondary-structure assignment on\nthe predicted 3D coordinates (mkdssp on PATH is tried first). The metric\n`hairpin_dssp_accuracy` is defined as the fraction of *expected*-hairpin panel\nproteins for which the predicted SS string contains the pattern\n`E{3,}L{2,8}E{3,}`. All PDBs, SS strings, and pLDDTs are cached per-protein\nunder `working/`; each protein is wrapped in try/except so failures don't abort\nthe batch. I additionally attempt a lightweight PISCES scan (informational only)\nso we can verify staging without gating the baseline on it, and record any\nmissing resources. Results (predictions, ground truth expected-hairpin flags,\nper-residue pLDDT, SS strings) are saved to `experiment_data.npy` and the\naccuracy is printed.", "The error is due to `transformers.utils.loading_report._style` calling\n`sys.stdout.isatty()`, but the execution environment redirects stdout to a\n`RedirectQueue` object lacking the `isatty` method. The fix is to monkey-patch\n`isatty` onto `sys.stdout` (and `sys.stderr`) before importing/using\ntransformers, returning `False` so no ANSI styling is attempted. This keeps\neverything else identical.", "I'll implement a baseline that (1) preflights the environment (stdio patch,\npydssp/biotite install), (2) uses a hardcoded panel of well-characterized\n\u03b2-hairpin-containing proteins plus a negative control (Trp-cage), (3) loads\nESMFold from MODEL_DIR (with HF fallback), (4) predicts structures and caches\nPDB immediately after each forward pass (independent of SS assignment) to avoid\nwasting compute, (5) assigns secondary structure with a cascade pydssp \u2192 mkdssp\n\u2192 biotite, (6) computes `hairpin_dssp_accuracy` by regex-matching\n`E{3,}L{2,8}E{3,}` inside the annotated \u03b2-hairpin target region for each\nprotein, (7) fails loudly if `n_evaluated == 0`, and (8) saves per-protein\npredictions, SS strings, plddt, and the aggregate metric under `working_dir`.\nThis first sub-stage just establishes the metric on the wild-type panel \u2014 no\ninterventions yet, but the caching and modular structure will support the\nlocalization/seq2pair/charge ablations in later stages.", "Seed node", "Aggregate results from multiple seeds"], "code": ["import os, sys, io, glob, re, gzip, time, subprocess, tempfile, warnings\n\nwarnings.filterwarnings(\"ignore\")\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\nimport numpy as np\nimport torch\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nDATA_DIR = \"/data/zhenqian/data\"\nMODEL_DIR = \"/data/zhenqian/models\"\n\n# ---------------- Locate PISCES cull list ----------------\npisces_path = None\nfor pat in [\"**/cullpdb_pc25*chains12055*\", \"**/cullpdb_pc25*\", \"**/cullpdb*\"]:\n    hits = glob.glob(os.path.join(DATA_DIR, pat), recursive=True)\n    hits = [h for h in hits if os.path.isfile(h) and \"fasta\" not in h.lower()]\n    if hits:\n        pisces_path = hits[0]\n        break\nif pisces_path is None:\n    raise FileNotFoundError(\"PISCES cull list not found in DATA_DIR\")\nprint(f\"Using PISCES: {pisces_path}\")\n\nwith open(pisces_path) as f:\n    lines = f.read().splitlines()\nchains_list = []\nfor ln in lines[1:]:\n    parts = ln.split()\n    if len(parts) < 2:\n        continue\n    pdb_chain = parts[0]\n    if len(pdb_chain) < 5:\n        continue\n    pdb_id = pdb_chain[:4].lower()\n    chain_id = pdb_chain[4]\n    try:\n        length = int(parts[1])\n    except:\n        continue\n    if 40 <= length <= 150:\n        chains_list.append((pdb_id, chain_id, length))\nprint(f\"Candidate PISCES chains (40-150 aa): {len(chains_list)}\")\n\n# ---------------- Locate ESMFold model ----------------\nesmfold_path = None\nfor cand in [\"esmfold_v1\", \"esmfold\", \"facebook/esmfold_v1\"]:\n    p = os.path.join(MODEL_DIR, cand)\n    if os.path.isdir(p):\n        esmfold_path = p\n        break\nif esmfold_path is None:\n    matches = glob.glob(os.path.join(MODEL_DIR, \"**/esmfold*\"), recursive=True)\n    matches = [m for m in matches if os.path.isdir(m)]\n    if matches:\n        esmfold_path = matches[0]\nif esmfold_path is None:\n    raise FileNotFoundError(\"ESMFold model not found in MODEL_DIR\")\nprint(f\"Loading ESMFold from: {esmfold_path}\")\n\nfrom transformers import EsmForProteinFolding, AutoTokenizer\n\ntokenizer = AutoTokenizer.from_pretrained(esmfold_path)\nmodel = EsmForProteinFolding.from_pretrained(esmfold_path, low_cpu_mem_usage=True)\nmodel = model.to(device)\ntry:\n    model.esm = model.esm.half()\nexcept Exception:\n    pass\ntry:\n    model.trunk.set_chunk_size(64)\nexcept Exception:\n    pass\nmodel.eval()\nprint(\"ESMFold loaded.\")\n\n# ---------------- Structure/SS utilities ----------------\nimport biotite.structure as struc\nimport biotite.structure.io.pdb as pdb_io\nimport biotite.structure.io.pdbx as pdbx_io\n\ntry:\n    import biotite.database.rcsb as rcsb\n\n    _HAS_RCSB = True\nexcept Exception:\n    _HAS_RCSB = False\n\nTHREE_TO_ONE = {\n    \"ALA\": \"A\",\n    \"CYS\": \"C\",\n    \"ASP\": \"D\",\n    \"GLU\": \"E\",\n    \"PHE\": \"F\",\n    \"GLY\": \"G\",\n    \"HIS\": \"H\",\n    \"ILE\": \"I\",\n    \"LYS\": \"K\",\n    \"LEU\": \"L\",\n    \"MET\": \"M\",\n    \"ASN\": \"N\",\n    \"PRO\": \"P\",\n    \"GLN\": \"Q\",\n    \"ARG\": \"R\",\n    \"SER\": \"S\",\n    \"THR\": \"T\",\n    \"VAL\": \"V\",\n    \"TRP\": \"W\",\n    \"TYR\": \"Y\",\n}\n\n\ndef run_dssp(pdb_file_path):\n    \"\"\"Try mkdssp binary; return SS string. Returns None if DSSP unavailable.\"\"\"\n    for exe in [\"mkdssp\", \"dssp\"]:\n        try:\n            out = subprocess.run(\n                [exe, pdb_file_path], capture_output=True, text=True, timeout=60\n            )\n            if out.returncode == 0 and \"#  RESIDUE\" in out.stdout:\n                lines = out.stdout.splitlines()\n                start = next(\n                    i for i, l in enumerate(lines) if l.startswith(\"  #  RESIDUE\")\n                )\n                ss = []\n                for l in lines[start + 1 :]:\n                    if len(l) < 17:\n                        continue\n                    c = l[16]\n                    ss.append(c if c != \" \" else \"-\")\n                return \"\".join(ss)\n        except (\n            FileNotFoundError,\n            subprocess.TimeoutExpired,\n            StopIteration,\n            subprocess.SubprocessError,\n        ):\n            continue\n    return None\n\n\ndef sse_to_dssp_like(sse_arr):\n    \"\"\"Map biotite annotate_sse ('a'/'b'/'c') to DSSP-like single-letter codes.\"\"\"\n    m = {\"a\": \"H\", \"b\": \"E\", \"c\": \"-\"}\n    return \"\".join(m.get(x, \"-\") for x in sse_arr)\n\n\ndef get_ss_from_pdb(pdb_path):\n    \"\"\"Return (seq, ss) for first protein chain; try DSSP else biotite annotate_sse.\"\"\"\n    ss = run_dssp(pdb_path)\n    try:\n        pdb_file = pdb_io.PDBFile.read(pdb_path)\n        structure = pdb_file.get_structure(model=1)\n    except Exception:\n        return None\n    aa_mask = struc.filter_amino_acids(structure)\n    chain_aa = structure[aa_mask]\n    if len(chain_aa) == 0:\n        return None\n    # single chain: keep first chain\n    first_chain = chain_aa.chain_id[0]\n    chain_aa = chain_aa[chain_aa.chain_id == first_chain]\n    ca_mask = chain_aa.atom_name == \"CA\"\n    ca = chain_aa[ca_mask]\n    if len(ca) < 20:\n        return None\n    seq = \"\".join(THREE_TO_ONE.get(r, \"X\") for r in ca.res_name)\n    if ss is None or len(ss) != len(seq):\n        try:\n            sse_arr = struc.annotate_sse(chain_aa)\n            ss = sse_to_dssp_like(sse_arr)\n        except Exception:\n            return None\n    if len(ss) != len(seq):\n        # align by min length\n        L = min(len(ss), len(seq))\n        ss = ss[:L]\n        seq = seq[:L]\n    return seq, ss\n\n\ndef find_hairpins(ss):\n    \"\"\"Return list of (s1s, s1e, s2s, s2e) \u03b2-hairpin candidates from SS string.\"\"\"\n    ss2 = \"\".join(\"E\" if c == \"E\" else \".\" for c in ss)\n    out = []\n    for m in re.finditer(r\"(E{3,})(\\.{2,7})(E{3,})\", ss2):\n        out.append((m.start(1), m.end(1), m.start(3), m.end(3)))\n    return out\n\n\ndef fetch_pdb(pdb_id):\n    \"\"\"Look for local PDB, else fetch from RCSB. Returns local path or None.\"\"\"\n    for base in [DATA_DIR, working_dir]:\n        for sub in [\"pdb\", \"PDB\", \"structures\", \"\"]:\n            for ext in [\".pdb\", \".ent\", \".pdb.gz\", \".ent.gz\"]:\n                p = os.path.join(base, sub, f\"{pdb_id}{ext}\")\n                if os.path.isfile(p):\n                    if p.endswith(\".gz\"):\n                        target = os.path.join(working_dir, f\"{pdb_id}.pdb\")\n                        if not os.path.isfile(target):\n                            with gzip.open(p, \"rt\") as fin, open(target, \"w\") as fout:\n                                fout.write(fin.read())\n                        return target\n                    return p\n    target = os.path.join(working_dir, f\"{pdb_id}.pdb\")\n    if os.path.isfile(target):\n        return target\n    if _HAS_RCSB:\n        try:\n            rcsb.fetch(pdb_id, \"pdb\", working_dir)\n            if os.path.isfile(target):\n                return target\n        except Exception as e:\n            print(f\"  RCSB fetch failed for {pdb_id}: {e}\")\n    return None\n\n\n# ---------------- Collect \u03b2-hairpin targets ----------------\nMAX_TARGETS = 20\ntargets = []\nfor pdb_id, chain_id, length in chains_list:\n    if len(targets) >= MAX_TARGETS:\n        break\n    pdb_path = fetch_pdb(pdb_id)\n    if pdb_path is None:\n        continue\n    res = get_ss_from_pdb(pdb_path)\n    if res is None:\n        continue\n    seq, ss = res\n    hairpins = find_hairpins(ss)\n    if not hairpins:\n        continue\n    targets.append(\n        {\n            \"pdb_id\": pdb_id,\n            \"chain_id\": chain_id,\n            \"seq\": seq,\n            \"ss_native\": ss,\n            \"hairpin\": hairpins[0],\n        }\n    )\n    print(f\"  target {pdb_id}_{chain_id}  L={len(seq)}  hairpin={hairpins[0]}\")\nprint(f\"Collected {len(targets)} \u03b2-hairpin targets\")\n\nif len(targets) == 0:\n    raise RuntimeError(\"No \u03b2-hairpin targets could be collected from PISCES/PDB.\")\n\n# ---------------- ESMFold prediction + evaluation ----------------\nexperiment_data = {\n    \"pisces_hairpin_baseline\": {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"targets\": [],\n    }\n}\n\n\ndef esmfold_predict(seq):\n    with torch.no_grad():\n        toks = tokenizer([seq], return_tensors=\"pt\", add_special_tokens=False)\n        toks = {k: v.to(device) for k, v in toks.items()}\n        out = model(toks[\"input_ids\"])\n    pdbs = model.output_to_pdb(out)\n    return pdbs[0]\n\n\nhits = 0\ntotal = 0\nfor i, t in enumerate(targets):\n    seq = t[\"seq\"]\n    try:\n        pdb_str = esmfold_predict(seq)\n    except Exception as e:\n        print(f\"  ESMFold failed on {t['pdb_id']}: {e}\")\n        continue\n    pred_path = os.path.join(working_dir, f\"pred_{t['pdb_id']}_{t['chain_id']}.pdb\")\n    with open(pred_path, \"w\") as f:\n        f.write(pdb_str)\n    res = get_ss_from_pdb(pred_path)\n    if res is None:\n        print(f\"  SS assignment failed for pred {t['pdb_id']}\")\n        continue\n    pred_seq, pred_ss = res\n    s1s, s1e, s2s, s2e = t[\"hairpin\"]\n    L = min(len(pred_ss), len(t[\"ss_native\"]))\n    if s2e > L:\n        continue\n    strand_positions = list(range(s1s, s1e)) + list(range(s2s, s2e))\n    match = sum(1 for j in strand_positions if j < L and pred_ss[j] == \"E\")\n    frac = match / max(1, len(strand_positions))\n    is_hairpin = frac >= 0.7\n    hits += int(is_hairpin)\n    total += 1\n    acc = hits / total\n    print(\n        f\"[{i+1}/{len(targets)}] {t['pdb_id']}_{t['chain_id']}: strand-match={frac:.2f} \"\n        f\"hairpin={'YES' if is_hairpin else 'no'}  running_acc={acc:.3f}\"\n    )\n    print(f\"Epoch {i}: validation_loss = {1-acc:.4f}\")\n    experiment_data[\"pisces_hairpin_baseline\"][\"predictions\"].append(pred_ss)\n    experiment_data[\"pisces_hairpin_baseline\"][\"ground_truth\"].append(t[\"ss_native\"])\n    experiment_data[\"pisces_hairpin_baseline\"][\"targets\"].append(\n        {\n            \"pdb_id\": t[\"pdb_id\"],\n            \"chain_id\": t[\"chain_id\"],\n            \"hairpin\": t[\"hairpin\"],\n            \"seq_len\": len(seq),\n            \"strand_match_frac\": frac,\n            \"is_hairpin_pred\": is_hairpin,\n        }\n    )\n    experiment_data[\"pisces_hairpin_baseline\"][\"metrics\"][\"val\"].append(acc)\n    experiment_data[\"pisces_hairpin_baseline\"][\"losses\"][\"val\"].append(1 - acc)\n\nfinal_acc = hits / max(1, total)\nprint(f\"\\n=== FINAL hairpin_dssp_accuracy = {final_acc:.4f}  ({hits}/{total}) ===\")\n\nnp.save(\n    os.path.join(working_dir, \"experiment_data.npy\"), experiment_data, allow_pickle=True\n)\n\n# ---------------- Visualization ----------------\nimport matplotlib\n\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\n\nvals = experiment_data[\"pisces_hairpin_baseline\"][\"metrics\"][\"val\"]\nif vals:\n    plt.figure(figsize=(8, 4))\n    plt.plot(range(1, len(vals) + 1), vals, marker=\"o\")\n    plt.xlabel(\"Sample #\")\n    plt.ylabel(\"Running hairpin_dssp_accuracy\")\n    plt.title(f\"ESMFold Baseline \u03b2-hairpin DSSP Accuracy (final={final_acc:.3f})\")\n    plt.grid(True, alpha=0.3)\n    plt.savefig(\n        os.path.join(working_dir, \"pisces_hairpin_baseline_accuracy.png\"),\n        dpi=120,\n        bbox_inches=\"tight\",\n    )\n    plt.close()\n\n    per_frac = [\n        t[\"strand_match_frac\"]\n        for t in experiment_data[\"pisces_hairpin_baseline\"][\"targets\"]\n    ]\n    plt.figure(figsize=(8, 4))\n    plt.hist(per_frac, bins=10, range=(0, 1), edgecolor=\"k\")\n    plt.axvline(0.7, color=\"r\", linestyle=\"--\", label=\"hairpin threshold=0.7\")\n    plt.xlabel(\"Fraction of target strand residues predicted as \u03b2\")\n    plt.ylabel(\"Count\")\n    plt.legend()\n    plt.title(\"Distribution of strand-match fractions\")\n    plt.savefig(\n        os.path.join(working_dir, \"pisces_hairpin_baseline_strand_frac_hist.png\"),\n        dpi=120,\n        bbox_inches=\"tight\",\n    )\n    plt.close()\n\nprint(\"Done. Artifacts written to:\", working_dir)\n", "import os, sys, io, re, json, gzip, traceback, warnings\n\nwarnings.filterwarnings(\"ignore\")\n\n# isatty monkey-patch for sandboxed stdout\nfor _s in (sys.stdout, sys.stderr):\n    if not hasattr(_s, \"isatty\"):\n        try:\n            _s.isatty = lambda: False\n        except Exception:\n            pass\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\nimport numpy as np\nimport torch\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nDATA_DIR = \"/data/zhenqian/data\"\nMODEL_DIR = \"/data/zhenqian/models\"\n\nexperiment_data = {\n    \"esmfold_hairpin_baseline\": {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"per_sample\": [],\n        \"summary\": {},\n    }\n}\n\n# ------------- Locate PISCES cull list -------------\npisces_name = \"cullpdb_pc25.0_res0.0-2.5_len40-10000_R0.3_Xray_d2026_05_14_chains12055\"\npisces_candidates = []\nfor root, dirs, files in os.walk(DATA_DIR):\n    for f in files:\n        if pisces_name in f or f.startswith(\"cullpdb\"):\n            pisces_candidates.append(os.path.join(root, f))\n\nprint(\"PISCES candidates:\", pisces_candidates[:5])\n\npisces_file = None\nfor c in pisces_candidates:\n    if pisces_name in c:\n        pisces_file = c\n        break\nif pisces_file is None and pisces_candidates:\n    pisces_file = pisces_candidates[0]\n\nchains_list = []\nif pisces_file and os.path.exists(pisces_file):\n    opener = gzip.open if pisces_file.endswith(\".gz\") else open\n    with opener(pisces_file, \"rt\") as fh:\n        lines = fh.readlines()\n    # First line is header\n    header = lines[0].split()\n    for ln in lines[1:]:\n        parts = ln.split()\n        if len(parts) < 2:\n            continue\n        entry = parts[0]  # e.g. \"1A2P A\" or \"1A2PA\"\n        if len(entry) == 5:\n            pdb_id, chain = entry[:4], entry[4]\n        else:\n            pdb_id, chain = parts[0], parts[1] if len(parts) > 1 else \"A\"\n        chains_list.append((pdb_id.lower(), chain))\n    print(f\"Loaded {len(chains_list)} chains from PISCES: {pisces_file}\")\nelse:\n    raise FileNotFoundError(f\"PISCES cull list not found under {DATA_DIR}\")\n\n# ------------- Fetch PDB structures via biotite -------------\nimport biotite.structure.io.pdbx as pdbx\nimport biotite.structure.io.pdb as pdb_io\nimport biotite.structure as struc\nimport biotite.database.rcsb as rcsb\n\npdb_cache = os.path.join(working_dir, \"pdb_cache\")\nos.makedirs(pdb_cache, exist_ok=True)\n\n\n# ------------- DSSP helpers -------------\ndef assign_ss_biotite(atoms):\n    \"\"\"Fallback: annotate_sse returns per-residue 'a'/'b'/'c'.\"\"\"\n    try:\n        sse = struc.annotate_sse(atoms)\n        # map: a->H, b->E, c->L\n        mapping = {\"a\": \"H\", \"b\": \"E\", \"c\": \"L\"}\n        return \"\".join(mapping.get(x, \"L\") for x in sse)\n    except Exception as e:\n        return None\n\n\ndef get_ca_chain(atoms, chain_id=None):\n    if chain_id is not None:\n        atoms = atoms[atoms.chain_id == chain_id]\n    # protein only\n    atoms = atoms[struc.filter_amino_acids(atoms)]\n    return atoms\n\n\ndef three_to_one(resname):\n    d = {\n        \"ALA\": \"A\",\n        \"ARG\": \"R\",\n        \"ASN\": \"N\",\n        \"ASP\": \"D\",\n        \"CYS\": \"C\",\n        \"GLN\": \"Q\",\n        \"GLU\": \"E\",\n        \"GLY\": \"G\",\n        \"HIS\": \"H\",\n        \"ILE\": \"I\",\n        \"LEU\": \"L\",\n        \"LYS\": \"K\",\n        \"MET\": \"M\",\n        \"PHE\": \"F\",\n        \"PRO\": \"P\",\n        \"SER\": \"S\",\n        \"THR\": \"T\",\n        \"TRP\": \"W\",\n        \"TYR\": \"Y\",\n        \"VAL\": \"V\",\n        \"MSE\": \"M\",\n        \"SEC\": \"U\",\n        \"PYL\": \"O\",\n    }\n    return d.get(resname, \"X\")\n\n\ndef extract_sequence(atoms):\n    # unique residues in order\n    res_ids = atoms.res_id\n    res_names = atoms.res_name\n    seen = []\n    last = None\n    for i in range(len(res_ids)):\n        key = (res_ids[i], atoms.chain_id[i])\n        if key != last:\n            seen.append(res_names[i])\n            last = key\n    return \"\".join(three_to_one(r) for r in seen)\n\n\ndef fetch_pdb(pdb_id):\n    fp = os.path.join(pdb_cache, f\"{pdb_id}.pdb\")\n    if os.path.exists(fp) and os.path.getsize(fp) > 0:\n        return fp\n    try:\n        rcsb.fetch(pdb_id, \"pdb\", pdb_cache)\n        return fp if os.path.exists(fp) else None\n    except Exception:\n        return None\n\n\n# regex for \u03b2-hairpin motif on SS string\nHAIRPIN_RE = re.compile(r\"E{3,}[LH]{2,8}E{3,}\")\n\n\ndef find_hairpin_regions(ss_string):\n    regions = []\n    for m in HAIRPIN_RE.finditer(ss_string):\n        regions.append((m.start(), m.end()))\n    return regions\n\n\ndef is_hairpin(ss_substr):\n    \"\"\"Check if a SS substring matches \u03b2-hairpin pattern: E-strand, loop, E-strand.\"\"\"\n    if HAIRPIN_RE.fullmatch(ss_substr):\n        return True\n    # Softer: at least 70% strand and contains two runs of E with a loop\n    e_frac = ss_substr.count(\"E\") / max(1, len(ss_substr))\n    if e_frac < 0.5:\n        return False\n    # find E-runs\n    runs = re.findall(r\"E+\", ss_substr)\n    if len(runs) >= 2 and all(len(r) >= 2 for r in runs[:2]):\n        return True\n    return False\n\n\n# ------------- Load ESMFold model -------------\nimport transformers\n\ntry:\n    transformers.logging.set_verbosity_error()\nexcept Exception:\n    pass\n\nfrom transformers import AutoTokenizer, EsmForProteinFolding\n\nesmfold_paths = [\n    os.path.join(MODEL_DIR, \"esmfold_v1\"),\n    os.path.join(MODEL_DIR, \"ESMFold\"),\n    os.path.join(MODEL_DIR, \"esmfold\"),\n]\nesmfold_path = None\nfor p in esmfold_paths:\n    if os.path.isdir(p):\n        esmfold_path = p\n        break\nif esmfold_path is None:\n    # search\n    for name in os.listdir(MODEL_DIR):\n        if \"esmfold\" in name.lower():\n            esmfold_path = os.path.join(MODEL_DIR, name)\n            break\n\nif esmfold_path is None:\n    raise FileNotFoundError(f\"ESMFold model not found under {MODEL_DIR}\")\n\nprint(f\"Loading ESMFold from: {esmfold_path}\")\n\ntokenizer = AutoTokenizer.from_pretrained(esmfold_path, local_files_only=True)\nmodel = EsmForProteinFolding.from_pretrained(\n    esmfold_path, local_files_only=True, low_cpu_mem_usage=True\n)\nmodel = model.to(device)\nmodel.eval()\nif device.type == \"cuda\":\n    try:\n        model.esm = model.esm.half()\n    except Exception:\n        pass\n    try:\n        model.trunk.set_chunk_size(64)\n    except Exception:\n        pass\n\nprint(\"ESMFold loaded.\")\n\n\n# convert model output to PDB\ndef output_to_pdb(output):\n    from transformers.models.esm.openfold_utils.protein import (\n        to_pdb,\n        Protein as OFProtein,\n    )\n    from transformers.models.esm.openfold_utils.feats import atom14_to_atom37\n\n    final_atom_positions = atom14_to_atom37(output[\"positions\"][-1], output)\n    outputs = {\n        k: v.to(\"cpu\").numpy() for k, v in output.items() if isinstance(v, torch.Tensor)\n    }\n    final_atom_positions = final_atom_positions.cpu().numpy()\n    final_atom_mask = outputs[\"atom37_atom_exists\"]\n    pdbs = []\n    for i in range(outputs[\"aatype\"].shape[0]):\n        aa = outputs[\"aatype\"][i]\n        pred_pos = final_atom_positions[i]\n        mask = final_atom_mask[i]\n        resid = outputs[\"residue_index\"][i] + 1\n        pred = OFProtein(\n            aatype=aa,\n            atom_positions=pred_pos,\n            atom_mask=mask,\n            residue_index=resid,\n            b_factors=outputs[\"plddt\"][i],\n            chain_index=outputs[\"chain_index\"][i] if \"chain_index\" in outputs else None,\n        )\n        pdbs.append(to_pdb(pred))\n    return pdbs\n\n\n# ------------- Build evaluation set -------------\nimport random\n\nrandom.seed(0)\nrandom.shuffle(chains_list)\n\neval_samples = []  # list of dicts: pdb_id, chain, sequence, native_ss, target_region\nMAX_CHAINS_SCAN = 400\nTARGET_N = 20\nMIN_LEN, MAX_LEN = 40, 130\n\nfor pdb_id, chain in chains_list[:MAX_CHAINS_SCAN]:\n    if len(eval_samples) >= TARGET_N:\n        break\n    fp = fetch_pdb(pdb_id)\n    if fp is None:\n        continue\n    try:\n        pf = pdb_io.PDBFile.read(fp)\n        atoms = pf.get_structure(model=1)\n        atoms = get_ca_chain(atoms, chain_id=chain)\n        if len(atoms) == 0:\n            continue\n        # get CA-only for SS\n        ca = atoms[atoms.atom_name == \"CA\"]\n        seq = extract_sequence(atoms)\n        if not (MIN_LEN <= len(seq) <= MAX_LEN):\n            continue\n        # assign SS with biotite fallback\n        ss = assign_ss_biotite(ca)\n        if ss is None or len(ss) != len(seq):\n            continue\n        regions = find_hairpin_regions(ss)\n        if not regions:\n            continue\n        # pick the first hairpin region\n        region = regions[0]\n        eval_samples.append(\n            {\n                \"pdb_id\": pdb_id,\n                \"chain\": chain,\n                \"sequence\": seq,\n                \"native_ss\": ss,\n                \"target_region\": region,\n            }\n        )\n        print(\n            f\"  + {pdb_id}_{chain} len={len(seq)} region={region} ss_seg={ss[region[0]:region[1]]}\"\n        )\n    except Exception as e:\n        continue\n\nprint(f\"Collected {len(eval_samples)} evaluation samples with native \u03b2-hairpins.\")\n\n\n# ------------- Run ESMFold predictions and score -------------\ndef predict_structure(sequence):\n    inputs = tokenizer([sequence], return_tensors=\"pt\", add_special_tokens=False)\n    inputs = {k: v.to(device) for k, v in inputs.items()}\n    with torch.no_grad():\n        outputs = model(**inputs)\n    return outputs\n\n\nn_match = 0\nn_total = 0\nper_sample = []\n\nfor i, samp in enumerate(eval_samples):\n    seq = samp[\"sequence\"]\n    region = samp[\"target_region\"]\n    try:\n        with torch.no_grad():\n            outputs = predict_structure(seq)\n        pdbs = output_to_pdb(outputs)\n        pdb_str = pdbs[0]\n        # write to file\n        pred_fp = os.path.join(\n            working_dir, f\"pred_{samp['pdb_id']}_{samp['chain']}.pdb\"\n        )\n        with open(pred_fp, \"w\") as f:\n            f.write(pdb_str)\n        # load predicted structure and assign SS\n        pf = pdb_io.PDBFile.read(pred_fp)\n        atoms = pf.get_structure(model=1)\n        atoms = get_ca_chain(atoms)\n        ca = atoms[atoms.atom_name == \"CA\"]\n        pred_ss = assign_ss_biotite(ca)\n        if pred_ss is None:\n            print(f\"SS assignment failed for {samp['pdb_id']}\")\n            continue\n        # extract plddt\n        plddt = (\n            outputs[\"plddt\"][0].mean().item() if \"plddt\" in outputs else float(\"nan\")\n        )\n        region_ss = (\n            pred_ss[region[0] : region[1]]\n            if region[1] <= len(pred_ss)\n            else pred_ss[region[0] :]\n        )\n        match = bool(is_hairpin(region_ss))\n        n_total += 1\n        n_match += int(match)\n        per_sample.append(\n            {\n                \"pdb_id\": samp[\"pdb_id\"],\n                \"chain\": samp[\"chain\"],\n                \"seq_len\": len(seq),\n                \"region\": region,\n                \"native_ss_region\": samp[\"native_ss\"][region[0] : region[1]],\n                \"pred_ss_region\": region_ss,\n                \"pred_ss_full\": pred_ss,\n                \"plddt_mean\": plddt,\n                \"match\": match,\n            }\n        )\n        print(\n            f\"[{i+1}/{len(eval_samples)}] {samp['pdb_id']}_{samp['chain']} \"\n            f\"native={samp['native_ss'][region[0]:region[1]]} \"\n            f\"pred={region_ss} match={match} plddt={plddt:.2f}\"\n        )\n        # free memory\n        del outputs\n        if device.type == \"cuda\":\n            torch.cuda.empty_cache()\n    except Exception as e:\n        print(f\"Error for {samp['pdb_id']}_{samp['chain']}: {e}\")\n        traceback.print_exc()\n        if device.type == \"cuda\":\n            torch.cuda.empty_cache()\n        continue\n\nhairpin_dssp_accuracy = (n_match / n_total) if n_total > 0 else 0.0\nprint(\n    f\"\\n=== BASELINE hairpin_dssp_accuracy = {hairpin_dssp_accuracy:.4f} ({n_match}/{n_total}) ===\"\n)\n\nexperiment_data[\"esmfold_hairpin_baseline\"][\"metrics\"][\"val\"].append(\n    {\n        \"epoch\": 0,\n        \"hairpin_dssp_accuracy\": hairpin_dssp_accuracy,\n        \"n_match\": n_match,\n        \"n_total\": n_total,\n    }\n)\nexperiment_data[\"esmfold_hairpin_baseline\"][\"losses\"][\"val\"].append(\n    {\n        \"epoch\": 0,\n        \"val_loss\": 1.0 - hairpin_dssp_accuracy,\n    }\n)\nexperiment_data[\"esmfold_hairpin_baseline\"][\"per_sample\"] = per_sample\nexperiment_data[\"esmfold_hairpin_baseline\"][\"summary\"] = {\n    \"hairpin_dssp_accuracy\": hairpin_dssp_accuracy,\n    \"n_match\": n_match,\n    \"n_total\": n_total,\n    \"n_scanned_chains\": min(MAX_CHAINS_SCAN, len(chains_list)),\n    \"esmfold_path\": esmfold_path,\n    \"pisces_file\": pisces_file,\n}\n\nprint(f\"Epoch 0: validation_loss = {1.0 - hairpin_dssp_accuracy:.4f}\")\n\n# ---- Visualization ----\ntry:\n    import matplotlib\n\n    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n\n    if per_sample:\n        plddts = [p[\"plddt_mean\"] for p in per_sample]\n        matches = [int(p[\"match\"]) for p in per_sample]\n        fig, ax = plt.subplots(1, 2, figsize=(10, 4))\n        ax[0].hist(plddts, bins=10)\n        ax[0].set_title(\"Mean pLDDT distribution\")\n        ax[0].set_xlabel(\"pLDDT\")\n        ax[0].set_ylabel(\"count\")\n        ax[1].bar([\"no_hairpin\", \"hairpin\"], [matches.count(0), matches.count(1)])\n        ax[1].set_title(f\"\u03b2-hairpin match (acc={hairpin_dssp_accuracy:.2%})\")\n        fig.tight_layout()\n        fig.savefig(\n            os.path.join(working_dir, \"esmfold_hairpin_baseline_summary.png\"), dpi=120\n        )\n        plt.close(fig)\nexcept Exception as e:\n    print(\"Plot error:\", e)\n\nnp.save(\n    os.path.join(working_dir, \"experiment_data.npy\"), experiment_data, allow_pickle=True\n)\nprint(f\"Saved experiment_data.npy to {working_dir}\")\n", "import os, sys, io, re, json, contextlib, gzip, shutil, subprocess, tempfile\n\n# --- defensive stdio monkey-patch (fixes transformers .isatty crash) ---\nfor _stream in (\"stdout\", \"stderr\"):\n    _s = getattr(sys, _stream, None)\n    if _s is not None and not hasattr(_s, \"isatty\"):\n        try:\n            _s.isatty = lambda: False\n        except Exception:\n            pass\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\nimport numpy as np\nimport torch\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\nDATA_DIR = \"/data/zhenqian/data\"\nMODEL_DIR = \"/data/zhenqian/models\"\n\n\n# -------- Locate ESMFold local weights --------\ndef find_esmfold_path():\n    candidates = [\n        os.path.join(MODEL_DIR, \"esmfold_v1\"),\n        os.path.join(MODEL_DIR, \"facebook\", \"esmfold_v1\"),\n        os.path.join(MODEL_DIR, \"esmfold\"),\n        os.path.join(MODEL_DIR, \"models--facebook--esmfold_v1\"),\n    ]\n    for p in candidates:\n        if os.path.isdir(p) and (\n            os.path.isfile(os.path.join(p, \"config.json\"))\n            or any(\"snapshots\" in d for d in os.listdir(p))\n        ):\n            # unwrap huggingface cache snapshot\n            if not os.path.isfile(os.path.join(p, \"config.json\")):\n                snap_root = os.path.join(p, \"snapshots\")\n                if os.path.isdir(snap_root):\n                    snaps = os.listdir(snap_root)\n                    if snaps:\n                        return os.path.join(snap_root, snaps[0])\n            return p\n    for root, dirs, files in os.walk(MODEL_DIR):\n        if \"config.json\" in files and \"esmfold\" in root.lower():\n            return root\n    return \"facebook/esmfold_v1\"\n\n\nmodel_path = find_esmfold_path()\nprint(f\"Loading ESMFold from: {model_path}\")\n\nfrom transformers import AutoTokenizer, EsmForProteinFolding\n\nwith contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(\n    io.StringIO()\n):\n    tokenizer = AutoTokenizer.from_pretrained(model_path)\n    model = EsmForProteinFolding.from_pretrained(model_path, low_cpu_mem_usage=True)\n\nmodel = model.to(device)\ntry:\n    model.esm = model.esm.half()\nexcept Exception as e:\n    print(f\"half() failed on ESM backbone: {e}\")\nmodel = model.eval()\ntry:\n    model.trunk.set_chunk_size(64)\nexcept Exception:\n    pass\nprint(\"ESMFold loaded.\")\n\n# -------- PISCES availability check (informational) --------\npisces_names = [\n    \"cullpdb_pc25.0_res0.0-2.5_len40-10000_R0.3_Xray_d2026_05_14_chains12055\",\n]\npisces_found = None\nfor base in [\n    DATA_DIR,\n    os.path.join(DATA_DIR, \"pisces\"),\n    os.path.join(DATA_DIR, \"PISCES\"),\n]:\n    if not os.path.isdir(base):\n        continue\n    for n in pisces_names + [n + \".gz\" for n in pisces_names]:\n        p = os.path.join(base, n)\n        if os.path.isfile(p):\n            pisces_found = p\n            break\n    if pisces_found:\n        break\nif not pisces_found:\n    for root, dirs, files in os.walk(DATA_DIR):\n        for f in files:\n            if f.startswith(\"cullpdb\"):\n                pisces_found = os.path.join(root, f)\n                break\n        if pisces_found:\n            break\nmissing_resources = []\nif pisces_found:\n    print(f\"PISCES file located: {pisces_found}\")\nelse:\n    print(\n        f\"PISCES cull list NOT FOUND under {DATA_DIR}; proceeding with hardcoded panel only.\"\n    )\n    missing_resources.append(\"PISCES cullpdb list\")\n\n# -------- Panel of known \u03b2-hairpin proteins --------\npanel = [\n    # (name, sequence, expected_hairpin)\n    (\"GB1_hairpin\", \"GEWTYDDATKTFTVTE\", True),\n    (\"trpzip2\", \"SWTWENGKWTWK\", True),\n    (\"GB1_full\", \"MTYKLILNGKTLKGETTTEAVDAATAEKVFKQYANDNGVDGEWTYDDATKTFTVTE\", True),\n    (\n        \"ubiquitin\",\n        \"MQIFVKTLTGKTITLEVEPSDTIENVKAKIQDKEGIPPDQQRLIFAGKQLEDGRTLSDYNIQKESTLHLVLRLRGG\",\n        True,\n    ),\n    (\"WW_Pin1\", \"KLPPGWEKRMSRSSGRVYYFNHITNASQWERPSG\", True),\n    (\"trp_cage\", \"NLYIQWLKDGGPSSGRPPPS\", False),  # helical negative control\n    (\"villin_hp35\", \"LSDEDFKAVFGMTRSAFANLPLWKQQNLKKEKGLF\", False),  # helical\n]\n\n\n# -------- ESMFold inference --------\ndef predict_structure(seq):\n    inputs = tokenizer([seq], return_tensors=\"pt\", add_special_tokens=False)\n    input_ids = inputs[\"input_ids\"].to(device)\n    with torch.no_grad():\n        outputs = model(input_ids)\n    pdb_str = model.output_to_pdb(outputs)[0]\n    # pLDDT: openfold outputs plddt as (B, L, 37) or (B, L); handle both\n    plddt = outputs[\"plddt\"][0].detach().cpu().numpy()\n    if plddt.ndim == 2:\n        plddt = plddt.mean(axis=-1)\n    return pdb_str, plddt\n\n\n# -------- Secondary-structure assignment --------\ndef ss_via_mkdssp(pdb_str):\n    if shutil.which(\"mkdssp\") is None:\n        return None\n    with tempfile.NamedTemporaryFile(\"w\", suffix=\".pdb\", delete=False) as f:\n        f.write(pdb_str)\n        pdb_path = f.name\n    try:\n        out = subprocess.run(\n            [\"mkdssp\", pdb_path], capture_output=True, text=True, timeout=60\n        )\n        if out.returncode != 0:\n            return None\n        lines = out.stdout.splitlines()\n        # parse DSSP: after '#  RESIDUE ...' line\n        ss = []\n        start = False\n        for line in lines:\n            if line.startswith(\"  #  RESIDUE\"):\n                start = True\n                continue\n            if not start:\n                continue\n            if len(line) < 17:\n                continue\n            aa = line[13]\n            sscode = line[16]\n            if aa == \"!\":\n                continue\n            ss.append(sscode if sscode != \" \" else \"-\")\n        # map to 3-state\n        mapping = {\n            \"H\": \"H\",\n            \"G\": \"H\",\n            \"I\": \"H\",\n            \"E\": \"E\",\n            \"B\": \"E\",\n            \"T\": \"L\",\n            \"S\": \"L\",\n            \"-\": \"L\",\n            \" \": \"L\",\n        }\n        return \"\".join(mapping.get(c, \"L\") for c in ss)\n    finally:\n        try:\n            os.unlink(pdb_path)\n        except:\n            pass\n\n\ndef ss_via_biotite(pdb_str):\n    from biotite.structure.io.pdb import PDBFile\n    from biotite.structure import annotate_sse, filter_amino_acids\n\n    pf = PDBFile.read(io.StringIO(pdb_str))\n    struct = pf.get_structure(model=1)\n    struct = struct[filter_amino_acids(struct)]\n    sse = annotate_sse(struct)  # per residue: 'a','b','c'\n    mapping = {\"a\": \"H\", \"b\": \"E\", \"c\": \"L\"}\n    return \"\".join(mapping.get(x, \"L\") for x in sse)\n\n\ndef assign_ss(pdb_str):\n    ss = ss_via_mkdssp(pdb_str)\n    if ss is not None and len(ss) > 0:\n        return ss, \"mkdssp\"\n    return ss_via_biotite(pdb_str), \"biotite\"\n\n\nHAIRPIN_RE = re.compile(r\"E{3,}L{2,8}E{3,}\")\n\n\ndef has_hairpin(ss):\n    # collapse H into L for the loop tolerance? keep strict L window between strands\n    return bool(HAIRPIN_RE.search(ss))\n\n\n# -------- Run baseline --------\nexperiment_data = {\n    \"panel_baseline\": {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"per_protein\": [],\n        \"missing_resources\": missing_resources,\n    }\n}\n\nresults = []\nfor name, seq, expected in panel:\n    cache_pdb = os.path.join(working_dir, f\"{name}.pdb\")\n    cache_meta = os.path.join(working_dir, f\"{name}.json\")\n    try:\n        if os.path.isfile(cache_pdb) and os.path.isfile(cache_meta):\n            with open(cache_pdb) as f:\n                pdb_str = f.read()\n            with open(cache_meta) as f:\n                meta = json.load(f)\n            plddt = np.array(meta[\"plddt\"])\n        else:\n            print(f\"[{name}] predicting (len={len(seq)}) ...\")\n            pdb_str, plddt = predict_structure(seq)\n            with open(cache_pdb, \"w\") as f:\n                f.write(pdb_str)\n            with open(cache_meta, \"w\") as f:\n                json.dump({\"plddt\": plddt.tolist(), \"seq\": seq}, f)\n        ss, ss_source = assign_ss(pdb_str)\n        found = has_hairpin(ss)\n        rec = {\n            \"name\": name,\n            \"s     outputs = {\n        k: v.to(\"cpu\").numpy()\n        for k, v in outputs.items()\n        if isinstance(v, torch.Tensor)\n    }\n    final_atom_positions = final_atom_positions.cpu().numpy()\n    final_atom_mask = outputs[\"atom37_atom_exists\"]\n    pdbs = []\n    for i in range(outputs[\"aatype\"].shape[0]):\n        aa = outputs[\"aatype\"][i]\n        pred_pos = final_atom_positions[i]\n        mask = final_atom_mask[i]\n        resid = outputs[\"residue_index\"][i] + 1\n        pred = OFProtein(\n            aatype=aa,\n            atom_positions=pred_pos,\n            atom_mask=mask,\n            residue_index=resid,\n            b_factors=outputs[\"plddt\"][i],\n            chain_index=outputs[\"chain_index\"][i] if \"chain_index\" in outputs else None,\n        )\n        pdbs.append(to_pdb(pred))\n    return pdbs\n\n\n@torch.no_grad()\ndef predict_structure(seq):\n    tokenized = tokenizer([seq], return_tensors=\"pt\", add_special_tokens=False)\n    tokenized = {k: v.to(device) for k, v in tokenized.items()}\n    out = model(**tokenized)\n    pdb_strs = convert_outputs_to_pdb(out)\n    plddt = out[\"plddt\"].mean().item()\n    return pdb_strs[0], plddt\n\n\n# ---------- SS assignment cascade ----------\ndef ss_from_pydssp(pdb_str):\n    import pydssp\n    from Bio.PDB import PDBParser\n\n    parser = PDBParser(QUIET=True)\n    struct = parser.get_structure(\"x\", io.StringIO(pdb_str))\n    # collect N, CA, C, O for each residue in order\n    coords = []\n    for model_ in struct:\n        for chain in model_:\n            for res in chain:\n                try:\n                    n = res[\"N\"].coord\n                    ca = res[\"CA\"].coord\n                    c = res[\"C\"].coord\n                    o = res[\"O\"].coord\n                except KeyError:\n                    continue\n                coords.append([n, ca, c, o])\n        break\n    if len(coords) == 0:\n        raise RuntimeError(\"no backbone atoms\")\n    arr = torch.tensor(np.array(coords), dtype=torch.float32).unsqueeze(\n        0\n    )  # [1, L, 4, 3]\n    ss = pydssp.assign(arr, out_type=\"c3\")  # returns \"H\"/\"E\"/\"-\" per residue\n    if isinstance(ss, list) or isinstance(ss, tuple):\n        ss = ss[0]\n    if isinstance(ss, np.ndarray):\n        ss = \"\".join(ss.tolist())\n    # normalize to E / H / L\n    ss = \"\".join(\n        \"E\" if c in (\"E\", \"B\") else (\"H\" if c in (\"H\", \"G\", \"I\") else \"L\") for c in ss\n    )\n    return ss\n\n\ndef ss_from_mkdssp(pdb_str):\n    if shutil.which(\"mkdssp\") is None:\n        raise RuntimeError(\"mkdssp not installed\")\n    tmp = os.path.join(working_dir, \"_tmp.pdb\")\n    with open(tmp, \"w\") as f:\n        f.write(pdb_str)\n    out = subprocess.check_output([\"mkdssp\", tmp], text=True)\n    # parse DSSP output\n    ss = []\n    started = False\n    for ln in out.splitlines():\n        if ln.startswith(\"  #  RESIDUE\"):\n            started = True\n            continue\n        if not started:\n            continue\n        if len(ln) < 17:\n            continue\n        c = ln[16]\n        ss.append(\"E\" if c in (\"E\", \"B\") else (\"H\" if c in (\"H\", \"G\", \"I\") else \"L\"))\n    return \"\".join(ss)\n\n\ndef ss_from_biotite(pdb_str):\n    import biotite.structure.io.pdb as bpdb\n    import biotite.structure as bstruc\n\n    pf = bpdb.PDBFile.read(io.StringIO(pdb_str))\n    atoms = pf.get_structure(model=1)\n    sse = bstruc.annotate_sse(atoms)\n    return \"\".join(\"E\" if c == \"b\" else (\"H\" if c == \"a\" else \"L\") for c in sse)\n\n\ndef assign_ss(pdb_str):\n    errs = []\n    for fn, name in [\n        (ss_from_pydssp, \"pydssp\"),\n        (ss_from_mkdssp, \"mkdssp\"),\n        (ss_from_biotite, \"biotite\"),\n    ]:\n        try:\n            ss = fn(pdb_str)\n            if ss and len(ss) > 0:\n                return ss, name\n        except Exception as e:\n            errs.append(f\"{name}: {e}\")\n    raise RuntimeError(\"All SS assigners failed: \" + \" | \".join(errs))\n\n\n# ---------- Hairpin regex ----------\nHAIRPIN_RE = re.compile(r\"E{3,}L{2,8}E{3,}\")\n\n\ndef is_hairpin(ss_region):\n    return bool(HAIRPIN_RE.search(ss_region))\n\n\n# ---------- Experiment ----------\nexperiment_data = {\n    \"esmfold_hairpin_panel\": {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"per_protein\": [],\n    }\n}\n\npdb_cache_dir = os.path.join(working_dir, \"pdb_cache\")\nos.makedirs(pdb_cache_dir, exist_ok=True)\n\n# Stage 1: predict + cache PDBs\nfor name, seq, region, is_pos in PANEL:\n    pdb_path = os.path.join(pdb_cache_dir, f\"{name}.pdb\")\n    if os.path.exists(pdb_path):\n        print(f\"[cache] {name}\")\n        continue\n    try:\n        t0 = time.time()\n        pdb_str, plddt = predict_structure(seq)\n        with open(pdb_path, \"w\") as f:\n            f.write(pdb_str)\n        with open(pdb_path + \".plddt\", \"w\") as f:\n            f.write(str(plddt))\n        print(f\"[pred] {name} len={len(seq)} plddt={plddt:.2f} ({time.time()-t0:.1f}s)\")\n    except Exception as e:\n        print(f\"[pred FAIL] {name}: {e}\")\n        traceback.print_exc()\n\n# Stage 2: SS assignment + metric\nn_eval, n_correct = 0, 0\nfor name, seq, (r0, r1), is_pos in PANEL:\n    pdb_path = os.path.join(pdb_cache_dir, f\"{name}.pdb\")\n    if not os.path.exists(pdb_path):\n        print(f\"[skip] {name}: no cached PDB\")\n        continue\n    try:\n        with open(pdb_path) as f:\n            pdb_str = f.read()\n        try:\n            with open(pdb_path + \".plddt\") as f:\n                plddt = float(f.read())\n        except Exception:\n            plddt = float(\"nan\")\n        ss, used = assign_ss(pdb_str)\n        if len(ss) != len(seq):\n            print(f\"[warn] {name}: ss len {len(ss)} vs seq len {len(seq)}\")\n        ss_full = ss[: len(seq)].ljust(len(seq), \"L\")\n        region_ss = ss_full[r0 - 1 : r1]\n        pred_hairpin = is_hairpin(region_ss)\n        correct = int(pred_hairpin == is_pos)\n        n_eval += 1\n        n_correct += correct\n        print(\n            f\"[eval] {name:12s} region={region_ss}  full={ss_full}  pred_hp={pred_hairpin} gt_hp={is_pos} correct={correct} plddt={plddt:.2f} tool={used}\"\n        )\n        experiment_data[\"esmfold_hairpin_panel\"][\"per_protein\"].append(\n            {\n                \"name\": name,\n                \"sequence\": seq,\n                \"region\": [r0, r1],\n                \"gt_hairpin\": is_pos,\n                \"pred_hairpin\": pred_hairpin,\n                \"ss_full\": ss_full,\n                \"ss_region\": region_ss,\n                \"plddt\": plddt,\n                \"ss_tool\": used,\n                \"correct\": bool(correct),\n            }\n        )\n        experiment_data[\"esmfold_hairpin_panel\"][\"predictions\"].append(\n            int(pred_hairpin)\n        )\n        experiment_data[\"esmfold_hairpin_panel\"][\"ground_truth\"].append(int(is_pos))\n    except Exception as e:\n        print(f\"[eval FAIL] {name}: {e}\")\n        traceback.print_exc()\n\nassert n_eval > 0, \"No proteins evaluated; metric is meaningless\"\nhairpin_dssp_accuracy = n_correct / n_eval\nprint(\n    f\"\\n=== hairpin_dssp_accuracy = {hairpin_dssp_accuracy:.4f}  ({n_correct}/{n_eval}) ===\"\n)\nprint(f\"Epoch 0: validation_loss = {1.0 - hairpin_dssp_accuracy:.4f}\")\n\nexperiment_data[\"esmfold_hairpin_panel\"][\"metrics\"][\"val\"].append(\n    {\n        \"epoch\": 0,\n        \"hairpin_dssp_accuracy\": hairpin_dssp_accuracy,\n        \"n_eval\": n_eval,\n        \"n_correct\": n_correct,\n    }\n)\nexperiment_data[\"esmfold_hairpin_panel\"][\"losses\"][\"val\"].append(\n    {\"epoch\": 0, \"loss\": 1.0 - hairpin_dssp_accuracy}\n)\n\n# Simple visualization\ntry:\n    import matplotlib\n\n    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n\n    nam  package to a version whose\n`utils/loading_report.py` does not assume `sys.stdout.isatty` exists (or file a\nfix upstream).  After patching `isatty`, model loading should proceed and the\nrest of the \u03b2-hairpin baseline pipeline should run.", "The script failed immediately because the PISCES cull list file could not be\nlocated under DATA_DIR (/data/zhenqian/data). The os.walk search returned zero\ncandidates matching either the exact filename\n`cullpdb_pc25.0_res0.0-2.5_len40-10000_R0.3_Xray_d2026_05_14_chains12055` or any\nfile starting with `cullpdb`, so the code raised FileNotFoundError before any\nESMFold work could start.  Proposed fixes: 1. Download the PISCES cull list if\nit's absent instead of hard-failing. The PISCES lists are hosted at\nhttps://dunbrack.fccc.edu/pisces/download/ (e.g., `https://dunbrack.fccc.edu/pis\nces/download/cullpdb_pc25.0_res0.0-2.5_len40-\n10000_R0.3_Xray_d2026_05_14_chains12055.gz`). Fetch it to `$DATA_DIR/pisces/`\nand then load it. 2. Broaden the search to also look for the file in common\nsubdirectories (e.g., `$DATA_DIR/pisces`, `$DATA_DIR/PISCES`) and to accept\n`.gz` variants of the filename. 3. Print the DATA_DIR listing\n(`os.listdir(DATA_DIR)`) when the file is missing so the user can quickly see\nwhether the dataset was staged under a different name/path. 4. As a robust\nalternative, allow specifying a PISCES-like whitelist file via environment\nvariable (e.g., `PISCES_FILE`) that overrides the walk-based discovery.  After\nensuring the PISCES file is available (either pre-staged under DATA_DIR or auto-\ndownloaded), rerun the script so the remaining ESMFold hairpin evaluation\npipeline can execute.", "All 7 proteins in the panel failed secondary structure assignment. The `mkdssp`\ntool is not available on the system (so `ss_via_mkdssp` returns None), and the\nfallback `ss_via_biotite` fails immediately with `ModuleNotFoundError: No module\nnamed 'biotite'`. As a result, `n_evaluated = 0` and `hairpin_dssp_accuracy =\n0.0000` \u2014 no meaningful results were produced.  The research idea explicitly\nrequires DSSP-based evaluation, so the primary fix is to ensure DSSP is\navailable:  Proposed fix: 1. Install DSSP by adding a setup step: `pip install\npydssp` (a pure-PyTorch DSSP reimplementation that requires no system binary),\nor `conda install -c salilab dssp` / `apt-get install dssp` to obtain the\n`mkdssp` binary. `pydssp` is the most portable choice. 2.\nAlternatively/additionally, install biotite as a fallback: `pip install\nbiotite`. 3. Update `assign_ss` to try `pydssp` first (loading the PDB with e.g.\n`pydssp.read_pdbtext` and calling `assign` to obtain per-residue H/E/L codes),\nthen fall back to `mkdssp`, then biotite. Also raise a clear error if none are\navailable instead of silently returning zero accuracy. 4. Since the PDBs were\nalready computed (predict_structure ran successfully) but not cached because the\nexception occurred before `json.dump`, restructure the try/except so the PDB and\npLDDT are cached to disk before SS assignment \u2014 this avoids re-running ESMFold\non the next attempt.", "The script failed with `ModuleNotFoundError: No module named 'biotite'`. The\ncode depends on `biotite.structure` and `biotite.structure.io.pdb` for parsing\nPDB files and secondary-structure annotation, but this package is not installed\nin the runtime environment.  Proposed fix: 1. Install the missing dependency,\ne.g., add a `pip install biotite` step at the beginning of the script (or\ninstall it in the environment before running):    ```python    import\nsubprocess, sys    try:        import biotite    except ImportError:\nsubprocess.check_call([sys.executable, \"-m\", \"pip\", \"install\", \"biotite\"])\nimport biotite    ``` 2. Alternatively, replace biotite usage with an available\nlibrary such as `Bio.PDB` (Biopython) for PDB parsing and use DSSP (via\n`Bio.PDB.DSSP`) or a manual CA-based SSE assignment as a fallback. 3. Also\nconsider verifying that `mkdssp`/`dssp` executables are available; if not, the\nfallback `struc.annotate_sse` (from biotite) is needed \u2014 so biotite must be\ninstalled regardless.  After installing biotite (and ideally DSSP), rerun the\nscript.", "", "", ""], "exc_type": ["AttributeError", "FileNotFoundError", null, "ModuleNotFoundError", null, null, null], "exc_info": [{"args": ["'RedirectQueue' object has no attribute 'isatty'"], "name": "isatty", "obj": "<ai_scientist.treesearch.interpreter.RedirectQueue object at 0x7fa69126b3d0>"}, {"args": ["PISCES cull list not found under /data/zhenqian/data"]}, null, {"args": ["No module named 'biotite'"], "name": "biotite", "msg": "No module named 'biotite'"}, null, null, null], "exc_stack": [[["/data/zhenqian/exp/AI-Scientist-v2-main/ai_scientist/treesearch/interpreter.py", 210, "_run_session", "exec(compile(code, self.agent_file_name, \"exec\"), global_scope)"], ["runfile.py", 68, "<module>", "model = EsmForProteinFolding.from_pretrained(esmfold_path, low_cpu_mem_usage=True)"], ["/data/zhenqian/miniconda3/envs/ai_scientist_v2/lib/python3.11/site-packages/transformers/modeling_utils.py", 4369, "from_pretrained", "loading_info = cls._finalize_model_loading(model, load_config, loading_info)"], ["/data/zhenqian/miniconda3/envs/ai_scientist_v2/lib/python3.11/site-packages/transformers/modeling_utils.py", 4545, "_finalize_model_loading", "log_state_dict_report("], ["/data/zhenqian/miniconda3/envs/ai_scientist_v2/lib/python3.11/site-packages/transformers/utils/loading_report.py", 262, "log_state_dict_report", "report = loading_info.create_loading_report()"], ["/data/zhenqian/miniconda3/envs/ai_scientist_v2/lib/python3.11/site-packages/transformers/utils/loading_report.py", 190, "create_loading_report", "tips += f\"\\n- {_style('MISSING:', 'red')}\\t\" + _style("], ["/data/zhenqian/miniconda3/envs/ai_scientist_v2/lib/python3.11/site-packages/transformers/utils/loading_report.py", 123, "_style", "if sys.stdout.isatty():"]], [["/data/zhenqian/exp/AI-Scientis
